<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolmeRechnung — Angebote &amp; Rechnungen</title>
<link rel="icon" href="logo.svg">
<style>
:root{
  --acc:#F97316; --acc-d:#EA6000; --acc-l:#FB923C;
  --bg:#f4f5f9; --card:#fff; --text:#1c2030; --mid:#5b6172; --dim:#8a90a3;
  --line:#e3e6ef; --green:#16a34a; --red:#ef4444; --blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
label{font-size:12.5px;color:var(--mid);display:block;margin:10px 0 4px;font-weight:600}
a{color:var(--acc-d)}

/* Layout */
#app{display:flex;min-height:100vh}
#side{width:220px;background:#1c2030;color:#e6e8eb;padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
#side .logo{display:flex;align-items:center;gap:10px;margin:0 6px 18px}
#side .logo img{width:44px;filter:invert(1) brightness(1.6)}
#side .logo b{font-size:17px}
#side .logo small{display:block;color:var(--acc-l);font-weight:600;font-size:11px;letter-spacing:.5px}
#side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#c8ccd6;padding:10px 12px;border-radius:9px;font-size:14.5px}
#side button:hover{background:#2a2f3f}
#side button.act{background:var(--acc);color:#fff;font-weight:600}
#side .foot{margin-top:auto;font-size:11px;color:#6a7080;padding:8px 6px}
#main{flex:1;padding:26px 30px;max-width:1200px}

h1{font-size:21px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--acc-d)}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--acc);color:var(--acc-d)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}

table.list{width:100%;border-collapse:collapse}
table.list th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:hover td{background:#fafbff}
table.list tr.click{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.b-entwurf{background:#eceef4;color:var(--mid)}
.b-offen{background:#fff3e6;color:var(--acc-d)}
.b-bezahlt,.b-angenommen{background:#e6f6ec;color:var(--green)}
.b-ueberfaellig{background:#fdeaea;color:var(--red)}
.b-abgelehnt,.b-storniert{background:#f3e8ff;color:#7c3aed}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12.5px;color:var(--mid);font-weight:600}
.kpi.warn .v{color:var(--red)}
.kpi.ok .v{color:var(--green)}
.kpi.acc .v{color:var(--acc-d)}

/* Editor */
.pos-table{width:100%;border-collapse:collapse;margin-top:8px}
.pos-table th{font-size:12px;color:var(--dim);text-align:left;padding:4px 6px}
.pos-table td{padding:4px 6px;vertical-align:top}
.pos-table input,.pos-table select{padding:6px 8px}
.totals{margin-left:auto;width:300px;margin-top:14px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .sum{border-top:2px solid var(--text);font-weight:700;font-size:17px;margin-top:4px;padding-top:6px}

/* Login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#login .card{width:340px;text-align:center}
#login img{width:80px;margin-bottom:8px}

/* Druckansicht */
#printArea{display:none}
@media print{
  body>#app,#login{display:none!important}
  body{background:#fff}
  #printArea{display:block}
}
.sheet{width:210mm;min-height:280mm;padding:18mm 20mm 14mm;background:#fff;color:#1c2030;font-size:10.5pt;line-height:1.45;position:relative;display:flex;flex-direction:column}
.sheet .kopf{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14mm}
.sheet .kopf img{width:34mm}
.sheet .kopf .firma{text-align:right;font-size:9.5pt;color:#444}
.sheet .kopf .firma b{color:#1c2030;font-size:12pt}
.sheet .absZeile{font-size:7.5pt;color:#888;border-bottom:.3pt solid #bbb;padding-bottom:1mm;margin-bottom:3mm;width:85mm}
.sheet .adrBlock{display:flex;justify-content:space-between;margin-bottom:10mm}
.sheet .meta{font-size:9.5pt;color:#333}
.sheet .meta td{padding:.4mm 0 .4mm 6mm;text-align:right}
.sheet .meta td:first-child{color:#777;text-align:left;padding-left:0}
.sheet h2.dtitel{font-size:15pt;margin-bottom:2mm;color:#1c2030}
.sheet h2.dtitel span{color:var(--acc-d)}
.sheet .intro{margin-bottom:5mm;white-space:pre-wrap}
.sheet table.pos{width:100%;border-collapse:collapse;margin-bottom:5mm}
.sheet table.pos th{background:var(--acc);color:#fff;font-size:9pt;text-align:left;padding:2mm;font-weight:600}
.sheet table.pos th.num,.sheet table.pos td.num{text-align:right}
.sheet table.pos td{padding:2mm;border-bottom:.3pt solid #ddd;vertical-align:top}
.sheet table.pos .beschr{font-size:9pt;color:#666;white-space:pre-wrap}
.sheet .sumBlock{margin-left:auto;width:70mm;margin-bottom:6mm}
.sheet .sumBlock div{display:flex;justify-content:space-between;padding:.7mm 0}
.sheet .sumBlock .endsum{border-top:1.2pt solid #1c2030;font-weight:700;font-size:12pt;margin-top:1mm;padding-top:1.5mm;color:var(--acc-d)}
.sheet .hinweis{font-size:9pt;color:#555;margin-bottom:4mm;white-space:pre-wrap}
.sheet .schluss{margin-top:2mm;white-space:pre-wrap}
.sheet .fuss{margin-top:auto;border-top:.4pt solid #bbb;padding-top:2.5mm;font-size:7.5pt;color:#777;display:flex;justify-content:space-between;gap:6mm}
@page{size:A4;margin:0}
@media screen{ .sheet{box-shadow:0 4px 30px rgba(0,0,0,.2);margin:20px auto} }
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="card">
    <img src="logo.svg" alt="Volme 3D">
    <h1 style="justify-content:center">VolmeRechnung</h1>
    <p style="color:var(--mid);font-size:13.5px;margin-bottom:10px">Login-Schlüssel eingeben (steht in der Dienst-Ausgabe bzw. config.json)</p>
    <input id="loginKey" type="password" placeholder="Schlüssel" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="loginErr" style="color:var(--red);font-size:13px;margin-top:6px"></div>
    <button class="btn" style="margin-top:12px;width:100%" onclick="doLogin()">Anmelden</button>
  </div>
</div>

<div id="app" style="display:none">
  <nav id="side">
    <div class="logo">
      <img src="logo.svg" alt="">
      <div><b>Volme 3D</b><small>RECHNUNG</small></div>
    </div>
    <button data-v="dash" onclick="nav('dash')">📊 Übersicht</button>
    <button data-v="angebot" onclick="nav('angebot')">📝 Angebote</button>
    <button data-v="rechnung" onclick="nav('rechnung')">🧾 Rechnungen</button>
    <button data-v="kunden" onclick="nav('kunden')">👥 Kunden</button>
    <button data-v="artikel" onclick="nav('artikel')">📦 Artikel</button>
    <button data-v="kurse" onclick="nav('kurse')">🎓 Kurse</button>
    <button data-v="ausgaben" onclick="nav('ausgaben')">💸 Ausgaben</button>
    <button data-v="einstellungen" onclick="nav('einstellungen')">⚙️ Einstellungen</button>
    <div class="foot">VolmeRechnung · Tailnet-intern<br>Port 8782</div>
  </nav>
  <main id="main"></main>
</div>

<div id="printArea"></div>

<script>
'use strict';
// ---------------------------------------------------------------- Grundlagen
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>(Number(v)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const dtDE=s=>s?new Date(s+(s.length===10?'T12:00:00':'')).toLocaleDateString('de-DE'):'—';
const today=()=>new Date().toISOString().slice(0,10);

let KEY=localStorage.getItem('vrKey')||'';
let S={settings:null,customers:[],items:[],docs:[],courses:[],expenses:[]};
let view='dash', editDoc=null; // editDoc = gerade offener Beleg-Editor

async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'X-Key':KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){showLogin();throw new Error('Login nötig');}
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function loadAll(){
  [S.settings,S.customers,S.items,S.docs,S.courses,S.expenses]=await Promise.all([
    api('settings'),api('customers'),api('items'),api('docs'),api('courses'),api('expenses')]);
}
function showLogin(){$('#login').style.display='flex';$('#app').style.display='none';$('#loginKey').focus();}
async function doLogin(){
  KEY=$('#loginKey').value.trim();
  try{await api('login');localStorage.setItem('vrKey',KEY);$('#login').style.display='none';await start();}
  catch(e){$('#loginErr').textContent='Schlüssel falsch';}
}
async function start(){
  await loadAll();
  $('#app').style.display='flex';
  nav('dash');
}
(async()=>{
  if(!KEY)return showLogin();
  try{await start();}catch(e){/* showLogin lief schon */}
})();

function nav(v){
  view=v;editDoc=null;
  document.querySelectorAll('#side button').forEach(b=>b.classList.toggle('act',b.dataset.v===v));
  render();
}
function toast(msg,err){ // schlicht: kurze Statuszeile oben
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;top:14px;right:16px;z-index:99;padding:10px 16px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:opacity .4s';document.body.appendChild(t);}
  t.style.background=err?'var(--red)':'var(--green)';t.textContent=msg;t.style.opacity=1;
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2500);
}

// ------------------------------------------------------------ Beleg-Helfer
function docStatus(d){
  if(d.status==='offen'&&d.art==='rechnung'&&d.festgeschrieben){
    const ziel=new Date(d.datum);ziel.setDate(ziel.getDate()+(Number(d.zahlungszielTage)||S.settings.zahlungszielTage||14));
    if(ziel<new Date())return 'ueberfaellig';
  }
  return d.status;
}
const STATUS_TXT={entwurf:'Entwurf',offen:'Offen',bezahlt:'Bezahlt',angenommen:'Angenommen',abgelehnt:'Abgelehnt',storniert:'Storniert',ueberfaellig:'Überfällig'};
function badge(d){const s=docStatus(d);return `<span class="badge b-${s}">${STATUS_TXT[s]||s}</span>`;}
function calcTotals(doc){
  let netto=0;const ust={};
  for(const p of doc.positionen||[]){
    if(p.typ==='text')continue;
    const zeile=(Number(p.menge)||0)*(Number(p.preis)||0)*(1-(Number(p.rabatt)||0)/100);netto+=zeile;
    const satz=S.settings.steuer.modus==='klein'?0:(Number(p.ust)||0);
    ust[satz]=(ust[satz]||0)+zeile*satz/100;
  }
  const rabatt=netto*(Number(doc.rabattProzent)||0)/100;
  const nn=netto-rabatt;let us=0;
  for(const k of Object.keys(ust)){ust[k]=ust[k]*(netto?nn/netto:1);us+=ust[k];}
  return {netto,rabatt,nettoNachRabatt:nn,ust,brutto:nn+us};
}
function kundeName(d){return d.kunde?(d.kunde.firma||d.kunde.name||'—'):'—';}

// ---------------------------------------------------------------- Rendern
function render(){
  const m=$('#main');
  if(editDoc)return renderEditor(m);
  switch(view){
    case 'dash':return renderDash(m);
    case 'angebot':return renderDocList(m,'angebot');
    case 'rechnung':return renderDocList(m,'rechnung');
    case 'kunden':return renderKunden(m);
    case 'artikel':return renderArtikel(m);
    case 'kurse':return renderKurse(m);
    case 'ausgaben':return renderAusgaben(m);
    case 'einstellungen':return renderSettings(m);
  }
}

// --- Dashboard
function renderDash(m){
  const jahr=new Date().getFullYear();
  const re=S.docs.filter(d=>d.art==='rechnung');
  const umsatz=re.filter(d=>d.status==='bezahlt'&&(d.datum||'').startsWith(jahr)).reduce((a,d)=>a+calcTotals(d).brutto,0);
  const offen=re.filter(d=>docStatus(d)==='offen');
  const ueber=re.filter(d=>docStatus(d)==='ueberfaellig');
  const offenSum=offen.concat(ueber).reduce((a,d)=>a+calcTotals(d).brutto,0);
  const angOffen=S.docs.filter(d=>d.art==='angebot'&&['offen','entwurf'].includes(docStatus(d)));
  const ausgaben=S.expenses.filter(a=>(a.datum||'').startsWith(jahr)).reduce((x,a)=>x+(Number(a.betrag)||0),0);
  const letzten=[...S.docs].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,8);
  m.innerHTML=`
  <h1>Übersicht <span class="spacer"></span>
    <button class="btn sec" onclick="newDoc('angebot')">+ Angebot</button>
    <button class="btn" onclick="newDoc('rechnung')">+ Rechnung</button></h1>
  <div class="kpis">
    <div class="kpi ok"><div class="l">Umsatz ${jahr} (bezahlt)</div><div class="v">${eur(umsatz)}</div></div>
    <div class="kpi acc"><div class="l">Offene Forderungen</div><div class="v">${eur(offenSum)}</div></div>
    <div class="kpi ${ueber.length?'warn':''}"><div class="l">Überfällige Rechnungen</div><div class="v">${ueber.length}</div></div>
    <div class="kpi"><div class="l">Offene Angebote</div><div class="v">${angOffen.length}</div></div>
    <div class="kpi"><div class="l">Ausgaben ${jahr}</div><div class="v">${eur(ausgaben)}</div></div>
    <div class="kpi ${umsatz-ausgaben>=0?'ok':'warn'}"><div class="l">Gewinn ${jahr} (grob)</div><div class="v">${eur(umsatz-ausgaben)}</div></div>
  </div>
  <div class="card"><h3 style="margin-bottom:8px">Zuletzt bearbeitet</h3>
  ${letzten.length?docTable(letzten,true):'<p style="color:var(--dim)">Noch keine Belege. Leg mit einem Angebot oder einer Rechnung los!</p>'}
  </div>
  ${ueber.length?`<div class="card" style="border-color:var(--red)"><h3 style="color:var(--red);margin-bottom:8px">⚠️ Überfällig — Mahnung fällig?</h3>${docTable(ueber,true)}</div>`:''}`;
}

// --- Beleglisten
function docTable(list,mitArt){
  return `<table class="list"><tr><th>Nummer</th>${mitArt?'<th>Art</th>':''}<th>Kunde</th><th>Datum</th><th class="num">Brutto</th><th>Status</th><th></th></tr>
  ${list.map(d=>`<tr class="click" onclick="openDoc('${d.id}')">
    <td><b>${esc(d.nummer||'(Entwurf)')}</b></td>
    ${mitArt?`<td>${d.art==='rechnung'?'🧾':'📝'}</td>`:''}
    <td>${esc(kundeName(d))}</td><td>${dtDE(d.datum||d.created?.slice(0,10))}</td>
    <td class="num">${eur(calcTotals(d).brutto)}</td><td>${badge(d)}</td>
    <td class="num"><button class="btn sm sec" onclick="event.stopPropagation();printDoc('${d.id}')">🖨️</button></td>
  </tr>`).join('')}</table>`;
}
let sucheTxt='';
function sucheFilter(list){
  const q=sucheTxt.trim().toLowerCase();
  if(!q)return list;
  return list.filter(d=>[d.nummer,kundeName(d),d.datum,String(calcTotals(d).brutto.toFixed(2)),
    ...(d.positionen||[]).map(p=>p.name)].join(' ').toLowerCase().includes(q));
}
function renderDocList(m,art){
  const titel=art==='rechnung'?'Rechnungen':'Angebote';
  const list=sucheFilter(S.docs.filter(d=>d.art===art)).sort((a,b)=>(b.created||'').localeCompare(a.created||''));
  m.innerHTML=`<h1>${titel}<span class="spacer"></span>
    <input id="suche" style="width:220px" placeholder="🔍 Nummer, Kunde, Artikel, Betrag …" value="${esc(sucheTxt)}" oninput="sucheTxt=this.value;renderDocList($('#main'),'${art}');$('#suche').focus();$('#suche').setSelectionRange(99,99)">
    ${art==='rechnung'?'<button class="btn sec" onclick="exportCsv()">⬇️ CSV</button>':''}
    <button class="btn" onclick="newDoc('${art}')">+ Neu</button></h1>
  <div class="card">${list.length?docTable(list):`<p style="color:var(--dim)">${sucheTxt?'Nichts gefunden.':'Noch keine '+titel+'.'}</p>`}</div>`;
}
function exportCsv(){
  const sep=';',f=n=>String(n.toFixed(2)).replace('.',','); // deutsches Excel
  const rows=[['Nummer','Art','Datum','Kunde','Status','Netto','USt','Brutto','Bezahlt am'].join(sep)];
  for(const d of S.docs.filter(x=>x.festgeschrieben).sort((a,b)=>(a.nummer||'').localeCompare(b.nummer||''))){
    const t=calcTotals(d);
    rows.push([d.nummer,d.art,dtDE(d.datum),'"'+kundeName(d).replace(/"/g,'""')+'"',STATUS_TXT[docStatus(d)]||d.status,
      f(t.netto- t.rabatt),f(t.brutto-t.nettoNachRabatt),f(t.brutto),d.bezahltAm?dtDE(d.bezahltAm):''].join(sep));
  }
  if(typeof S.expenses!=='undefined'&&S.expenses.length){
    rows.push('');rows.push(['Ausgaben:'].join(sep));
    rows.push(['Datum','Lieferant','Beschreibung','Kategorie','Brutto'].join(sep));
    for(const a of S.expenses)rows.push([dtDE(a.datum),'"'+(a.lieferant||'').replace(/"/g,'""')+'"','"'+(a.beschreibung||'').replace(/"/g,'""')+'"',a.kategorie||'',f(Number(a.betrag)||0)].join(sep));
  }
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='volmerechnung-export-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
}
async function duplicateDoc(){
  try{const kopie=await api('docs/'+editDoc.id+'/duplicate','POST',{});await loadAll();editDoc=kopie;view=kopie.art;toast('Kopie als neuer Entwurf angelegt');render();}
  catch(e){toast(e.message,true);}
}

// --- Beleg-Editor
async function newDoc(art){
  if(!S.customers.length){toast('Bitte zuerst einen Kunden anlegen',true);nav('kunden');return;}
  editDoc={art,kundeId:'',kunde:null,datum:today(),positionen:[{name:'',beschreibung:'',menge:1,einheit:'Stk.',preis:0,ust:19}],rabattProzent:0,unsaved:true};
  render();
}
function openDoc(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;
  editDoc=JSON.parse(JSON.stringify(d));
  render();
}
function edSet(field,val){editDoc[field]=val;}
function edKunde(id){
  editDoc.kundeId=id;
  const k=S.customers.find(c=>c.id===id);
  editDoc.kunde=k?JSON.parse(JSON.stringify(k)):null; // Schnappschuss: Beleg behält Kundendaten von damals
}
function edPos(i,f,v){editDoc.positionen[i][f]=(f==='menge'||f==='preis'||f==='ust'||f==='rabatt')?parseFloat(String(v).replace(',','.'))||0:v;renderTotalsOnly();}
function edPosArtikel(i,artId){
  const a=S.items.find(x=>x.id===artId);if(!a)return;
  Object.assign(editDoc.positionen[i],{name:a.name,beschreibung:a.beschreibung||'',preis:a.preis,einheit:a.einheit||'Stk.',ust:a.ust??19});
  render();
}
function edAddPos(){editDoc.positionen.push({name:'',beschreibung:'',menge:1,einheit:'Stk.',preis:0,ust:19});render();}
function edAddText(){editDoc.positionen.push({typ:'text',name:'',beschreibung:''});render();}
function edDelPos(i){editDoc.positionen.splice(i,1);render();}
function edMovePos(i,dir){
  const j=i+dir;if(j<0||j>=editDoc.positionen.length)return;
  const a=editDoc.positionen;[a[i],a[j]]=[a[j],a[i]];render();
}
function renderTotalsOnly(){const t=$('#edTotals');if(t)t.innerHTML=totalsHtml(editDoc);}
function totalsHtml(d){

  return `<div><span>Netto</span><b>${eur(t.netto)}</b></div>
  ${t.rabatt?`<div><span>Rabatt (${d.rabattProzent} %)</span><b>−${eur(t.rabatt)}</b></div>`:''}
  ${klein?'':Object.entries(t.ust).map(([s,v])=>`<div><span>USt ${s} %</span><b>${eur(v)}</b></div>`).join('')}

// --- KI-Assistent (lokales Ollama über den Server)
function kiBusy(on,msg){
  const b1=$('#kiBtn'),b2=$('#kiTxtBtn'),s=$('#kiStatus');
  if(b1)b1.disabled=on;if(b2)b2.disabled=on;
  if(s)s.textContent=on?(msg||'KI arbeitet … (lokal, 10–60 s)'):'';
}
async function kiEntwurf(){
  const text=$('#kiText').value.trim();
  if(!text){toast('Bitte den Auftrag kurz beschreiben',true);return;}
  kiBusy(true);
  try{
    const r=await api('ki/entwurf','POST',{text,art:editDoc.art});
    if(r.positionen.length)editDoc.positionen=r.positionen;
    if(r.kundeId){editDoc.kundeId=r.kundeId;editDoc.kunde=r.kunde;}
    editDoc._kiText=text;
    render();
    const hinweis=r.kundeVorschlag?` — Kunde „${r.kundeVorschlag}“ ist noch nicht angelegt, bitte wählen/anlegen`:'';
    toast(r.positionen.length?`${r.positionen.length} Position(en) übernommen${hinweis}`:'Keine Positionen erkannt — bitte konkreter beschreiben',!r.positionen.length);
    const t=$('#kiText');if(t)t.value=text;
  }catch(e){toast(e.message,true);}
  kiBusy(false);
}
async function kiTexte(){
  if(!editDoc.positionen.some(p=>p.name)){toast('Erst Positionen anlegen',true);return;}
  kiBusy(true,'KI formuliert Beschreibungen …');
  try{
    const r=await api('ki/texte','POST',{positionen:editDoc.positionen});
    editDoc.positionen.forEach((p,i)=>{if(r.beschreibungen[i])p.beschreibung=r.beschreibungen[i];});
    render();
    const t=$('#kiText');if(t&&editDoc._kiText)t.value=editDoc._kiText;
    toast('Beschreibungen aktualisiert');
  }catch(e){toast(e.message,true);}
  kiBusy(false);
}

async function saveDoc(){
  if(!editDoc.kundeId){toast('Bitte Kunden wählen',true);return;}
  delete editDoc._kiText;
  try{
    if(editDoc.unsaved){delete editDoc.unsaved;const d=await api('docs','POST',editDoc);editDoc=d;}
    else editDoc=await api('docs/'+editDoc.id,'PUT',editDoc);
    await loadAll();toast('Gespeichert');render();
  }catch(e){toast(e.message,true);}
}
async function finalizeDoc(){
  await saveDoc();
  try{editDoc=await api('docs/'+editDoc.id+'/finalize','POST',{});await loadAll();toast('Festgeschrieben: '+editDoc.nummer);render();}
  catch(e){toast(e.message,true);}
}
async function docAction(action,body){
  try{editDoc=await api('docs/'+editDoc.id+'/'+action,'POST',body||{});await loadAll();toast('Erledigt');render();}
  catch(e){toast(e.message,true);}
}
async function convertDoc(){
  try{const re=await api('docs/'+editDoc.id+'/convert','POST',{});await loadAll();editDoc=re;view='rechnung';toast('Rechnungsentwurf erstellt');render();}
  catch(e){toast(e.message,true);}
}
async function deleteDoc(){
  try{await api('docs/'+editDoc.id,'DELETE');await loadAll();toast('Gelöscht');nav(editDoc.art);}
  catch(e){toast(e.message,true);}
}

// --- 3D-Druck-Kalkulator (Dialog im Beleg-Editor)
function kalkOpen(){
  const k=S.settings.kalkulation;
  let dlg=$('#kalkDlg');
  if(dlg)dlg.remove();
  dlg=document.createElement('div');dlg.id='kalkDlg';
  dlg.style.cssText='position:fixed;inset:0;background:rgba(20,24,35,.5);display:flex;align-items:center;justify-content:center;z-index:60';
  dlg.innerHTML=`<div class="card" style="width:430px;margin:0">
    <h3>🖨️ 3D-Druck kalkulieren</h3>
    <div class="grid2">
      <div><label>Material</label><select id="kMat">${k.materialien.map((x,i)=>`<option value="${i}">${esc(x.name)} (${x.preisKg} €/kg)</option>`).join('')}</select></div>
      <div><label>Gewicht (g)</label><input id="kGramm" type="number" value="100"></div>
      <div><label>Druckzeit (Std:Min)</label><div style="display:flex;gap:6px"><input id="kStd" type="number" value="2" style="width:70px"><input id="kMin" type="number" value="0" style="width:70px"></div></div>
      <div><label>Arbeitszeit (Min)</label><input id="kArbeit" type="number" value="15"></div>
      <div><label>Marge (%)</label><input id="kMarge" type="number" value="${k.margeProzent}"></div>
      <div><label>Stückzahl</label><input id="kAnzahl" type="number" value="1"></div>
    </div>
    <div class="totals" style="width:100%;margin-top:14px" id="kalkErg"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn" onclick="kalkUebernehmen()">➕ Als Position übernehmen</button>
      <button class="btn sec" onclick="$('#kalkDlg').remove()">Abbrechen</button>
    </div>
    <p style="color:var(--dim);font-size:12px;margin-top:8px">Sätze (Material, Maschine ${k.maschineProStd} €/h, Arbeit ${k.arbeitProStd} €/h) änderst du in den Einstellungen.</p>
  </div>`;
  document.body.appendChild(dlg);
  dlg.addEventListener('input',kalkRechnen);
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.remove();});
  kalkRechnen();
}
function kalkWerte(){
  const k=S.settings.kalkulation;
  const mat=k.materialien[parseInt($('#kMat').value)||0];
  const gramm=parseFloat($('#kGramm').value)||0;
  const stunden=(parseFloat($('#kStd').value)||0)+(parseFloat($('#kMin').value)||0)/60;
  const arbeitMin=parseFloat($('#kArbeit').value)||0;
  const marge=parseFloat($('#kMarge').value)||0;
  const anzahl=Math.max(1,parseInt($('#kAnzahl').value)||1);
  const material=gramm/1000*mat.preisKg;
  const maschine=stunden*k.maschineProStd;
  const arbeit=arbeitMin/60*k.arbeitProStd;
  const selbstkosten=material+maschine+arbeit;
  let preis=selbstkosten*(1+marge/100);
  preis=Math.max(preis,k.mindestpreis||0);
  preis=Math.ceil(preis*10)/10; // auf 10 Cent aufrunden
  return {mat,gramm,stunden,arbeitMin,marge,anzahl,material,maschine,arbeit,selbstkosten,preis};
}
function kalkRechnen(){
  const w=kalkWerte();
  $('#kalkErg').innerHTML=`
    <div><span>Material (${w.gramm} g ${esc(w.mat.name)})</span><b>${eur(w.material)}</b></div>
    <div><span>Maschine (${w.stunden.toFixed(2).replace('.',',')} h)</span><b>${eur(w.maschine)}</b></div>
    <div><span>Arbeit (${w.arbeitMin} min)</span><b>${eur(w.arbeit)}</b></div>
    <div><span>Selbstkosten</span><b>${eur(w.selbstkosten)}</b></div>
    <div class="sum"><span>VK je Stück (+${w.marge} %)</span><b>${eur(w.preis)}</b></div>`;
}
function kalkUebernehmen(){
  const w=kalkWerte();
  const std=Math.floor(w.stunden),min=Math.round((w.stunden-std)*60);
  editDoc.positionen.push({
    name:'3D-Druck '+w.mat.name,
    beschreibung:`${w.gramm} g ${w.mat.name}, ${std}:${String(min).padStart(2,'0')} h Druckzeit, ${w.arbeitMin} min Arbeitszeit`,
    menge:w.anzahl,einheit:'Stk.',preis:w.preis,ust:19,
  });
  $('#kalkDlg').remove();render();toast('Position übernommen');
}

    <td><button class="btn sm danger" onclick="event.stopPropagation();delKurs('${c.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--dim)">Noch keine Kurse — z. B. „Grundkurs 3D-Druck“.</td></tr>'}
  </table></div>
  <div id="kursForm"></div>`;
}
function editKurs(id){
  const c=id?S.courses.find(x=>x.id===id):{teilnehmer:[]};
  window._kursTeilnehmer=JSON.parse(JSON.stringify(c.teilnehmer||[]));
  $('#kursForm').innerHTML=`<div class="card"><h3>${id?'Kurs bearbeiten':'Neuer Kurs'}</h3>
  <div class="grid3">
    <div><label>Kursname</label><input id="cName" value="${esc(c.name||'')}"></div>
    <div><label>Termin (frei, z. B. 18.09.2026 17 Uhr)</label><input id="cDatum" value="${esc(c.datum||'')}"></div>
    <div><label>Preis pro Teilnehmer (netto, €)</label><input id="cPreis" value="${c.preis??''}"></div>
  </div>
  <label>Beschreibung (erscheint auf der Rechnung)</label><textarea id="cBeschr" rows="2">${esc(c.beschreibung||'')}</textarea>
  <label>Teilnehmer (aus dem Kundenstamm)</label>
  <div style="display:flex;gap:8px"><select id="cKunde">${S.customers.map(k=>`<option value="${k.id}">${esc(k.firma||k.name)}</option>`).join('')}</select>
  <button class="btn sm sec" onclick="kursAddTeilnehmer()">+ hinzufügen</button></div>
  <div id="cTeilnehmer" style="margin-top:8px"></div>
  <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" onclick="saveKurs('${id||''}')">💾 Speichern</button>
    ${id&&(c.teilnehmer||[]).length?`<button class="btn" style="background:var(--green)" onclick="kursRechnungen('${id}')">🧾 ${(c.teilnehmer||[]).length} Rechnung(en) erzeugen</button>`:''}
    <button class="btn sec" onclick="$('#kursForm').innerHTML=''">Abbrechen</button>
  </div></div>`;
  kursRenderTeilnehmer();
  $('#cName').focus();
}
function kursRenderTeilnehmer(){
  $('#cTeilnehmer').innerHTML=window._kursTeilnehmer.map((t,i)=>{
    const k=S.customers.find(x=>x.id===t.kundeId);
    return `<span class="badge b-entwurf" style="margin:2px 4px 2px 0">${esc(k?(k.firma||k.name):t.name||'?')} <a style="cursor:pointer;color:var(--red)" onclick="window._kursTeilnehmer.splice(${i},1);kursRenderTeilnehmer()">✕</a></span>`;
  }).join('')||'<span style="color:var(--dim);font-size:13px">Noch keine Teilnehmer.</span>';
}
function kursAddTeilnehmer(){
  const kid=$('#cKunde').value;
  if(!kid)return;
  if(window._kursTeilnehmer.some(t=>t.kundeId===kid)){toast('Schon in der Liste',true);return;}
  window._kursTeilnehmer.push({kundeId:kid});
  kursRenderTeilnehmer();
}
async function saveKurs(id){
  const rec={name:$('#cName').value.trim(),datum:$('#cDatum').value.trim(),preis:parseFloat(String($('#cPreis').value).replace(',','.'))||0,
    beschreibung:$('#cBeschr').value.trim(),teilnehmer:window._kursTeilnehmer};
  if(!rec.name){toast('Kursname angeben',true);return;}
  try{
    if(id)await api('courses/'+id,'PUT',rec);else await api('courses','POST',rec);
    await loadAll();toast('Gespeichert');render();
  }catch(e){toast(e.message,true);}
}
async function delKurs(id){
  if(!confirm('Kurs löschen? (Bereits erzeugte Rechnungen bleiben)'))return;
  try{await api('courses/'+id,'DELETE');await loadAll();render();}catch(e){toast(e.message,true);}
}
async function kursRechnungen(id){
  if(!confirm('Für jeden Teilnehmer einen Rechnungsentwurf erzeugen?'))return;
  try{const r=await api('courses/'+id+'/rechnungen','POST',{});await loadAll();toast(r.anzahl+' Rechnungsentwürfe erzeugt');nav('rechnung');}
  catch(e){toast(e.message,true);}
}

// --- Ausgaben
function renderAusgaben(m){
  const jahr=new Date().getFullYear();
  const summe=S.expenses.filter(a=>(a.datum||'').startsWith(jahr)).reduce((x,a)=>x+(Number(a.betrag)||0),0);
  m.innerHTML=`<h1>💸 Ausgaben<span class="spacer"></span><span style="font-size:15px;color:var(--mid)">Summe ${jahr}: <b>${eur(summe)}</b></span><button class="btn" onclick="editAusgabe()">+ Ausgabe</button></h1>
  <div class="card"><table class="list"><tr><th>Datum</th><th>Lieferant</th><th>Beschreibung</th><th>Kategorie</th><th class="num">Brutto</th><th></th></tr>
  ${[...S.expenses].sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')).map(a=>`<tr class="click" onclick="editAusgabe('${a.id}')">
    <td>${dtDE(a.datum)}</td><td><b>${esc(a.lieferant||'')}</b></td><td>${esc(a.beschreibung||'')}</td>
    <td>${esc(a.kategorie||'')}</td><td class="num">${eur(a.betrag)}</td>
    <td><button class="btn sm danger" onclick="event.stopPropagation();delAusgabe('${a.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--dim)">Noch keine Ausgaben erfasst — z. B. Filament-Bestellung, Strom, Werkzeug.</td></tr>'}
  </table></div>
  <div id="ausgabeForm"></div>`;
}
function editAusgabe(id){
  const a=id?S.expenses.find(x=>x.id===id):{datum:today()};
  $('#ausgabeForm').innerHTML=`<div class="card"><h3>${id?'Ausgabe bearbeiten':'Neue Ausgabe'}</h3>
  <div class="grid3">
    <div><label>Datum</label><input id="aDatum" type="date" value="${esc(a.datum||today())}"></div>
    <div><label>Lieferant</label><input id="aLief" value="${esc(a.lieferant||'')}"></div>
    <div><label>Betrag (brutto, €)</label><input id="aBetrag" value="${a.betrag??''}"></div>
    <div><label>Kategorie</label><select id="aKat">${['Material','Maschinen/Werkzeug','Strom/Miete','Software/IT','Versand','Marketing','Sonstiges'].map(k=>`<option ${a.kategorie===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div style="grid-column:span 2"><label>Beschreibung</label><input id="aBeschrE" value="${esc(a.beschreibung||'')}"></div>
  </div>
  <div style="margin-top:12px;display:flex;gap:10px">
    <button class="btn" onclick="saveAusgabe('${id||''}')">💾 Speichern</button>
    <button class="btn sec" onclick="$('#ausgabeForm').innerHTML=''">Abbrechen</button>
  </div></div>`;
  $('#aLief').focus();
}
async function saveAusgabe(id){
  const rec={datum:$('#aDatum').value,lieferant:$('#aLief').value.trim(),betrag:parseFloat(String($('#aBetrag').value).replace(',','.'))||0,
    kategorie:$('#aKat').value,beschreibung:$('#aBeschrE').value.trim()};
  if(!rec.lieferant&&!rec.beschreibung){toast('Lieferant oder Beschreibung angeben',true);return;}
  try{
    if(id)await api('expenses/'+id,'PUT',rec);else await api('expenses','POST',rec);
    await loadAll();toast('Gespeichert');render();
  }catch(e){toast(e.message,true);}
}
async function delAusgabe(id){
  if(!confirm('Ausgabe löschen?'))return;
  try{await api('expenses/'+id,'DELETE');await loadAll();render();}catch(e){toast(e.message,true);}
}

// --- Einstellungen

  const s=S.settings;
  m.innerHTML=`<h1>Einstellungen</h1>
  <div class="card"><h3>Firmendaten (erscheinen auf allen Belegen)</h3>
  <div class="grid3">
    <div><label>Firmenname</label><input id="sName" value="${esc(s.firma.name)}"></div>
    <div><label>Inhaber</label><input id="sInhaber" value="${esc(s.firma.inhaber)}"></div>
    <div><label>Telefon</label><input id="sTel" value="${esc(s.firma.telefon)}"></div>
    <div><label>Straße + Nr.</label><input id="sStrasse" value="${esc(s.firma.strasse)}"></div>
    <div class="grid2"><div><label>PLZ</label><input id="sPlz" value="${esc(s.firma.plz)}"></div><div><label>Ort</label><input id="sOrt" value="${esc(s.firma.ort)}"></div></div>

    <div><label>Gültigkeit Angebote (Tage)</label><input id="sGuelt" type="number" value="${s.angebotGueltigTage}"></div>

  <label>Einleitung Angebot</label><textarea id="sTAO" rows="2">${esc(s.texte.angebotOben)}</textarea>

async function saveSettings(){
  const s=S.settings;
  const upd={
    firma:{name:$('#sName').value,inhaber:$('#sInhaber').value,telefon:$('#sTel').value,strasse:$('#sStrasse').value,plz:$('#sPlz').value,ort:$('#sOrt').value,email:$('#sEmail').value,web:$('#sWeb').value},
    steuer:{modus:$('#sModus').value,steuernummer:$('#sStnr').value,ustId:$('#sUstId').value},
    bank:{iban:$('#sIban').value,bic:$('#sBic').value,institut:$('#sInstitut').value},
    kalkulation:{
      maschineProStd:parseFloat(String($('#sKMasch').value).replace(',','.'))||0,
      arbeitProStd:parseFloat(String($('#sKArbeit').value).replace(',','.'))||0,
      margeProzent:parseFloat(String($('#sKMarge').value).replace(',','.'))||0,
      mindestpreis:parseFloat(String($('#sKMin').value).replace(',','.'))||0,
      materialien:$('#sKMat').value.split('\n').map(z=>{
        const[t,p]=z.split(':');return t&&p?{name:t.trim(),preisKg:parseFloat(p.replace(',','.'))||0}:null;
      }).filter(Boolean),
    },
    zahlungszielTage:parseInt($('#sZiel').value)||14,
    angebotGueltigTage:parseInt($('#sGuelt').value)||30,
    texte:{angebotOben:$('#sTAO').value,angebotUnten:$('#sTAU').value,rechnungOben:$('#sTRO').value,rechnungUnten:$('#sTRU').value,mahnung:$('#sTM').value},
  };
  try{S.settings=await api('settings','PUT',Object.assign({},s,upd));toast('Gespeichert');render();}
  catch(e){toast(e.message,true);}
}

// ---------------------------------------------------------------- Druck
function sheetHtml(d,mahnung,girocode){
  const s=S.settings,t=calcTotals(d),klein=s.steuer.modus==='klein';
  const re=d.art==='rechnung';
  const k=d.kunde||{};
  const ziel=new Date(d.datum||today());ziel.setDate(ziel.getDate()+(Number(d.zahlungszielTage)||((re?s.zahlungszielTage:s.angebotGueltigTage))||14));
  const zielStr=ziel.toLocaleDateString('de-DE');
  const titel=mahnung?(d.mahnstufe>1?`Mahnung <span>Nr. ${d.mahnstufe-1}</span>`:'Zahlungserinnerung')
    :re?`Rechnung <span>${esc(d.nummer||'ENTWURF')}</span>`:`Angebot <span>${esc(d.nummer||'ENTWURF')}</span>`;
  const intro=mahnung?s.texte.mahnung:re?s.texte.rechnungOben:s.texte.angebotOben;
  const schluss=mahnung?'':re?s.texte.rechnungUnten:s.texte.angebotUnten;
  const anrede=k.name?`Sehr geehrte/r ${esc(k.name)},`:'Sehr geehrte Damen und Herren,';
  return `<div class="sheet">
  <div class="kopf">
    <img src="logo.svg" alt="">
    <div class="firma"><b>${esc(s.firma.name)}</b><br>
      ${esc(s.firma.inhaber)}${s.firma.inhaber?'<br>':''}
      ${esc(s.firma.strasse)}<br>${esc(s.firma.plz)} ${esc(s.firma.ort)}<br>
      ${esc(s.firma.telefon)}<br>${esc(s.firma.email)}</div>
  </div>
  <div class="adrBlock">
    <div>
      <div class="absZeile">${esc(s.firma.name)} · ${esc(s.firma.strasse)} · ${esc(s.firma.plz)} ${esc(s.firma.ort)}</div>
      <div>${esc(k.firma||'')}${k.firma?'<br>':''}${esc(k.name||'')}${k.name?'<br>':''}${esc(k.strasse||'')}<br>${esc((k.plz||'')+' '+(k.ort||''))}</div>
    </div>
    <table class="meta">
      ${re&&d.nummer?`<tr><td>Rechnungs-Nr.</td><td><b>${esc(d.nummer)}</b></td></tr>`:''}
      ${!re&&d.nummer?`<tr><td>Angebots-Nr.</td><td><b>${esc(d.nummer)}</b></td></tr>`:''}
      ${k.nr?`<tr><td>Kunden-Nr.</td><td>${esc(k.nr)}</td></tr>`:''}
      <tr><td>Datum</td><td>${mahnung?new Date().toLocaleDateString('de-DE'):dtDE(d.datum)}</td></tr>
      ${re&&!mahnung?`<tr><td>Zahlbar bis</td><td>${zielStr}</td></tr>`:''}
      ${!re?`<tr><td>Gültig bis</td><td>${zielStr}</td></tr>`:''}
      ${d.quelleAngebot?`<tr><td>Ihr Angebot</td><td>${esc(d.quelleAngebot)}</td></tr>`:''}
    </table>
  </div>
  <h2 class="dtitel">${titel}</h2>
  <div class="intro">${anrede}\n\n${esc(intro)}</div>
  ${mahnung?`<table class="pos"><tr><th>Rechnung</th><th>Datum</th><th class="num">Betrag</th></tr>
    <tr><td>${esc(d.nummer)}</td><td>${dtDE(d.datum)}</td><td class="num"><b>${eur(t.brutto)}</b></td></tr></table>`
  :`<table class="pos">
    <tr><th style="width:8mm">Pos.</th><th>Bezeichnung</th><th class="num">Menge</th><th>Einheit</th><th class="num">Einzelpreis</th><th class="num">Gesamt</th></tr>
    ${(()=>{let nr=0;return (d.positionen||[]).map(p=>{
      if(p.typ==='text')return `<tr><td></td><td colspan="5">${p.name?`<b>${esc(p.name)}</b>`:''}${p.beschreibung?`<div class="beschr">${esc(p.beschreibung)}</div>`:''}</td></tr>`;
      nr++;
      return `<tr>
      <td>${nr}</td>
      <td><b>${esc(p.name)}</b>${p.beschreibung?`<div class="beschr">${esc(p.beschreibung)}</div>`:''}${p.rabatt?`<div class="beschr">abzgl. ${p.rabatt} % Rabatt</div>`:''}</td>
      <td class="num">${(Number(p.menge)||0).toLocaleString('de-DE')}</td><td>${esc(p.einheit||'')}</td>
      <td class="num">${eur(p.preis)}</td><td class="num">${eur((p.menge||0)*(p.preis||0)*(1-(p.rabatt||0)/100))}</td>
    </tr>`;}).join('');})()}
  </table>
  <div class="sumBlock">
    <div><span>Nettobetrag</span><span>${eur(t.netto)}</span></div>
    ${t.rabatt?`<div><span>Rabatt (${d.rabattProzent} %)</span><span>−${eur(t.rabatt)}</span></div>`:''}
    ${klein?'':Object.entries(t.ust).map(([sz,v])=>`<div><span>zzgl. ${sz} % USt</span><span>${eur(v)}</span></div>`).join('')}
    <div class="endsum"><span>${re?'Rechnungsbetrag':'Gesamtbetrag'}</span><span>${eur(t.brutto)}</span></div>
  </div>`}
  ${klein?`<div class="hinweis">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</div>`:''}
  ${re&&!mahnung?`<div class="hinweis" style="display:flex;gap:5mm;align-items:center">
    ${girocode?`<div style="flex-shrink:0">${girocode}</div>`:''}
    <div>Bitte überweisen Sie den Betrag bis zum <b>${zielStr}</b> unter Angabe der Rechnungsnummer auf das unten genannte Konto.${girocode?'<br><b>Tipp:</b> GiroCode mit der Banking-App scannen — alle Daten sind schon ausgefüllt.':''}</div>
  </div>`:''}
  ${d.status==='storniert'?'<div class="hinweis" style="color:#ef4444;font-weight:700">STORNIERT am '+dtDE(d.storniertAm)+'</div>':''}
  <div class="schluss">${esc(schluss)}${schluss?'\n\n':''}Mit freundlichen Grüßen\n${esc(s.firma.inhaber||s.firma.name)}</div>
  <div class="fuss">
    <div><b>${esc(s.firma.name)}</b><br>${esc(s.firma.inhaber)}<br>${esc(s.firma.strasse)}<br>${esc(s.firma.plz)} ${esc(s.firma.ort)}</div>
    <div>Tel: ${esc(s.firma.telefon)}<br>${esc(s.firma.email)}<br>${esc(s.firma.web)}</div>
    <div>${s.bank.iban?`IBAN: ${esc(s.bank.iban)}<br>BIC: ${esc(s.bank.bic)}<br>${esc(s.bank.institut)}`:''}</div>
    <div>${s.steuer.steuernummer?`Steuernummer:<br>${esc(s.steuer.steuernummer)}`:''}${s.steuer.ustId?`<br>USt-IdNr.: ${esc(s.steuer.ustId)}`:''}</div>
  </div>
  </div>`;
}
async function printDoc(id){
  const d=S.docs.find(x=>x.id===id)||editDoc;if(!d)return;
  let girocode=null;
  if(d.art==='rechnung'&&d.festgeschrieben&&S.settings.bank.iban&&!['bezahlt','storniert'].includes(d.status)){
    try{
      const r=await fetch('/api/girocode/'+d.id,{headers:{'X-Key':KEY}});
      if(r.ok)girocode=await r.text();
    }catch(e){/* ohne QR drucken */}
  }
  $('#printArea').innerHTML=sheetHtml(d,false,girocode);
  setTimeout(()=>window.print(),80);
}
async function printMahnung(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;
  try{editDoc=await api('docs/'+id+'/remind','POST',{});await loadAll();}catch(e){toast(e.message,true);return;}
  $('#printArea').innerHTML=sheetHtml(editDoc,true);
  setTimeout(()=>window.print(),80);
  render();
}
</script>
</body>
</html>
