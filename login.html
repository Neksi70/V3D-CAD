<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>V3D CAD — Anmelden</title>
<link rel="icon" href="favicon.svg">
<style>
:root{
  --border:#dde1e8;--text:#1a1d26;--mid:#5a6078;--dim:#9098b0;
  --acc:#F97316;--ahov:#EA6C10;--red:#f03030;
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
html,body{margin:0;height:100%}
body{background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
#auth-box{width:380px;max-width:95vw;padding:40px 36px;display:flex;flex-direction:column;align-items:center;gap:16px;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
#auth-logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;color:#111;margin-bottom:4px}
#auth-logo img{height:36px;width:auto}
#auth-subtitle{font-size:13px;color:var(--mid);margin-bottom:8px;text-align:center}
#auth-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px 16px;background:#fff;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;font-family:var(--font)}
#auth-google:hover{border-color:#4285F4;background:#f0f4ff}
#auth-google svg{width:18px;height:18px;flex-shrink:0}
.auth-divider{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;font-weight:700;color:var(--dim)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
#auth-email,#auth-pw{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--text);outline:none;transition:border-color .15s;box-sizing:border-box}
#auth-email:focus,#auth-pw:focus{border-color:var(--acc)}
.auth-btns{display:flex;gap:8px;width:100%}
#auth-btn-login{flex:1;padding:10px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s}
#auth-btn-login:hover{background:var(--ahov)}
#auth-btn-register{flex:1;padding:10px;background:#fff;color:var(--mid);border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s}
#auth-btn-register:hover{border-color:var(--acc);color:var(--acc)}
#auth-err{width:100%;padding:8px 12px;background:#fff0f0;border:1.5px solid var(--red);border-radius:6px;font-size:12px;color:var(--red);font-weight:600;display:none}
#auth-note{width:100%;padding:8px 12px;background:#FFF7ED;border:1.5px solid var(--acc);border-radius:6px;font-size:12px;color:#9a3412;font-weight:600;display:none}
</style>
</head>
<body>
<div id="auth-box">
  <div id="auth-logo">
    <img src="logo.svg" alt="V3D CAD">
    <span>V3D<span style="color:#F97316"> CAD</span></span>
  </div>
  <div id="auth-subtitle">Melde dich an, um deine Designs zu speichern.</div>
  <div id="auth-note"></div>
  <button id="auth-google">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Mit Google anmelden
  </button>
  <div class="auth-divider">oder</div>
  <input type="email" id="auth-email" placeholder="E-Mail-Adresse" autocomplete="email">
  <input type="password" id="auth-pw" placeholder="Passwort" autocomplete="current-password">
  <div class="auth-btns">
    <button id="auth-btn-register">Registrieren</button>
    <button id="auth-btn-login">Anmelden</button>
  </div>
  <div id="auth-err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:            "AIzaSyB1TC58k0AmuU6pclev-WLr1-VGIgu98Q4",
  authDomain:        "volme3d.firebaseapp.com",
  projectId:         "volme3d",
  storageBucket:     "volme3d.firebasestorage.app",
  messagingSenderId: "287060944142",
  appId:             "1:287060944142:web:4e9175ff4f769e9310235f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const $ = id => document.getElementById(id);
function showErr(m){ const e = $('auth-err'); e.textContent = m; e.style.display = ''; }
function note(m){ const e = $('auth-note'); e.textContent = m; e.style.display = ''; }

// Wohin nach dem Anmelden? Nur eigene Pfade, damit der Parameter nicht als
// Weiterleitung auf fremde Seiten missbraucht werden kann.
const params = new URLSearchParams(location.search);
let ziel = params.get('weiter') || '/volme3d.html';
if (!/^\/[A-Za-z0-9_\-./?=&]*$/.test(ziel) || ziel.startsWith('//')) ziel = '/volme3d.html';

if (params.get('grund') === 'sitzung')
  note('Diese Einladung ist abgelaufen oder gibt es nicht. Melde dich an, um weiterzuarbeiten.');
else if (params.get('grund') === 'abgelaufen')
  note('Deine Anmeldung ist abgelaufen. Bitte melde dich neu an.');

// Firebase-Anmeldung -> serverseitige Sitzung. Erst danach gibt der Server
// die App heraus; das Cookie ist HttpOnly, der Editor sieht es nie.
async function sessionAnlegen(user){
  const idToken = await user.getIdToken(true);
  const r = await fetch('/auth/session', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({idToken: idToken}),
    credentials: 'same-origin'
  });
  if (!r.ok) {
    let msg = 'Sitzung konnte nicht angelegt werden (' + r.status + ').';
    try { msg = (await r.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  location.replace(ziel);
}

auth.onAuthStateChanged(function(user){
  // Wer noch eine gueltige Firebase-Sitzung im Browser hat (z. B. weil nur
  // das Server-Cookie abgelaufen ist), kommt ohne erneutes Tippen durch.
  if (user) sessionAnlegen(user).catch(e => showErr(e.message));
});

$('auth-google').onclick = function(){
  $('auth-err').style.display = 'none';
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => showErr((e.code ? e.code + ': ' : '') + e.message));
};
$('auth-btn-login').onclick = function(){
  $('auth-err').style.display = 'none';
  auth.signInWithEmailAndPassword($('auth-email').value.trim(), $('auth-pw').value)
      .catch(e => showErr(e.message));
};
$('auth-btn-register').onclick = function(){
  $('auth-err').style.display = 'none';
  auth.createUserWithEmailAndPassword($('auth-email').value.trim(), $('auth-pw').value)
      .catch(e => showErr(e.message));
};
$('auth-pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('auth-btn-login').click(); });
</script>
</body>
</html>
