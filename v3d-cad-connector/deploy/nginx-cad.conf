# V3D CAD × Claude (netcup, im server-Block von v3dcad.volme3dakademie.de einbinden):
# Agent-Hub (Live-Tabs, Monitor) unter /cad-agent, claude.ai-Connector unter /cad-mcp.
location = /cad-agent { return 301 /cad-agent/; }
location /cad-agent/ {
    proxy_pass http://127.0.0.1:8830/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # Hub erkennt daran „von außen“ (PIN, nur Tab-Routen)
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;                             # Server-Sent Events (Live-Befehle, Monitor)
    proxy_read_timeout 3600s;
    client_max_body_size 100m;                       # Ergebnisse/Exporte aus dem Tab
}
location /cad-mcp/ {
    proxy_pass http://127.0.0.1:8840/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 700s;
    client_max_body_size 20m;
}
# OAuth-Erkennung am Host-Stamm (RFC 8414 / RFC 9728 mit Pfad)
location = /.well-known/oauth-authorization-server/cad-mcp {
    proxy_pass http://127.0.0.1:8840/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
}
location ^~ /.well-known/oauth-protected-resource/cad-mcp {
    proxy_pass http://127.0.0.1:8840;
    proxy_set_header Host $host;
}
