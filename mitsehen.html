<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<title>Mitsehen · V3D CAD</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{ --acc:#F97316; --acc2:#7c3aed; --text:#1f2430; --mid:#444b59; --dim:#8a91a3; --border:#e3e6ef; --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#eef0f7;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;min-height:54px;display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 14px 0;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:10}
  #bar .logo{font-weight:800;font-size:16px;white-space:nowrap}
  #bar .logo b{color:var(--acc)}
  #bar .name{flex:1;min-width:0;font-size:13px;color:var(--mid);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#059669;white-space:nowrap}
  .live i{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.6s ease-in-out infinite;font-style:normal}
  .live.stale{color:var(--dim)} .live.stale i{background:#c3c8d4;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:10}
  #foot .dim{flex:1;min-width:120px;font-size:12px;font-weight:700;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text);background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:9px 13px;cursor:pointer;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btn.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
  .btn:disabled{opacity:.5;cursor:default}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;background:rgba(238,240,247,.85)}
  #msg .card{max-width:440px;width:100%;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.12);padding:26px 24px}
  #msg h1{font-size:20px;margin:0 0 8px}
  #msg p{font-size:14px;color:var(--mid);line-height:1.55;margin:0 0 16px}
  #msg input{width:100%;font-family:var(--font);font-size:26px;font-weight:800;letter-spacing:7px;text-align:center;border:1.5px solid var(--border);border-radius:11px;padding:11px;margin-bottom:12px;color:var(--text)}
  #msg .err{color:#b91c1c;font-size:13px;font-weight:700;min-height:18px;margin:0 0 8px}
  .spin{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);max-width:92vw;background:rgba(31,36,48,.88);color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;z-index:11;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
  .hint.show{opacity:1}
  #tree{position:fixed;right:10px;top:62px;bottom:auto;max-height:56vh;width:230px;overflow-y:auto;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.10);padding:8px;z-index:9;font-size:12px}
  #tree .t-h{font-weight:800;color:var(--mid);padding:2px 6px 7px}
  #tree .t-i{padding:6px 7px;border-radius:8px;line-height:1.35}
  #tree .t-i:nth-child(odd){background:#f7f8fc}
  #tree .t-i b{font-weight:700}
  #tree .t-i span{color:var(--dim)}
  #tree .t-i.hole b{color:#b91c1c}
  @media(max-width:700px){ #tree{display:none} }
  body.marking #c{cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar" class="hidden">
  <span class="logo">V3D<b> CAD</b></span>
  <span class="name" id="name"></span>
  <span class="live stale" id="live"><i></i><span id="liveTxt">verbinde…</span></span>
</div>
<div class="hint" id="hint">🖐 Ziehen zum Drehen · 2 Finger / Rad zum Zoomen</div>
<div id="tree" class="hidden"></div>
<div id="foot" class="hidden">
  <span class="dim" id="dim"></span>
  <button class="btn" id="followBtn" title="Der Ansicht des Gestalters folgen">🎯 Folgen</button>
  <button class="btn" id="markBtn" title="Auf eine Stelle zeigen — sie erscheint beim Gestalter">📍 Zeigen</button>
</div>
<div id="msg"><div class="card"><div class="spin"></div><p style="margin-top:14px">Sitzung wird gesucht…</p></div></div>

<script src="lib/three.min.js"></script>
<script src="lib/fflate.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey:"AIzaSyB1TC58k0AmuU6pclev-WLr1-VGIgu98Q4", authDomain:"volme3d.firebaseapp.com", projectId:"volme3d", storageBucket:"volme3d.firebasestorage.app", messagingSenderId:"287060944142", appId:"1:287060944142:web:4e9175ff4f769e9310235f" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function msg(html){ const m=document.getElementById('msg'); m.classList.remove('hidden'); m.innerHTML='<div class="card">'+html+'</div>'; }
function hideMsg(){ document.getElementById('msg').classList.add('hidden'); }
function b64ToU8(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
function dsDecompress(s){ if(typeof s!=='string'||s.slice(0,4)!=='GZ1:') return s; try{ return fflate.strFromU8(fflate.gunzipSync(b64ToU8(s.slice(4)))); }catch(e){ return s; } }
async function sha256(t){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } }
function hint(t,ms){ const h=document.getElementById('hint'); h.textContent=t; h.classList.add('show'); clearTimeout(hint._t); hint._t=setTimeout(()=>h.classList.remove('show'), ms||3200); }

// ── Three.js Szene ──
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeef0f7);
const camera=new THREE.PerspectiveCamera(45,1,0.01,100000);
scene.add(new THREE.AmbientLight(0xffffff,0.78));
const dl=new THREE.DirectionalLight(0xffffff,0.85); dl.position.set(40,80,50); scene.add(dl);
const dl2=new THREE.DirectionalLight(0x88aaff,0.32); dl2.position.set(-40,-20,-30); scene.add(dl2);
const markGroup=new THREE.Group(); scene.add(markGroup);
let group=null, target=new THREE.Vector3(), radius=50, theta=0.7, phi=1.05;
let sid='', follow=false, marking=false, fitted=false, viewerName='', ended=false;

function updateCam(){
  phi=Math.max(0.06,Math.min(Math.PI-0.06,phi));
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
function fit(box){
  box.getCenter(target);
  const s=box.getSize(new THREE.Vector3()); const maxd=Math.max(s.x,s.y,s.z)||1;
  radius=maxd*2.0; camera.near=Math.max(0.01,maxd*0.01); camera.far=maxd*60+500; camera.updateProjectionMatrix();
  updateCam();
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();

// ── Orbit (Maus + Touch). Selbst drehen schaltet „Folgen" ab. ──
function manual(){ if(follow) setFollow(false); }
let drag=false, lx=0, ly=0, pinch=0, moved=0;
canvas.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch')return; drag=true; moved=0; lx=e.clientX; ly=e.clientY; });
addEventListener('pointermove',e=>{ if(!drag||e.pointerType==='touch')return; const dx=e.clientX-lx, dy=e.clientY-ly; moved+=Math.abs(dx)+Math.abs(dy);
  if(moved>3){ manual(); theta-=dx*0.01; phi-=dy*0.01; updateCam(); } lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup',e=>{ if(drag && moved<=3 && marking) placeMark(e.clientX,e.clientY); drag=false; });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); manual(); radius*=(1+Math.sign(e.deltaY)*0.1); radius=Math.max(0.5,radius); updateCam(); },{passive:false});
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1){ drag=true; moved=0; lx=e.touches[0].clientX; ly=e.touches[0].clientY; } else if(e.touches.length===2){ drag=false; pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); } },{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&drag){ const x=e.touches[0].clientX,y=e.touches[0].clientY; const dx=x-lx,dy=y-ly; moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>4){ manual(); theta-=dx*0.01; phi-=dy*0.01; updateCam(); } lx=x; ly=y; }
  else if(e.touches.length===2){ manual(); const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(pinch){ radius*=pinch/d; radius=Math.max(0.5,radius); updateCam(); } pinch=d; }
},{passive:false});
canvas.addEventListener('touchend',e=>{ if(e.touches.length===0){ if(drag && moved<=4 && marking) placeMark(lx,ly); drag=false; pinch=0; } });

// ── Modell (wird bei jeder Live-Aktualisierung neu gebaut) ──
function buildModel(parts){
  if(group){ scene.remove(group); group.traverse(n=>{ if(n.isMesh){ n.geometry.dispose(); n.material.dispose(); } }); }
  group=new THREE.Group();
  const box=new THREE.Box3();
  parts.forEach(pt=>{
    const u8=b64ToU8(pt.p); const pos=new Float32Array(u8.buffer, u8.byteOffset, Math.floor(u8.byteLength/4));
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.computeVertexNormals();
    const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color(pt.c||'#8aa0b8'),roughness:0.55,metalness:0.08,side:THREE.DoubleSide}));
    group.add(m); g.computeBoundingBox(); box.union(g.boundingBox);
  });
  scene.add(group);
  if(!fitted && !box.isEmpty()){ fit(box); fitted=true; }
  const s=box.getSize(new THREE.Vector3());
  document.getElementById('dim').textContent=box.isEmpty()?'—':(Math.round(s.x*10)+' × '+Math.round(s.z*10)+' × '+Math.round(s.y*10)+' mm');
}

function drawTree(tree, sel){
  const el=document.getElementById('tree');
  if(!tree || !tree.length){ el.classList.add('hidden'); return; }
  const selSet=new Set(sel||[]);
  el.innerHTML='<div class="t-h">Bauteile ('+tree.length+')</div>'+tree.map(t=>
    '<div class="t-i'+(t.h?' hole':'')+'" style="'+(selSet.has(t.n)?'outline:2px solid var(--acc2);outline-offset:-2px':'')+'">'+
      '<b>'+(t.h?'○ ':'')+esc(t.n)+'</b>'+
      (t.d?'<br><span>'+t.d[0]+' × '+t.d[1]+' × '+t.d[2]+' mm</span>':'')+
      (t.t?' <span>· '+esc(t.t)+'</span>':'')+
      (t.v===false?' <span>· ausgeblendet</span>':'')+
    '</div>').join('');
  el.classList.remove('hidden');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── Stufe 3: auf eine Stelle zeigen ──
const ray=new THREE.Raycaster();
async function placeMark(cx,cy){
  if(!group){ return; }
  const r=canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1), camera);
  const hits=ray.intersectObjects(group.children,true);
  if(!hits.length){ hint('Daneben — bitte direkt auf das Modell tippen'); return; }
  const p=hits[0].point;
  const t=(window.prompt('Was möchtest du zeigen? (leer lassen für nur einen Pfeil)','')||'').trim().slice(0,80);
  try{
    await db.collection('sessions').doc(sid).collection('marks').add({
      p:[p.x,p.y,p.z], t, at:Date.now(), by:viewerName.slice(0,40), expiresAt:Date.now()+3*60*60*1000 });
    hint('📍 Markierung gesetzt — sie erscheint jetzt beim Gestalter');
  }catch(e){ console.warn(e); hint('Markierung konnte nicht gesendet werden'); }
  setMarking(false);
}
function showMark(id,d){
  if(!d||!Array.isArray(d.p)) return;
  if(markGroup.children.some(c=>c.userData.markId===id)) return;
  const size=Math.max(0.15, radius*0.05);
  const pin=new THREE.Group(); pin.userData.markId=id;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(size*0.32,size,20), new THREE.MeshBasicMaterial({color:0xF97316,depthTest:false,transparent:true,opacity:.92}));
  cone.rotation.x=Math.PI; cone.position.y=size*0.5;
  const ring=new THREE.Mesh(new THREE.RingGeometry(size*0.34,size*0.5,28), new THREE.MeshBasicMaterial({color:0xF97316,depthTest:false,transparent:true,opacity:.55,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;
  pin.add(cone); pin.add(ring);
  pin.position.set(d.p[0],d.p[1],d.p[2]);
  markGroup.add(pin);
}
function setMarking(on){ marking=on; document.body.classList.toggle('marking',on);
  document.getElementById('markBtn').classList.toggle('on',on);
  if(on) hint('Tippe auf die Stelle, die du zeigen möchtest'); }
function setFollow(on){ follow=on; document.getElementById('followBtn').classList.toggle('on',on);
  if(on){ hint('Du folgst jetzt der Ansicht des Gestalters — einfach selbst drehen zum Lösen'); applyCam(); } }
let lastCam=null;
function applyCam(){
  if(!follow||!lastCam) return;
  target.set(lastCam.t[0],lastCam.t[1],lastCam.t[2]); theta=lastCam.th; phi=lastCam.ph; radius=lastCam.r; updateCam();
}

// ── Verbinden ──
function setLive(on,txt){
  const el=document.getElementById('live'); el.classList.toggle('stale',!on);
  document.getElementById('liveTxt').textContent=txt;
}
function sessionEnded(){
  if(ended) return; ended=true;
  setLive(false,'beendet');
  msg('<h1>Sitzung beendet</h1><p>Der Gestalter hat das Mitsehen beendet. Das zuletzt gesehene Modell bleibt unten stehen.</p>'+
      '<button class="btn" onclick="document.getElementById(\'msg\').classList.add(\'hidden\')">Modell weiter ansehen</button>');
}

async function connect(){
  // Name des Zuschauers — steht spaeter an der Markierung
  viewerName=localStorage.getItem('mit_name')||'';
  if(!viewerName){ viewerName=(window.prompt('Wie heißt du? (erscheint an deinen Markierungen)','Betreuer')||'Betreuer').trim(); localStorage.setItem('mit_name',viewerName); }

  const ref=db.collection('sessions').doc(sid);

  // Stufe 1: Geometrie
  ref.collection('state').doc('geo').onSnapshot(doc=>{
    if(!doc.exists) return;
    const d=doc.data();
    let payload; try{ payload=JSON.parse(dsDecompress(d.data)); }catch(e){ return; }
    document.getElementById('name').textContent=payload.name||'Modell';
    try{ buildModel(payload.parts||[]); }catch(e){ console.warn(e); return; }
    drawTree(payload.tree, lastCam&&lastCam.sel);
    setLive(true,'live');
    hideMsg();
    document.getElementById('bar').classList.remove('hidden');
    document.getElementById('foot').classList.remove('hidden');
  }, e=>{ console.warn('geo',e); setLive(false,'Verbindung weg'); });

  // Stufe 2: Kamera + Auswahl des Gestalters
  ref.collection('state').doc('cam').onSnapshot(doc=>{
    if(!doc.exists) return;
    lastCam=doc.data(); applyCam();
    if(!ended) setLive(true,'live');
    const el=document.getElementById('tree');
    if(!el.classList.contains('hidden')) el.querySelectorAll('.t-i').forEach(n=>{
      const sel=new Set(lastCam.sel||[]); const nm=n.querySelector('b')?.textContent.replace(/^○ /,'');
      n.style.outline=sel.has(nm)?'2px solid var(--acc2)':''; n.style.outlineOffset=sel.has(nm)?'-2px':'';
    });
  }, ()=>{});

  // Stufe 3: eigene Markierungen sichtbar machen
  ref.collection('marks').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='added') showMark(ch.doc.id, ch.doc.data());
      else if(ch.type==='removed'){ const c=markGroup.children.find(c=>c.userData.markId===ch.doc.id); if(c) markGroup.remove(c); }
    });
  }, ()=>{});

  // Sitzung noch da?
  ref.onSnapshot(doc=>{ if(!doc.exists || doc.data().live===false) sessionEnded(); }, ()=>{});

  // Anwesenheit melden, damit der Gestalter sieht, dass jemand zuschaut
  let vid=sessionStorage.getItem('mit_vid');
  if(!vid){ vid='v_'+Math.random().toString(36).slice(2,10); sessionStorage.setItem('mit_vid',vid); }
  const eye=ref.collection('eyes').doc(vid);
  const beat=()=>{ if(!ended) eye.set({at:Date.now(),name:viewerName.slice(0,40)}).catch(()=>{}); };
  beat(); setInterval(beat,20000);
  addEventListener('beforeunload',()=>{ eye.delete().catch(()=>{}); });

  // Der Gastgeber sendet mindestens alle 20 s ein Lebenszeichen. Bleibt es aus,
  // ist er weg (Tab zu, Rechner aus) — dann nicht laenger „live" behaupten.
  setInterval(()=>{
    if(ended||!lastCam) return;
    setLive(Date.now()-(lastCam.at||0) < 60000, Date.now()-(lastCam.at||0) < 60000 ? 'live' : 'gerade weg');
  },10000);

  document.getElementById('followBtn').onclick=()=>setFollow(!follow);
  document.getElementById('markBtn').onclick=()=>setMarking(!marking);
  hint('🖐 Ziehen zum Drehen · „Folgen" zeigt dir seine Ansicht',5000);
}

// ── Start: Sitzung suchen, Code abfragen ──
function askCode(hash, name){
  msg('<h1>👀 '+esc(name||'Mitsehen')+'</h1>'+
      '<p>Gib den Code ein, den dir der Gestalter durchgibt.</p>'+
      '<input id="codeIn" inputmode="numeric" maxlength="6" placeholder="––––––" autocomplete="off">'+
      '<p class="err" id="codeErr"></p>'+
      '<button class="btn pri" id="codeGo" style="width:100%;justify-content:center">Mitsehen</button>');
  const inp=document.getElementById('codeIn'); inp.focus();
  const go=async()=>{
    const v=(inp.value||'').trim();
    if(v.length<6){ document.getElementById('codeErr').textContent='Bitte alle 6 Ziffern eingeben.'; return; }
    if(await sha256(sid+':'+v) !== hash){ document.getElementById('codeErr').textContent='Der Code stimmt nicht.'; inp.select(); return; }
    msg('<div class="spin"></div><p style="margin-top:14px">Verbinde…</p>');
    connect();
  };
  document.getElementById('codeGo').onclick=go;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

(async function(){
  sid=new URLSearchParams(location.search).get('s')||'';
  if(!sid){ msg('<h1>Kein Link</h1><p>Dieser Link enthält keine Sitzungs-Kennung.</p><a class="btn pri" href="./">Zur App</a>'); return; }
  let d;
  try{
    const doc=await db.collection('sessions').doc(sid).get();
    if(!doc.exists){ msg('<h1>Sitzung nicht gefunden</h1><p>Sie wurde beendet oder ist abgelaufen. Bitte lass dir einen neuen Link schicken.</p><a class="btn pri" href="./">Zur App</a>'); return; }
    d=doc.data();
  }catch(e){
    console.warn(e);
    msg('<h1>Sitzung nicht erreichbar</h1><p>Sie ist vermutlich abgelaufen. Bitte lass dir einen neuen Link schicken.</p><a class="btn pri" href="./">Zur App</a>'); return;
  }
  if(d.live===false){ msg('<h1>Sitzung beendet</h1><p>Der Gestalter hat das Mitsehen bereits beendet.</p><a class="btn pri" href="./">Zur App</a>'); return; }
  if(d.codeHash) askCode(d.codeHash, d.name);
  else connect();   // kein Hash hinterlegt (kein secure context beim Gastgeber)
})();
</script>
</body>
</html>
