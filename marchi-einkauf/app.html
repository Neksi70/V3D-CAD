<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// Hinter dem Funnel (/einkauf) muss jeder relative Pfad unter dem Präfix bleiben
(function(){var p=location.pathname;if(!/\/$/.test(p)&&!/\.html$/.test(p))document.write('<base href="'+p+'/">');})();
</script>
<title>Marchi Einkauf</title>
<link rel="icon" href="logo-icon-blau.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--blau:#00a2ff;--blau-d:#0077c2;--blau-h:#e6f6ff;--text:#151515;--text2:#4b5563;--grau:#6b7280;--linie:#e3e6ea;--flaeche:#f4f6f8;--weiss:#fff;
  --rot:#c62828;--rot-h:#fdecec;--gruen:#16834f;--gruen-h:#e3f5ec;--gelb-h:#fff6d6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--flaeche)}
header{background:#111;color:#fff;display:flex;align-items:center;gap:22px;padding:0 22px;height:64px;position:sticky;top:0;z-index:5}
header img{height:28px}
header .titel{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blau);border-left:1px solid #333;padding-left:18px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:#bbb;font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px}
nav button:hover{color:#fff}
nav button.an{background:var(--blau);color:#fff}
nav .ic{font-size:17px}
main{max-width:1180px;margin:0 auto;padding:22px 22px 40px}
h2{margin:0 0 14px;font-size:24px}
h3{margin:22px 0 10px;font-size:18px}
a{color:var(--blau-d)}
.leiste{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.leiste .rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;padding:10px 11px;border:1px solid #cbd1d8;border-radius:8px;background:#fff;color:inherit;min-width:0}
textarea{min-height:70px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blau);border-color:transparent}
.btn{font:inherit;font-size:15px;border:1px solid #cbd1d8;background:#fff;border-radius:8px;padding:9px 15px;cursor:pointer;white-space:nowrap;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--blau)}
.btn.p{background:var(--blau);border-color:var(--blau);color:#fff;font-weight:600}
.btn.p:hover{background:var(--blau-d)}
.btn.g{background:var(--gruen);border-color:var(--gruen);color:#fff;font-weight:600}
.btn.rot{color:var(--rot)}
.btn.klein{padding:5px 10px;font-size:13px}
.btn.gross{padding:14px 22px;font-size:17px;border-radius:10px}
.btn.tel{background:var(--gruen-h);border-color:#bfe6d1;color:var(--gruen);font-weight:600}
.karte{background:#fff;border:1px solid var(--linie);border-radius:12px;padding:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linie);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linie);vertical-align:top}
th{background:#fafbfc;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--grau);font-weight:600}
tbody tr.klick{cursor:pointer}
tbody tr.klick:hover{background:#f0f8ff}
td.z,th.z{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.leer{padding:30px;text-align:center;color:var(--grau)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;background:#eef1f4;white-space:nowrap;color:var(--text)}
.punkt{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.st{font-weight:600}
.st-Bedarf{background:#fff4d6}.st-Angefragt{background:#e8f0ff}.st-Bestellt{background:#dff3ff;color:#005d94}
.st-Teilgeliefert{background:#efe6ff}.st-Geliefert{background:#dcf5e8;color:#11663f}.st-Storniert{background:#f3f3f3;color:#888;text-decoration:line-through}
.plus{color:var(--gruen);font-weight:600}.minus{color:var(--rot);font-weight:600}
.hinweis{color:var(--grau);font-size:14px}
.ok{color:var(--gruen)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.zweispaltig{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.halb{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

/* Startseite */
.mikro-karte{display:flex;align-items:center;gap:22px;width:100%;text-align:left;background:linear-gradient(135deg,#00a2ff,#0077c2);color:#fff;border:0;border-radius:16px;padding:26px 26px;cursor:pointer;font:inherit;box-shadow:0 8px 24px rgba(0,119,194,.25)}
.mikro-karte:hover{filter:brightness(1.05)}
.mikro-karte .rund{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:38px;flex:none}
.mikro-karte b{font-size:24px;display:block}
.mikro-karte span{opacity:.92}
.kacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 8px}
.kachel{background:#fff;border:1px solid var(--linie);border-radius:14px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kachel:hover{border-color:var(--blau)}
.kachel .ic{font-size:28px}
.kachel b{display:block;font-size:17px;margin-top:6px}
.kachel .wert{font-size:22px;font-weight:700;color:var(--gruen);margin-top:4px}

/* Preisspiegel */
.rang{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:14px;margin-bottom:10px}
.rang.best{border:2px solid var(--gruen);background:#fbfffd}
.rang .nr{width:36px;height:36px;border-radius:50%;background:#eef1f4;display:flex;align-items:center;justify-content:center;font-weight:700}
.rang.best .nr{background:var(--gruen);color:#fff}
.rang .preis{font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rang .preis small{font-size:13px;font-weight:400;color:var(--grau)}
.rang .akt{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.infozeile{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.info{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:10px 14px}
.info .k{font-size:12px;color:var(--grau);text-transform:uppercase;letter-spacing:.04em}
.info .v{font-size:18px;font-weight:700}

/* Ersparnis */
.held{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:16px}
.held .karte{padding:20px}
.groesse{font-size:40px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.diagramm{position:relative}
.diagramm svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#111;color:#fff;font-size:13px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.tip.an{opacity:1}

/* Memo / Telefonat */
.memo-mic{width:128px;height:128px;border-radius:50%;border:0;background:var(--blau);color:#fff;font-size:54px;cursor:pointer;display:block;margin:6px auto 10px;box-shadow:0 8px 24px rgba(0,162,255,.35);transition:transform .15s}
.memo-mic.an{background:var(--rot);animation:puls 1.3s infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}70%{box-shadow:0 0 0 22px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.memo-status{text-align:center;font-size:17px;font-weight:600;min-height:26px}
.beispiel{background:var(--blau-h);border-radius:10px;padding:10px 14px;font-size:14px;color:#0b4f7a;margin-top:10px}
.posk{border:1px solid var(--linie);border-radius:12px;padding:14px;margin-bottom:12px;background:#fcfdfe}
.neu{background:var(--gelb-h);color:#7a5a00;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}
.rueck{background:var(--gelb-h);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.urteil{font-size:18px;font-weight:700;margin:4px 0 8px}

dialog{border:0;border-radius:14px;padding:0;width:min(760px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.breit{width:min(1100px,97vw)}
dialog::backdrop{background:rgba(10,20,30,.5)}
.dkopf{padding:16px 20px;border-bottom:1px solid var(--linie);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.dkopf h3{margin:0;font-size:19px}
.dkopf .x{margin-left:auto}
.dinhalt{padding:18px 20px}
.dfuss{padding:14px 20px;border-top:1px solid var(--linie);display:flex;gap:8px;position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
.dfuss .rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form.drei{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.vier{grid-template-columns:repeat(4,minmax(0,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--grau)}
.form label.ganz{grid-column:1/-1}
.form label.zwei{grid-column:span 2}
.form input,.form select{color:var(--text);width:100%}
.form label{min-width:0}
.preisfeld{font-size:20px!important;font-weight:700;text-align:right}
.pos td{padding:5px 6px}
.pos input,.pos select{width:100%;padding:7px 8px}
.summe{font-size:18px;font-weight:700;text-align:right;margin-top:10px}
.reiter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.reiter button{font:inherit;border:1px solid var(--linie);background:#fff;border-radius:99px;padding:7px 15px;cursor:pointer}
.reiter button.an{background:#111;color:#fff;border-color:#111}
.baum{background:#fff;border:1px solid var(--linie);border-radius:12px;padding:8px}
.baum .r{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer}
.baum .r:hover{background:#f0f8ff}
.baum .r.an{background:var(--blau);color:#fff}
.baum .r.u{padding-left:28px;font-size:14px}
.baum .r .n{margin-left:auto;font-size:12px;opacity:.65}
#login{max-width:360px;margin:12vh auto;text-align:center;padding:0 16px}
#login img{height:44px;margin-bottom:22px}
#login input{width:100%;font-size:22px;text-align:center;letter-spacing:.3em;margin:10px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:10px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.an{opacity:1}
.mapping td{cursor:default;font-size:14px}
.mapping select{width:100%}
details summary{cursor:pointer;color:var(--grau)}
#druck{display:none}

@media (max-width:820px){
  body{font-size:16px}
  header{height:56px;padding:0 16px}
  header .titel{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;background:#111;margin:0;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
  nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1}
  nav .ic{font-size:21px}
  main{padding:14px 16px 100px}
  .zweispaltig,.halb,.held{grid-template-columns:1fr}
  .form,.form.drei,.form.vier{grid-template-columns:1fr 1fr}
  .form label.zwei{grid-column:1/-1}
  .kacheln{grid-template-columns:1fr}
  .kachel{display:flex;align-items:center;gap:14px;padding:14px}
  .kachel b{margin:0}
  .mikro-karte{padding:20px;gap:16px}
  .mikro-karte .rund{width:64px;height:64px;font-size:32px}
  .mikro-karte b{font-size:21px}
  table{font-size:14px}
  th,td{padding:9px 8px}
  .ausbl{display:none}
  dialog,dialog.breit{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  .groesse{font-size:34px}
  .toast{bottom:90px}
}
@media print{
  body{background:#fff}
  body>*:not(#druck){display:none!important}
  #druck{display:block;padding:0 6mm;font-size:12px}
  #druck table{border:0}#druck th,#druck td{padding:6px 4px}
  @page{size:A4;margin:16mm 14mm}
}
</style>
</head>
<body>
<div id="login" hidden>
  <img src="logo-dunkel.svg" alt="Marchi Group">
  <div class="karte">
    <b>Zentraleinkauf</b>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
    <button class="btn p gross" style="width:100%" onclick="anmelden()">Anmelden</button>
    <div id="loginFehler" class="hinweis" style="color:var(--rot);margin-top:8px"></div>
  </div>
</div>

<div id="app" hidden>
<header>
  <img src="logo-weiss.svg" alt="Marchi Group">
  <span class="titel">Zentraleinkauf</span>
  <nav id="nav">
    <button data-s="start"><span class="ic">🏠</span>Start</button>
    <button data-s="preise"><span class="ic">⚖️</span>Preise</button>
    <button data-s="bestellungen"><span class="ic">🛒</span>Bestellungen</button>
    <button data-s="ersparnis"><span class="ic">💶</span>Ersparnis</button>
    <button data-s="verwaltung"><span class="ic">⚙️</span>Verwaltung</button>
  </nav>
</header>
<main id="inhalt"></main>
</div>

<dialog id="dlg"></dialog>
<div id="druck"></div>
<div class="toast" id="toast"></div>

<script>
let D = {rubriken:[],artikel:[],lieferanten:[],kunden:[],bestellungen:[],angebote:[],refs:{},einstellungen:{},einheiten:[],status:[]};
let seite = 'start';
const F = {rubrik:null, bestSuche:'', bestStatus:'', bestRubrik:'', artSuche:'', liefSuche:'', kundSuche:'', preisSuche:'', spiegel:null, verw:'rubriken', jahr:new Date().getFullYear()};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const eur0 = n => (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const ep = n => (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:4})+' €';   // Einzelpreis
const pct = n => (n>0?'+':'')+(Number(n)||0).toLocaleString('de-DE',{maximumFractionDigits:1})+' %';
const sparPct = v => Math.abs(v).toLocaleString('de-DE',{maximumFractionDigits:1})+' % '+(v>=0?'günstiger':'teurer');
const zahlDe = n => (Number(n)||0).toLocaleString('de-DE',{maximumFractionDigits:3});
const zahlLesen = s => { s = String(s??'').trim(); if (!s) return 0; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); return Number(s.replace(/[^\d.\-]/g,'')) || 0; };
const datumDe = s => s ? s.slice(0,10).split('-').reverse().join('.') : '';
const heute = () => new Date().toISOString().slice(0,10);
const byId = (liste, id) => D[liste].find(x => x.id == id);
const passt = (o, q, felder) => !q || q.toLowerCase().split(/\s+/).every(w => felder.some(f => String(o[f]??'').toLowerCase().includes(w)));
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e) {} };

function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('an'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('an'),2600); }

async function api(pfad, opt={}){
  const o = {method: opt.method||'GET', headers:{}};
  if (opt.body !== undefined){
    if (opt.roh){ o.body = opt.body; } else { o.body = JSON.stringify(opt.body); o.headers['Content-Type']='application/json'; }
  }
  const r = await fetch('api/'+pfad, o);
  if (r.status === 401){ zeigeLogin(); throw new Error('Anmeldung nötig'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok){ if (!opt.still) toast(j.fehler || 'Fehler'); throw new Error(j.fehler||r.status); }
  return j;
}

function zeigeLogin(){ $('#app').hidden=true; $('#login').hidden=false; setTimeout(()=>$('#pin').focus(),50); }
async function anmelden(){
  const r = await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});
  const j = await r.json().catch(()=>({}));
  if (!r.ok){ $('#loginFehler').textContent=j.fehler||'PIN falsch'; return; }
  $('#login').hidden=true; start();
}
$('#pin').addEventListener('keydown', e => { if (e.key==='Enter') anmelden(); });

async function laden(){ D = await api('alles'); zeichnen(); }
async function start(){
  try { D = await api('alles'); } catch(e){ return; }
  $('#app').hidden=false;
  seite = lsGet('me_seite') || seite;
  zeichnen();
  anrufPruefen();
}
function gehe(s){ seite = s; lsSet('me_seite', s); zeichnen(); window.scrollTo(0,0); }
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ if (b.dataset.s==='preise') F.spiegel=null; gehe(b.dataset.s); } });

function zeichnen(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('an', b.dataset.s===seite));
  ({start:sStart, preise:sPreise, bestellungen:sBestellungen, ersparnis:sErsparnis, verwaltung:sVerwaltung})[seite]();
}

// ---------- Rubriken-Hilfen
const hauptRubriken = () => D.rubriken.filter(r => !r.parent_id);
const unterRubriken = id => D.rubriken.filter(r => r.parent_id == id);
const hauptVon = id => { const r = byId('rubriken', id); return r ? (r.parent_id || r.id) : null; };
function rubrikName(id){ const r = byId('rubriken', id); if (!r) return ''; const p = r.parent_id && byId('rubriken', r.parent_id); return p ? p.name+' › '+r.name : r.name; }
function rubrikChip(id){ const r = byId('rubriken', id); if (!r) return ''; return `<span class="chip"><span class="punkt" style="background:${esc(r.farbe)}"></span>${esc(rubrikName(id))}</span>`; }
function rubrikOptionen(sel, leer='— Rubrik —', nurHaupt=false){
  let h = `<option value="">${leer}</option>`;
  for (const r of hauptRubriken()){
    h += `<option value="${r.id}" ${r.id==sel?'selected':''}>${esc(r.name)}</option>`;
    if (!nurHaupt) for (const u of unterRubriken(r.id)) h += `<option value="${u.id}" ${u.id==sel?'selected':''}>&nbsp;&nbsp;› ${esc(u.name)}</option>`;
  }
  return h;
}
const rubrikUndUnter = id => [Number(id), ...unterRubriken(id).map(u=>u.id)];
const optionen = (liste, sel, leer, feld='name') => `<option value="">${leer}</option>` + D[liste].map(x => `<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x[feld])}${liste==='kunden'&&x.ort?' ('+esc(x.ort)+')':''}</option>`).join('');
const statusChip = s => `<span class="chip st st-${esc(s)}">${esc(s)}</span>`;
const artikelText = a => a ? a.name + (a.abmessung ? ' – '+a.abmessung : '') : '';
const telLink = t => String(t||'').replace(/[^\d+]/g,'');

// Angebote je Artikel (für Übersichten): bester aktueller Preis
function angebotsStand(aid){
  const grenze = new Date(Date.now()-180*864e5).toISOString().slice(0,10);
  const ang = D.angebote.filter(a => a.artikel_id==aid && a.datum>=grenze && a.preis>0);
  if (!ang.length) return null;
  const best = ang.reduce((a,b) => b.preis < a.preis ? b : a);
  return {best, anzahl:new Set(ang.map(a=>a.lieferant_id)).size, zuletzt: ang.map(a=>a.datum).sort().pop()};
}
function gegenVorher(aid, preis){
  const ref = D.refs[aid]; if (!ref || !preis) return '';
  const p = (preis-ref)/ref*100;
  return `<span class="${p<0?'plus':p>0?'minus':''}">${pct(p)} ggü. vorher</span>`;
}

// =====================================================================
// Startseite
function sStart(){
  const E = D.einstellungen;
  const offen = D.bestellungen.filter(b => !['Geliefert','Storniert'].includes(b.status));
  const neu = [...new Set(D.angebote.map(a=>a.artikel_id))].slice(0,8);
  $('#inhalt').innerHTML = `
  <h2>${E.einkaeufer ? 'Hallo '+esc(E.einkaeufer.split(' ')[0]) : 'Zentraleinkauf'}</h2>
  <button class="mikro-karte" onclick="memoOeffnen()">
    <div class="rund">🎤</div>
    <div><b>Telefonat eintragen</b><span>Nach dem Gespräch einfach erzählen, was der Lieferant angeboten hat.</span></div>
  </button>
  <div class="kacheln">

// --- Spracherkennung: Browser (live) oder Server (Whisper)
let REC = null, MR = null, aufnahme = false, recBasis = '', recWache = null;
function aufnahmeUmschalten(){ aufnahme ? aufnahmeStopp() : aufnahmeStart(); }
function micAnzeige(an, text){
  const m = $('#mic'); if (!m) return;
  m.classList.toggle('an', an); m.textContent = an ? '■' : '🎤';
  $('#micStatus').textContent = text;
}
function aufnahmeStart(){
  if (!window.isSecureContext){            // Browser geben das Mikrofon nur auf https-Seiten frei
    micAnzeige(false, ''); $('#memoText').focus();
    toast('Mikrofon-Knopf geht nur über https – bitte ' + (/Android|iPhone|iPad/i.test(navigator.userAgent) ? 'die Mikrofon-Taste der Tastatur' : 'Windows-Taste + H') + ' nutzen');
    return;
  }
  // Live-Erkennung des Browsers, außer sie ist abgeschaltet oder hat auf diesem Gerät schon einmal versagt
  const browser = SR && D.einstellungen.sprache !== 'server' && !lsGet('me_nur_server');
  if (browser){
    let gehoert = false;
    REC = new SR(); REC.lang='de-DE'; REC.continuous=true; REC.interimResults=true;
    recBasis = $('#memoText').value.trim(); if (recBasis) recBasis += ' ';
    let fertig = '';
    REC.onresult = e => {
      gehoert = true;
      let vorl = '';
      for (let i=e.resultIndex; i<e.results.length; i++){
        if (e.results[i].isFinal) fertig += e.results[i][0].transcript + ' ';
        else vorl += e.results[i][0].transcript;
      }
      M.text = $('#memoText').value = (recBasis + fertig + vorl).replace(/\s+/g,' ');
    };
    REC.onerror = e => {
      if (e.error==='not-allowed' || e.error==='service-not-allowed'){ aufnahme=false; micAnzeige(false, MIC_GESPERRT); }
      else if (e.error==='network' || e.error==='audio-capture'){ aufnahmeWechsel(); }
    };
    // Manche Browser nehmen die Erkennung an, liefern aber nie etwas (ohne Fehler) → nach 7 s auf Server umschalten
    clearTimeout(recWache);
    recWache = setTimeout(() => { if (aufnahme && REC && !gehoert) aufnahmeWechsel(); }, 7000);
    REC.onend = () => { if (aufnahme && REC){ recBasis = $('#memoText').value.trim()+' '; fertig=''; try{ REC.start(); }catch(e){} } };
    try { REC.start(); aufnahme = true; micAnzeige(true, 'Ich höre zu … zum Beenden nochmal tippen'); }
    catch(e){ serverAufnahme(); }
  } else serverAufnahme();
}
async function serverAufnahme(hinweis){
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
    micAnzeige(false, 'Sprechen geht hier nicht – bitte die Mikrofon-Taste der Handy-Tastatur nutzen oder tippen.'); return;
  }
  if (!D.whisper){ micAnzeige(false, 'Keine Spracherkennung verfügbar – bitte tippen.'); return; }
  try {
    const strom = await navigator.mediaDevices.getUserMedia({audio:true});
    const teile = [];
    MR = new MediaRecorder(strom);
    MR.ondataavailable = e => e.data.size && teile.push(e.data);
    MR.onstop = async () => {
      strom.getTracks().forEach(t=>t.stop());
      if (MR?._abbruch){ MR=null; return; }
      MR = null;
      micAnzeige(false, 'Erkenne Sprache …'); $('#memoWeiter').disabled = true;
      try {
        const r = await api('ton', {method:'POST', body:new Blob(teile), roh:true});
        const t = $('#memoText'); t.value = (t.value.trim()+' '+r.text).trim(); M.text = t.value;
        micAnzeige(false, 'Fertig – prüfen und auf „Weiter" tippen');
      } catch(e){ micAnzeige(false, 'Erkennung fehlgeschlagen – bitte tippen.'); }
      $('#memoWeiter').disabled = false;
    };
    MR.start(); aufnahme = true; micAnzeige(true, hinweis || 'Aufnahme läuft … zum Beenden nochmal tippen');
  } catch(e){ micAnzeige(false, MIC_GESPERRT); }
}
function aufnahmeWechsel(){
  clearTimeout(recWache);
  const r = REC; REC = null; aufnahme = false;
  if (r){ r.onend = null; r.onerror = null; try { r.abort(); } catch(e){} }
  lsSet('me_nur_server', '1');          // dieses Gerät künftig gleich über den Server
  serverAufnahme('Live-Erkennung reagiert hier nicht – ich nehme jetzt auf. Bitte noch einmal sagen, dann zum Beenden tippen.');
}
function aufnahmeStopp(abbruch){
  clearTimeout(recWache);
  aufnahme = false;
  if (REC){ const r = REC; REC = null; try { r.stop(); } catch(e){} micAnzeige(false, 'Fertig – prüfen und auf „Weiter" tippen'); }
  if (MR){ MR._abbruch = !!abbruch; try { MR.stop(); } catch(e){} }
}

// --- Brücke zum Telefon: aus der App anrufen, danach direkt eintragen
function anrufen(lid, aid){
  const l = byId('lieferanten', lid);
  if (!l?.telefon){ toast('Keine Telefonnummer hinterlegt'); return; }
  lsSet('me_anruf', JSON.stringify({lid, aid:aid||null, t:Date.now()}));
  if ($('#dlg').open) $('#dlg').close();
  location.href = 'tel:' + telLink(l.telefon);
}
function anrufPruefen(){
  if (document.visibilityState !== 'visible' || $('#app').hidden) return;
  let a; try { a = JSON.parse(lsGet('me_anruf')||'null'); } catch(e){}
  if (!a) return;
  const dauer = Date.now() - a.t;
  if (dauer < 4000) return;              // noch gar nicht telefoniert
  lsSet('me_anruf', null);
  if (dauer > 3*3600e3) return;
  memoOeffnen({lieferant_id:a.lid, artikel_id:a.aid, nachAnruf:true});
}
document.addEventListener('visibilitychange', () => setTimeout(anrufPruefen, 300));
window.addEventListener('focus', () => setTimeout(anrufPruefen, 300));

function sPreise(){

  $('#inhalt').innerHTML = `
  <h2>Preise vergleichen</h2>
  <div class="leiste">
    <input id="psuche" placeholder="Was brauchst du? z. B. Aluprofil" value="${esc(F.preisSuche)}" style="flex:1;max-width:420px;font-size:17px">

  </div>
  <div id="ptab"></div>`;
  const zeigen = () => {
    const q = F.preisSuche.trim();
    const l = D.artikel.filter(a => a.aktiv && passt(a, q, ['name','nr','abmessung','werkstoff'])).map(a => ({a, s:angebotsStand(a.id)}))
      .sort((x,y) => (y.s?.zuletzt||'').localeCompare(x.s?.zuletzt||'') || x.a.name.localeCompare(y.a.name));
    $('#ptab').innerHTML = (l.length ? `<table><thead><tr><th>Artikel</th><th class="ausbl">Rubrik</th><th>Günstigster</th><th class="z">Preis</th><th class="ausbl">Vergleich bisher</th></tr></thead><tbody>

        <td class="z">${s?`<b>${ep(s.best.preis)}</b> / ${esc(s.best.einheit||a.einheit)}<div>${gegenVorher(a.id,s.best.preis)}</div>`:''}</td>

    ${s.letzter?`<div class="info"><div class="k">Zuletzt gekauft</div><div class="v" style="font-size:15px">${ep(s.letzter.preis)} · ${esc(s.letzter.lieferant||'')} · ${datumDe(s.letzter.datum)}</div></div>`:''}
  </div>

  ${liste.length ? liste.map((x,i) => {
    const l = byId('lieferanten', x.lieferant_id) || {};

      <div class="nr">${i===0?'🏆':i+1}</div>

      <div class="preis">${ep(x.preis)}<br><small>je ${esc(x.einheit)}${mehr?' · '+mehr:''}</small></div>
      <div class="akt">
        <button class="btn ${i===0?'g':''} klein" onclick="ausAngebotBestellen(${x.id})">🛒 Bestellen</button>

      </div></div>`; }).join('')
  : '<div class="karte leer">Noch keine Angebote für diesen Artikel.</div>'}
  ${s.noch_fragen.length ? `<h3>Noch nicht gefragt</h3><div class="karte">${s.noch_fragen.map(k => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--linie)">
    <span style="flex:1"><b>${esc(k.name)}</b>${k.ansprechpartner?' · '+esc(k.ansprechpartner):''}</span>
    ${k.telefon?`<button class="btn tel klein" onclick="anrufen(${k.id},${a.id})">📞 ${esc(k.telefon)}</button>`:`<button class="btn klein" onclick="lieferantOeffnen(${k.id})">Nummer eintragen</button>`}
    <button class="btn klein" onclick="memoOeffnen({lieferant_id:${k.id},artikel_id:${a.id}})">🎤</button></div>`).join('')}</div>` : ''}
  ${s.alle.length > liste.length ? `<details style="margin-top:16px"><summary>Alle ${s.alle.length} Angebote (auch ältere)</summary>
    <table style="margin-top:8px"><tbody>${s.alle.map(x=>`<tr><td>${datumDe(x.datum)}</td><td>${esc(x.lieferant)}</td><td class="z">${ep(x.preis)} / ${esc(x.einheit)}</td><td>${x.menge?'ab '+zahlDe(x.menge):''}</td></tr>`).join('')}</tbody></table></details>` : ''}`;

async function ausAngebotBestellen(angebotId){
  const an = D.angebote.find(a => a.id === angebotId);
  const menge = prompt('Wie viel bestellen?' + (an?.einheit ? ' ('+an.einheit+')' : ''), an?.menge ? String(an.menge).replace('.',',') : '');
  if (menge === null) return;
  const r = await api(`angebote/${angebotId}/bestellen`, {method:'POST', body:{menge:zahlLesen(menge)}});

}

}

const leerePos = () => ({rubrik_id:'', artikel_id:'', bezeichnung:'', menge:1, einheit:'Stk', preis:0});
const kundeText = id => { const k = byId('kunden', id); return k ? (k.kundennr ? k.kundennr+' · ' : '')+k.name+(k.ort?' ('+k.ort+')':'') : ''; };
function posZeichnen(){
  let ers = 0;
  $('#posBody').innerHTML = B.positionen.map((p,i) => {
    const ref = p.artikel_id ? (p.referenzpreis || D.refs[p.artikel_id]) : null;
    const e = ref ? (ref - p.preis) * p.menge : null; if (e) ers += e;
    return `<tr>
    <td><select onchange="posSetz(${i},'rubrik_id',this.value)">${rubrikOptionen(p.rubrik_id)}</select></td>
    <td><input list="artikelliste" value="${esc(p.bezeichnung)}" onchange="posArtikel(${i},this.value)" placeholder="Artikel wählen oder frei eintragen"></td>
    <td><input value="${zahlDe(p.menge)}" inputmode="decimal" onchange="posSetz(${i},'menge',zahlLesen(this.value))" style="text-align:right"></td>
    <td><select onchange="posSetz(${i},'einheit',this.value)">${D.einheiten.map(e=>`<option ${e===p.einheit?'selected':''}>${e}</option>`).join('')}</select></td>
    <td><input value="${(Number(p.preis)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:4})}" inputmode="decimal" onchange="posSetz(${i},'preis',zahlLesen(this.value))" style="text-align:right"></td>
    <td class="z" style="padding-top:13px">${eur(p.menge*p.preis)}</td>
    <td class="z" style="padding-top:8px;font-size:13px">${ref?`<span class="${e>0?'plus':e<0?'minus':''}">${eur(e)}</span><div class="hinweis">vorher ${ep(ref)}</div>`:'<span class="hinweis">–</span>'}</td>

  $('#bSumme').innerHTML = 'Summe netto: ' + eur(B.positionen.reduce((a,p)=>a+p.menge*p.preis,0)) + (ers ? ` <span class="${ers>0?'plus':'minus'}" style="font-size:15px;margin-left:10px">${ers>0?'gespart':'teurer'}: ${eur(Math.abs(ers))}</span>` : '');
}
function posSetz(i,f,v){ B.positionen[i][f]=v; posZeichnen(); }
function posArtikel(i, text){
  const p = B.positionen[i];
  const a = D.artikel.find(a => artikelText(a) === text);
  p.bezeichnung = text; p.referenzpreis = null;
  if (a){
    p.artikel_id = a.id; p.rubrik_id = a.rubrik_id || p.rubrik_id; p.einheit = a.einheit || p.einheit;

  } else p.artikel_id = '';
  posZeichnen();

const MONATE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function tipp(box){ let t = box.querySelector('.tip'); if (!t){ t = document.createElement('div'); t.className='tip'; box.appendChild(t); } return t; }
function achsenSchritte(max){ const roh = max/4; const p = Math.pow(10, Math.floor(Math.log10(roh||1))); const s = [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=roh) || p; return s; }

function kurveZeichnen(box, r){
  const jetztJahr = r.jahr === new Date().getFullYear();
  const bis = jetztJahr ? new Date().getMonth()+1 : 12;
  const werte = r.kumuliert.slice(0, bis);
  const W=560, H=240, L=58, R=14, T=14, U=28;
  const min = Math.min(0, ...werte), max = Math.max(1, ...werte);
  const schritt = achsenSchritte(max-min), oben = Math.ceil(max/schritt)*schritt, unten = Math.floor(min/schritt)*schritt;
  const x = i => L + i*(W-L-R)/11, y = v => T + (oben-v)/(oben-unten||1)*(H-T-U);
  let g = '';
  for (let v=unten; v<=oben+1e-9; v+=schritt) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9aa3ad':'#e9ecef'}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6b7280">${eur0(v)}</text>`;
  MONATE.forEach((m,i) => g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6b7280">${m}</text>`);
  const pfad = werte.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join('');
  const flaeche = werte.length ? `${pfad}L${x(werte.length-1)},${y(0)}L${x(0)},${y(0)}Z` : '';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aufsummierte Ersparnis je Monat">${g}
    <path d="${flaeche}" fill="#00a2ff" opacity=".12"/><path d="${pfad}" fill="none" stroke="#00a2ff" stroke-width="2.5" stroke-linejoin="round"/>
    ${werte.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#00a2ff" stroke="#fff" stroke-width="2"/>`).join('')}
    ${werte.length?`<text x="${x(werte.length-1)}" y="${y(werte[werte.length-1])-10}" text-anchor="${werte.length>9?'end':'middle'}" font-size="12" font-weight="700" fill="#151515">${eur0(werte[werte.length-1])}</text>`:''}
    ${werte.map((v,i)=>`<rect x="${x(i)-(W-L-R)/22}" y="${T}" width="${(W-L-R)/11}" height="${H-T-U}" fill="transparent" data-i="${i}"/>`).join('')}
    <line id="kLinie" x1="0" x2="0" y1="${T}" y2="${H-U}" stroke="#9aa3ad" stroke-dasharray="3 3" opacity="0"/></svg>`;
  const t = tipp(box), svg = box.querySelector('svg'), lin = box.querySelector('#kLinie');
  svg.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.addEventListener('pointerenter', () => {
      const i = +rc.dataset.i, sk = svg.getBoundingClientRect().width / W;
      t.innerHTML = `<b>${MONATE[i]} ${r.jahr}</b><br>im Monat: ${eur(r.monate[i])}<br>aufsummiert: ${eur(werte[i])}`;
      t.style.left = x(i)*sk+'px'; t.style.top = y(werte[i])*sk+'px'; t.classList.add('an');
      lin.setAttribute('x1', x(i)); lin.setAttribute('x2', x(i)); lin.setAttribute('opacity', 1);
    });
    rc.addEventListener('pointerleave', () => { t.classList.remove('an'); lin.setAttribute('opacity', 0); });
  });
}
function rubrikBalken(box, r){
  const z = r.rubriken.filter(x => x.basis || x.volumen).filter(x => x.basis);
  if (!z.length){ box.innerHTML = '<div class="leer">Noch keine Einsparung in diesem Jahr.</div>'; return; }
  const W=560, zeile=34, L=170, R=110, H=z.length*zeile+8;
  const maxAbs = Math.max(...z.map(x=>Math.abs(x.basis)));
  const hatNeg = z.some(x=>x.basis<0), null0 = hatNeg ? L + (W-L-R)/2 : L;
  const breite = hatNeg ? (W-L-R)/2 : (W-L-R);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ersparnis je Rubrik">
    <line x1="${null0}" x2="${null0}" y1="0" y2="${H}" stroke="#9aa3ad"/>
    ${z.map((x,i) => { const rb = byId('rubriken', x.rubrik_id); const w = Math.max(2, Math.abs(x.basis)/maxAbs*breite); const yy = 6+i*zeile;
      const proz = x.vergleichsvolumen ? ' · '+(x.hart/x.vergleichsvolumen*100).toLocaleString('de-DE',{maximumFractionDigits:1})+' %' : '';
      return `<g data-i="${i}" style="cursor:default"><rect x="0" y="${yy-3}" width="${W}" height="${zeile}" fill="transparent"/>
      <text x="${L-10}" y="${yy+17}" text-anchor="end" font-size="13" fill="#151515">${esc((rb?.name||'ohne Rubrik').slice(0,22))}</text>
      <rect x="${x.basis<0?null0-w:null0}" y="${yy+4}" width="${w}" height="18" rx="4" fill="${x.basis<0?'#c62828':(rb?.farbe||'#00a2ff')}"/>
      <text x="${W-R+8}" y="${yy+17}" font-size="12" fill="#151515" font-weight="600">${eur0(x.basis)}${x.basis<0?' teurer':''}</text></g>`; }).join('')}
  </svg>`;
  const t = tipp(box), svg = box.querySelector('svg');
  svg.querySelectorAll('g[data-i]').forEach(gr => {
    gr.addEventListener('pointerenter', () => {
      const x = z[+gr.dataset.i], rb = byId('rubriken', x.rubrik_id), sk = svg.getBoundingClientRect().width / W;
      t.innerHTML = `<b>${esc(rb?.name||'ohne Rubrik')}</b><br>gespart: ${eur(x.basis)}<br>Einkauf: ${eur0(x.volumen)}${x.vergleichsvolumen?'<br>vorher wären es '+eur0(x.vergleichsvolumen)+' gewesen':''}`;
      t.style.left = (W/2)*sk+'px'; t.style.top = (6+(+gr.dataset.i)*zeile)*sk+'px'; t.classList.add('an');
    });
    gr.addEventListener('pointerleave', () => t.classList.remove('an'));
  });
}

    dlg.querySelectorAll('[data-k]').forEach(e => {
      const f = felder.find(x=>x.k===e.dataset.k) || {};
      d[e.dataset.k] = e.type==='checkbox' ? (e.checked?1:0) : f.zahl ? zahlLesen(e.value) : (f.typ==='select' && e.value==='' ? null : e.value);
    });
    if (pflicht==='name' && !String(d.name||'').trim()){ toast('Bitte einen Namen eintragen'); return; }
    const r = await api(tab+(obj.id?'/'+obj.id:''), {method:obj.id?'PUT':'POST', body:pflicht==='name'?d:{...d, [pflicht]:obj[pflicht]}});
    dlg.close(); await laden(); toast('Gespeichert'); nachSpeichern && nachSpeichern(obj.id||r.id);
  };
  if (obj.id) $('#fdLoeschen').onclick = async () => {
    if (!confirm(`„${obj.name||'Eintrag'}" wirklich löschen?`)) return;
    await api(tab+'/'+obj.id,{method:'DELETE'}); dlg.close(); laden();
  };
  if (!dlg.open) dlg.showModal();
  setTimeout(()=>dlg.querySelector('[data-k]')?.focus(),30);
}

async function einstellungenSpeichern(){

// --- Datei-Import (Kunden / Altpreise): Datei → erkannte Spalten → einlesen
let IMP = null;
function importStarten(art){
  const i = document.createElement('input'); i.type='file'; i.accept='.csv,.txt,.xlsx'; i.id='importDatei'; i.hidden=true;
  i.onchange = () => importDatei(art, i.files[0]); document.body.appendChild(i); i.click(); setTimeout(()=>i.remove(), 60000);
}
const FELDNAMEN = {kundennr:'Kundennummer', name:'Firma / Name', ansprechpartner:'Ansprechpartner', strasse:'Straße', plz:'PLZ', ort:'Ort', land:'Land', telefon:'Telefon', email:'E-Mail', ustid:'USt-ID', notiz:'Notiz',
  datum:'Datum', lieferant:'Lieferant', artikelnr:'Artikelnummer', bezeichnung:'Artikel / Bezeichnung', menge:'Menge', einheit:'Einheit', preis:'Einzelpreis', gesamt:'Gesamtbetrag', rubrik:'Rubrik / Warengruppe'};
async function importDatei(art, datei){
  if (!datei) return;
  const r = await api(`${art}/vorschau?datei=`+encodeURIComponent(datei.name), {method:'POST', body:await datei.arrayBuffer(), roh:true});
  IMP = {...r, datei:datei.name, art};
  const dlg = $('#dlg'); dlg.className='breit';
  dlg.innerHTML = `<div class="dkopf"><h3>${art==='kunden'?'Kunden':'Altpreise'} einlesen: ${esc(datei.name)}</h3><button class="btn x" onclick="$('#dlg').close()">✕</button></div>
  <div class="dinhalt">
    <p><b>${r.zeilen.length}</b> Zeilen gefunden. Die Spalten wurden automatisch zugeordnet – bitte kurz prüfen.
    ${art==='kunden'?'Vorhandene Kunden (gleiche Kundennummer, sonst gleicher Name + PLZ) werden <b>aktualisiert</b>, neue <b>angelegt</b>.':'Fehlende Lieferanten und Artikel werden <b>automatisch angelegt</b> und in Rubriken einsortiert.'}</p>
    <div style="overflow:auto"><table class="mapping"><thead><tr>${r.kopf.map((k,i)=>`<th style="min-width:140px">${esc(k)||'Spalte '+(i+1)}<br>
      <select data-i="${i}" style="margin-top:6px;text-transform:none;font-weight:400"><option value="">– ignorieren –</option>${r.felder.map(f=>`<option value="${f}" ${r.zuordnung[i]===f?'selected':''}>${FELDNAMEN[f]||f}</option>`).join('')}</select></th>`).join('')}</tr></thead>
    <tbody>${r.zeilen.slice(0,8).map(z=>`<tr>${r.kopf.map((_,i)=>`<td>${esc(z[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    ${r.zeilen.length>8?`<p class="hinweis">… und ${r.zeilen.length-8} weitere Zeilen.</p>`:''}
  </div>
  <div class="dfuss"><div class="rechts"><button class="btn" onclick="$('#dlg').close()">Abbrechen</button><button class="btn p" onclick="importAusfuehren()">${r.zeilen.length} Zeilen einlesen</button></div></div>`;
  if (!dlg.open) dlg.showModal();
}
async function importAusfuehren(){
  const zuordnung = {};
  $('#dlg').querySelectorAll('select[data-i]').forEach(s => { if (s.value) zuordnung[s.dataset.i] = s.value; });
  const z = Object.values(zuordnung);
  if (IMP.art==='kunden' && !z.includes('name')){ toast('Bitte eine Spalte als „Firma / Name" zuordnen'); return; }
  if (IMP.art==='historie' && (!z.includes('bezeichnung') && !z.includes('artikelnr') || !z.includes('preis') && !z.includes('gesamt'))){ toast('Bitte mindestens Artikel und Preis zuordnen'); return; }
  const r = await api(`${IMP.art}/import`, {method:'POST', body:{zeilen:IMP.zeilen, zuordnung, quelle:'Import '+IMP.datei+' ('+datumDe(heute())+')'}});
  const text = IMP.art==='kunden'
    ? `✓ ${r.neu} Kunden neu angelegt, ${r.aktualisiert} aktualisiert${r.uebersprungen?`, ${r.uebersprungen} Zeilen ohne Namen übersprungen`:''}.`
    : `✓ ${r.zeilen} Preise eingelesen. ${r.neue_artikel} Artikel und ${r.neue_lieferanten} Lieferanten neu angelegt.${r.ohne_datum?` ${r.ohne_datum} Zeilen ohne Datum wurden auf den ${datumDe(r.ersatzdatum)} gelegt.`:''}${r.uebersprungen?` ${r.uebersprungen} Zeilen ohne Artikel/Preis übersprungen.`:''}`;
  $('#dlg').innerHTML = `<div class="dkopf"><h3>Fertig</h3></div><div class="dinhalt"><p class="ok" style="font-size:17px">${text}</p>
    ${IMP.art==='historie'?'<p class="hinweis">Bitte unter Verwaltung → Rubriken &amp; Artikel kurz prüfen, ob die Artikel in den richtigen Rubriken gelandet sind.</p>':''}</div>
    <div class="dfuss"><div class="rechts"><button class="btn p" onclick="$('#dlg').close()">Fertig</button></div></div>`;
  await laden();
}

start();
</script>
