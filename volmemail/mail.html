function sigDaten() {
  const d = { layout: document.getElementById('sig_layout').value };
  for (const [k] of SIG_FELDER) d[k] = document.getElementById('sig_' + k).value.trim();
  d.logo = S.sigLogo ? S.sigLogo.data : '';
  d.logoTyp = S.sigLogo ? S.sigLogo.type : '';
  d.logoBreite = parseInt(document.getElementById('sig_logoBreite').value, 10) || 140;
  d.logoPos = document.getElementById('sig_logoPos').value;
  d.kontaktUnter = document.getElementById('sig_kontaktUnter').checked;
  return d;
}
function sigVorschau() {
  const d = sigDaten();
  document.getElementById('sig_vor').innerHTML =
    sigBauen(d, d.layout).html || '<span class="muted">noch nichts ausgefüllt</span>';
  const lv = document.getElementById('sig_logovor');
  lv.innerHTML = d.logo
    ? `<img src="${esc(d.logo)}" style="max-width:110px;max-height:60px">`
    : '<span class="muted" style="font-size:12px">kein Logo</span>';
}

// --- Logo -------------------------------------------------------------------
// Mails wollen Rasterbilder: SVG zeigen viele Programme nicht an. Die Umwandlung
// macht der Browser über ein Canvas — auf dem Server liegt kein Rasterer.
function svgZuPng(svg, zielBreite) {
  return new Promise((fertig, schief) => {
    const bild = new Image();
    const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    bild.onload = () => {
      const v = bild.width || 600, h = bild.height || 300;
      const b = zielBreite * 2;                     // doppelt für scharfe Darstellung
      const c = document.createElement('canvas');
      c.width = b; c.height = Math.round(b * h / v);
      const g = c.getContext('2d');
      g.fillStyle = '#ffffff';                      // Mailprogramme mit dunklem Hintergrund
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(bild, 0, 0, c.width, c.height);
      fertig(c.toDataURL('image/png'));
    };
    bild.onerror = () => schief(new Error('Logo konnte nicht gelesen werden'));
    bild.src = url;
  });
}

async function sigLogoAusRechnung() {
  let r;
  try { r = await api('firmenlogo'); } catch (e) { return toast(e.message); }
  if (!r.svg) return toast('Kein Firmenlogo gefunden');
  try {
    const breite = parseInt(document.getElementById('sig_logoBreite').value, 10) || 140;
    S.sigLogo = { data: await svgZuPng(r.svg, breite), type: 'image/png', name: 'logo.png' };
    sigVorschau();
    toast('Firmenlogo übernommen');
  } catch (e) { toast(e.message); }
}

function sigLogoDatei(datei) {
  if (!datei) return;
  if (datei.size > 400 * 1024) return toast('Bitte ein Logo unter 400 KB wählen');
  const fr = new FileReader();
  fr.onload = () => {
    S.sigLogo = { data: fr.result, type: datei.type || 'image/png', name: datei.name || 'logo.png' };
    sigVorschau();
  };
  fr.readAsDataURL(datei);
}

function sigLogoWeg() { S.sigLogo = null; sigVorschau(); }
async function sigAusRechnung(still) {
  let f;
  try { f = (await api('firma')).firma || {}; } catch (e) { return still || toast(e.message); }
  if (!Object.keys(f).length) return still || toast('Keine Firmendaten gefunden');
  const setze = (k, v) => { const el = document.getElementById('sig_' + k); if (el && v && !el.value) el.value = v; };
  setze('name', f.inhaber); setze('firma', f.name); setze('slogan', f.slogan);
  setze('strasse', f.strasse); setze('ort', [f.plz, f.ort].filter(Boolean).join(' '));
  setze('telefon', f.telefon); setze('web', f.web);
  sigVorschau();
  if (!still) toast('Aus VolmeRechnung übernommen');
}
function sigLeeren() {
  for (const [k] of SIG_FELDER) document.getElementById('sig_' + k).value = '';
  sigVorschau();
}
async function sigSpeichern(id) {
  if (!id) return toast('Bitte das Konto erst speichern, dann die Signatur einrichten', 5000);
  const d = sigDaten();
  const { text } = sigBauen(d, d.layout);
  // Für den Versand verweist das Logo auf den eingebetteten Teil (cid), nicht
  // auf die data:-Fassung — die zeigt Outlook nicht an.
  const { html } = sigBauen(d, d.layout,
    d.logo ? { logo: { src: 'cid:' + SIG_LOGO_CID, breite: d.logoBreite } } : {});
  const leer = !text.trim();
  // Nur Adresse und Telefon ohne Namen ergibt keine Signatur, sondern eine
  // zusammenhanglose Zeile unter der Mail.
  if (!leer && !d.name && !d.firma) {
    return toast('Bitte mindestens Name oder Firma ausfüllen', 5000);
  }
  try {
    const r = await post('account/save', {
      id, signatureData: leer ? {} : d,
      signature: leer ? '' : text, signatureHtml: leer ? '' : html,
    });
    const i = S.accounts.findIndex(x => x.id === r.account.id);
    if (i >= 0) S.accounts[i] = r.account;
    if (S.acc && S.acc.id === r.account.id) S.acc = r.account;
    toast(leer ? 'Signatur entfernt' : 'Signatur gespeichert ✓');
    editAccount(id);
  } catch (e) { toast('Fehler: ' + e.message, 5000); }
}

async function saveAccount(id) {
  const btn = document.getElementById('a_save');
  const err = document.getElementById('a_err');
  const acc = {
    id: id || undefined,
    email: document.getElementById('a_email').value.trim(),
    name: document.getElementById('a_name').value.trim(),
    password: document.getElementById('a_pass').value,
    user: document.getElementById('a_user').value.trim(),
    imapHost: document.getElementById('a_ih').value.trim(),
    imapPort: parseInt(document.getElementById('a_ip').value, 10) || 993,
    imapSSL: document.getElementById('a_issl').checked,
    smtpHost: document.getElementById('a_sh').value.trim(),
    smtpPort: parseInt(document.getElementById('a_sp').value, 10) || 587,
    smtpMode: document.getElementById('a_sm').value,
    // Signatur bewusst nicht mitschicken: sie wird im eigenen Editor gepflegt,
    // der Server behält beim Speichern die nicht übergebenen Felder.
  };
  if (!acc.email || !acc.imapHost) { err.textContent = 'E-Mail-Adresse und IMAP-Server sind Pflicht.'; return; }
  if (!acc.password && !id) { err.textContent = 'Passwort fehlt.'; return; }
  err.textContent = ''; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> prüfe…';
  try {
    await post('account/test', acc);
    const r = await post('account/save', acc);
    const idx = S.accounts.findIndex(x => x.id === r.account.id);
    if (idx >= 0) S.accounts[idx] = r.account; else S.accounts.push(r.account);
    closeModal(); toast('Konto gespeichert ✓');
    document.getElementById('app').classList.remove('hide');
    if (S.acc && S.acc.id === r.account.id) { S.acc = r.account; renderAccounts(); loadFolders(); }
    else switchAcc(r.account.id);
  } catch (e) {
    err.textContent = e.message;
  } finally { btn.disabled = false; btn.textContent = 'Prüfen & speichern'; }
}

async function delAccount(id) {
  if (!confirm('Konto wirklich entfernen? Die Mails auf dem Server bleiben unangetastet.')) return;
  await post('account/delete', { id });
  S.accounts = S.accounts.filter(a => a.id !== id);
  accountDialog(!S.accounts.length);
  if (S.acc && S.acc.id === id) location.reload();
}

// --- Kalender --------------------------------------------------------------
S.cal = { y: 0, m: 0, events: [], cals: [], von: null };
const KAL_MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli',
                    'August', 'September', 'Oktober', 'November', 'Dezember'];

function calKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
const isoZ = (d) => d.toISOString().replace(/\.\d+Z$/, 'Z');

function oeffneKalender() {
  if (!S.acc) return toast('Erst ein Postfach anlegen');
  document.getElementById('cal').classList.remove('hide');
  document.getElementById('side').classList.remove('open');
  pushLayer('cal');
  const d = new Date();
  S.cal.y = d.getFullYear(); S.cal.m = d.getMonth();
  ladeTermine();
}
function schliesseKalender() {
  if (S.layers[S.layers.length - 1] === 'cal') zurueck();
  else document.getElementById('cal').classList.add('hide');
}
function calMonat(dx) {
  const d = new Date(S.cal.y, S.cal.m + dx, 1);
  S.cal.y = d.getFullYear(); S.cal.m = d.getMonth();
  ladeTermine();
}
function calHeute() { const d = new Date(); S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); ladeTermine(); }

async function ladeTermine() {
  document.getElementById('calmon').textContent = KAL_MONATE[S.cal.m] + ' ' + S.cal.y;
  document.getElementById('calacc').textContent = S.acc.email;
  const grid = document.getElementById('calgrid');
  // Gitter: Montag vor dem Monatsersten, 6 Wochen
  const erster = new Date(S.cal.y, S.cal.m, 1);
  const start = new Date(erster);
  start.setDate(1 - ((erster.getDay() + 6) % 7));
  const ende = new Date(start);
  ende.setDate(start.getDate() + 42);
  S.cal.von = start;
  grid.innerHTML = '<div style="grid-column:1/-1;padding:34px;text-align:center"><span class="spin"></span></div>';
  let r;
  try {
    r = await post('cal/events', { acc: S.acc.id, start: isoZ(start), end: isoZ(ende) });
  } catch (e) {
    if (/nicht verbunden/.test(e.message)) return kalenderEinrichten(grid);
    grid.innerHTML = `<div style="grid-column:1/-1;padding:34px;text-align:center;color:var(--red)">${esc(e.message)}</div>`;
    return;
  }
  S.cal.events = r.events; S.cal.cals = r.calendars;
  renderKalender();
}

function kalenderEinrichten(grid) {
  grid.innerHTML = `<div style="grid-column:1/-1;padding:40px 20px;text-align:center">
    <p style="margin-bottom:6px"><b>Kalender ist noch nicht verbunden.</b></p>
    <p class="muted" style="margin-bottom:16px">Die Termine liegen beim Mail-Hoster (CalDAV) und sind damit auch am
    Handy und in anderen Programmen dieselben.<br>Angemeldet wird mit den Zugangsdaten des Postfachs
    <b>${esc(S.acc.email)}</b> — bei goneo muss dafür „Webmail Plus" im Tarif aktiv sein.</p>
    <button class="btn" onclick="verbindeKalender(this)">Kalender verbinden</button></div>`;
}

async function verbindeKalender(btn) {
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Suche Kalender…';
  try {
    await post('cal/setup', { acc: S.acc.id });
    toast('Kalender verbunden');
    ladeTermine();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Kalender verbinden';
    modal(`<h3>Kalender verbinden</h3><p style="margin:12px 0">${esc(e.message)}</p>
      <div style="display:flex;justify-content:flex-end"><button class="btn" onclick="closeModal()">OK</button></div>`);
  }
}

function tagesTermine(key) {
  return S.cal.events.filter(ev => {
    if (ev.allDay) {
      // DTEND ist bei Ganztags-Terminen exklusiv
      return ev.end > ev.start ? (ev.start <= key && key < ev.end) : key === ev.start;
    }
    return calKey(new Date(ev.start)) === key;
  });
}

function evZeit(ev) {
  if (ev.allDay) return 'ganztägig';
  const f = (d) => new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return f(ev.start) + '–' + f(ev.end);
}

function renderKalender() {
  const grid = document.getElementById('calgrid');
  const heute = calKey(new Date());
  const d = new Date(S.cal.von);
  let html = '';
  for (let i = 0; i < 42; i++) {
    const key = calKey(d);
    const evs = tagesTermine(key);
    const cls = 'calday' + (d.getMonth() !== S.cal.m ? ' aus' : '') + (key === heute ? ' heute' : '');
    html += `<div class="${cls}" onclick="tagDialog('${key}')"><span class="dnum">${d.getDate()}</span>`;
    for (const ev of evs.slice(0, 4)) {
      const idx = S.cal.events.indexOf(ev);
      const zeit = ev.allDay ? '' : new Date(ev.start).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' ';
      html += `<span class="calev${ev.allDay ? ' ganz' : ''}" onclick="event.stopPropagation();terminDialog(${idx})">${zeit}${esc(ev.summary || '(ohne Titel)')}</span>`;
    }
    if (evs.length > 4) html += `<span class="calev">+${evs.length - 4} weitere</span>`;
    if (evs.length) html += '<span class="punkt"></span>';
    html += '</div>';
    d.setDate(d.getDate() + 1);
  }
  grid.innerHTML = html;
}

function tagDialog(key) {
  const evs = tagesTermine(key);
  const datum = new Date(key + 'T12:00:00').toLocaleDateString('de-DE',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  modal(`<h3>${datum}</h3>
    <div style="margin:12px 0">${evs.length ? evs.map(ev => {
      const idx = S.cal.events.indexOf(ev);
      return `<div class="calev${ev.allDay ? ' ganz' : ''}" style="font-size:14px;padding:8px 10px;margin-top:6px"
        onclick="terminDialog(${idx})"><b>${esc(ev.summary || '(ohne Titel)')}</b>
        <span class="muted">${evZeit(ev)}${ev.location ? ' · ' + esc(ev.location) : ''}</span></div>`;
    }).join('') : '<p class="muted">Keine Termine.</p>'}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn sec" onclick="closeModal()">Schließen</button>
      <button class="btn" onclick="terminDialog(null,'${key}')">＋ Neuer Termin</button></div>`);
}

function terminDialog(idx, key) {
  if (!S.acc) return;
  const ev = (idx === null || idx === undefined) ? null : S.cal.events[idx];
  if (ev && ev.recurring) {
    modal(`<h3>${esc(ev.summary || 'Termin')}</h3>
      <p style="margin:10px 0">${evZeit(ev)}${ev.location ? ' · ' + esc(ev.location) : ''}</p>
      ${ev.description ? `<p class="muted" style="white-space:pre-wrap;margin-bottom:10px">${esc(ev.description)}</p>` : ''}
      <p class="muted" style="margin:10px 0">Dies ist ein <b>Serientermin</b>. Ändern bitte in dem Programm, mit dem
      die Serie angelegt wurde — sonst würde die ganze Serie überschrieben.</p>
      <div style="display:flex;justify-content:flex-end"><button class="btn" onclick="closeModal()">Schließen</button></div>`);
    return;
  }
  let d1, d2, von = '09:00', bis = '10:00', ganz = false;
  if (ev) {
    ganz = !!ev.allDay;
    if (ganz) {
      d1 = ev.start;
      const e = new Date(ev.end + 'T12:00:00');
      if (ev.end > ev.start) e.setDate(e.getDate() - 1);   // exklusiv → letzter Tag
      d2 = calKey(e);
    } else {
      const s = new Date(ev.start), e = new Date(ev.end);
      d1 = calKey(s); d2 = calKey(e);
      von = s.toTimeString().slice(0, 5); bis = e.toTimeString().slice(0, 5);
    }
  } else {
    d1 = key || calKey(new Date()); d2 = d1;
  }
  const calWahl = (!ev && S.cal.cals.length > 1) ?
    `<label style="font-size:12.5px;color:var(--mid)">Kalender<select id="t_cal" style="width:100%;margin-top:3px">
      ${S.cal.cals.map(c => `<option value="${esc(c.href)}">${esc(c.name)}</option>`).join('')}</select></label>` : '';
  modal(`<h3>${ev ? 'Termin bearbeiten' : 'Neuer Termin'}</h3>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">
      <input id="t_titel" placeholder="Titel" value="${esc(ev && ev.summary || '')}">
      <input id="t_ort" placeholder="Ort (optional)" value="${esc(ev && ev.location || '')}">
      <label style="font-size:13.5px;display:flex;align-items:center;gap:7px">
        <input type="checkbox" id="t_ganz" ${ganz ? 'checked' : ''}
          onchange="document.getElementById('t_zeiten').style.display=this.checked?'none':'flex'"> Ganztägig</label>
      <div style="display:flex;gap:8px">
        <label style="flex:1;font-size:12.5px;color:var(--mid)">Datum<input type="date" id="t_datum" value="${d1}" style="width:100%;margin-top:3px"></label>
        <label style="flex:1;font-size:12.5px;color:var(--mid)">bis<input type="date" id="t_datum2" value="${d2}" style="width:100%;margin-top:3px"></label>
      </div>
      <div id="t_zeiten" style="display:${ganz ? 'none' : 'flex'};gap:8px">
        <label style="flex:1;font-size:12.5px;color:var(--mid)">von<input type="time" id="t_von" value="${von}" style="width:100%;margin-top:3px"></label>
        <label style="flex:1;font-size:12.5px;color:var(--mid)">bis<input type="time" id="t_bis" value="${bis}" style="width:100%;margin-top:3px"></label>
      </div>
      ${calWahl}
      <textarea id="t_besch" placeholder="Beschreibung (optional)" style="min-height:70px">${esc(ev && ev.description || '')}</textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      ${ev ? `<button class="btn danger" style="margin-right:auto" onclick="terminLoeschen(${idx})">🗑 Löschen</button>` : ''}
      <button class="btn sec" onclick="closeModal()">Abbrechen</button>
      <button class="btn" onclick="terminSpeichern(${ev ? idx : 'null'})">Speichern</button>
    </div>`);
  document.getElementById('t_titel').focus();
}

async function terminSpeichern(idx) {
  const w = (id) => document.getElementById(id).value;
  const ganz = document.getElementById('t_ganz').checked;
  const d1 = w('t_datum'), d2 = w('t_datum2') || d1;
  const ev = { summary: w('t_titel').trim(), location: w('t_ort').trim(),
               description: w('t_besch').trim(), allDay: ganz };
  if (!ev.summary) return toast('Titel fehlt');
  if (!d1) return toast('Datum fehlt');
  if (ganz) {
    ev.start = d1; ev.end = d2 < d1 ? d1 : d2;
  } else {
    const s = new Date(d1 + 'T' + (w('t_von') || '09:00'));
    const e = new Date((d2 < d1 ? d1 : d2) + 'T' + (w('t_bis') || '10:00'));
    if (e <= s) return toast('Ende liegt vor dem Beginn');
    ev.start = isoZ(s); ev.end = isoZ(e);
  }
  const alt = idx === null ? null : S.cal.events[idx];
  const calSel = document.getElementById('t_cal');
  try {
    await post('cal/save', { acc: S.acc.id, ev, href: alt && alt.href, uid: alt && alt.uid,
                             calendar: calSel ? calSel.value : null });
    closeModal();
    toast('Termin gespeichert');
    ladeTermine();
  } catch (e) { toast(e.message); }
}

async function terminLoeschen(idx) {
  const ev = S.cal.events[idx];
  if (!ev || !confirm('Termin „' + (ev.summary || 'ohne Titel') + '" wirklich löschen?')) return;
  try {
    await post('cal/delete', { acc: S.acc.id, href: ev.href });
    closeModal();
    toast('Termin gelöscht');
    ladeTermine();
  } catch (e) { toast(e.message); }
}

// --- KI --------------------------------------------------------------------
async function kiDialog() {
  document.getElementById('side').classList.remove('open');
  let st = { hasKey: false, model: 'claude-haiku-4-5' };
  try { st = await api('ai/settings'); } catch (e) {}
  modal(`<h3>✨ KI einrichten</h3>
    <p class="muted" style="margin:6px 0 12px">Für Zusammenfassen, Antwort-Entwürfe und die Formulier-Hilfe braucht
    V3D Mail einen Anthropic-API-Schlüssel (console.anthropic.com → API Keys). Abgerechnet wird pro Nutzung —
    bei Mail-Mengen typisch wenige Cent im Monat. Das Diktieren braucht keinen Schlüssel.</p>
    <p style="margin-bottom:8px">Stand: <b>${st.hasKey ? 'Schlüssel hinterlegt ✓' : 'kein Schlüssel hinterlegt'}</b></p>
    <input id="ki_key" placeholder="${st.hasKey ? 'Neuer Schlüssel (leer lassen = behalten)' : 'sk-ant-…'}" style="width:100%;margin-bottom:10px">
    <label style="font-size:12.5px;color:var(--mid)">Modell
      <select id="ki_model" style="width:100%;margin:3px 0 14px">
        <option value="claude-haiku-4-5">Haiku 4.5 — schnell & günstig (Standard)</option>
        <option value="claude-sonnet-5">Sonnet 5 — beste Texte, teurer</option>
      </select></label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn sec" onclick="closeModal()">Abbrechen</button>
      <button class="btn" onclick="kiSpeichern()">Speichern</button></div>`);
  document.getElementById('ki_model').value = st.model;
}

async function kiSpeichern() {
  try {
    await post('ai/settings', { key: document.getElementById('ki_key').value.trim(),
                                model: document.getElementById('ki_model').value });
    toast('KI-Einstellungen gespeichert');
    closeModal();
  } catch (e) { toast(e.message); }
}

function kiLauf(titel) {
  modal(`<h3>${titel}</h3><p style="margin:24px 0;text-align:center"><span class="spin"></span> Die KI arbeitet…</p>`);
}

function kiFehler(e) {
  modal(`<h3>✨ KI</h3><p style="margin:12px 0;color:var(--red)">${esc(e.message)}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      ${/KI-Schlüssel/.test(e.message) ? '<button class="btn" onclick="kiDialog()">KI einrichten</button>' : ''}
      <button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}

function kiMailText(m) { return m.plain || stripTags(m.html); }

async function kiZusammenfassen() {
  if (!S.cur) return;
  const m = S.cur;
  kiLauf('✨ Zusammenfassung');
  try {
    const r = await post('ai', { task: 'summary', subject: m.subject,
                                 from: (m.from[0] || {}).email || '', text: kiMailText(m) });
    S.kiDraft = r.text;
    modal(`<h3>✨ Zusammenfassung</h3>
      <div style="white-space:pre-wrap;margin:12px 0;line-height:1.55">${esc(r.text)}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn sec" onclick="navigator.clipboard.writeText(S.kiDraft);toast('Kopiert')">Kopieren</button>
        <button class="btn" onclick="closeModal()">Schließen</button></div>`);
  } catch (e) { kiFehler(e); }
}

function kiAntwort() {
  if (!S.cur) return;
  modal(`<h3>✨ Antwort-Entwurf</h3>
    <p class="muted" style="margin:6px 0 10px">Worauf soll die Antwort hinauslaufen? (optional — z. B.
    „zusagen, Termin Donnerstag vorschlagen")</p>
    <textarea id="ki_hint" style="width:100%;min-height:70px"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn sec" onclick="closeModal()">Abbrechen</button>
      <button class="btn" onclick="kiAntwortLos()">Entwerfen</button></div>`);
}

async function kiAntwortLos() {
  const m = S.cur, hint = document.getElementById('ki_hint').value.trim();
  kiLauf('✨ Antwort-Entwurf');
  try {
    const r = await post('ai', { task: 'draft', hint, subject: m.subject,
                                 from: (m.from[0] || {}).email || '', text: kiMailText(m) });
    S.kiDraft = r.text;
    modal(`<h3>✨ Antwort-Entwurf</h3>
      <div style="white-space:pre-wrap;margin:12px 0;max-height:45vh;overflow-y:auto;line-height:1.55;border:1px solid var(--line);border-radius:8px;padding:10px">${esc(r.text)}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn sec" onclick="closeModal()">Verwerfen</button>
        <button class="btn" onclick="kiAntwortUebernehmen()">In Antwort übernehmen</button></div>`);
  } catch (e) { kiFehler(e); }
}

function kiAntwortUebernehmen() {
  closeModal();
  // Erst wenn die Modal-Ebene wirklich zu ist (popstate ist asynchron),
  // sonst reißt der Rücksprung das frisch geöffnete Verfassen-Fenster mit.
  setTimeout(() => {
    reply(false);
    const ta = document.getElementById('ctext');
    ta.value = S.kiDraft + '\n' + ta.value;   // Entwurf über dem Zitat
    ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  }, 250);
}

function kiFormulieren() {
  modal(`<h3>✨ Text-KI</h3>
    <p class="muted" style="margin:6px 0 12px">Der Text im Verfassen-Fenster wird an die KI gegeben.</p>
    <div style="display:flex;gap:8px;flex-direction:column">
      <button class="btn" onclick="kiPolish('ausformulieren')">Aus Stichpunkten eine fertige Mail machen</button>
      <button class="btn sec" onclick="kiPolish('glaetten')">Rechtschreibung &amp; Ton glätten</button></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="btn sec" onclick="closeModal()">Abbrechen</button></div>`);
}

async function kiPolish(mode) {
  const ta = document.getElementById('ctext');
  if (!ta.value.trim()) return toast('Kein Text im Verfassen-Fenster');
  kiLauf('✨ Text-KI');
  try {
    const r = await post('ai', { task: 'polish', mode, text: ta.value,
                                 subject: document.getElementById('csubj').value });
    S.kiDraft = r.text;
    modal(`<h3>✨ Vorschlag</h3>
      <div style="white-space:pre-wrap;margin:12px 0;max-height:45vh;overflow-y:auto;line-height:1.55;border:1px solid var(--line);border-radius:8px;padding:10px">${esc(r.text)}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn sec" onclick="closeModal()">Verwerfen</button>
        <button class="btn" onclick="document.getElementById('ctext').value=S.kiDraft;closeModal();toast('Text übernommen')">Übernehmen</button></div>`);
  } catch (e) { kiFehler(e); }
}

// --- Diktieren (Spracherkennung des Browsers, kein Server nötig) ------------
let _diktat = null;

function diktat() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Spracherkennung nicht verfügbar — bitte Chrome oder Edge nutzen');
  if (_diktat) { _diktat.stop(); return; }
  const ta = document.getElementById('ctext');
  const btn = document.getElementById('cdictate');
  const rec = new SR();
  rec.lang = 'de-DE';
  rec.continuous = true;
  rec.interimResults = true;
  const basis = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : '';
  rec.onresult = (e) => {
    let fertig = '', zwischen = '';
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) fertig += r[0].transcript;
      else zwischen += r[0].transcript;
    }
    ta.value = basis + fertig + zwischen;
    ta.scrollTop = ta.scrollHeight;
  };
  rec.onend = () => { _diktat = null; btn.textContent = '🎤 Diktieren'; };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed') toast('Mikrofon-Zugriff wurde verweigert');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Diktat: ' + e.error);
  };
  _diktat = rec;
  btn.textContent = '🔴 Aufnahme läuft — Klick stoppt';
  rec.start();
}

// --- Tastatur --------------------------------------------------------------
document.addEventListener('keydown', e => {
  if (/input|textarea|select/i.test((e.target.tagName || ''))) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === 'Escape') zurueck();     // schließt genau die oberste Ebene
  if (e.key === 'n') compose();
  if (e.key === 'r' && S.cur) reply(false);
  if (e.key === 'Delete' && S.cur) delCurrent();
  if (e.key === 'j' || e.key === 'k') {
    const i = S.msgs.findIndex(m => S.cur && m.uid === S.cur.uid);
    const nx = S.msgs[Math.max(0, Math.min(S.msgs.length - 1, i + (e.key === 'j' ? 1 : -1)))];
    if (nx) openMsg(nx.uid);
  }
});

function fitMenu() { document.getElementById('menubtn').style.display = window.innerWidth <= 900 ? '' : 'none'; }
window.addEventListener('resize', fitMenu); fitMenu();

boot().catch(() => { document.getElementById('login').classList.remove('hide'); });
</script>
