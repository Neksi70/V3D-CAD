<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3D Mail</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F97316">
<style>
:root{
  --acc:#F97316; --acc-d:#EA6000; --acc-l:#FB923C;
  --bg:#f4f5f9; --card:#fff; --text:#1c2030; --mid:#5b6172; --dim:#8a90a3;
  --line:#e3e6ef; --green:#16a34a; --red:#ef4444; --blue:#2563eb;
  --side:#1c2030;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
label{font-size:12.5px;color:var(--mid);display:block;margin:10px 0 4px;font-weight:600}
a{color:var(--acc-d)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--acc-d)}
.btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--acc);color:var(--acc-d)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.muted{color:var(--mid)}
.hide{display:none !important}

/* --- Anmeldung --- */
#login{position:fixed;inset:0;background:var(--side);display:flex;align-items:center;justify-content:center;z-index:60}
#login .box{background:#fff;border-radius:16px;padding:30px;width:min(400px,92vw);text-align:center}
#login h1{font-size:22px;margin-bottom:4px}
#login p{color:var(--mid);font-size:13.5px;margin-bottom:18px}
#login .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* --- Grundgerüst --- */
#app{display:flex;height:100vh}
#side{width:230px;background:var(--side);color:#e6e8eb;padding:14px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
#side .logo{display:flex;align-items:baseline;gap:8px;margin:4px 8px 14px}
#side .logo b{font-size:18px}
#side .logo small{color:var(--acc-l);font-weight:600;font-size:11px;letter-spacing:.5px}
#side .acc{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#252a38;border:1px solid transparent;color:#c8ccd6;padding:7px 9px;border-radius:10px;margin:0 0 5px;font-size:13.5px}
#side .acc:hover{background:#2f3546}
#side .acc.act{background:#2f3546;border-color:var(--acc);color:#fff}
#side .acc .ini{width:26px;height:26px;border-radius:50%;background:#3a4053;color:#c8ccd6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
#side .acc.act .ini{background:var(--acc);color:#fff}
#side .acc .txt{flex:1;min-width:0}
#side .acc .nm{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .acc .ad{display:block;font-size:11px;color:#8a90a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .acc.act .ad{color:#c8ccd6}
#side .acc .zahl{background:var(--acc);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;flex-shrink:0}
#side .acc .fehler{color:var(--red);font-size:14px;flex-shrink:0}
#side .accadd{width:100%;background:none;border:1px dashed #3a4053;color:#8a90a3;border-radius:10px;padding:6px 9px;font-size:12.5px;margin-bottom:4px}
#sendrecv{width:calc(100% - 8px);margin:0 4px 6px;background:#2a2f3f;color:var(--acc-l);
  border:1.5px solid var(--acc);border-radius:9px;padding:9px 10px;font-size:14px;
  font-weight:700;white-space:nowrap}
#sendrecv:hover{background:var(--acc);color:#fff}
#sendrecv:disabled{opacity:.6}
#side .accadd:hover{border-color:var(--acc);color:var(--acc-l)}
#side .fold{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:#c8ccd6;padding:8px 11px;border-radius:9px;font-size:14px}
#side .fold:hover{background:#2a2f3f}
#side .fold.act{background:var(--acc);color:#fff;font-weight:600}
#side .fold .ic{width:18px;text-align:center;flex-shrink:0}
#side .fold .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .fold .cnt{font-size:11.5px;background:#3a4053;border-radius:20px;padding:1px 7px;font-weight:600}
#side .fold.act .cnt{background:rgba(0,0,0,.22)}
#side .sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#6a7080;margin:14px 12px 5px;font-weight:700}
#side .foot{margin-top:auto;padding:10px 6px 2px;display:flex;gap:6px;flex-wrap:wrap}
#side .foot button{background:#2a2f3f;color:#c8ccd6;border:0;border-radius:8px;padding:6px 10px;font-size:12.5px}
#side .foot button:hover{background:#3a4053}

/* --- Nachrichtenliste --- */
#list{width:380px;flex-shrink:0;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
#list .top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#list .top input{padding:7px 10px;font-size:14px}
#list .bar{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mid);flex-wrap:wrap}
#items{flex:1;overflow-y:auto}
.item{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px}
.item:hover{background:#fafbff}
.item.act{background:#fff6ee;border-left:3px solid var(--acc);padding-left:10px}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:7px}
.item.seen .dot{background:transparent}
.item .body{flex:1;min-width:0}
.item .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .who{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.seen .who{font-weight:500;color:var(--mid)}
.item .when{font-size:11.5px;color:var(--dim);flex-shrink:0}
.item .subj{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.seen .subj{color:var(--mid)}
.item .meta{font-size:11.5px;color:var(--dim);display:flex;gap:7px;margin-top:1px}
.item .star{cursor:pointer;color:var(--dim);flex-shrink:0;font-size:15px;background:none;border:0;padding:0 2px}
.item .star.on{color:var(--acc)}

/* --- Leseansicht --- */
/* Die Leseansicht scrollt als Ganzes: der Rahmen der Nachricht wächst mit dem
   Inhalt mit, statt die Mail in einen Streifen unter den Knöpfen zu quetschen. */
#read{flex:1;display:flex;flex-direction:column;background:#fff;min-width:0;overflow-y:auto}
#read .hd{padding:16px 22px;border-bottom:1px solid var(--line)}
#read h2{font-size:19px;line-height:1.35;margin-bottom:8px;word-break:break-word}
#read .from{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
#read .av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
#read .acts{padding:8px 22px;border-bottom:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
#read .warn{margin:10px 22px 0;background:#fff3e6;border:1px solid #ffd7ad;color:var(--acc-d);border-radius:9px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
#read .atts{padding:10px 22px 0;display:flex;gap:8px;flex-wrap:wrap}
.att{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;background:#fafbff;cursor:pointer}
.att:hover{border-color:var(--acc)}
.att small{color:var(--dim)}
#read .imgs{padding:10px 22px 0}
#read .imgs .kopf{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mid);font-weight:600;margin-bottom:7px}
#read .imgs .raster{display:flex;gap:9px;flex-wrap:wrap}
.bild{border:1px solid var(--line);border-radius:9px;padding:5px;background:#fafbff;cursor:pointer;width:104px;text-align:center}
.bild:hover{border-color:var(--acc)}
.bild .vor{width:92px;height:70px;border-radius:6px;background:#eceef4 center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim)}
.bild .nm{font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bild .gr{font-size:10.5px;color:var(--dim)}
#frame{flex:1;width:100%;border:0;background:#fff}
#empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim)}
#empty .big{font-size:40px}

/* --- Verfassen --- */
#compose{position:fixed;inset:auto 24px 0 auto;width:min(680px,94vw);background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 40px rgba(20,25,40,.22);display:flex;flex-direction:column;z-index:50;max-height:88vh}
#compose .ch{background:var(--side);color:#fff;padding:10px 16px;border-radius:13px 13px 0 0;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
#compose .ch .x{margin-left:auto;background:none;border:0;color:#c8ccd6;font-size:19px;line-height:1}
#compose .cb{padding:12px 16px;overflow-y:auto;flex:1}
#compose .row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
#compose .row span{font-size:12.5px;color:var(--mid);width:56px;flex-shrink:0;font-weight:600}
#compose .row input{border:0;border-radius:0;padding:6px 2px}
#compose .row input:focus{outline:0}
#compose textarea{border:0;padding:12px 2px;min-height:220px;resize:vertical;font:14.5px/1.6 system-ui,sans-serif}
#compose textarea:focus{outline:0}
#compose .cf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cattlist{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
#csig{border-top:1px dashed var(--line);margin-top:6px;padding:10px 2px 4px}
#csig .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700;margin-bottom:6px}

/* --- Dialoge --- */
#modal{position:fixed;inset:0;background:rgba(20,25,40,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal .box{background:#fff;border-radius:15px;padding:22px;width:min(560px,96vw);max-height:92vh;overflow-y:auto}
#modal h3{font-size:18px;margin-bottom:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 20px;border-radius:10px;z-index:90;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* --- Kalender --- */
#cal{position:fixed;inset:0;background:#fff;z-index:45;display:flex;flex-direction:column}
#cal .ch{background:var(--side);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
#cal .ch .x{margin-left:auto;background:none;border:0;color:#c8ccd6;font-size:19px;line-height:1}
#calbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#calbar h3{font-size:17px;min-width:170px;text-align:center}
.calhead{display:grid;grid-template-columns:repeat(7,1fr)}
.calhead div{padding:6px 8px;font-size:11.5px;font-weight:700;color:var(--mid);border-bottom:1px solid var(--line);text-transform:uppercase}
#calgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(84px,1fr);overflow-y:auto}
.calday{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;min-width:0;cursor:pointer;overflow:hidden}
.calday:hover{background:#fff8f2}
.calday.aus{background:#fafafa}
.calday.aus .dnum{color:var(--dim)}
.calday.heute .dnum{background:var(--acc);color:#fff}
.dnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12.5px;font-weight:600}
.calev{display:block;font-size:11.5px;background:#edf1fb;border-left:3px solid #5a78c8;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.calev.ganz{background:#ffe9d6;border-left-color:var(--acc)}
.calday .punkt{display:none}
#calbtn{width:calc(100% - 8px);margin:0 4px 12px;background:#2a2f3f;color:#c8ccd6;
  border:1px solid #3a4053;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:600}
#calbtn:hover{border-color:var(--acc);color:var(--acc-l)}
@media(max-width:900px){
  #calgrid{grid-auto-rows:minmax(52px,1fr)}
  .calev{display:none}
  .calday .punkt{display:block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin:3px auto 0}
}

/* --- Handy --- */
#back{display:none;align-items:center;gap:6px;background:#fff6ee;color:var(--acc-d);
  border:1px solid #ffd7ad;border-radius:9px;padding:9px 14px;font-size:15px;font-weight:600;
  margin-bottom:12px;min-height:42px}
#back:active{background:#ffe8d5}
@media(max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  #side.open{transform:none}
  #list{width:100%;border-right:0}
  #read{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body.v-list #read{display:none}
  body.v-read #list{display:none}
  #back{display:inline-flex}
  #compose{inset:0;width:100%;max-height:100vh;border-radius:0}
  #compose .ch{border-radius:0}
}
</style>
</head>
<body class="v-list">

<div id="login">
  <div class="box">
    <h1>V3D Mail</h1>
    <p>Bitte Zugangsschlüssel eingeben</p>
    <input id="lkey" type="password" placeholder="Schlüssel" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:6px" onclick="doLogin()">Anmelden</button>
  </div>
</div>

<div id="app" class="hide">
  <nav id="side">
    <div class="logo"><b>V3D Mail</b><small>VOLME 3D</small></div>
    <div id="accs"></div>
    <button class="btn" style="margin:0 4px 6px;width:calc(100% - 8px)" onclick="compose()">✉️ Neue Nachricht</button>
    <button id="sendrecv" onclick="sendenEmpfangen()">⟳ Senden/Empfangen</button>
    <button id="calbtn" onclick="oeffneKalender()">📅 Kalender</button>
    <div id="folders"></div>
    <div class="foot">
      <button onclick="accountDialog()">⚙️ Konten</button>
      <button onclick="kiDialog()">✨ KI</button>
      <button onclick="logout()">Abmelden</button>
    </div>
  </nav>

  <section id="list">
    <div class="top">
      <button class="btn sec sm" style="display:none" id="menubtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <input id="q" type="search" placeholder="Suchen…" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn sec sm" onclick="doSearch()">🔍</button>
      <button class="btn sec sm" onclick="sendenEmpfangen()" title="Senden/Empfangen — alle Postfächer prüfen">⟳</button>
    </div>
    <div class="bar" id="listbar"></div>
    <div id="items"></div>
  </section>

  <section id="read">
    <div id="empty"><div class="big">✉️</div><div>Keine Nachricht ausgewählt</div></div>
    <div id="readinner" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="hd">
        <button id="back" onclick="zurueck()">‹ Zurück zur Liste</button>
        <h2 id="rsubj"></h2>
        <div class="from">
          <div class="av" id="rav"></div>
          <div style="flex:1;min-width:0">
            <div><b id="rfrom"></b> <span class="muted" id="rfromadr"></span></div>
            <div class="muted" style="font-size:12.5px" id="rto"></div>
          </div>
          <div class="muted" style="font-size:12.5px" id="rdate"></div>
        </div>
      </div>
      <div class="acts">
        <button class="btn sm" onclick="reply(false)">↩ Antworten</button>
        <button class="btn sec sm" onclick="reply(true)">↩↩ Allen</button>
        <button class="btn sec sm" onclick="forward()">↪ Weiterleiten</button>
        <button class="btn sec sm" onclick="toggleUnread()">✉ Ungelesen</button>
        <button class="btn sec sm" onclick="moveDialog()">📁 Verschieben</button>
        <button class="btn sec sm" onclick="kiZusammenfassen()">✨ Zusammenfassen</button>
        <button class="btn sec sm" onclick="kiAntwort()">✨ Antwort-Entwurf</button>
        <button class="btn danger sm" onclick="delCurrent()">🗑 Löschen</button>
      </div>
      <div id="rwarn" class="warn hide">
        <span id="rwarntext"></span>
        <button class="btn sm" style="margin-left:auto" onclick="showImages()">Bilder anzeigen</button>
      </div>
      <div class="atts hide" id="ratts"></div>
      <div class="imgs hide" id="rimgs"></div>
      <iframe id="frame" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
    </div>
  </section>
</div>

<div id="compose" class="hide">
  <div class="ch"><span id="ctitle">Neue Nachricht</span><button class="x" onclick="closeCompose()">✕</button></div>
  <div class="cb">
    <div class="row hide" id="cfromrow"><span>Von</span><select id="cfrom" onchange="fromChanged()" style="border:0;padding:6px 2px"></select></div>
    <div class="row"><span>An</span><input id="cto" placeholder="empfaenger@beispiel.de"></div>
    <div class="row" id="cccrow"><span>Kopie</span><input id="ccc" placeholder="optional"></div>
    <div class="row"><span>Betreff</span><input id="csubj"></div>
    <div id="cattlist"></div>
    <textarea id="ctext"></textarea>
    <div id="csig" class="hide"></div>
  </div>
  <div class="cf">
    <button class="btn" onclick="doSend()" id="csend">Senden</button>
    <button class="btn sec" onclick="document.getElementById('cfile').click()">📎 Anhang</button>
    <button class="btn sec" id="cdictate" onclick="diktat()">🎤 Diktieren</button>
    <button class="btn sec" onclick="kiFormulieren()">✨ Text-KI</button>
    <input type="file" id="cfile" multiple class="hide" onchange="addAttachments(this.files)">
    <span class="muted" style="margin-left:auto;font-size:12.5px" id="cstatus"></span>
  </div>
</div>

<div id="cal" class="hide">
  <div class="ch"><span>📅 Kalender</span>
    <span class="muted" id="calacc" style="color:#8a90a3;font-size:12.5px;font-weight:400"></span>
    <button class="x" onclick="schliesseKalender()">✕</button>
  </div>
  <div id="calbar">
    <button class="btn sec sm" onclick="calMonat(-1)">‹</button>
    <h3 id="calmon"></h3>
    <button class="btn sec sm" onclick="calMonat(1)">›</button>
    <button class="btn sec sm" onclick="calHeute()">Heute</button>
    <button class="btn sm" style="margin-left:auto" onclick="terminDialog()">＋ Neuer Termin</button>
  </div>
  <div class="calhead"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
  <div id="calgrid"></div>
</div>

<div id="modal" class="hide"><div class="box" id="modalbox"></div></div>

<script>
'use strict';
const API = (p) => p;                       // Pfade sind relativ — funktioniert auch unter /mail/
const S = { accounts: [], acc: null, folder: 'INBOX', folders: [], page: 0, total: 0,
            msgs: [], cur: null, q: '', reply: null, atts: [] };

function toast(msg, ms) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = '';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, ms || 2600);
}
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function api(path, opts) {
  const r = await fetch(API('api/' + path), Object.assign({ credentials: 'same-origin' }, opts || {}));
  // Beim Anmelden ist 401 die normale Antwort auf einen falschen Schlüssel —
  // dann die Meldung des Servers durchreichen statt „nicht angemeldet".
  if (r.status === 401 && path !== 'login') {
    document.getElementById('login').classList.remove('hide');
    throw new Error('nicht angemeldet');
  }
  const ct = r.headers.get('Content-Type') || '';
  if (!ct.includes('json')) { if (!r.ok) throw new Error('HTTP ' + r.status); return r; }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

// --- Anmeldung -------------------------------------------------------------
async function doLogin() {

// --- Start -----------------------------------------------------------------
async function boot() {
  const st = await api('state');
  if (!st.authed) { document.getElementById('login').classList.remove('hide'); return; }
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  S.accounts = st.accounts || [];
  if (!S.accounts.length) return accountDialog(true);
  const last = localStorage.getItem('v3dmail.acc');
  S.acc = S.accounts.find(a => a.id === last) || S.accounts[0];
  renderAccounts();
  await loadFolders();
  if (!await uebergabeAbholen()) starteAusAdresse();
  sendenEmpfangen(true);
  // Im Hintergrund alle drei Minuten nachsehen — ohne Meldung, außer es kommt
  // wirklich etwas Neues an.
  clearInterval(S.timer);
  S.timer = setInterval(() => { if (!document.hidden) sendenEmpfangen(true); }, 180000);
}

function renderAccounts() {
  // Postfächer untereinander in der Seitenleiste — ein Klick wechselt.
  const box = document.getElementById('accs');
  box.innerHTML = S.accounts.map((a, i) => {
    const mail = a.email || '';
    // Anzeigename oben, Adresse darunter. Steht im Namensfeld selbst eine

    const kurz = (a.name && !a.name.includes('@')) ? a.name : mail.split('@')[0];
    const zweite = kurz === mail ? '' : `<span class="ad">${esc(mail)}</span>`;
    const ini = (kurz[0] || '?').toUpperCase();

      : (st.unread ? `<span class="zahl">${st.unread}</span>` : '');
    return `<button class="acc${S.acc && a.id === S.acc.id ? ' act' : ''}" onclick="switchAcc(S.accounts[${i}].id)" title="${esc(mail)}">
      <span class="ini">${esc(ini)}</span>
      <span class="txt"><span class="nm">${esc(kurz)}</span>${zweite}</span>

function switchAcc(id) {

const FOLD_ICONS = { inbox: '📥', sent: '📤', drafts: '📝', trash: '🗑', junk: '⚠️', archive: '📦' };
// Der Server liefert die Ordner so, wie sie im Postfach heißen ("INBOX").
const FOLD_NAMEN = { inbox: 'Posteingang', sent: 'Gesendet', drafts: 'Entwürfe',
                     trash: 'Papierkorb', junk: 'Spam', archive: 'Archiv' };
function foldName(f) {
  if (!f) return '';
  const roh = f.name || f.path;
  // Nur echte englische Systemnamen übersetzen — eigene Namen bleiben unangetastet.
  return /^(inbox|sent|drafts|trash|junk|archive|sent items|deleted items)$/i.test(roh)
    ? (FOLD_NAMEN[f.kind] || roh) : roh;
}

async function loadFolders() {
  const box = document.getElementById('folders');
  box.innerHTML = '<div class="sect">Ordner</div><div style="padding:10px 12px"><span class="spin"></span></div>';
  try {
    const r = await api('folders?acc=' + S.acc.id);
    S.folders = r.folders || [];
  } catch (e) { box.innerHTML = `<div style="padding:10px 12px;font-size:13px;color:#ff9c9c">${esc(e.message)}</div>`; return; }
  const start = S.folders.find(f => f.path === S.folder) || S.folders.find(f => f.kind === 'inbox') || S.folders[0];
  if (start) openFolder(S.folders.indexOf(start));
}

function renderFolders() {
  // Ordnernamen dürfen Anführungszeichen enthalten — deshalb über den Index
  // anklicken statt den Pfad in den onclick-Text zu schreiben.
  const btn = i => {
    const f = S.folders[i];
    return `<button class="fold${f.path === S.folder ? ' act' : ''}" onclick="openFolder(${i})">
      <span class="ic">${FOLD_ICONS[f.kind] || '📁'}</span><span class="nm">${esc(foldName(f))}</span></button>`;
  };
  const main = [], rest = [];
  S.folders.forEach((f, i) => (f.kind ? main : rest).push(i));
  document.getElementById('folders').innerHTML =
    '<div class="sect">Ordner</div>' + main.map(btn).join('') +
    (rest.length ? '<div class="sect">Weitere</div>' + rest.map(btn).join('') : '');
}

function openFolder(idx) {
  const f = S.folders[idx];
  if (!f) return;
  S.folder = f.path; S.q = ''; document.getElementById('q').value = '';
  document.getElementById('side').classList.remove('open');
  renderFolders();

}

// --- Nachrichtenliste ------------------------------------------------------
function fmtDate(ts, dateStr) {
  if (!ts) return dateStr || '';
  const d = new Date(ts * 1000), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function fmtSize(n) {
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

async function loadMessages(folder, page, quiet) {
  S.folder = folder; S.page = page || 0;
  const items = document.getElementById('items');
  if (!quiet) items.innerHTML = '<div style="padding:20px;text-align:center"><span class="spin"></span></div>';
  const url = `messages?acc=${S.acc.id}&folder=${encodeURIComponent(folder)}&page=${S.page}` +
              (S.q ? '&q=' + encodeURIComponent(S.q) : '');
  let r;
  try { r = await api(url); }
  catch (e) { items.innerHTML = `<div style="padding:20px;color:var(--red)">${esc(e.message)}</div>`; return; }
  S.msgs = r.messages || []; S.total = r.total || 0;
  renderList();
}

function renderList() {
  const items = document.getElementById('items');
  const bar = document.getElementById('listbar');
  const from = S.total ? S.page * 50 + 1 : 0;
  const to = Math.min(S.total, (S.page + 1) * 50);
  const fname = foldName(S.folders.find(f => f.path === S.folder)) || S.folder;
  bar.innerHTML = `<b>${esc(fname)}</b><span>${from}–${to} von ${S.total}</span>` +
    (S.q ? `<span>· Suche „${esc(S.q)}"</span>` : '') +
    `<span style="margin-left:auto;display:flex;gap:4px">
      <button class="btn sec sm" ${S.page ? '' : 'disabled'} onclick="loadMessages(S.folder,${S.page - 1})">‹</button>
      <button class="btn sec sm" ${to < S.total ? '' : 'disabled'} onclick="loadMessages(S.folder,${S.page + 1})">›</button></span>`;
  if (!S.msgs.length) { items.innerHTML = '<div style="padding:30px;text-align:center;color:var(--dim)">Keine Nachrichten</div>'; return; }
  items.innerHTML = S.msgs.map(m => {
    const who = S.folder.toLowerCase().includes('sent') || (S.folders.find(f => f.path === S.folder) || {}).kind === 'sent'
      ? (m.to[0] ? (m.to[0].name || m.to[0].email) : '—')
      : (m.from[0] ? (m.from[0].name || m.from[0].email) : '—');
    return `<div class="item${m.seen ? ' seen' : ''}${S.cur && S.cur.uid === m.uid ? ' act' : ''}" data-uid="${m.uid}" onclick="openMsg(${m.uid})">
      <div class="dot"></div>
      <div class="body">
        <div class="r1"><div class="who">${esc(who)}</div><div class="when">${fmtDate(m.ts, m.date)}</div></div>
        <div class="subj">${esc(m.subject)}</div>
        <div class="meta">${m.hasAttachments ? '<span>📎</span>' : ''}<span>${fmtSize(m.size)}</span></div>
      </div>
      <button class="star${m.flagged ? ' on' : ''}" onclick="event.stopPropagation();star(${m.uid},${!m.flagged})">${m.flagged ? '★' : '☆'}</button>
    </div>`;
  }).join('');
}

function doSearch() { S.q = document.getElementById('q').value.trim(); loadMessages(S.folder, 0); }

// --- Senden/Empfangen ------------------------------------------------------
async function sendenEmpfangen(leise) {
  const btn = document.getElementById('sendrecv');
  const vorher = S.status || {};
  if (!leise) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> prüfe…'; }
  let r;
  try {
    r = await api('check');
  } catch (e) {
    if (!leise) toast('Prüfen fehlgeschlagen: ' + e.message, 5000);
    return;
  } finally {
    btn.disabled = false; btn.textContent = '⟳ Senden/Empfangen';
  }

  S.status = {};
  let neue = 0, fehler = [];
  for (const st of r.accounts) {
    S.status[st.id] = st;
    if (st.error) { fehler.push((st.email || '') + ': ' + st.error); continue; }
    const alt = vorher[st.id];
    // Nur echte Zuwächse zählen — beim ersten Durchlauf ist noch nichts bekannt.
    if (alt && typeof alt.unread === 'number' && st.unread > alt.unread) neue += st.unread - alt.unread;
  }
  renderAccounts();
  // Sichtbare Liste mitziehen, damit neue Nachrichten gleich auftauchen.
  await loadMessages(S.folder, S.page, true);

  if (neue) return toast(neue === 1 ? '1 neue Nachricht' : neue + ' neue Nachrichten');
  // Beim automatischen Lauf still bleiben; ein klemmendes Postfach zeigt schon
  // sein ⚠ am Kontoknopf und soll nicht alle paar Minuten dazwischenfunken.
  if (leise) return;
  if (fehler.length) return toast('Nicht erreichbar — ' + fehler[0], 6000);
  const offen = Object.values(S.status).reduce((s, x) => s + (x.unread || 0), 0);
  toast(offen ? 'Keine neuen — ' + offen + ' ungelesen' : 'Keine neuen Nachrichten');
}

async function star(uid, on) {
  const m = S.msgs.find(x => x.uid === uid); if (m) m.flagged = on;
  renderList();
  try { await post('flag', { acc: S.acc.id, folder: S.folder, uids: [uid], flag: '\\Flagged', on }); }
  catch (e) { toast(e.message); }
}

// --- Ebenen und Zurück-Taste ----------------------------------------------
// Jede geöffnete Ebene (Mail, Verfassen, Dialog) bekommt einen Eintrag in der
// Browser-Chronik. Nur so wirkt die Zurück-Geste auf dem Handy auf die App und
// schließt nicht gleich die ganze Seite.
S.layers = [];

function pushLayer(name) {
  if (S.layers[S.layers.length - 1] === name) return;   // dieselbe Ebene nicht doppelt
  // Der vorhandene Seiteneintrag wird als Basis markiert, statt einen zweiten
  // anzulegen: Chromium überspringt beim Zurückgehen Einträge, die es für
  // Verlaufsmanipulation hält — und zwei pushState in einer einzigen Geste
  // fallen genau darunter. So bleibt es bei einem Eintrag pro Ebene.
  if (!S.layers.length && !(history.state && 'v3d' in history.state)) {
    history.replaceState({ v3d: 0 }, '');
  }
  S.layers.push(name);
  history.pushState({ v3d: S.layers.length }, '');
}

function closeTop() {
  const top = S.layers.pop();
  if (top === 'compose') document.getElementById('compose').classList.add('hide');
  else if (top === 'modal') document.getElementById('modal').classList.add('hide');
  else if (top === 'cal') document.getElementById('cal').classList.add('hide');
  else if (top === 'msg') showList();
}

// Alle Schließen-Wege laufen über die Chronik, damit Stapel und Verlauf
// nicht auseinanderdriften; geschlossen wird immer erst in popstate.
function zurueck() {
  if (!S.layers.length) return showList();
  const tiefe = S.layers.length;
  history.back();
  // Sicherheitsnetz: verweigert der Browser den Rücksprung, schließen wir die
  // Ebene selbst. Sonst säße man in der Mail fest, obwohl man Zurück gedrückt hat.
  setTimeout(() => { if (S.layers.length === tiefe) closeTop(); }, 150);
}

window.addEventListener('popstate', (e) => {
  // Die Zieltiefe steht im Verlaufseintrag. Danach richten wir uns, statt blind
  // eine Ebene zu schließen — sonst reißt ein verspätetes Zurück eine Ebene mit,
  // die inzwischen neu geöffnet wurde.
  const ziel = (e.state && typeof e.state.v3d === 'number') ? e.state.v3d : 0;
  while (S.layers.length > ziel) closeTop();
});

function istHandy() { return window.innerWidth <= 900; }

// --- Leseansicht -----------------------------------------------------------
function showList() { document.body.classList.remove('v-read'); document.body.classList.add('v-list'); }
function showRead() { document.body.classList.remove('v-list'); document.body.classList.add('v-read'); }
function verlasseMail() {
  if (S.layers[S.layers.length - 1] === 'msg') zurueck(); else showList();
}

async function openMsg(uid, withImages) {
  // Beim Wechsel auf eine andere Nachricht die zwischengespeicherten Anhänge
  // und Vorschaubilder freigeben, sonst wächst der Speicher mit jeder Mail.
  if (S.cur && S.cur.uid !== uid) {
    (S.vorschauUrls || []).forEach(u => URL.revokeObjectURL(u));
    S.vorschauUrls = [];
    if (S.blobs) S.blobs.clear();
  }
  showRead();
  // Auf dem Handy verdeckt die Mail die Liste — dafür braucht es einen Eintrag
  // in der Chronik. Am Rechner stehen beide nebeneinander, da wäre er sinnlos.
  if (istHandy()) pushLayer('msg');
  document.getElementById('empty').classList.add('hide');
  const inner = document.getElementById('readinner');
  inner.classList.remove('hide');
  setzeFrame('<body style="font:15px system-ui;color:#8a90a3;padding:20px">lädt…</body>');
  let m;
  try {
    m = await api(`message?acc=${S.acc.id}&folder=${encodeURIComponent(S.folder)}&uid=${uid}` + (withImages ? '&images=1' : ''));
  } catch (e) { toast(e.message); return; }
  S.cur = m;
  const lm = S.msgs.find(x => x.uid === uid); if (lm) lm.seen = true;
  renderList();

  const f = m.from[0] || { name: '', email: '' };
  document.getElementById('rsubj').textContent = m.subject;
  document.getElementById('rav').textContent = ((f.name || f.email || '?')[0] || '?').toUpperCase();
  document.getElementById('rfrom').textContent = f.name || f.email;
  document.getElementById('rfromadr').textContent = f.name ? '<' + f.email + '>' : '';
  document.getElementById('rto').textContent = 'An: ' + (m.to.map(a => a.name || a.email).join(', ') || '—') +
    (m.cc.length ? ' · Kopie: ' + m.cc.map(a => a.name || a.email).join(', ') : '');
  document.getElementById('rdate').textContent = m.date ? new Date(m.date).toLocaleString('de-DE') : '';

  const warn = document.getElementById('rwarn');
  if (m.blockedImages) {
    warn.classList.remove('hide');
    document.getElementById('rwarntext').textContent =
      `${m.blockedImages} externe${m.blockedImages === 1 ? 's Bild wurde' : ' Bilder wurden'} blockiert (Schutz vor Lesebestätigungs-Pixeln).`;
  } else warn.classList.add('hide');

  // Bilder bekommen eine eigene Leiste mit Vorschau, alles andere bleibt Anhang.
  const bilder = m.attachments.filter(a => (a.type || '').startsWith('image/'));
  const dateien = m.attachments.filter(a => !(a.type || '').startsWith('image/'));

  const ab = document.getElementById('ratts');
  if (dateien.length) {
    ab.classList.remove('hide');
    ab.innerHTML = dateien.map((a, i) => `<div class="att" onclick="dlPart(${i},'datei')">
      📎 ${esc(a.filename)} <small>${fmtSize(a.size)}</small></div>`).join('');
    S.dateien = dateien;
  } else { ab.classList.add('hide'); ab.innerHTML = ''; S.dateien = []; }

  renderImages(m, bilder);
  renderBody(m);
}

// Teile der Mail einmal holen und behalten — Vorschau, Einbettung im Text und
// Herunterladen greifen sonst je dreimal auf denselben Anhang zu.
async function holePart(uid, part) {
  const key = uid + ':' + part;
  if (!S.blobs) S.blobs = new Map();
  if (S.blobs.has(key)) return S.blobs.get(key);
  const r = await fetch(API(`api/attachment?acc=${S.acc.id}&folder=${encodeURIComponent(S.folder)}&uid=${uid}&part=${part}&inline=1`),
                        { credentials: 'same-origin' });
  if (!r.ok) throw new Error('Anhang nicht ladbar');
  const blob = await r.blob();
  S.blobs.set(key, blob);
  return blob;
}

// Bilder, die die Mail nur verlinkt (Newsletter-Grafiken), holt der SERVER —
// nie der Browser. Sonst verriete jeder Abruf dem Absender IP und Lesezeit.
async function holeBild(url) {
  const key = 'url:' + url;
  if (!S.blobs) S.blobs = new Map();
  if (S.blobs.has(key)) return S.blobs.get(key);
  let blob = null;
  // Zwei Anläufe mit Pause: Newsletter-Server werfen unter Last gern einzelne
  // Bilder ab, beim zweiten Mal kommen sie fast immer.
  for (let versuch = 0; versuch < 2 && !blob; versuch++) {
    if (versuch) await new Promise(r => setTimeout(r, 900));
    const r = await fetch(API('api/bild?inline=1&url=' + encodeURIComponent(url)),
                          { credentials: 'same-origin' });
    if (r.ok) blob = await r.blob();
    else if (versuch) throw new Error('Bild nicht ladbar');
  }
  S.blobs.set(key, blob);
  return blob;
}

// Anhang oder Netz-Bild — je nachdem, was in der Kachel steckt.
function holeStueck(uid, a) {
  return a.url ? holeBild(a.url) : holePart(uid, a.part);
}

function alsDataUrl(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('Lesefehler'));
    fr.readAsDataURL(blob);
  });
}

function entschaerftZurueck(s) {
  const t = document.createElement('textarea'); t.innerHTML = s; return t.value;
}

function speichern(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name || 'bild';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function dlPart(i, art) {
  const liste = art === 'bild' ? S.bilder : S.dateien;
  const a = (liste || [])[i];
  if (!a) return;
  try { speichern(await holeStueck(S.cur.uid, a), a.filename); }
  catch (e) { toast('Konnte nicht laden: ' + e.message); }
}

// Die Bilderleiste bleibt EINGEKLAPPT: sie ist zum Speichern da, nicht zum
// Anschauen — angeschaut werden die Bilder in der Nachricht selbst. Aufgeklappte
// Kacheln drängten auf dem Handy den Nachrichtentext auf einen Streifen zusammen.
async function renderImages(m, bilder) {
  const box = document.getElementById('rimgs');
  S.bilder = bilder;
  S.bilderOffen = false;
  if (!bilder.length) { box.classList.add('hide'); box.innerHTML = ''; return; }
  box.classList.remove('hide');
  const gesamt = bilder.reduce((s, a) => s + (a.size || 0), 0);
  box.innerHTML = `<div class="kopf"><span>🖼️ ${bilder.length} ${bilder.length === 1 ? 'Bild' : 'Bilder'} in dieser Nachricht</span>
      <span style="color:var(--dim);font-weight:400">${fmtSize(gesamt)}</span>
      <button class="btn sec sm" id="bkacheln" onclick="bilderUmschalten()">Speichern…</button>
      ${bilder.length > 1 ? '<button class="btn sec sm" onclick="alleBilder()">Alle speichern</button>' : ''}</div>
    <div class="raster hide" id="rraster">${bilder.map((a, i) => `<div class="bild" onclick="dlPart(${i},'bild')" title="${esc(a.filename)} — zum Speichern anklicken">
      <div class="vor" id="vor${i}">🖼️</div>
      <div class="nm">${esc(a.filename)}</div><div class="gr">${fmtSize(a.size)}</div></div>`).join('')}</div>`;
}

function bilderUmschalten() {
  const raster = document.getElementById('rraster');
  const knopf = document.getElementById('bkacheln');
  if (!raster) return;
  S.bilderOffen = !S.bilderOffen;
  raster.classList.toggle('hide', !S.bilderOffen);
  if (knopf) knopf.textContent = S.bilderOffen ? 'Zuklappen' : 'Speichern…';
  if (S.bilderOffen) ladeVorschauen(S.cur, S.bilder || []);
}

// Vorschaubilder erst beim Aufklappen holen; sehr große überspringen, damit die
// Ansicht flott bleibt.
function ladeVorschauen(m, bilder) {
  bilder.forEach(async (a, i) => {
    if ((a.size || 0) > 8 * 1024 * 1024) return;
    const el = document.getElementById('vor' + i);
    if (!el || el.dataset.fertig) return;
    try {
      const blob = await holeStueck(m.uid, a);
      if (!S.cur || S.cur.uid !== m.uid || !el.isConnected) return;
      const url = URL.createObjectURL(blob);
      (S.vorschauUrls = S.vorschauUrls || []).push(url);
      el.style.backgroundImage = `url("${url}")`;
      el.textContent = '';
      el.dataset.fertig = '1';
    } catch (e) { /* Platzhalter bleibt stehen */ }
  });
}

async function alleBilder() {
  if (!S.bilder || !S.bilder.length) return;
  toast(`Speichere ${S.bilder.length} Bilder…`);
  for (let i = 0; i < S.bilder.length; i++) {
    await dlPart(i, 'bild');
    await new Promise(r => setTimeout(r, 350));   // Browser mag keine Download-Salve
  }
}

// Inhalt immer in ein FRISCHES iframe setzen. Ein bestehendes iframe neu zu
// laden hängt jedes Mal einen Eintrag an den Verlauf des Browsers — die
// Zurück-Geste landete dann dort statt bei der geöffneten Mail, und man kam
// aus der Nachricht nicht mehr heraus. Das erste Laden eines neu eingefügten
// iframes zählt dagegen nicht als Navigation.
function setzeFrame(doc) {
  const alt = document.getElementById('frame');
  const neu = document.createElement('iframe');
  neu.id = 'frame';
  // allow-same-origin NUR damit wir den Inhalt ausmessen können (Breite/Höhe).
  // Ohne allow-scripts läuft im Rahmen nichts — der Filter wirft Skripte ohnehin
  // raus, und die Inhaltsregel des Dokuments lässt nur data:-Bilder zu.
  neu.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox allow-downloads allow-same-origin');
  neu.setAttribute('referrerpolicy', 'no-referrer');
  neu.addEventListener('load', () => passeRahmenAn(neu));
  neu.srcdoc = doc;
  alt.replaceWith(neu);
}

// Mails sind auf ~650 px Breite gebaut — auf dem Handy passt das nicht. Also
// den Inhalt herunterzoomen, bis er in die Breite passt, und den Rahmen auf dem
// Handy so hoch machen wie die Nachricht: dann scrollt die ganze Ansicht, statt
// die Mail in einen Streifen zu quetschen.
function passeRahmenAn(fr) {
  let d;
  try { d = fr.contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;
  const anpassen = () => {
    if (!fr.isConnected) return;
    const platz = fr.clientWidth || 1;
    d.body.style.zoom = '';
    const breit = Math.max(d.body.scrollWidth, d.documentElement.scrollWidth);
    const faktor = breit > platz + 4 ? Math.max(0.4, platz / breit) : 1;
    if (faktor < 1) d.body.style.zoom = faktor;
    requestAnimationFrame(() => {
      if (!fr.isConnected) return;
      // scrollHeight steht bereits in gezoomten Pixeln — nicht nochmal rechnen.
      const hoch = Math.ceil(d.documentElement.scrollHeight) + 16;
      fr.style.flex = 'none';
      fr.style.height = Math.max(280, hoch) + 'px';
    });
  };
  anpassen();
  // Bilder trudeln als data:-URL erst nach dem Aufbau ein und ändern die Höhe.
  [...d.images].forEach(i => i.complete || i.addEventListener('load', anpassen, { once: true }));
  clearTimeout(S.rahmenTimer);
  S.rahmenTimer = setTimeout(anpassen, 1200);
}

async function renderBody(m) {
  let html = m.html || '';
  // Eingebettete Bilder (cid:) nachladen und als data:-URL einsetzen — das
  // Anzeige-iframe ist abgeschottet und kann selbst nichts nachladen.
  const parts = [...new Set([...html.matchAll(/cid-part:(\d+)/g)].map(x => x[1]))];
  for (const p of parts) {
    try {
      const blob = await holePart(m.uid, p);
      const url = await alsDataUrl(blob);
      html = html.split('cid-part:' + p).join(url);
    } catch (e) { /* Bild bleibt leer */ }
  }
  // Bilder, die die Mail nur verlinkt: erst nach ausdrücklichem "Bilder
  // anzeigen" liefert der Server sie überhaupt im Text aus. Dann holt sie der
  // Server stellvertretend und wir legen sie ebenfalls als data:-URL hinein —
  // sonst blockt die Inhaltsregel des iframes jedes Nachladen.
  const stellen = new Map();     // roher Treffer -> { url, bau(dataUrl) }
  for (const t of html.matchAll(/src="(https?:[^"]+)"/gi)) {
    stellen.set(t[0], { url: entschaerftZurueck(t[1]), bau: d => 'src="' + d + '"' });
  }
  // Hintergrundbilder im style-Attribut zählen genauso — sonst bleibt der Kopf
  // eines Newsletters leer, obwohl das Bild da ist.
  for (const t of html.matchAll(/url\(\s*(?:&quot;|['"])?(https?:[^)'"]+?)(?:&quot;|['"])?\s*\)/gi)) {
    stellen.set(t[0], { url: entschaerftZurueck(t[1]), bau: d => 'url("' + d + '")' });
  }
  // Höchstens vier Abrufe gleichzeitig: Newsletter-Server werfen bei einer
  // Salve aus einem Dutzend Anfragen zuverlässig einzelne Bilder ab.
  const geholt = [];
  const aufgabe = [...stellen.entries()].slice(0, 60);
  let naechste = 0;
  await Promise.all(Array.from({ length: Math.min(4, aufgabe.length) }, async () => {
    while (naechste < aufgabe.length) {
      const [roh, wie] = aufgabe[naechste++];
      try {
        const blob = await holeBild(wie.url);
        const url = await alsDataUrl(blob);
        html = html.split(roh).join(wie.bau(url));
        geholt.push({ url: wie.url, blob });
      } catch (e) { /* Bild bleibt leer */ }
    }
  }));
  if (S.cur && S.cur.uid === m.uid && geholt.length) {
    // Winzlinge (Abstandshalter, Zählpixel) gehören nicht in die Bilderleiste.
    const gesehen = new Set();
    const kacheln = geholt.filter(g => g.blob.size >= 1024 && (g.blob.type || '').startsWith('image/'))
      .filter(g => !gesehen.has(g.url) && gesehen.add(g.url))
      .map(g => ({
        url: g.url, filename: decodeURIComponent((g.url.split('?')[0].split('/').pop() || 'bild')),
        type: g.blob.type, size: g.blob.size, inline: true,
      }));
    if (kacheln.length) renderImages(m, (S.bilder || []).filter(a => !a.url).concat(kacheln));
  }
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'">
    <style>body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c2030;margin:18px 22px;word-wrap:break-word}
    img{max-width:100%;height:auto}table{max-width:100%}pre.plain{font:14.5px/1.6 system-ui,sans-serif;white-space:pre-wrap;word-wrap:break-word}
    blockquote{border-left:3px solid #e3e6ef;margin:8px 0;padding:2px 0 2px 12px;color:#5b6172}
    a{color:#EA6000}</style></head><body>${html}</body></html>`;
  setzeFrame(doc);
}

// --- Verfassen -------------------------------------------------------------
function compose(pre) {
  pre = pre || {};
  S.reply = pre.reply || null; S.atts = [];
  // Absender: bei mehreren Konten wählbar, sonst bleibt die Zeile verborgen.
  const from = document.getElementById('cfrom');
  from.innerHTML = S.accounts.map(a =>
    `<option value="${a.id}">${esc(a.name ? a.name + ' <' + a.email + '>' : a.email)}</option>`).join('');
  from.value = pre.from || (S.acc && S.acc.id) || '';
  document.getElementById('cfromrow').classList.toggle('hide', S.accounts.length < 2);
  document.getElementById('ctitle').textContent = pre.title || 'Neue Nachricht';
  document.getElementById('cto').value = pre.to || '';
  document.getElementById('ccc').value = pre.cc || '';
  document.getElementById('csubj').value = pre.subject || '';
  // Die Signatur steht bewusst NICHT im Textfeld: sie wird erst beim Senden
  // angehängt. So kann sie nicht versehentlich zerschrieben werden, und beim
  // Wechsel des Absenders stimmt sie ohne Nachbessern.
  const text = pre.text || '';
  document.getElementById('ctext').value = text;
  S.composeFrom = from.value;
  sigZeile();
  document.getElementById('cattlist').innerHTML = '';
  document.getElementById('cstatus').textContent = '';
  document.getElementById('compose').classList.remove('hide');
  pushLayer('compose');
  document.getElementById(pre.to ? 'ctext' : 'cto').focus();
}

// Als Programm installiert meldet sich V3D Mail für mailto:-Links an. Windows
// startet die App dann mit ?compose=mailto:… — dasselbe Feld dient der
// Sprungliste ("Neue Nachricht") mit ?compose=1.
function ausMailto(wert) {
  if (!wert || wert === '1') return {};
  // Kodiert übergeben (so macht es Windows) einmal auflösen. Steht das mailto
  // dagegen im Klartext in der Adresse, sind seine &-Teile schon getrennt —
  // dann nicht nochmal auflösen, sonst zerfallen kodierte Zeichen im Text.
  let roh = wert;
  if (!/^mailto:/i.test(wert)) {
    try { roh = decodeURIComponent(wert); } catch (e) { /* roh lassen */ }
  }
  if (!/^mailto:/i.test(roh)) return { to: roh };
  const [adressen, abfrage] = roh.slice(7).split('?');
  const pre = { to: decodeURIComponent(adressen || '').replace(/,\s*/g, ', ') };
  for (const paar of (abfrage || '').split('&')) {
    if (!paar) continue;
    const [k, ...rest] = paar.split('=');
    let v = rest.join('=');
    try { v = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) { /* roh lassen */ }
    const name = k.toLowerCase();
    if (name === 'subject') pre.subject = v;
    else if (name === 'body') pre.text = v;
    else if (name === 'cc') pre.cc = v;
    else if (name === 'to') pre.to = pre.to ? pre.to + ', ' + v : v;
  }
  return pre;
}

// Übergabe von VolmeRechnung: ?uebergabe=<token> in der Adresse — der fertige
// Entwurf samt PDF-Anhang liegt beim Rechnungs-Server und wird hier über den
// gemeinsamen Funnel (/rechnung) abgeholt. Das Token ist einmalig und verfällt.
// mailto taugt dafür nicht, weil es keine Anhänge transportieren kann.
async function uebergabeAbholen() {
  const token = new URLSearchParams(location.search).get('uebergabe');
  if (!token) return false;
  // Adresse säubern, damit ein Neuladen nicht ins Leere greift (Token ist weg).
  history.replaceState(history.state, '', location.pathname);
  let d;
  try {
    const r = await fetch('/rechnung/api/uebergabe/' + encodeURIComponent(token));
    d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  } catch (e) {
    toast('Übergabe von VolmeRechnung fehlgeschlagen: ' + e.message, 8000);
    return false;
  }
  compose({ title: 'Neue Nachricht', to: d.to || '', subject: d.subject || '', text: d.text || '' });
  for (const a of d.attachments || []) {
    if (!a.data) continue;
    S.atts.push({ name: a.name || 'anhang.pdf', type: a.type || 'application/octet-stream',
                  data: a.data, size: a.size || Math.floor(a.data.length * 3 / 4) });
  }
  addAttachments([]); // nur Liste zeichnen — es kommen keine neuen Dateien dazu
  return true;
}

function starteAusAdresse() {
  // Alles hinter compose= nehmen, nicht nur den ersten Parameter: ein im
  // Klartext übergebenes mailto bringt eigene &-Teile mit (&body=…), die
  // URLSearchParams sonst abschneidet.
  const treffer = location.search.match(/[?&]compose=([\s\S]*)$/);
  const wert = treffer && treffer[1];
  if (!wert) return;
  // Adresse wieder säubern, damit ein Neuladen nicht erneut das Fenster öffnet.
  history.replaceState(history.state, '', location.pathname);
  const pre = ausMailto(wert);
  const eigen = S.acc && S.acc.signature ? '\n\n' + S.acc.signature : '';
  compose(Object.assign({ title: 'Neue Nachricht' }, pre,
                        pre.text !== undefined ? { text: pre.text + eigen } : {}));
}

function fromChanged() {
  S.composeFrom = document.getElementById('cfrom').value;
  sigZeile();
}

function sigZeile() {
  const sender = S.accounts.find(a => a.id === S.composeFrom) || S.acc || {};
  const box = document.getElementById('csig');
  if (!box) return;
  if (sender.signatureHtml || sender.signature) {
    box.classList.remove('hide');
    box.innerHTML = '<div class="k">Signatur wird angehängt</div>' +
      (sigAnzeige(sender) || esc(sender.signature).replace(/\n/g, '<br>')) +
      `<button class="btn sec sm" style="margin-top:8px" onclick="editAccount('${sender.id}')">Ändern</button>`;
  } else {
    box.classList.remove('hide');
    box.innerHTML = '<div class="k">Keine Signatur hinterlegt</div>' +
      `<button class="btn sec sm" onclick="signaturDialog('${sender.id || ''}')">Signatur einrichten</button>`;
  }
}

// Getippter Text in die formatierte Fassung übersetzen. Zitatzeilen bekommen
// die übliche graue Leiste, damit die Antwort lesbar bleibt.
function htmlAusText(text) {
  return (text || '').split('\n').map(z => {
    if (/^\s*>/.test(z)) {
      return `<div style="border-left:2px solid #ccd0da;padding-left:8px;color:#5b6172">${esc(z.replace(/^\s*>\s?/, ''))}</div>`;
    }
    return esc(z) + '<br>';
  }).join('');
}
function closeCompose() {
  if (S.layers[S.layers.length - 1] === 'compose') zurueck();
  else document.getElementById('compose').classList.add('hide');
}

function quoted(m) {
  const who = m.from[0] ? (m.from[0].name || m.from[0].email) : '';
  const head = `\n\nAm ${m.date} schrieb ${who}:\n`;
  const body = (m.plain || stripTags(m.html)).split('\n').map(l => '> ' + l).join('\n');
  return head + body;
}
function stripTags(h) {
  const d = document.createElement('div'); d.innerHTML = (h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n');
  return (d.textContent || '').trim();
}
function senderFor(m) {
  // Aus welchem Postfach wurde die Mail empfangen? Danach richtet sich der
  // Absender der Antwort — sonst antwortet man aus dem falschen Konto.
  const adressen = m.to.concat(m.cc || []).map(a => (a.email || '').toLowerCase());
  const treffer = S.accounts.find(a => adressen.includes((a.email || '').toLowerCase()));
  return (treffer || S.acc).id;
}
function reply(all) {
  if (!S.cur) return;
  const m = S.cur;
  const fromId = senderFor(m);
  const self = (S.accounts.find(a => a.id === fromId) || S.acc);
  const to = (m.replyTo.length ? m.replyTo : m.from).map(a => a.email).join(', ');
  const cc = all ? m.to.concat(m.cc).map(a => a.email).filter(e => e !== self.email).join(', ') : '';
  compose({
    title: 'Antworten', to, cc, from: fromId,
    subject: /^(re|aw):/i.test(m.subject) ? m.subject : 'Re: ' + m.subject,
    text: quoted(m),
    reply: { inReplyTo: m.messageId, references: m.references },
  });
}
function forward() {
  if (!S.cur) return;
  const m = S.cur;
  const fromId = senderFor(m);
  const self = (S.accounts.find(a => a.id === fromId) || S.acc);
  compose({
    title: 'Weiterleiten', from: fromId,
    subject: /^(fwd|wg):/i.test(m.subject) ? m.subject : 'Fwd: ' + m.subject,
    text: `\n\n---------- Weitergeleitete Nachricht ----------\nVon: ${m.from.map(a => a.email).join(', ')}\nDatum: ${m.date}\nBetreff: ${m.subject}\n\n` +
      (m.plain || stripTags(m.html)),
  });
}

async function addAttachments(files) {
  for (const f of files) {
    if (f.size > 20 * 1024 * 1024) { toast(f.name + ' ist größer als 20 MB'); continue; }
    const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(f); });
    S.atts.push({ name: f.name, type: f.type, data, size: f.size });
  }
  document.getElementById('cattlist').innerHTML = S.atts.map((a, i) =>
    `<div class="att" onclick="S.atts.splice(${i},1);addAttachments([])">📎 ${esc(a.name)} <small>${fmtSize(a.size)}</small> ✕</div>`).join('');
  document.getElementById('cfile').value = '';
}

async function doSend() {
  const btn = document.getElementById('csend');
  const to = document.getElementById('cto').value.trim();
  if (!to) return toast('Bitte Empfänger angeben');
  btn.disabled = true;
  document.getElementById('cstatus').innerHTML = '<span class="spin"></span> sendet…';
  const accId = document.getElementById('cfrom').value || S.acc.id;
  const sender = S.accounts.find(a => a.id === accId) || {};
  const roh = document.getElementById('ctext').value;
  // "-- " ist der seit jeher übliche Trenner vor der Signatur; Mailprogramme
  // blenden alles darunter beim Antworten aus.
  const text = sender.signature ? roh.replace(/\s+$/, '') + '\n\n-- \n' + sender.signature : roh;
  const html = sender.signatureHtml
    ? `<div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45">` +
      htmlAusText(roh) + '<br>' + sender.signatureHtml + '</div>'
    : '';
  // Logo der Signatur fest mitschicken, damit es beim Empfänger auch ohne
  // Nachladen erscheint. Quelle ist die im Konto abgelegte data:-Fassung.
  const logoRoh = (sender.signatureData || {}).logo;
  const bilder = logoRoh ? [{
    cid: SIG_LOGO_CID, name: 'logo.png',
    type: (sender.signatureData.logoTyp || 'image/png'),
    data: String(logoRoh).split(',')[1] || '',
  }] : [];
  try {
    const r = await post('send', Object.assign({
      acc: accId,
      to, cc: document.getElementById('ccc').value.trim(),
      subject: document.getElementById('csubj').value,
      text, html, inlineImages: bilder,
      attachments: S.atts,
    }, S.reply || {}));
    closeCompose();
    toast(r.savedToSent ? 'Gesendet ✓' : 'Gesendet ✓ (keine Kopie in „Gesendet")');
  } catch (e) {
    document.getElementById('cstatus').textContent = '';
    toast('Fehler: ' + e.message, 6000);
  } finally { btn.disabled = false; }
}

async function doAutoconfig() {
  const email = document.getElementById('a_email').value.trim();
  const out = document.getElementById('a_ac');
  if (!email.includes('@')) { out.textContent = 'Bitte vollständige Adresse eingeben.'; return; }
  out.innerHTML = '<span class="spin"></span> suche Server für ' + esc(email.split('@')[1]) + '…';
  try {
    const r = await post('autoconfig', { email });
    if (r.imapHost) {
      document.getElementById('a_ih').value = r.imapHost;
      document.getElementById('a_ip').value = r.imapPort;
      document.getElementById('a_issl').checked = r.imapSSL !== false;
    }
    if (r.smtpHost) {
      document.getElementById('a_sh').value = r.smtpHost;
      document.getElementById('a_sp').value = r.smtpPort;
      document.getElementById('a_sm').value = r.smtpMode || 'starttls';
    }

    out.textContent = 'Quelle: ' + r.source;
  } catch (e) { out.textContent = e.message; }

// --- Signatur --------------------------------------------------------------
// Aus den Angaben entstehen zwei Fassungen: HTML für die formatierte Mail und
// Klartext als Rückfallebene. Die HTML-Fassung nutzt ausschließlich Stile
// direkt am Element — Mailprogramme werfen <style>-Blöcke im Kopf weg.
const SIG_LOGO_CID = 'v3dsiglogo';

// Die gespeicherte Signatur verweist fürs Versenden auf das eingebettete Logo
// (cid:). Im Browser gibt es das nicht — für Vorschauen die data:-Fassung
// wieder einsetzen.
function sigAnzeige(acc) {
  const h = (acc && acc.signatureHtml) || '';
  const logo = ((acc && acc.signatureData) || {}).logo;
  return (h && logo) ? h.split('cid:' + SIG_LOGO_CID).join(logo) : h;
}
const SIG_FELDER = [
  ['name', 'Name', 'Volker Isken'], ['rolle', 'Funktion', 'Inhaber'],
  ['firma', 'Firma', 'Volme 3D'], ['slogan', 'Zusatz unter der Firma', '3D-Druck · Konstruktion · Kurse'],
  ['strasse', 'Straße', 'Tückinger Höhe 15'], ['ort', 'PLZ und Ort', '58135 Hagen'],
  ['telefon', 'Telefon', '+49 1512 0164288'], ['email', 'E-Mail', ''],
  ['web', 'Web', 'https://volme3dakademie.de'], ['zusatz', 'Freie Zeile', ''],
];

function sigBauen(d, layout, opts) {
  opts = opts || {};
  const A = '#EA6000', T = '#1c2030', M = '#5b6172';
  const e = s => esc(s || '');
  const web = (d.web || '').replace(/^https?:\/\//, '');
  const schrift = "font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45";

  const zeilen = [];
  if (d.strasse) zeilen.push(e(d.strasse));
  if (d.ort) zeilen.push(e(d.ort));
  const kontakt = [];
  if (d.telefon) kontakt.push(`Tel. <a href="tel:${e((d.telefon || '').replace(/[^+\d]/g, ''))}" style="color:${M};text-decoration:none">${e(d.telefon)}</a>`);
  if (d.email) kontakt.push(`<a href="mailto:${e(d.email)}" style="color:${A};text-decoration:none">${e(d.email)}</a>`);
  if (d.web) kontakt.push(`<a href="${e(d.web)}" style="color:${A};text-decoration:none">${e(web)}</a>`);

  const kopf = `<span style="font-weight:bold;color:${T};font-size:14px">${e(d.name)}</span>` +
    (d.rolle ? `<span style="color:${M}"> · ${e(d.rolle)}</span>` : '');
  const firma = d.firma ? `<div style="color:${T};font-weight:bold;margin-top:2px">${e(d.firma)}</div>` : '';
  const slogan = d.slogan ? `<div style="color:${A};font-size:11.5px;letter-spacing:.3px">${e(d.slogan)}</div>` : '';
  const adresse = zeilen.length ? `<div style="color:${M};margin-top:6px">${zeilen.join('<br>')}</div>` : '';
  // Untereinander oder als eine Zeile mit Trennpunkten
  const kontaktZeile = !kontakt.length ? ''
    : d.kontaktUnter
      ? `<div style="color:${M};margin-top:4px">${kontakt.map(z => `<div>${z}</div>`).join('')}</div>`
      : `<div style="color:${M};margin-top:4px">${kontakt.join(' &nbsp;·&nbsp; ')}</div>`;
  const zusatz = d.zusatz ? `<div style="color:${M};font-size:11.5px;margin-top:6px">${e(d.zusatz)}</div>` : '';

  // Mit Logo wandert der Spruch nach oben zur Marke, sonst steht er hier.
  const hatLogo = !!(opts.logo || d.logo);
  const sloganHier = hatLogo ? '' : slogan;

  let innen;
  if (layout === 'kompakt') {
    const alles = [d.strasse, d.ort].filter(Boolean).map(e).join(', ');
    innen = `<div>${kopf}${d.firma ? ` · <span style="font-weight:bold;color:${T}">${e(d.firma)}</span>` : ''}</div>` +
      sloganHier + (alles ? `<div style="margin-top:3px;color:${M}">${alles}</div>` : '') + kontaktZeile + zusatz;
  } else {
    innen = `<div>${kopf}</div>${firma}${sloganHier}${adresse}${kontaktZeile}${zusatz}`;
  }

  // Das Logo kommt als eingebettetes Bild (Content-ID) in die Mail. Für die
  // Vorschau in der App wird stattdessen die data:-Fassung durchgereicht.
  const logo = opts.logo || (d.logo && { src: d.logo, breite: d.logoBreite });
  if (logo && logo.src) {
    const br = parseInt(logo.breite, 10) || 140;
    const bild = `<img src="${e(logo.src)}" width="${br}" alt="${e(d.firma || d.name)}"` +
      ` style="display:block;border:0;outline:none;width:${br}px;max-width:${br}px;height:auto">`;
    // Der Spruch gehört zur Marke: mit Logo steht er direkt darunter, nicht
    // zwischen den Angaben.
    const marke = bild + (slogan ? `<div style="margin-top:5px">${slogan}</div>` : '');
    if (d.logoPos === 'oben') {
      innen = `<div style="margin-bottom:12px">${marke}</div>${innen}`;
    } else {
      // Tabelle statt Flexbox: Outlook kann kein modernes Layout.
      innen = `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">` +
        `<tr><td valign="top" style="padding:0 16px 0 0;vertical-align:top">${bild}</td>` +
        `<td valign="top" style="vertical-align:top">${innen}</td></tr></table>`;
    }
  }

  let html;
  if (layout === 'balken') {
    html = `<div style="${schrift};border-left:3px solid ${A};padding-left:12px">${innen}</div>`;
  } else if (layout === 'kompakt') {
    html = `<div style="${schrift};color:${M}">${innen}</div>`;
  } else {
    html = `<div style="${schrift};border-top:1px solid #e3e6ef;padding-top:10px">${innen}</div>`;
  }

  const t = [];
  // In der Klartextfassung gibt es kein Logo — dort führt der Spruch die
  // Signatur an, damit beide Fassungen dieselbe Reihenfolge haben.
  if (d.slogan && hatLogo) t.push(d.slogan);
  t.push([d.name, d.rolle].filter(Boolean).join(' · '));
  if (d.firma) t.push(d.firma);
  if (d.slogan && !hatLogo) t.push(d.slogan);
  if (d.strasse) t.push(d.strasse);
  if (d.ort) t.push(d.ort);
  const tk = [];
  if (d.telefon) tk.push('Tel. ' + d.telefon);
  if (d.email) tk.push(d.email);
  if (d.web) tk.push(web);
  if (tk.length) t.push(d.kontaktUnter ? tk.join('\n') : tk.join(' · '));
  if (d.zusatz) t.push(d.zusatz);
  return { html, text: t.filter(Boolean).join('\n') };
}
