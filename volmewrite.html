<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VolmeWrite</title>
<style>
  :root {
    --bg: #e8eaed;
    --bar: #ffffff;
    --border: #d0d3d8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --text: #1f2328;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Kopfzeile ---------- */
  header {
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px 0 14px;
    flex: 0 0 auto;
  }
  .titlerow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .logo {
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    white-space: nowrap;
    user-select: none;
  }
  #docTitle {
    font-size: 15px;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 8px;
    min-width: 120px;
    max-width: 40vw;
    outline: none;
  }
  #docTitle:hover { border-color: var(--border); }
  #docTitle:focus { border-color: var(--accent); }
  .titlerow .spacer { flex: 1; }
  .filebtns { display: flex; gap: 6px; }
  .filebtns button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .filebtns button:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* ---------- Werkzeugleiste ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px;
    padding: 6px 0;
  }
  .toolbar .sep {
    width: 1px;
    height: 22px;
    background: var(--border);
    margin: 0 5px;
  }
  .toolbar button {
    border: 1px solid transparent;
    background: none;
    border-radius: 5px;
    min-width: 30px;
    height: 30px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
  }
  .toolbar button:hover { background: var(--accent-soft); }
  .toolbar button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .toolbar select, .toolbar input[type=color] {
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar input[type=color] { width: 34px; padding: 2px; }
  .toolbar label.colorwrap {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    font-size: 9px;
    color: #666;
    cursor: pointer;
    gap: 1px;
  }

  /* ---------- Schreibfläche ---------- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 12px 60px 12px;
  }
  #page {
    background: #fff;
    max-width: 21cm;
    min-height: 29.7cm;
    margin: 0 auto;
    padding: 2.5cm 2cm;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
    border-radius: 2px;
    outline: none;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12pt;
    line-height: 1.5;
    overflow-wrap: break-word;
  }
  #page:focus { box-shadow: 0 2px 12px rgba(0,0,0,.18), 0 0 0 2px var(--accent-soft); }
  #page img { max-width: 100%; }
  #page table { border-collapse: collapse; }
  #page table td, #page table th { border: 1px solid #999; padding: 4px 8px; min-width: 40px; }
  #page blockquote {
    border-left: 3px solid var(--accent);
    margin-left: 0;
    padding-left: 12px;
    color: #555;
  }
  #page a { color: var(--accent); }

  /* ---------- Statusleiste ---------- */
  footer {
    flex: 0 0 auto;
    background: var(--bar);
    border-top: 1px solid var(--border);
    padding: 4px 14px;
    font-size: 12px;
    color: #666;
    display: flex;
    gap: 16px;
  }
  footer .spacer { flex: 1; }
  #saveState { color: #16a34a; }

  /* ---------- Druck ---------- */
  @media print {
    header, footer { display: none !important; }
    main { padding: 0; overflow: visible; }
    body { background: #fff; }
    #page {
      box-shadow: none;
      max-width: none;
      min-height: 0;
      padding: 0;
      margin: 0;
      border-radius: 0;
    }
  }
</style>
</head>
<body>

<header>
  <div class="titlerow">
    <span class="logo">✒ VolmeWrite</span>
    <input id="docTitle" value="Unbenanntes Dokument" title="Dokumentname">
    <span class="spacer"></span>
    <div class="filebtns">
      <button onclick="newDoc()" title="Neues Dokument">Neu</button>
      <button onclick="openFile()" title="Datei öffnen (.html, .txt)">Öffnen</button>
      <button onclick="saveHtml()" title="Als Datei speichern (Strg+S)">Speichern</button>
      <button onclick="saveTxt()" title="Als reinen Text exportieren">Als .txt</button>
      <button onclick="window.print()" title="Drucken / als PDF speichern">Drucken</button>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <button onclick="cmd('undo')" title="Rückgängig (Strg+Z)">↶</button>
    <button onclick="cmd('redo')" title="Wiederholen (Strg+Y)">↷</button>
    <span class="sep"></span>

    <select id="blockSel" onchange="setBlock(this.value)" title="Absatzformat">
      <option value="p">Normaler Text</option>
      <option value="h1">Überschrift 1</option>
      <option value="h2">Überschrift 2</option>
      <option value="h3">Überschrift 3</option>
      <option value="blockquote">Zitat</option>
      <option value="pre">Code</option>
    </select>

    <select id="fontSel" onchange="cmd('fontName', this.value)" title="Schriftart">
      <option value="Georgia">Georgia</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Arial">Arial</option>
      <option value="Verdana">Verdana</option>
      <option value="Courier New">Courier New</option>
      <option value="Comic Sans MS">Comic Sans MS</option>
    </select>

    <select id="sizeSel" onchange="cmd('fontSize', this.value)" title="Schriftgröße">
      <option value="1">8 pt</option>
      <option value="2">10 pt</option>
      <option value="3" selected>12 pt</option>
      <option value="4">14 pt</option>
      <option value="5">18 pt</option>
      <option value="6">24 pt</option>
      <option value="7">36 pt</option>
    </select>
    <span class="sep"></span>

    <button data-cmd="bold" onclick="cmd('bold')" title="Fett (Strg+B)"><b>F</b></button>
    <button data-cmd="italic" onclick="cmd('italic')" title="Kursiv (Strg+I)"><i>K</i></button>
    <button data-cmd="underline" onclick="cmd('underline')" title="Unterstrichen (Strg+U)"><u>U</u></button>
    <button data-cmd="strikeThrough" onclick="cmd('strikeThrough')" title="Durchgestrichen"><s>S</s></button>
    <span class="sep"></span>

    <label class="colorwrap" title="Schriftfarbe">
      <input type="color" value="#000000" oninput="cmd('foreColor', this.value)">
    </label>
    <label class="colorwrap" title="Textmarker">
      <input type="color" value="#ffff00" oninput="cmd('hiliteColor', this.value)">
    </label>
    <button onclick="clearFmt()" title="Formatierung entfernen">⌫A</button>
    <span class="sep"></span>

    <button data-cmd="justifyLeft" onclick="cmd('justifyLeft')" title="Linksbündig">⯇</button>
    <button data-cmd="justifyCenter" onclick="cmd('justifyCenter')" title="Zentriert">≡</button>
    <button data-cmd="justifyRight" onclick="cmd('justifyRight')" title="Rechtsbündig">⯈</button>
    <button data-cmd="justifyFull" onclick="cmd('justifyFull')" title="Blocksatz">☰</button>
    <span class="sep"></span>

    <button data-cmd="insertUnorderedList" onclick="cmd('insertUnorderedList')" title="Aufzählung">•≡</button>
    <button data-cmd="insertOrderedList" onclick="cmd('insertOrderedList')" title="Nummerierte Liste">1≡</button>
    <button onclick="cmd('outdent')" title="Einzug verkleinern">⇤</button>
    <button onclick="cmd('indent')" title="Einzug vergrößern">⇥</button>
    <span class="sep"></span>

    <button onclick="insertLink()" title="Link einfügen">🔗</button>
    <button onclick="insertImage()" title="Bild einfügen">🖼</button>
    <button onclick="insertTable()" title="Tabelle einfügen">⊞</button>
    <button onclick="cmd('insertHorizontalRule')" title="Trennlinie">―</button>
  </div>
</header>

<main>
  <div id="page" contenteditable="true" spellcheck="true">
    <p>Moin! Einfach lostippen …</p>
  </div>
</main>

<footer>
  <span id="wordCount">0 Wörter</span>
  <span id="charCount">0 Zeichen</span>
  <span class="spacer"></span>
  <span id="saveState"></span>
</footer>

<input type="file" id="fileInput" accept=".html,.htm,.txt,.md" style="display:none">

<script>
'use strict';
const page = document.getElementById('page');
const docTitle = document.getElementById('docTitle');
const STORE_KEY = 'volmewrite_doc';
const TITLE_KEY = 'volmewrite_title';

document.execCommand('styleWithCSS', false, true);

/* ---------- Formatier-Befehle ---------- */
function cmd(name, value) {
  page.focus();
  document.execCommand(name, false, value ?? null);
  updateToolbar();
  scheduleSave();
}

function setBlock(tag) {
  cmd('formatBlock', '<' + tag + '>');
}

function clearFmt() {
  cmd('removeFormat');
  cmd('formatBlock', '<p>');
}

function insertLink() {
  const url = prompt('Link-Adresse (URL):', 'https://');
  if (url && url !== 'https://') cmd('createLink', url);
}

function insertImage() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => cmd('insertImage', r.result);
    r.readAsDataURL(f);
  };
  inp.click();
}

function insertTable() {
  const rows = parseInt(prompt('Anzahl Zeilen:', '3'), 10);
  const cols = parseInt(prompt('Anzahl Spalten:', '3'), 10);
  if (!rows || !cols || rows < 1 || cols < 1 || rows > 50 || cols > 20) return;
  let html = '<table>';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) html += '<td><br></td>';
    html += '</tr>';
  }
  html += '</table><p><br></p>';
  cmd('insertHTML', html);
}

/* ---------- Toolbar-Zustand ---------- */
function updateToolbar() {
  document.querySelectorAll('#toolbar button[data-cmd]').forEach(btn => {
    let on = false;
    try { on = document.queryCommandState(btn.dataset.cmd); } catch (e) {}
    btn.classList.toggle('active', on);
  });
  // Absatzformat im Dropdown spiegeln
  const sel = window.getSelection();
  if (sel.rangeCount) {
    let node = sel.anchorNode;
    if (node && node.nodeType === 3) node = node.parentElement;
    while (node && node !== page) {
      const t = node.tagName ? node.tagName.toLowerCase() : '';
      if (['h1','h2','h3','blockquote','pre','p'].includes(t)) {
        document.getElementById('blockSel').value = t;
        return;
      }
      node = node.parentElement;
    }
    document.getElementById('blockSel').value = 'p';
  }
}
document.addEventListener('selectionchange', () => {
  if (document.activeElement === page || page.contains(document.activeElement)) updateToolbar();
});

/* ---------- Zähler + Autosave ---------- */
let saveTimer = null;
function scheduleSave() {
  updateCounts();
  document.getElementById('saveState').textContent = '…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, page.innerHTML);
      localStorage.setItem(TITLE_KEY, docTitle.value);
      document.getElementById('saveState').textContent = '✓ Automatisch gespeichert';
    } catch (e) {
      document.getElementById('saveState').textContent = '⚠ Autosave fehlgeschlagen (Dokument zu groß?)';
    }
  }, 600);
}

function updateCounts() {
  const text = page.innerText.replace(/ /g, ' ');
  const words = (text.match(/[\wäöüÄÖÜß]+/g) || []).length;
  document.getElementById('wordCount').textContent = words + ' ' + (words === 1 ? 'Wort' : 'Wörter');
  const chars = text.replace(/\n/g, '').length;
  document.getElementById('charCount').textContent = chars + ' Zeichen';
}

page.addEventListener('input', scheduleSave);
docTitle.addEventListener('input', scheduleSave);

/* Einfügen: nur einfaches HTML/Text zulassen, kein Word-Müll */
page.addEventListener('paste', e => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});

/* ---------- Datei-Operationen ---------- */
function newDoc() {
  if (!confirm('Neues Dokument anlegen? Der aktuelle Inhalt wird verworfen.')) return;
  page.innerHTML = '<p><br></p>';
  docTitle.value = 'Unbenanntes Dokument';
  scheduleSave();
  page.focus();
}

function safeName() {
  return (docTitle.value.trim() || 'Dokument').replace(/[\\/:*?"<>|]+/g, '_');
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function saveHtml() {
  const html = '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="UTF-8">\n<title>'
    + docTitle.value.replace(/</g, '&lt;')
    + '</title>\n<style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.5;max-width:21cm;margin:2cm auto;padding:0 1cm;} img{max-width:100%;} table{border-collapse:collapse;} td,th{border:1px solid #999;padding:4px 8px;} blockquote{border-left:3px solid #2563eb;margin-left:0;padding-left:12px;color:#555;}</style>\n</head>\n<body>\n'
    + page.innerHTML
    + '\n</body>\n</html>';
  download(new Blob([html], {type: 'text/html'}), safeName() + '.html');
  document.getElementById('saveState').textContent = '✓ Datei gespeichert';
}

function saveTxt() {
  download(new Blob([page.innerText], {type: 'text/plain'}), safeName() + '.txt');
}

function openFile() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function () {
  const f = this.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const content = r.result;
    if (/\.html?$/i.test(f.name)) {
      const doc = new DOMParser().parseFromString(content, 'text/html');
      // Skripte sicherheitshalber entfernen
      doc.querySelectorAll('script, style, link').forEach(el => el.remove());
      page.innerHTML = doc.body.innerHTML || '<p><br></p>';
      docTitle.value = doc.title || f.name.replace(/\.html?$/i, '');
    } else {
      page.innerHTML = '<p>' + content
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .split(/\n/).join('<br>') + '</p>';
      docTitle.value = f.name.replace(/\.(txt|md)$/i, '');
    }
    scheduleSave();
  };
  r.readAsText(f);
  this.value = '';
});

/* ---------- Tastenkürzel ---------- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveHtml();
  }
});

/* ---------- Wiederherstellen beim Start ---------- */
(function restore() {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved && saved.trim()) {
    page.innerHTML = saved;
    docTitle.value = localStorage.getItem(TITLE_KEY) || 'Unbenanntes Dokument';
  }
  updateCounts();
})();
</script>
</body>
</html>
