<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragenquiz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1b2a4a 0%, #2d4a7a 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 2.2em;
    margin: 18px 0 6px;
    letter-spacing: 1px;
  }
  .sub { text-align: center; opacity: .8; margin-bottom: 24px; font-size: .95em; }
  .frage {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .frage h2 { font-size: 1.05em; margin-bottom: 12px; }
  .frage h2 .nr {
    display: inline-block;
    background: #ffb830;
    color: #1b2a4a;
    border-radius: 50%;
    width: 26px; height: 26px;
    line-height: 26px;
    text-align: center;
    margin-right: 8px;
    font-size: .9em;
  }
  button.antwort {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.25);
    color: #fff;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 8px 0;
    font-size: 1em;
    cursor: pointer;
    transition: background .15s;
  }
  button.antwort:active { background: rgba(255,255,255,.25); }
  button.antwort.richtig { background: #2e9e5b; border-color: #2e9e5b; }
  button.antwort.falsch  { background: #c0392b; border-color: #c0392b; }
  button.antwort:disabled { cursor: default; opacity: .9; }
  .ziffer {
    margin-top: 10px;
    font-size: .95em;
    color: #ffb830;
    font-weight: bold;
    display: none;
  }
  #ergebnis {
    display: none;
    text-align: center;
    background: rgba(255,255,255,.12);
    border: 2px solid #ffb830;
    border-radius: 16px;
    padding: 24px 16px;
    margin-top: 24px;
  }
  #ergebnis h2 { margin-bottom: 10px; }
  #code {
    font-size: 2.6em;
    letter-spacing: .35em;
    font-weight: bold;
    color: #ffb830;
    margin: 10px 0;
  }
  #nochmal {
    margin-top: 14px;
    background: none;
    border: 1px solid rgba(255,255,255,.4);
    color: #fff;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fragenquiz</h1>
  <p class="sub">Beantworte alle 4 Fragen richtig und erhalte den Zahlencode!</p>
  <div id="quiz"></div>
  <div id="ergebnis">
    <h2>🎉 Geschafft!</h2>
    <p>Dein Zahlencode lautet:</p>
    <div id="code"></div>
    <button id="nochmal" onclick="location.reload()">Nochmal spielen</button>
  </div>
</div>

<script>
(function(){
  // Fragen: text, Antworten, Index der richtigen Antwort, Code-Ziffer (leicht verschleiert)
  var FRAGEN = [
    {
      t: "Wie viele Beine hat eine Spinne?",
      a: ["6", "8", "10"],
      r: 1, z: 55
    },
    {
      t: "Welcher Planet ist der Sonne am nächsten?",
      a: ["Venus", "Mars", "Merkur"],
      r: 2, z: 51
    },
    {
      t: "Wie viele Minuten hat eine Stunde?",
      a: ["60", "100", "90"],
      r: 0, z: 56
    },
    {
      t: "Welches Tier ist das größte der Welt?",
      a: ["Elefant", "Blauwal", "Giraffe"],
      r: 1, z: 50
    }
  ];

  var geloest = FRAGEN.map(function(){ return false; });
  var quizEl = document.getElementById("quiz");

  FRAGEN.forEach(function(f, i){
    var box = document.createElement("div");
    box.className = "frage";
    var h = document.createElement("h2");
    h.innerHTML = '<span class="nr">' + (i+1) + '</span>' + f.t;
    box.appendChild(h);

    f.a.forEach(function(txt, j){
      var btn = document.createElement("button");
      btn.className = "antwort";
      btn.textContent = txt;
      btn.onclick = function(){
        if (j === f.r) {
          btn.classList.add("richtig");
          box.querySelectorAll("button.antwort").forEach(function(b){ b.disabled = true; });
          geloest[i] = true;
          var zi = box.querySelector(".ziffer");
          zi.textContent = "✔ Richtig! " + (i+1) + ". Ziffer: " + String.fromCharCode(f.z);
          zi.style.display = "block";
          pruefen();
        } else {
          btn.classList.add("falsch");
          btn.disabled = true;
        }
      };
      box.appendChild(btn);
    });

    var zif = document.createElement("div");
    zif.className = "ziffer";
    box.appendChild(zif);
    quizEl.appendChild(box);
  });

  function pruefen(){
    if (geloest.every(Boolean)) {
      var code = FRAGEN.map(function(f){ return String.fromCharCode(f.z); }).join("");
      document.getElementById("code").textContent = code;
      var erg = document.getElementById("ergebnis");
      erg.style.display = "block";
      erg.scrollIntoView({ behavior: "smooth" });
    }
  }
})();
</script>
</body>
</html>
