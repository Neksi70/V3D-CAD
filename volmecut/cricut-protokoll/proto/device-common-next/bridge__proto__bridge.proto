// bridge/proto/bridge.proto
syntax = "editions";
package bridge.proto;
import "bridge/proto/NativeModel.Bridge.proto";
import "bridge/proto/device/message.proto";
import "bridge/proto/logging/message.proto";

message Message {
  /*oneof payload*/ NativeModel.Bridge.PBCommonBridge legacy_bridge = 1;
  /*oneof payload*/ bridge.proto.device.Message device_message = 2;
  /*oneof payload*/ bridge.proto.logging.Log log_message = 3;
}

