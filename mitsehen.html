<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<title>Sitzung beitreten · V3D CAD</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{ --acc:#F97316; --text:#1f2430; --mid:#444b59; --border:#e3e6ef; --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  html,body{margin:0;height:100%;background:#eef0f7;color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.12);padding:26px 24px}
  h1{font-size:19px;margin:0 0 8px}
  p{font-size:14px;color:var(--mid);line-height:1.55;margin:0 0 16px}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:14px;font-weight:700;color:#fff;background:var(--acc);border:1.5px solid var(--acc);border-radius:11px;padding:11px 16px;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>👥 Sitzung beitreten</h1>
  <p id="t">Einen Moment — du wirst weitergeleitet…</p>
  <a class="btn" id="go" href="./volme3d.html">Weiter zur App</a>
</div>
<script>
// Frueher lag hier ein eigener Nur-Gucken-Viewer. Gemeinsame Sitzungen laufen
// inzwischen in der vollen App (dort sieht der Gast echte Objekte samt
// Parametern und kann den Stift uebernehmen). Alte Links landen weiter richtig.
(function(){
  var sid = '';
  try{ var q = new URLSearchParams(location.search); sid = q.get('s') || q.get('sitzung') || ''; }catch(e){}
  var url = './volme3d.html' + (sid ? '?sitzung=' + encodeURIComponent(sid) : '');
  document.getElementById('go').href = url;
  if (sid){ location.replace(url); }
  else document.getElementById('t').textContent = 'Dieser Link enthält keine Sitzungs-Kennung. Lass dir bitte einen neuen schicken.';
})();
</script>
</body>
</html>
