<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3D ERP</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e2e6ed;--nav:#1d2433;--blue:#2f6fde;--green:#1f9d55;--orange:#e08a00;--red:#d64545;--yellow:#e6b800;--row:42px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:#cfd6e6;padding:12px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{color:#fff;font-weight:700;font-size:17px;padding:4px 18px 14px}
nav .logo small{display:block;font-weight:400;font-size:11px;color:#8e98b0}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7d879f;padding:14px 18px 4px}
nav a{display:block;color:#cfd6e6;padding:7px 18px;border-left:3px solid transparent}
nav a:hover{background:#262f42;color:#fff}
nav a.on{background:#2b3550;color:#fff;border-left-color:var(--blue)}
nav .unten{padding:16px 18px;font-size:12px;color:#7d879f}nav .unten a{display:inline;padding:0;border:0;color:#9fb4e8}
main{padding:16px 20px;min-width:0}
.kopfzeile{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kopfzeile h1{font-size:21px;margin:0;font-weight:600}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.rot{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f6f7fa;color:#4b5366}
input.zahl{text-align:right}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fafbfd;position:sticky;top:0}
td.r,th.r{text-align:right}
tr.klick{cursor:pointer} tr.klick:hover{background:#f2f6fd} tr.sel{background:#e7effc!important}
.liste{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.filter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter input{max-width:280px}.filter select{max-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .z{font-size:22px;font-weight:700}.kpi .t{color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;color:#fff;white-space:nowrap}
.st-entwurf{background:#8d96aa}.st-verarbeitet{background:var(--green)}.st-storniert{background:var(--red)}
.s-ok{background:var(--green)}.s-late{background:var(--orange)}.s-risk{background:var(--yellow);color:#4a3b00}.s-over{background:var(--red)}.s-open{background:var(--blue)}.s-fut{background:#b8c6e6;color:#1d2433}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.feld label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.hinweis{font-size:12px;color:var(--mute)}
.kette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kette a{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink);background:#fafbfd}
.kette a.akt{border-color:var(--blue);background:#e7effc}
.kette .pfeil{color:var(--mute)}
.reiter{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.reiter button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.reiter button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.pos td{padding:4px}.pos input{padding:4px 6px}
.summe{display:grid;grid-template-columns:auto 130px;gap:2px 16px;justify-content:end;margin-top:10px}
.summe .r{text-align:right}.summe b{font-size:16px}
.info{background:#f6f9ff;border:1px solid #dbe6fb;border-radius:8px;padding:8px 12px;font-size:13px}
.menue{position:relative;display:inline-block}
.menue .ddl{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;min-width:220px}
.menue.auf .ddl{display:block}
.ddl button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.ddl button:hover{background:#f2f6fd}
/* Zeitstrahl */
.gantt{display:grid;grid-template-columns:250px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gl{background:#fafbfd;border-right:1px solid var(--line)}
.gl .h,.gr .h{height:46px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.gl .h{display:flex;align-items:end;padding:0 10px 6px}
.gl .r{height:var(--row);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden}
.gl .r .x{overflow:hidden;text-overflow:ellipsis}
.gl .r:hover{background:#eef3fc}
.gr{overflow-x:auto;position:relative}
.gr .inner{position:relative}
.gr .h{position:relative}
.wk{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:11px;padding:3px 0 0 4px;color:var(--mute)}
.mo{position:absolute;top:22px;font-size:11px;font-weight:600;color:var(--ink);padding-left:4px;white-space:nowrap}
.gr .r{height:var(--row);border-bottom:1px solid var(--line);position:relative}
.grid{position:absolute;top:0;bottom:0;border-left:1px dashed #edf0f5}
.heute{position:absolute;top:0;bottom:0;border-left:2px solid var(--blue);z-index:3}
.heute span{position:absolute;top:2px;left:3px;font-size:10px;color:var(--blue);font-weight:700;background:#fff;padding:0 2px}
.bar{position:absolute;top:12px;height:18px;border-radius:4px;z-index:2;cursor:pointer;min-width:6px}
.ms{position:absolute;top:12px;width:17px;height:17px;transform:rotate(45deg);margin-left:-8px;border-radius:3px;z-index:2;cursor:pointer}
.base{position:absolute;top:7px;height:28px;width:0;border-left:3px solid #8d96aa;z-index:1}
.shift{position:absolute;top:20px;height:0;border-top:2px dashed var(--red);z-index:1}
.ist{position:absolute;top:10px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:2px solid var(--green);z-index:4;font-size:13px;line-height:18px;text-align:center;color:var(--green);font-weight:700}
.ist.late{border-color:var(--orange);color:var(--orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grund{font-size:12px;color:#8a4b00}
body.kunde .intern{display:none!important}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,26,40,.45)}
.dk{padding:14px 18px;border-bottom:1px solid var(--line)}.dk h3{margin:0;font-size:17px}
.db{padding:14px 18px;display:grid;gap:10px}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.zeile{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.zeile label{color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.fehler{background:var(--red)}
.login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:10px}
.druck{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;padding:6px}nav .grp,nav .unten{display:none}nav .logo{padding:6px 10px}nav a{padding:6px 10px;border-left:0}.gantt{grid-template-columns:140px 1fr}}
@media print{
  nav,.noprint,.kopfzeile .btn,.df{display:none!important}
  .app{display:block} main{padding:0} body{background:#fff}
  .card{border:0;padding:4px 0}
  .intern{display:none!important}
  body.belegdruck main>*{display:none!important}
  body.belegdruck .druck{display:block!important}
  @page{size:A4;margin:15mm}
  body.querformat{}
}
/* Briefansicht Belegerfassung */
.tisch{background:#dfe3ea;border-radius:10px;padding:22px 12px;overflow-x:auto}
.blatt{background:#fff;max-width:900px;min-width:720px;margin:0 auto;padding:34px 44px 30px;box-shadow:0 4px 18px rgba(0,0,0,.14);border-radius:2px}
.blatt input,.blatt select,.blatt textarea{border:1px solid transparent;background:#f5f7fb;border-radius:3px}
.blatt input:focus,.blatt select:focus,.blatt textarea:focus{border-color:var(--blue);background:#fff;outline:0}
.blatt.gesperrt input,.blatt.gesperrt select,.blatt.gesperrt textarea{background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.blatt.gesperrt select{appearance:none}.bk-wert{display:block;padding:2px 5px;white-space:normal;line-height:1.35}.blatt.gesperrt textarea{resize:none}.blatt.gesperrt textarea:placeholder-shown{display:none}
.bk-firma{text-align:right;font-weight:700;font-size:18px;letter-spacing:.02em}.bk-firma small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.bk-oben{display:flex;justify-content:space-between;gap:24px;margin:26px 0 18px}
.bk-links{width:46%}.bk-abs{font-size:9.5px;border-bottom:1px solid #444;padding-bottom:1px;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.bk-anschrift{min-height:96px;line-height:1.5}
.bk-kasten{width:330px;border:1px solid #444;padding:0 0 4px}
.bk-titel{background:#e9ecf1;border-bottom:1px solid #444;text-align:center;font-weight:700;font-size:17px;padding:4px}
.bk-z{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;padding:2px 8px;font-size:13px}
.bk-z>span:first-child{color:#444}
.bk-z input,.bk-z select{padding:2px 5px}
.bk-such{display:flex;gap:3px}.bk-such .btn{padding:0 7px}
.bk-zb{grid-template-columns:150px 260px;justify-content:end;padding:6px 0}
.bk-text{display:block;margin:8px 0;resize:vertical;font:inherit}
.bk-pos th{background:#e9ecf1;color:#333;border-bottom:1px solid #444;position:static}
.bk-pos td{border-bottom:1px solid #eceff4}
.statusleiste{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;flex-wrap:wrap}
@media (max-width:820px){.blatt{padding:18px;min-width:680px}}
.bk-logo{max-height:64px;max-width:260px;display:block;margin-left:auto}
.bk-fuss{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid #888;margin-top:22px;padding-top:6px;font-size:9.5px;color:#555;line-height:1.35}
.nurdruck{display:none}
@media print{.nurdruck{display:block;margin-bottom:8px}}
.druck .brief{font-size:12.5px}
.druck .absz{font-size:9px;border-bottom:1px solid #000;display:inline-block;margin-bottom:4px}
.druck .bk{border:1px solid #000;padding:6px 10px;width:250px;float:right}
.druck table th{background:none;border-bottom:1px solid #000;color:#000}
.druck table td{border-bottom:1px solid #ddd}
</style>
</head>
<body>
<div id="root"></div>
<div class="druck" id="druck"></div>
<dialog id="dlg"><div class="dk"><h3 id="dTitel"></h3><div class="hinweis" id="dSub"></div></div><div class="db" id="dBody"></div><div class="df" id="dFuss"></div></dialog>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ================================================================ Grundgerüst
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const zahl = n => (Number(n)||0).toLocaleString('de-DE',{maximumFractionDigits:3});
const dt = s => s ? new Date(s.slice(0,10)+'T00:00:00') : null;
const fmt = s => s ? dt(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '–';
const heute = () => { const x=new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const tage = (a,b) => Math.round((dt(b)-dt(a))/86400000);
const num = v => { if (typeof v === 'number') return v; const s=String(v||'').trim().replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
let G = null, ICH = null, E = {};

async function api(pfad, opt={}){
  const r = await fetch('api/'+pfad, {method: opt.method || (opt.body ? 'POST':'GET'), headers:{'Content-Type':'application/json','X-ERP':'1'},
                                     body: opt.body ? JSON.stringify(opt.body) : undefined, credentials:'same-origin'});
  const d = await r.json().catch(()=>({fehler:'Ungültige Antwort'}));
  if (r.status === 401){ zeigeLogin(); throw new Error('login'); }
  if (!r.ok){ toast(d.fehler || 'Fehler', true); throw new Error(d.fehler); }
  return d;
}
let tt; function toast(t, fehler){ const e=$('#toast'); e.textContent=t; e.classList.toggle('fehler',!!fehler); e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'), fehler?5000:3500); }

function zeigeLogin(){
  $('#root').innerHTML = `<form class="login" id="lf"><div style="font-size:20px;font-weight:700">V3D ERP</div><div class="hinweis">Prototyp · nur Testdaten</div>
    <input id="lu" placeholder="Benutzer" autocomplete="username" value="demo"><input id="lp" type="password" placeholder="Kennwort" autocomplete="current-password">
    <button class="btn pri">Anmelden</button></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault();
    const r = await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('#lu').value,passwort:$('#lp').value})});
    if (r.ok){ start(); } else { toast((await r.json()).fehler, true); } };
  $('#lp').focus();
}

const MENUE = [
  ['Übersicht', [['#/start','Startseite']]],
  ['Verkauf', [['#/belege/VK','Verkaufsbelege'],['#/op/debitor','Offene Posten Kunden']]],
  ['Einkauf', [['#/belege/EK','Einkaufsbelege'],['#/op/kreditor','Offene Posten Lieferanten']]],
  ['Projekte', [['#/projekte','Projekte & Zeitstrahl']]],
  ['Stammdaten', [['#/adressen/kunde','Kunden'],['#/adressen/lieferant','Lieferanten'],['#/adressen/','Alle Adressen'],['#/artikel','Artikel & Lager']]],
  ['System', [['#/einstellungen','Firmendaten & Briefkopf']]],
];
function rahmen(){
  $('#root').innerHTML = `<div class="app"><nav><div id="navLogo"></div><div class="logo">V3D ERP<small>Prototyp · Testdaten</small></div>
    ${MENUE.map(([g,l])=>`<div class="grp">${g}</div>`+l.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')).join('')}
    <div class="unten">${esc(ICH.name)} · <a href="#" id="abm">Abmelden</a></div></nav><main id="m"></main></div>`;
  $('#abm').onclick = async e => { e.preventDefault(); await fetch('api/logout'); zeigeLogin(); };
}
async function start(){
  try { ICH = await api('ich'); G = await api('grundlagen'); E = await api('einstellungen'); } catch(e){ return; }
  rahmen(); navigiere();
}
window.addEventListener('hashchange', navigiere);
async function navigiere(){
  if (!ICH) return;
  const h = location.hash || '#/start';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', h.startsWith(a.getAttribute('href')) && a.getAttribute('href')!=='#/adressen/' || h===a.getAttribute('href')));
  document.body.classList.remove('kunde');
  const [, teil, a, b] = h.split('/');
  try{
    if (['beleg','neu','projekt','start'].includes(teil)) E = await api('einstellungen');   // Firmendaten immer aktuell
    const nl = $('#navLogo'); if (nl) nl.innerHTML = E.logo ? `<img src="${E.logo}" alt="${esc(E.firma_name)}" style="display:block;max-width:150px;max-height:60px;margin:2px 18px 10px;border-radius:3px">` : '';
    if (teil==='start') return await seiteStart();
    if (teil==='belege') return await seiteBelege(a||'VK', b ? +b : null);
    if (teil==='beleg') return await seiteBeleg(+a);
    if (teil==='neu') return await seiteBelegNeu(a);
    if (teil==='op') return await seiteOP(a||'debitor');
    if (teil==='projekte') return await seiteProjekte();
    if (teil==='projekt') return await seiteProjekt(+a);
    if (teil==='adressen') return await seiteAdressen(a||'', b ? +b : null);
    if (teil==='artikel') return await seiteArtikel(a ? +a : null);
    if (teil==='einstellungen') return await seiteEinstellungen();
    location.hash = '#/start';
  }catch(e){ if (e.message!=='login') console.error(e); }
}
const M = () => $('#m');
const ba = code => G.belegarten.find(x=>x.code===code) || {name:code};

// ================================================================ Briefkopf aus Einstellungen
const absender = e => [e.firma_name, e.strasse, [e.plz,e.ort].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
function kopfHTML(e){
  return `<div class="bk-firma">${e.logo?`<img src="${e.logo}" alt="" class="bk-logo">`:''}${e.logo?'':esc(e.firma_name)}<small>${e.logo?esc(e.firma_name)+' · ':''}${esc(e.firma_zusatz||'')}</small></div>`;
}
function fussHTML(e){
  const sp = (...z) => `<div>${z.filter(Boolean).map(esc).join('<br>')}</div>`;
  return `<div class="bk-fuss">${sp(e.firma_name, e.strasse, [e.plz,e.ort].filter(Boolean).join(' '))}${sp(e.telefon&&'Tel. '+e.telefon, e.email, e.web)}${sp(e.bank_name, e.iban&&'IBAN '+e.iban, e.bic&&'BIC '+e.bic)}${sp(e.geschaeftsfuehrer&&'Geschäftsführer: '+e.geschaeftsfuehrer, e.handelsregister, e.ust_id&&'USt-IdNr. '+e.ust_id, e.steuernr&&'St.-Nr. '+e.steuernr)}</div>`;
}

// ================================================================ Startseite
async function seiteStart(){
  const u = await api('uebersicht');
  M().innerHTML = `<div class="kopfzeile"><h1>Startseite</h1></div>
  <div class="kpis">
    <div class="kpi"><div class="z">${eur(u.umsatz_monat)} €</div><div class="t">Umsatz netto diesen Monat</div></div>
    <div class="kpi"><div class="z">${eur(u.umsatz_jahr)} €</div><div class="t">Umsatz netto dieses Jahr</div></div>
    <div class="kpi"><div class="z">${eur(u.op_debitor)} €</div><div class="t">Offen Kunden · <b style="color:${u.op_debitor_ueber>0?'var(--red)':'inherit'}">${eur(u.op_debitor_ueber)} € überfällig</b></div></div>
    <div class="kpi"><div class="z">${eur(u.op_kreditor)} €</div><div class="t">Offen Lieferanten · ${eur(u.op_kreditor_ueber)} € fällig</div></div>
    <div class="kpi"><div class="z">${u.entwuerfe}</div><div class="t">Belege im Entwurf</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px;margin-top:14px">
    <div class="card"><b>Termine, die Aufmerksamkeit brauchen</b>
      <table style="margin-top:6px"><tbody>${u.kritisch.map(k=>`<tr class="klick" onclick="location.hash='#/projekt/${k.projekt_id}'"><td>${esc(k.projektnr)}</td><td>${esc(k.titel)}</td><td><span class="pill s-${k.status}">${esc(k.status_text)}</span></td></tr>`).join('') || '<tr><td class="hinweis">Alles im Plan.</td></tr>'}</tbody></table></div>
    <div class="card"><b>Projekte</b>

async function seiteBelege(bereich, sel){
  const arten = G.belegarten.filter(x=>x.bereich===bereich);
  M().innerHTML = `<div class="kopfzeile"><h1>${bereich==='VK'?'Verkaufsbelege':'Einkaufsbelege'}</h1><span class="sp"></span>
    <div class="menue" id="neuM"><button class="btn pri">Neu ▾</button><div class="ddl">${arten.map(a=>`<button data-a="${a.code}">${esc(a.name)}</button>`).join('')}</div></div></div>
    <div class="card"><div class="filter"><input id="fs" placeholder="Suchen: Nummer, Name, Betreff, Projekt"><select id="fa"><option value="">Alle Belegarten</option>${arten.map(a=>`<option value="${a.code}">${esc(a.name)}</option>`).join('')}</select>
    <select id="fst"><option value="">Alle Status</option><option value="entwurf">Entwurf</option><option value="verarbeitet">Verarbeitet</option></select></div>
    <div class="liste"><table><thead><tr><th>Belegart</th><th>Nummer</th><th>Datum</th><th>${bereich==='VK'?'Kunde':'Lieferant'}</th><th>Betreff</th><th>Projekt</th><th class="r">Netto</th><th>Status</th></tr></thead><tbody id="bl"></tbody></table></div></div>`;
  menueAuf('#neuM', code => location.hash = '#/neu/'+code);

    const l = await api(`belege?bereich=${bereich}&suche=${encodeURIComponent($('#fs').value)}&belegart=${$('#fa').value}&status=${$('#fst').value}`);
    $('#bl').innerHTML = l.map(b=>`<tr class="klick" onclick="location.hash='#/beleg/${b.id}'"><td>${esc(ba(b.belegart).name)}</td><td>${esc(b.nummer||'(Entwurf)')}</td><td>${fmt(b.datum)}</td><td>${esc(b.adresse_kurz)}</td><td>${esc(b.betreff||'')}</td><td>${esc(b.projektnr||'')}</td><td class="r">${eur(b.netto)}</td><td><span class="pill st-${b.status}">${b.status}</span></td></tr>`).join('') || '<tr><td colspan="8" class="hinweis">Keine Belege.</td></tr>';
  };
  let t; $('#fs').oninput = () => { clearTimeout(t); t=setTimeout(laden, 250); }; $('#fa').onchange = laden; $('#fst').onchange = laden;
  await laden();

function menueAuf(sel, fn){
  const m = $(sel); m.querySelector('.btn').onclick = e => { e.stopPropagation(); m.classList.toggle('auf'); };
  m.querySelectorAll('.ddl button').forEach(b => b.onclick = () => { m.classList.remove('auf'); fn(b.dataset.a); });
  document.addEventListener('click', () => m.classList.remove('auf'), {once:true});
}

async function belegMaske(b){
  const vk = b.bereich==='VK';
  const [adr, art, proj] = await Promise.all([api('adressen?rolle='+(vk?'kunde':'lieferant')), api('artikel'), api('projekte')]);
  const gesperrt = b.status!=='entwurf';

  if (!b.positionen.length && !gesperrt) b.positionen.push({});

  let adresseId = b.adresse_id || null;
  const aktAdr = () => adr.find(x=>x.id===adresseId);
  const anschrift = a => a ? [a.name1, a.name2, a.strasse, [a.plz,a.ort].filter(Boolean).join(' '), a.land&&a.land!=='DE'?a.land:''].filter(Boolean).map(esc).join('<br>')
                           : `<span class="hinweis">${vk?'Kundennummer':'Lieferantennummer'} rechts eingeben oder mit … suchen</span>`;
  const sysStatus = b.status==='verarbeitet' ? 'verarbeitet' : (b.id ? 'gespeichert' : 'neu');
  M().innerHTML = `<div class="kopfzeile noprint" style="margin-bottom:8px">
    <a href="#/belege/${b.bereich}">← ${vk?'Verkaufsbelege':'Einkaufsbelege'}</a><span class="sp"></span>
    <div class="menue" id="nM"><button class="btn">Neu ▾</button><div class="ddl">${G.belegarten.filter(x=>x.bereich===b.bereich).map(x=>`<button data-a="${x.code}">${esc(x.name)}</button>`).join('')}</div></div>
    <input id="dSu" placeholder="Direktsuche Belegnr." style="width:170px">
    ${!gesperrt?`<button class="btn" id="bSp">Speichern</button><button class="btn ok" id="bVa">Verarbeiten</button>`:''}
    ${gesperrt && b.folgearten.length?`<div class="menue" id="wM"><button class="btn pri">Weiterverarbeiten ▾</button><div class="ddl">${b.folgearten.map(f=>`<button data-a="${f.code}">→ ${esc(f.name)}</button>`).join('')}</div></div>`:''}
    ${b.id?`<button class="btn" id="bDr">Drucken</button>`:''}
    ${b.id && !gesperrt?`<button class="btn rot" id="bLo">Löschen</button>`:''}</div>
  ${b.kette.length>1?`<div class="kette noprint" style="margin-bottom:10px"><b style="margin-right:6px">Vorgang:</b>${b.kette.map((k,i)=>`${i?'<span class="pfeil">→</span>':''}<a href="#/beleg/${k.id}" class="${k.id===b.id?'akt':''}">${esc(k.belegart_name)} ${esc(k.nummer||'Entwurf')}</a>`).join('')}</div>`:''}
  <div class="tisch"><div class="blatt ${gesperrt?'gesperrt':''}">
    ${kopfHTML(E)}
    <div class="bk-oben">
      <div class="bk-links"><div class="bk-abs">${esc(absender(E))}</div><div class="bk-anschrift" id="anschrift">${anschrift(aktAdr())}</div></div>
      <div class="bk-kasten">
        <div class="bk-titel">${esc(b.belegart_name)}</div>
        <div class="bk-z"><span>Belegnummer</span><b>${b.nummer?esc(b.nummer):'<i class="hinweis">beim Verarbeiten</i>'}</b></div>
        <div class="bk-z"><span>${vk?'Kundennummer':'Lieferantennr.'}</span><span class="bk-such"><input id="kKnr" list="adrL" value="${esc(aktAdr()?nrVon(aktAdr()):'')}" ${dis}>${gesperrt?'':'<button class="btn" id="kSu" title="Suchen">…</button>'}</span></div>
        <div class="bk-z"><span>Datum</span><input type="date" id="kDat" value="${b.datum}" ${dis}></div>
        <div class="bk-z"><span>Betreff</span>${gesperrt?`<span class="bk-wert">${esc(b.betreff||'')}</span><input id="kBet" type="hidden" value="${esc(b.betreff||'')}">`:`<input id="kBet" value="${esc(b.betreff||'')}">`}</div>
        <div class="bk-z"><span>Projekt</span>${gesperrt&&b.projektnr?`<span class="bk-wert"><a href="#/projekt/${b.projekt_id}">${esc(b.projektnr)}</a> ${esc(b.projekt_titel||'')}</span>`:''}<select id="kPro" ${dis} ${gesperrt&&b.projektnr?'style="display:none"':''}><option value="">–</option>${proj.map(p=>`<option value="${p.id}" ${p.id===b.projekt_id?'selected':''}>${esc(p.projektnr)} · ${esc(p.titel)}</option>`).join('')}</select></div>
        <div class="bk-z"><span>${vk?'Ihre Bestellung':'Unsere Referenz'}</span><input id="kRef" value="${esc(b.ihre_referenz||'')}" ${dis}></div>
        <div class="bk-z"><span>Bearbeiter</span><span>${esc(b.angelegt_von||ICH.login)}</span></div>
      </div>
    </div>
    <textarea id="kKt" class="bk-text" rows="2" ${gesperrt?'':'placeholder="Kopftext (z. B. „Vielen Dank für Ihre Anfrage …“)"'} ${dis}>${esc(b.kopftext||'')}</textarea>
    <table class="pos bk-pos"><thead><tr><th style="width:34px">Pos</th><th style="width:150px">Artikel</th><th>Bezeichnung</th><th class="r" style="width:80px">Menge</th><th style="width:52px">ME</th><th class="r" style="width:100px">Einzelpreis</th><th class="r" style="width:66px">Rabatt %</th><th class="r" style="width:100px">Gesamtpreis</th><th class="noprint" style="width:26px"></th></tr></thead><tbody id="pt"></tbody></table>
    ${!gesperrt?'<button class="btn noprint" id="pNeu" style="margin-top:6px">+ Position</button>':''}
    <div class="summe"><span>Zwischensumme netto</span><span class="r" id="sN"></span><span>zzgl. MwSt.</span><span class="r" id="sS"></span><b>Endsumme</b><b class="r" id="sB"></b></div>
    <div class="bk-z bk-zb"><span>Zahlungsbedingung</span><select id="kZb" ${dis}><option value="">–</option>${G.zahlungsbedingungen.map(z=>`<option value="${z.id}" ${z.id===b.zahlungsbed_id?'selected':''}>${esc(z.text)}</option>`).join('')}</select></div>
    <textarea id="kFt" class="bk-text" rows="2" ${gesperrt?'':'placeholder="Fußtext (z. B. „Für Rückfragen stehen wir Ihnen gern zur Verfügung.“)"'} ${dis}>${esc(b.fusstext||'')}</textarea>
    ${fussHTML(E)}
  </div></div>
  <div class="statusleiste noprint"><span>Status: <b>${sysStatus}</b>${b.verarbeitet?` · ${fmt(b.verarbeitet)} von ${esc(b.verarbeitet_von||'')} – Änderung nur per Folgebeleg`:''}</span><span class="sp"></span><span id="bInfo">Bestand / Verfügbar: Artikel wählen</span></div>
  <datalist id="artL">${art.map(a=>`<option value="${esc(a.artikelnr)}">${esc(a.kurz)} – ${esc(a.bezeichnung)}</option>`).join('')}</datalist>
  <datalist id="adrL">${adr.map(a=>`<option value="${esc(nrVon(a))}">${esc(a.kurz)} · ${esc(a.ort||'')}</option>`).join('')}</datalist>`;

  const artNr = Object.fromEntries(art.map(a=>[a.artikelnr,a]));
  const artId = Object.fromEntries(art.map(a=>[a.id,a]));
  const zeichne = () => {
    $('#pt').innerHTML = b.positionen.map((p,i)=>{ const a=artId[p.artikel_id];
      return `<tr data-i="${i}"><td>${i+1}</td>
      <td><input list="artL" class="pA" value="${esc(a?a.artikelnr:'')}" ${dis} placeholder="Artikel"></td>
      <td>${gesperrt?`<span class="bk-wert">${esc(p.text||'')}</span>`:`<input class="pT" value="${esc(p.text||'')}" placeholder="Bezeichnung / freier Text">`}</td>
      <td><input class="pM zahl" value="${zahl(p.menge??1)}" ${dis}></td>
      <td><input class="pE" value="${esc(p.me||'Stk')}" ${dis}></td>
      <td><input class="pP zahl" value="${eur(p.einzelpreis??0)}" ${dis}></td>
      <td><input class="pR zahl" value="${zahl(p.rabatt_pct||0)}" ${dis}></td>
      <td class="r pG"></td><td class="noprint">${!gesperrt?`<button class="btn rot pX" title="Position löschen" style="padding:1px 6px">×</button>`:''}</td></tr>`; }).join('');
    rechne();
  };
  const rechne = () => {
    let n=0,s=0;
    document.querySelectorAll('#pt tr').forEach(tr=>{ const p=b.positionen[+tr.dataset.i];
      const g=Math.round(num(p.menge??1)*num(p.einzelpreis??0)*(1-num(p.rabatt_pct||0)/100)*100)/100;
      tr.querySelector('.pG').textContent=eur(g); n+=g; s+=g*(p.steuer_pct??19)/100; });
    $('#sN').textContent=eur(n)+' €'; $('#sS').textContent=eur(s)+' €'; $('#sB').textContent=eur(n+s)+' €';
  };
  const info = async aid => { if(!aid) return; const a = await api('artikel/'+aid);
    $('#bInfo').innerHTML = `<b>${esc(a.artikelnr)}</b> ${esc(a.kurz)} · Bestand <b>${zahl(a.bestand)} ${esc(a.me)}</b> · in Aufträgen ${zahl(a.reserviert)} · <b style="color:${a.verfuegbar<0?'var(--red)':'var(--green)'}">Verfügbar ${zahl(a.verfuegbar)}</b>`; };
  zeichne();
  // Kunde/Lieferant über Nummer (wie in myfactory) – Anschrift füllt sich
  const setzeAdresse = () => {
    const v = $('#kKnr').value.trim().toLowerCase();
    const a = adr.find(x => (nrVon(x)||'').toLowerCase()===v) || adr.find(x => x.kurz.toLowerCase()===v) ||
              (v.length>=2 ? adr.filter(x => (x.kurz+' '+x.name1).toLowerCase().includes(v)).sort((x,y)=>x.kurz.length-y.kurz.length)[0] : null);
    adresseId = a ? a.id : null;
    $('#anschrift').innerHTML = anschrift(a);
    if (a){ $('#kKnr').value = nrVon(a); const zb = vk?a.k_zb:a.l_zb; if (zb && !$('#kZb').value) $('#kZb').value = zb; }
    else if (v) toast('Nicht gefunden – Nummer oder Kurzbezeichnung eingeben.', true);
  };
  if (!gesperrt){
    $('#kKnr').onchange = setzeAdresse;
    $('#kSu').onclick = () => dialog(vk?'Kunde suchen':'Lieferant suchen','',`<input id="suI" placeholder="Name, Nummer, Ort"><div class="liste" style="max-height:300px;margin-top:8px"><table><tbody id="suL"></tbody></table></div>`,[['Schließen','']]) || (() => {
      const male = () => { const q=$('#suI').value.toLowerCase(); $('#suL').innerHTML = adr.filter(a=>(nrVon(a)+' '+a.kurz+' '+a.name1+' '+(a.ort||'')).toLowerCase().includes(q)).slice(0,60)
        .map(a=>`<tr class="klick" data-n="${esc(nrVon(a))}"><td>${esc(nrVon(a))}</td><td>${esc(a.kurz)}</td><td>${esc(a.name1)}</td><td>${esc(a.ort||'')}</td></tr>`).join('');
        $('#suL').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>{ $('#kKnr').value=tr.dataset.n; $('#dlg').close(); setzeAdresse(); }); };
      $('#suI').oninput = male; male(); $('#suI').focus(); })();
  }
  $('#pt').addEventListener('input', e => { const tr=e.target.closest('tr'); const p=b.positionen[+tr.dataset.i]; const c=e.target.classList;
    if (c.contains('pT')) p.text=e.target.value; if (c.contains('pM')) p.menge=num(e.target.value); if (c.contains('pE')) p.me=e.target.value;
    if (c.contains('pP')) p.einzelpreis=num(e.target.value); if (c.contains('pR')) p.rabatt_pct=num(e.target.value); rechne(); });
  $('#pt').addEventListener('change', e => { if(!e.target.classList.contains('pA')) return; const tr=e.target.closest('tr'); const i=+tr.dataset.i; const p=b.positionen[i];
    const a=artNr[e.target.value.trim()]; if(!a){ p.artikel_id=null; return; }
    const kd = aktAdr();
    Object.assign(p,{artikel_id:a.id,text:a.bezeichnung,me:a.me,einzelpreis:vk?a.vk_preis:a.ek_preis,steuer_pct:a.steuer_pct,rabatt_pct:vk&&kd?kd.k_rabatt||0:0});
    if (i===b.positionen.length-1 && !gesperrt) b.positionen.push({});      // wie im Brief: nächste Zeile steht bereit
    setTimeout(()=>{ zeichne(); info(a.id); const n=document.querySelector(`#pt tr[data-i="${i}"] .pM`); if(n){ n.focus(); n.select(); } }, 0); });
  $('#pt').addEventListener('focusin', e => { const tr=e.target.closest('tr'); if(tr){ const p=b.positionen[+tr.dataset.i]; if(p&&p.artikel_id) info(p.artikel_id);} });
  $('#pt').addEventListener('click', e => { if(e.target.classList.contains('pX')){ b.positionen.splice(+e.target.closest('tr').dataset.i,1); if(!b.positionen.length) b.positionen.push({}); zeichne(); } });
  if ($('#pNeu')) $('#pNeu').onclick = () => { b.positionen.push({}); zeichne(); };
  const sammeln = () => ({id:b.id, belegart:b.belegart, adresse_id:adresseId, datum:$('#kDat').value, projekt_id:+$('#kPro').value||null,
    betreff:$('#kBet').value, ihre_referenz:$('#kRef').value, zahlungsbed_id:+$('#kZb').value||null, kopftext:$('#kKt').value, fusstext:$('#kFt').value,
    positionen:b.positionen.filter(p=>p.text||p.artikel_id).map(p=>({artikel_id:p.artikel_id||null,text:p.text,menge:num(p.menge??1),me:p.me||'Stk',einzelpreis:num(p.einzelpreis??0),rabatt_pct:num(p.rabatt_pct||0),steuer_pct:p.steuer_pct??19,vorgaenger_pos_id:p.vorgaenger_pos_id||null}))});
  const speichern = async () => { const n = await api('belege',{body:sammeln()}); b.id=n.id; return n; };
  menueAuf('#nM', code => location.hash='#/neu/'+code);
  $('#dSu').onkeydown = async e => { if (e.key!=='Enter') return; const q=$('#dSu').value.trim(); if(!q) return;
    const l = await api(`belege?bereich=${b.bereich}&suche=${encodeURIComponent(q)}`); const t = l.find(x=>(x.nummer||'').toLowerCase()===q.toLowerCase()) || l[0];
    if (t) location.hash='#/beleg/'+t.id; else toast('Kein Beleg gefunden.', true); };
  if ($('#bSp')) $('#bSp').onclick = async () => { const n=await speichern(); toast('Gespeichert.'); if (location.hash==='#/beleg/'+n.id) seiteBeleg(n.id); else location.hash='#/beleg/'+n.id; };
  if ($('#bVa')) $('#bVa').onclick = async () => {
    if (!confirm('Beleg verarbeiten? Danach ist er gesperrt und bekommt seine endgültige Nummer.')) return;
    const n = await speichern(); const r = await api(`belege/${n.id}/verarbeiten`,{body:{}});
    toast(`${r.beleg.nummer} verarbeitet${r.meldungen.length?' · '+r.meldungen.join(' · '):''}`);
    if (location.hash==='#/beleg/'+n.id) seiteBeleg(n.id); else location.hash='#/beleg/'+n.id; };
  if ($('#wM')) menueAuf('#wM', async ziel => { const n = await api(`belege/${b.id}/weiter`,{body:{ziel}}); toast(`${n.belegart_name} als Entwurf angelegt.`); location.hash='#/beleg/'+n.id; });
  if ($('#bLo')) $('#bLo').onclick = async () => { if(!confirm('Entwurf löschen?')) return; await api('belege/'+b.id,{method:'DELETE'}); location.hash='#/belege/'+b.bereich; };
  if ($('#bDr')) $('#bDr').onclick = () => belegDrucken(b.id);
  if (!gesperrt && !adresseId) $('#kKnr').focus();
}

// ================================================================ Offene Posten
async function seiteOP(art){

      <div><label><input type="checkbox" id="rL" style="width:auto" ${a.lieferant?'checked':''}> <b>ist Lieferant</b></label><div class="raster" style="margin-top:8px">
        <div class="feld"><label>Lieferantennr.</label><input id="l_nr" value="${esc(a.lieferant?.lieferantennr||'')}" placeholder="automatisch"></div>
        <div class="feld"><label>Zahlungsbedingung</label><select id="l_zb">${zb(a.lieferant?.zahlungsbed_id)}</select></div>
        <div class="feld"><label>Unsere Kundennr. dort</label><input id="l_uk" value="${esc(a.lieferant?.unsere_kundennr||'')}"></div>

      <p class="hinweis">Eine Adresse kann gleichzeitig Kunde und Lieferant sein – Kontaktdaten werden nur einmal gepflegt.</p>`;
    if (reiter==='belege') R.innerHTML = `<table><tbody>${a.belege.map(b=>`<tr class="klick" onclick="location.hash='#/beleg/${b.id}'"><td>${esc(ba(b.belegart).name)}</td><td>${esc(b.nummer||'Entwurf')}</td><td>${fmt(b.datum)}</td><td>${esc(b.betreff||'')}</td><td class="r">${eur(b.brutto)} €</td></tr>`).join('')||'<tr><td class="hinweis">Keine Belege.</td></tr>'}</tbody></table>`;
    if (reiter==='op') R.innerHTML = `<table><tbody>${a.op.map(o=>`<tr><td>${esc(o.art)}</td><td>fällig ${fmt(o.faellig)}</td><td class="r">${eur(o.offen)} €</td></tr>`).join('')||'<tr><td class="hinweis">Nichts offen.</td></tr>'}</tbody></table>`;
    if (reiter==='projekte') R.innerHTML = `<table><tbody>${a.projekte.map(p=>`<tr class="klick" onclick="location.hash='#/projekt/${p.id}'"><td>${esc(p.projektnr)}</td><td>${esc(p.titel)}</td><td>${esc(p.status)}</td></tr>`).join('')||'<tr><td class="hinweis">Keine Projekte.</td></tr>'}</tbody></table>`;
    $('#ad').querySelectorAll('.reiter button').forEach(b => b.onclick = () => { merken(); reiter=b.dataset.r; male(); });
    $('#aSp').onclick = async () => { merken(); const n = await api('adressen',{body:a}); toast('Gespeichert.'); Object.assign(a,n); id=n.id; await neuLaden(); male(); };
  };

    ['kurz','name1','name2','strasse','plz','ort','land','telefon','email','ust_id','notiz'].forEach(k=>{ const e=$('#a_'+k); if(e) a[k]=e.value; });

  };
  male();
}

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px" class="intern">
    <div class="card"><b>Belege im Projekt</b><table style="margin-top:6px"><tbody>${p.belege.map(b=>`<tr class="klick" onclick="location.hash='#/beleg/${b.id}'"><td>${esc(b.belegart_name)}</td><td>${esc(b.nummer||'Entwurf')}</td><td>${fmt(b.datum)}</td><td><span class="pill st-${b.status}">${b.status}</span></td><td class="r">${eur(b.brutto)} €</td></tr>`).join('')||'<tr><td class="hinweis">Noch keine Belege.</td></tr>'}</tbody></table></div>
    <div class="card"><b>Verlauf</b><div style="max-height:260px;overflow:auto;margin-top:6px;font-size:12.5px">${p.verlauf.map(v=>`<div style="padding:3px 0;border-bottom:1px solid var(--line)"><span class="hinweis">${fmt(v.zeit)} ${esc(v.benutzer||'')}</span> – ${esc(v.text)}</div>`).join('')}</div></div></div>`;
  zeichneGantt(p.meilensteine);
  $('#vI').onclick = () => { ANSICHT='intern'; seiteProjekt(id); };
  $('#vK').onclick = () => { ANSICHT='kunde'; seiteProjekt(id); };
  $('#pDr').onclick = () => { const vor=ANSICHT; ANSICHT='kunde'; document.body.classList.add('kunde'); setTimeout(()=>{ window.print(); ANSICHT=vor; seiteProjekt(id); },50); };
  $('#pFx').onclick = async () => { if(!confirm('Aktuelle Plantermine als Zusage an den Kunden festschreiben? Spätere Verschiebungen werden dagegen gemessen.')) return; await api(`projekte/${id}/fixieren`,{body:{}}); toast('Zusage eingefroren.'); seiteProjekt(id); };
  $('#pMs').onclick = () => dialog('Schritt hinzufügen','',`<div class="zeile"><label>Titel</label><input id="ms_t"></div><div class="zeile"><label>Verantwortlich</label><input id="ms_w"></div>
    <div class="zeile"><label>Start</label><input type="date" id="ms_s" value="${heute()}"></div><div class="zeile"><label>Ende</label><input type="date" id="ms_e" value="${heute()}"></div>
    <div class="zeile"><label>Automatisch erledigt durch</label><select id="ms_a"><option value="">– manuell –</option>${G.belegarten.map(b=>`<option value="${b.code}">${esc(b.name)}</option>`).join('')}</select></div>
    <label><input type="checkbox" id="ms_m" style="width:auto"> Meilenstein (Zeitpunkt statt Zeitraum)</label>`,
    [['Abbrechen',''],['Hinzufügen','pri', async () => { await api(`projekte/${id}/meilenstein`,{body:{titel:$('#ms_t').value,verantwortlich:$('#ms_w').value,plan_start:$('#ms_s').value,plan_ende:$('#ms_e').value,ausloeser:$('#ms_a').value,ist_meilenstein:$('#ms_m').checked}}); seiteProjekt(id); }]]);
  const oeffne = i => { if (ANSICHT==='kunde') return; schrittDialog(p, p.meilensteine[i], id); };
  M().querySelectorAll('tr.klick[data-i], .gl .r[data-i], .bar[data-i], .ms[data-i]').forEach(e => e.onclick = () => oeffne(+e.dataset.i));
}

function schrittDialog(p, m, pid){
  const body = `<div class="zeile"><label>Zugesagt</label><div>${fmt(m.zugesagt)}</div></div><div class="zeile"><label>Plan aktuell</label><div>${fmt(m.plan_start)} – <b>${fmt(m.plan_ende)}</b></div></div>
    <div class="zeile"><label>Erledigt</label><div>${fmt(m.ist_ende)}</div></div>
    ${m.ausloeser?`<div class="info">Erledigt sich automatisch, sobald im Projekt ein Beleg <b>${esc(m.ausloeser_name)}</b> verarbeitet wird.${m.ausloeser_nummer?` Erledigt durch ${esc(m.ausloeser_nummer)}.`:''}</div>`:''}<div id="sf"></div>`;
  const knoepfe = m.ist_ende ? [['Schließen',''],['Erledigt zurücknehmen','', async()=>{ await api(`meilensteine/${m.id}/erledigt`,{body:{zuruecknehmen:true}}); seiteProjekt(pid); }]]
    : [['Schließen',''],['Termin verschieben…','', () => { formVerschieben(); return false; }],['Als erledigt melden','pri', () => { formErledigt(); return false; }]];
  dialog(`${m.pos}. ${m.titel}`, `<span class="pill s-${m.status}">${esc(m.status_text)}</span> · ${esc(m.verantwortlich||'')}`, body, knoepfe);
  function formErledigt(){
    $('#sf').innerHTML = `<div class="zeile"><label>Erledigt am</label><input type="date" id="sfd" value="${heute()}"></div>`;
    fuss([['Abbrechen',''],['Speichern','pri', async()=>{ await api(`meilensteine/${m.id}/erledigt`,{body:{datum:$('#sfd').value}}); toast(`„${m.titel}“ erledigt.`); seiteProjekt(pid); }]]);
  }
  function formVerschieben(){
    $('#sf').innerHTML = `<div style="display:grid;gap:8px"><div class="zeile"><label>Neuer Endtermin</label><input type="date" id="sfn" value="${m.plan_ende}"></div>
      <div class="zeile"><label>Grund (Pflicht)</label><select id="sfg"><option value="">– bitte wählen –</option>${G.gruende.map(g=>`<option>${g}</option>`).join('')}</select></div>
      <div class="zeile"><label>Bemerkung</label><input id="sfb"></div><label><input type="checkbox" id="sff" checked style="width:auto"> Folgeschritte mitschieben</label>
      <div class="hinweis">Der zugesagte Termin bleibt sichtbar – der Kunde sieht, dass und warum verschoben wurde.</div></div>`;
    fuss([['Abbrechen',''],['Verschieben','pri', async()=>{ await api(`meilensteine/${m.id}/verschieben`,{body:{neu_ende:$('#sfn').value,grund:$('#sfg').value,bemerkung:$('#sfb').value,folge:$('#sff').checked}}); toast('Verschoben.'); seiteProjekt(pid); }]]);
  }
}

function zeichneGantt(ms){
  if (!ms.length){ $('#gl').innerHTML='<div class="h">Noch keine Schritte</div>'; return; }
  const alle = ms.flatMap(s=>[s.plan_start,s.plan_ende,s.zugesagt,s.ist_ende].filter(Boolean)).concat([heute()]);
  const min = alle.reduce((a,b)=>a<b?a:b), max = alle.reduce((a,b)=>a>b?a:b);
  const von = dt(min); von.setDate(von.getDate()-((von.getDay()+6)%7)-7);
  const bis = dt(max); bis.setDate(bis.getDate()+10);
  const n = Math.round((bis-von)/86400000);
  const W = Math.max(8, Math.min(28, Math.floor(($('#gr').clientWidth||900)/n)));
  const x = s => Math.round((dt(s)-von)/86400000)*W;
  const kw = t => { const u=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())); const d=u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-d); const y=new Date(Date.UTC(u.getUTCFullYear(),0,1)); return Math.ceil(((u-y)/86400000+1)/7); };
  let kopf='', gitter='', lm=-1;
  for (let i=0;i<n;i++){ const t=new Date(von); t.setDate(t.getDate()+i);
    if (t.getDay()===1){ if (W*7>=34) kopf+=`<div class="wk" style="left:${i*W}px">KW ${kw(t)}</div>`; gitter+=`<div class="grid" style="left:${i*W}px"></div>`; }
    if (t.getMonth()!==lm){ lm=t.getMonth(); kopf+=`<div class="mo" style="left:${i*W}px">${t.toLocaleDateString('de-DE',{month:'short',year:'2-digit'})}</div>`; } }
  const hx = x(heute());
  $('#gi').style.width = n*W+'px';
  $('#gi').innerHTML = `<div class="h">${kopf}</div>` + ms.map((s,i)=>{ let el='';
    const ende = s.ist_ende || s.plan_ende;
    if (tage(s.zugesagt, ende) > 0) el += `<div class="shift" style="left:${x(s.zugesagt)+W}px;width:${x(ende)-x(s.zugesagt)}px"></div>`;
    el += `<div class="base" style="left:${x(s.zugesagt)+W-1}px" title="Zugesagt ${fmt(s.zugesagt)}"></div>`;
    el += s.ist_meilenstein ? `<div class="ms s-${s.status}" data-i="${i}" style="left:${x(s.plan_ende)+W/2}px" title="${esc(s.titel)}"></div>`
                            : `<div class="bar s-${s.status}" data-i="${i}" style="left:${x(s.plan_start)}px;width:${Math.max(W,x(s.plan_ende)-x(s.plan_start)+W)}px" title="${esc(s.titel)}: ${fmt(s.plan_start)} – ${fmt(s.plan_ende)}"></div>`;
    if (s.ist_ende) el += `<div class="ist ${s.status==='ok'?'':'late'}" style="left:${x(s.ist_ende)+W/2}px" title="Erledigt ${fmt(s.ist_ende)}">✓</div>`;
    return `<div class="r">${gitter}${el}</div>`; }).join('') + `<div class="heute" style="left:${hx+W/2}px"><span>Heute</span></div>`;
  $('#gl').innerHTML = `<div class="h">Schritt</div>` + ms.map((s,i)=>`<div class="r" data-i="${i}"><span class="hinweis" style="width:16px;text-align:right">${s.pos}</span><span class="pill s-${s.status}" style="width:10px;height:10px;padding:0"></span><span class="x">${esc(s.titel)}</span></div>`).join('');
  const gr=$('#gr'); gr.scrollLeft = Math.max(0, hx - gr.clientWidth*0.5);
}

// ================================================================ Einstellungen
async function seiteEinstellungen(){
  const e = await api('einstellungen');
  const f = (k,l,ph='') => `<div class="feld"><label>${l}</label><input data-k="${k}" value="${esc(e[k]||'')}" placeholder="${esc(ph)}"></div>`;
  const t = (k,l) => `<div class="feld"><label>${l}</label><textarea data-k="${k}" rows="2">${esc(e[k]||'')}</textarea></div>`;
  M().innerHTML = `<div class="kopfzeile"><h1>Firmendaten & Briefkopf</h1><span class="sp"></span><button class="btn pri" id="eSp">Speichern</button></div>
  <div id="eForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:14px;align-items:start">
  <div>
    <div class="card"><b>Firma</b><div class="raster" style="margin-top:8px">${f('firma_name','Firmenname')}${f('firma_zusatz','Zusatz / Slogan')}${f('strasse','Straße')}${f('plz','PLZ')}${f('ort','Ort')}${f('telefon','Telefon')}${f('email','E-Mail')}${f('web','Internet')}</div></div>
    <div class="card"><b>Logo</b><div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <div id="eLogoV" style="min-width:160px;min-height:60px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:6px"></div>
      <label class="btn">Bild wählen…<input type="file" id="eLogo" accept="image/png,image/jpeg,image/svg+xml" style="display:none"></label>
      <button class="btn rot" id="eLogoX">Entfernen</button></div>
      <p class="hinweis">PNG/JPG werden automatisch auf max. 600 px Breite verkleinert. Ohne Logo erscheint der Firmenname als Schriftzug.</p></div>
    <div class="card"><b>Pflichtangaben & Bank (Fußzeile)</b><div class="raster" style="margin-top:8px">${f('geschaeftsfuehrer','Geschäftsführer')}${f('handelsregister','Handelsregister','Amtsgericht … HRB …')}${f('ust_id','USt-IdNr.')}${f('steuernr','Steuernummer')}${f('bank_name','Bank')}${f('iban','IBAN')}${f('bic','BIC')}</div></div>
    <div class="card"><b>Standardtexte für neue Belege</b><div style="display:grid;gap:8px;margin-top:8px">${t('kopftext_vk','Kopftext Verkauf')}${t('fusstext_vk','Fußtext Verkauf')}${t('kopftext_ek','Kopftext Einkauf')}${t('fusstext_ek','Fußtext Einkauf')}</div></div>
  </div>
  <div class="card" style="position:sticky;top:12px"><b>Vorschau</b><div class="tisch" style="margin-top:8px;padding:12px"><div class="blatt" id="eVor" style="min-width:0;padding:24px 28px;font-size:12px"></div></div></div>
  </div>`;
  const vorschau = () => {
    document.querySelectorAll('[data-k]').forEach(i => e[i.dataset.k] = i.value);
    $('#eLogoV').innerHTML = e.logo ? `<img src="${e.logo}" style="max-height:56px;max-width:220px">` : '<span class="hinweis">kein Logo</span>';
    $('#eVor').innerHTML = `${kopfHTML(e)}<div class="bk-oben" style="margin:18px 0 10px"><div class="bk-links"><div class="bk-abs">${esc(absender(e))}</div><div class="bk-anschrift">Beispielkunde GmbH<br>Musterweg 5<br>12345 Musterstadt</div></div>
      <div class="bk-kasten" style="width:200px"><div class="bk-titel" style="font-size:14px">Angebot</div><div class="bk-z"><span>Belegnummer</span><span>AN-26-0001</span></div><div class="bk-z"><span>Datum</span><span>${fmt(heute())}</span></div></div></div>
      <p>${esc(e.kopftext_vk)}</p><div style="border-top:1px solid #444;border-bottom:1px solid #ddd;padding:4px 0;color:var(--mute)">Pos · Artikel · Bezeichnung · Menge · Preis</div><p>${esc(e.fusstext_vk)}</p>${fussHTML(e)}`;
  };
  $('#eForm').addEventListener('input', vorschau); vorschau();
  $('#eLogo').onchange = async ev => { const datei = ev.target.files[0]; if (!datei) return;
    const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(datei); });
    if (datei.type === 'image/svg+xml'){ e.logo = url; }
    else { const img = new Image(); await new Promise(r => { img.onload = r; img.src = url; });
      const s = Math.min(1, 600/img.width); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); e.logo = c.toDataURL('image/png'); }
    if (e.logo.length > 700000){ toast('Logo zu groß – bitte kleineres Bild wählen.', true); e.logo=''; }
    vorschau(); };
  $('#eLogoX').onclick = () => { e.logo = ''; vorschau(); };
  $('#eSp').onclick = async () => { vorschau(); E = await api('einstellungen', {body:e}); $('#navLogo').innerHTML = E.logo ? `<img src="${E.logo}" alt="" style="display:block;max-width:150px;max-height:60px;margin:2px 18px 10px;border-radius:3px">` : ''; toast('Firmendaten gespeichert – gelten ab sofort für Briefansicht und Ausdruck.'); };
}

// ================================================================ Dialog
function dialog(titel, sub, body, knoepfe){
  $('#dTitel').textContent = titel; $('#dSub').innerHTML = sub; $('#dBody').innerHTML = body; fuss(knoepfe); $('#dlg').showModal();
}
function fuss(knoepfe){
  const f=$('#dFuss'); f.innerHTML='';
  knoepfe.forEach(([t,cls,fn]) => { const b=document.createElement('button'); b.className='btn '+cls; b.textContent=t;
    b.onclick = async () => { if (!fn){ $('#dlg').close(); return; } try{ const r = await fn(); if (r!==false) $('#dlg').close(); }catch(e){} }; f.appendChild(b); });
}

start();
</script>
</body>
