<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3D ERP</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e2e6ed;--nav:#1d2433;--blue:#2f6fde;--green:#1f9d55;--orange:#e08a00;--red:#d64545;--yellow:#e6b800;--row:42px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:#cfd6e6;padding:12px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{color:#fff;font-weight:700;font-size:17px;padding:4px 18px 14px}
nav .logo small{display:block;font-weight:400;font-size:11px;color:#8e98b0}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7d879f;padding:14px 18px 4px}
nav a{display:block;color:#cfd6e6;padding:7px 18px;border-left:3px solid transparent}
nav a:hover{background:#262f42;color:#fff}
nav a.on{background:#2b3550;color:#fff;border-left-color:var(--blue)}
nav .unten{padding:16px 18px;font-size:12px;color:#7d879f}nav .unten a{display:inline;padding:0;border:0;color:#9fb4e8}
main{padding:16px 20px;min-width:0}
.kopfzeile{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kopfzeile h1{font-size:21px;margin:0;font-weight:600}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.rot{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f6f7fa;color:#4b5366}
input.zahl{text-align:right}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fafbfd;position:sticky;top:0}
td.r,th.r{text-align:right}
tr.klick{cursor:pointer} tr.klick:hover{background:#f2f6fd} tr.sel{background:#e7effc!important}
.liste{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.quer{overflow-x:auto;max-width:100%}
.filter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter input{max-width:280px}.filter select{max-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .z{font-size:22px;font-weight:700}.kpi .t{color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;color:#fff;white-space:nowrap}
.st-entwurf{background:#8d96aa}.st-verarbeitet{background:var(--green)}.st-storniert{background:var(--red)}
.s-ok{background:var(--green)}.s-late{background:var(--orange)}.s-risk{background:var(--yellow);color:#4a3b00}.s-over{background:var(--red)}.s-open{background:var(--blue)}.s-fut{background:#b8c6e6;color:#1d2433}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.feld label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.hinweis{font-size:12px;color:var(--mute)}
.kette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kette a{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink);background:#fafbfd}
.kette a.akt{border-color:var(--blue);background:#e7effc}
.kette .pfeil{color:var(--mute)}
.reiter{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.reiter button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.reiter button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.pos td{padding:4px}.pos input{padding:4px 6px}
.summe{display:grid;grid-template-columns:auto 130px;gap:2px 16px;justify-content:end;margin-top:10px}
.summe .r{text-align:right}.summe b{font-size:16px}
.info{background:#f6f9ff;border:1px solid #dbe6fb;border-radius:8px;padding:8px 12px;font-size:13px}
.menue{position:relative;display:inline-block}
.menue .ddl{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;min-width:220px}
.menue.auf .ddl{display:block}
.ddl button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.ddl button:hover{background:#f2f6fd}
/* Zeitstrahl */
.gantt{display:grid;grid-template-columns:250px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gl{background:#fafbfd;border-right:1px solid var(--line)}
.gl .h,.gr .h{height:46px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.gl .h{display:flex;align-items:end;padding:0 10px 6px}
.gl .r{height:var(--row);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden}
.gl .r .x{overflow:hidden;text-overflow:ellipsis}
.gl .r:hover{background:#eef3fc}
.gr{overflow-x:auto;position:relative}
.gr .inner{position:relative}
.gr .h{position:relative}
.wk{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:11px;padding:3px 0 0 4px;color:var(--mute)}
.mo{position:absolute;top:22px;font-size:11px;font-weight:600;color:var(--ink);padding-left:4px;white-space:nowrap}
.gr .r{height:var(--row);border-bottom:1px solid var(--line);position:relative}
.grid{position:absolute;top:0;bottom:0;border-left:1px dashed #edf0f5}
.heute{position:absolute;top:0;bottom:0;border-left:2px solid var(--blue);z-index:3}
.heute span{position:absolute;top:2px;left:3px;font-size:10px;color:var(--blue);font-weight:700;background:#fff;padding:0 2px}
.bar{position:absolute;top:12px;height:18px;border-radius:4px;z-index:2;cursor:pointer;min-width:6px}
.ms{position:absolute;top:12px;width:17px;height:17px;transform:rotate(45deg);margin-left:-8px;border-radius:3px;z-index:2;cursor:pointer}
.base{position:absolute;top:7px;height:28px;width:0;border-left:3px solid #8d96aa;z-index:1}
.shift{position:absolute;top:20px;height:0;border-top:2px dashed var(--red);z-index:1}
.ist{position:absolute;top:10px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:2px solid var(--green);z-index:4;font-size:13px;line-height:18px;text-align:center;color:var(--green);font-weight:700}
.ist.late{border-color:var(--orange);color:var(--orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grund{font-size:12px;color:#8a4b00}
body.kunde .intern{display:none!important}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,26,40,.45)}
.dk{padding:14px 18px;border-bottom:1px solid var(--line)}.dk h3{margin:0;font-size:17px}
.db{padding:14px 18px;display:grid;gap:10px}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.zeile{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.zeile label{color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.fehler{background:var(--red)}
.login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:10px}
.druck{display:none}
.burger,.nav-schleier{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);height:100%;z-index:60;transform:translateX(-102%);transition:transform .22s ease,box-shadow .22s;overscroll-behavior:contain}
  body.nav-auf nav{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.35)}
  .nav-schleier{display:block;position:fixed;inset:0;z-index:55;background:rgba(10,14,24,.45);opacity:0;pointer-events:none;transition:opacity .22s}
  body.nav-auf .nav-schleier{opacity:1;pointer-events:auto}
  body.nav-auf{overflow:hidden}
  nav a{padding:11px 18px}
  .burger{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:40px;margin:0 4px 7px 0;position:sticky;left:0;z-index:2;background:color-mix(in srgb,var(--blue) 40%,#0e1320)!important;border:0;border-radius:7px;background:rgba(255,255,255,.13);color:#fff;font-size:20px;cursor:pointer}
  .gantt{grid-template-columns:140px 1fr}}
@media print{
  #toast,#dlg{display:none!important}
  nav,.noprint,.kopfzeile .btn,.df{display:none!important}
  .app{display:block} main{padding:0} body{background:#fff}
  .card{border:0;padding:4px 0}
  .intern{display:none!important}
  body.belegdruck main>*{display:none!important}
  body.belegdruck .druck{display:block!important}
  @page{size:A4;margin:15mm}
  body.querformat{}
}
/* Briefansicht Belegerfassung */
.tisch{background:#dfe3ea;border-radius:10px;padding:22px 12px;overflow-x:auto}
.blatt{background:#fff;max-width:900px;min-width:720px;margin:0 auto;padding:34px 44px 30px;box-shadow:0 4px 18px rgba(0,0,0,.14);border-radius:2px}
.blatt input,.blatt select,.blatt textarea{border:1px solid transparent;background:#f5f7fb;border-radius:3px}
.blatt input:focus,.blatt select:focus,.blatt textarea:focus{border-color:var(--blue);background:#fff;outline:0}
.blatt.gesperrt input,.blatt.gesperrt select,.blatt.gesperrt textarea{background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.blatt.gesperrt select{appearance:none}.bk-wert{display:block;padding:2px 5px;white-space:normal;line-height:1.35}.blatt.gesperrt textarea{resize:none}.blatt.gesperrt textarea:placeholder-shown{display:none}
.bk-firma{text-align:right;font-weight:700;font-size:18px;letter-spacing:.02em}.bk-firma small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.bk-oben{display:flex;justify-content:space-between;gap:24px;margin:26px 0 18px}
.bk-links{width:46%}.bk-abs{font-size:9.5px;border-bottom:1px solid #444;padding-bottom:1px;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.bk-anschrift{min-height:96px;line-height:1.5}
.bk-kasten{width:330px;border:1px solid #444;padding:0 0 4px}
.bk-titel{background:#e9ecf1;border-bottom:1px solid #444;text-align:center;font-weight:700;font-size:17px;padding:4px}
.bk-z{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;padding:2px 8px;font-size:13px}
.bk-z>span:first-child{color:#444}
.bk-z input,.bk-z select{padding:2px 5px}
.bk-such{display:flex;gap:3px}.bk-such .btn{padding:0 7px}
.bk-zb{grid-template-columns:150px 260px;justify-content:end;padding:6px 0}
.bk-text{display:block;margin:8px 0;resize:vertical;font:inherit}
.bk-pos th{background:#e9ecf1;color:#333;border-bottom:1px solid #444;position:static}
.bk-pos td{border-bottom:1px solid #eceff4}
.statusleiste{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;flex-wrap:wrap}
@media (max-width:820px){.blatt{padding:18px;min-width:680px}}
.bk-logo{max-height:64px;max-width:260px;display:block;margin-left:auto}
.bk-fuss{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid #888;margin-top:22px;padding-top:6px;font-size:9.5px;color:#555;line-height:1.35}
.nurdruck{display:none}
@media print{.nurdruck{display:block;margin-bottom:8px}}
.druck .brief{font-size:12.5px}
.druck .absz{font-size:9px;border-bottom:1px solid #000;display:inline-block;margin-bottom:4px}
.druck .bk{border:1px solid #000;padding:6px 10px;width:250px;float:right}
.druck table th{background:none;border-bottom:1px solid #000;color:#000}
.druck table td{border-bottom:1px solid #ddd}
/* ===== myfactory-Look: Rahmen, Reiter, Seitenkopf (Farben über Thema) ===== */
:root{--akzent:#f39200}
nav{background:color-mix(in srgb,var(--blue) 22%,#0e1320)}
nav a:hover{background:color-mix(in srgb,var(--blue) 32%,#0e1320)}
nav a.on{background:color-mix(in srgb,var(--blue) 48%,#0e1320);border-left-color:var(--akzent)}
.bsuche{position:relative;margin:0 12px 8px}
.bsuche input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:18px;padding:7px 12px}
.bsuche input::placeholder{color:#aeb7cc}
.bs-erg{display:none;position:absolute;left:0;top:100%;margin-top:4px;width:440px;max-height:70vh;overflow:auto;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60}
.bs-erg.auf{display:block}
.bs-erg a{display:block;padding:6px 12px;color:var(--ink);border-left:0}
.bs-erg a:hover{background:#eef3fc;color:var(--ink)}
.bs-erg .typ{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 2px}
.schnell{display:flex;gap:6px;padding:2px 12px 8px}
.schnell button{flex:1;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:6px;padding:7px 0;cursor:pointer;font-size:15px}
.schnell button:hover,.schnell button.on{background:var(--blue)}
.mm-titel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9aa4bb;padding:10px 18px 4px}
.ordner{display:flex;align-items:center;gap:7px;cursor:pointer;color:#e6eaf3;font-weight:600;padding:7px 18px;user-select:none}
.ordner:hover{background:rgba(255,255,255,.06)}
.ordner .pf{display:inline-block;transition:transform .15s;font-size:9px;width:10px;opacity:.8}
.ordner.auf .pf{transform:rotate(90deg)}
.ordner+.inhalt-o{display:none}.ordner.auf+.inhalt-o{display:block}
.inhalt-o a{padding-left:36px}
main{padding:0!important;min-width:0;display:flex;flex-direction:column}
.reiterleiste{display:flex;gap:3px;background:color-mix(in srgb,var(--blue) 22%,#0e1320);padding:7px 10px 0;overflow-x:auto;position:sticky;top:0;z-index:30;min-height:41px}
.reiterleiste .rt{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);color:#dfe5f1;border-radius:7px 7px 0 0;padding:7px 9px 7px 13px;cursor:pointer;white-space:nowrap;font-size:13px;max-width:250px}
.reiterleiste .rt span{overflow:hidden;text-overflow:ellipsis}
.reiterleiste .rt:hover{background:rgba(255,255,255,.22)}
.reiterleiste .rt.on{background:var(--bg);color:var(--ink);font-weight:600}
.reiterleiste .rt i{font-style:normal;opacity:.55;padding:0 3px;border-radius:3px;font-size:12px}.reiterleiste .rt i:hover{opacity:1;background:rgba(0,0,0,.12)}
.seite{display:none;padding:12px 20px 24px}.seite.on{display:block}
.seitenkopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px}
.seitenkopf h2{margin:0;font-size:25px;font-weight:500;color:#39415a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-bs{border:2px solid var(--akzent);color:var(--akzent);border-radius:10px;padding:3px 16px;font-weight:600;font-size:13px;background:#fff;white-space:nowrap}
.kopficons{justify-self:end;display:flex;gap:2px}
.kopficons button{border:0;background:none;font-size:17px;cursor:pointer;color:#39415a;padding:4px 7px;border-radius:6px;line-height:1}
.kopficons button:hover{background:#e3e8f0}.kopficons button.fav{color:var(--akzent)}
.inhalt>.kopfzeile h1{display:none}
.inhalt>.kopfzeile:empty{display:none}
.werkz{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.werkz input.fi{max-width:230px}
.blaettern{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);padding:7px 4px 0;font-style:italic}
.blaettern button{border:0;background:none;cursor:pointer;font-size:15px;color:var(--mute);font-style:normal}
.knopfreihe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.fussreihe{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn u{text-underline-offset:2px}
.posknopf{padding:1px 6px!important;font-size:12px}
.artzelle{display:flex;gap:3px}
.hilfe kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;background:#fafbfd}
@media (max-width:820px){.seitenkopf{grid-template-columns:1fr auto}.badge-bs{display:none}.seite{padding:10px}}
/* Handy: breite Tabellen scrollen in sich statt die ganze Seite zu verbreitern (BUG-004). Belegblatt (.blatt) behält sein Druckbild. */
@media (max-width:820px){.card table:not(.bk-pos){display:block;overflow-x:auto;max-width:100%}.card table:not(.bk-pos) table{display:table}}
.ws-kopf{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--blue) 22%,#0e1320);color:#fff;padding:10px 18px}
.ws-modus{display:flex;gap:6px;margin-left:10px}.ws-modus .btn{font-size:16px;padding:9px 14px}
.ws-kopf img{height:40px;border-radius:3px}.ws-titel{font-size:22px;font-weight:600}
.ws-seite{padding:16px 18px}
.ws-bereiche{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.ws-bereiche .btn{font-size:16px;padding:10px 16px}
.ws-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.ws-karte{background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.ws-karte.fertig{opacity:.6;border-left-color:var(--green)}
.ws-proj{font-size:13px;color:var(--mute)}.ws-schritt{font-size:21px;font-weight:600;line-height:1.25}.ws-info{font-size:14px}
.ws-knoepfe{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.ws-knoepfe .btn{font-size:18px;padding:12px 18px;border-radius:8px}
.ws-ok{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;flex:1}
.ws-problem{color:#8a4b00}
.pd-kopf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pd-start{font-size:20px!important;padding:14px 24px!important;border-radius:10px!important}
.pd-karte{background:#fff;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.pd-karte.pause{border-left-color:var(--orange);background:#fffaf0}
.pd-karte .ws-knoepfe{flex-wrap:nowrap}.pd-karte .ws-knoepfe .btn{padding:12px 14px}
.pd-charge{font-size:22px;font-weight:700}.pd-ag{font-size:19px;font-weight:600}.pd-info{font-size:14px;color:var(--mute)}
.pd-zeit{font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.pd-wahl{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}.pd-wahl .btn{font-size:17px;padding:12px 16px;border-radius:8px}
.pd-wahl .btn.an{background:var(--blue);color:#fff;border-color:var(--blue)}
.raster2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:8px}.raster2 .zeile{grid-template-columns:1fr;gap:3px}
.pd-gross{font-size:22px!important;padding:10px!important;height:auto!important}
.pd-liste{display:grid;gap:6px;max-height:42vh;overflow:auto}.pd-liste .btn{text-align:left;font-size:16px;padding:12px 14px;display:block;width:100%}

.viz-kopf{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}

.viz-tip{position:fixed;z-index:200;background:#1d2433;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}
.kpi.klick{cursor:pointer}.kpi.klick:hover{border-color:var(--blue)}

<body>
<div id="root"></div>
<div class="druck" id="druck"></div>
<dialog id="dlg"><div class="dk"><h3 id="dTitel"></h3><div class="hinweis" id="dSub"></div></div><div class="db" id="dBody"></div><div class="df" id="dFuss"></div></dialog>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ================================================================ Grundgerüst
let AKT = null; const TABS = [];
const $ = s => (AKT && AKT.el.querySelector(s)) || document.querySelector(s);   // zuerst im aktiven Reiter suchen
const $$ = s => (AKT ? AKT.el : document).querySelectorAll(s);
// Beschriftung mit unterstrichenem Kürzel (Alt+Buchstabe) wie in myfactory
const ak = (txt, b) => { const i = txt.toLowerCase().indexOf(b.toLowerCase()); return i < 0 ? esc(txt) : esc(txt.slice(0,i)) + '<u>' + esc(txt[i]) + '</u>' + esc(txt.slice(i+1)); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const preis = n => (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:4});   // Stückpreise: bis 4 Nachkommastellen (Lohnbearbeitung)
const zahl = n => (Number(n)||0).toLocaleString('de-DE',{maximumFractionDigits:3});
const dt = s => s ? new Date(s.slice(0,10)+'T00:00:00') : null;
const fmt = s => s ? dt(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '–';
const heute = () => { const x=new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const tage = (a,b) => Math.round((dt(b)-dt(a))/86400000);
const num = v => { if (typeof v === 'number') return v; const s=String(v||'').trim().replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
let G = null, ICH = null, E = {}, NUR_FAV = false;

async function api(pfad, opt={}){
  const r = await fetch('api/'+pfad, {method: opt.method || (opt.body ? 'POST':'GET'), headers:{'Content-Type':'application/json','X-ERP':'1'},
                                     body: opt.body ? JSON.stringify(opt.body) : undefined, credentials:'same-origin'});
  const d = await r.json().catch(()=>({fehler:'Ungültige Antwort'}));
  if (r.status === 401){ zeigeLogin(); const f = new Error('login'); f.gezeigt = true; throw f; }
  if (!r.ok){ toast(d.fehler || 'Fehler', true); const f = new Error(d.fehler); f.gezeigt = true; throw f; }
  return d;
}
async function herunterladen(pfad, was){
  const r = await fetch('api/'+pfad, {credentials:'same-origin'});
  if (r.status === 401) return zeigeLogin();
  if (!r.ok){ const d = await r.json().catch(()=>({})); const t = d.fehler || 'Fehler';
    if (t.startsWith('Für die E-Rechnung fehlt noch:'))
      return dialog(was + ' nicht möglich', 'Pflichtangaben fehlen', `<p>${esc(t)}</p><p class="hinweis">Firmendaten unter Einstellungen → Firma, Kundendaten in der Adresse ergänzen.</p>`, [['Schließen','']]);
    return toast(t, true); }
  const name = decodeURIComponent((r.headers.get('Content-Disposition')||'').split("''")[1] || 'datei');
  const url = URL.createObjectURL(await r.blob()); const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast(was + ' erstellt: ' + name);
}
let tt; function toast(t, fehler){ const e=$('#toast'); e.textContent=t; e.classList.toggle('fehler',!!fehler); e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'), fehler?5000:3500); }

function zeigeLogin(){
  $('#root').innerHTML = `<form class="login" id="lf"><div style="font-size:20px;font-weight:700">V3D ERP</div><div class="hinweis">Testsystem · alle Kunden, Artikel und Belege sind erfunden</div>
    <input id="lu" placeholder="Benutzer" autocomplete="username"><input id="lp" type="password" placeholder="Kennwort" autocomplete="current-password">
    <button class="btn pri">Anmelden</button></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault();
    const r = await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('#lu').value,passwort:$('#lp').value})});
    if (r.ok){ start(); } else { toast((await r.json()).fehler, true); } };
  $('#lp').focus();
}

const MENUE = [
  ['Übersicht', [['#/start','Startseite']]],
  ['Verkauf', [['#/belege/VK','Verkaufsbelege']]],
  ['Einkauf', [['#/belege/EK','Einkaufsbelege']]],
  ['Finanzen', [['#/op/debitor','Offene Posten Kunden'],['#/op/kreditor','Offene Posten Lieferanten'],['#/bank','Zahlungsabgleich'],['#/mahnwesen','Mahnwesen'],['#/liquiditaet','Liquiditätsplanung'],['#/datev','DATEV-Export']]],
  ['Auswertungen', [['#/umsatz','Umsatzauswertung']]],
  ['Projekte', [['#/projekte','Projekte & Zeitstrahl'],['#/werkstatt','Werkstatt-Ansicht']]],
  ['Produktion', [['#/produktion','Produktion (Paletten/Chargen)']]],
  ['Lager', [['#/chargen','Chargen (Kundenmaterial)'],['#/inventur','Inventur'],['#/kundenmaterial','Kundenmaterial erfassen']]],
  ['Stammdaten', [['#/adressen/kunde','Kunden'],['#/adressen/lieferant','Lieferanten'],['#/adressen/','Alle Adressen'],['#/artikel','Artikel & Lager']]],
  ['System', [['#/einstellungen','Firmendaten & Briefkopf'],['#/formulare','Formulare (Druck)'],['#/kennzeichen','Kennzeichen (Zusatzfelder)']]],
];
function thema(e){ const r = document.documentElement.style; r.setProperty('--blue', e.farbe_haupt || '#004aad'); r.setProperty('--akzent', e.farbe_akzent || '#f39200'); }
function rahmen(){
  $('#root').innerHTML = `<div class="app"><nav><div id="navLogo"></div><div class="logo">V3D ERP<small>Prototyp · Testdaten</small></div>
    <div class="bsuche"><input id="bs" placeholder="Business-Suche" autocomplete="off"><div class="bs-erg" id="bsErg"></div></div>
    <div class="schnell"><button data-s="fav" title="Nur Mein Menü zeigen">★</button><button data-s="mail" title="E-Mails">✉</button><button data-s="termine" title="Termine">📅</button><button data-s="aufgaben" title="Aufgaben">✓</button><button data-s="neu" title="Neu …">＋</button></div>
    <div id="menu"></div>
    <div class="unten">${esc(ICH.name)} · <a href="#" id="abm">Abmelden</a></div></nav>
    <div class="nav-schleier" id="navSchleier"></div>
    <main><div class="reiterleiste" id="tabs"></div><div id="seiten"></div></main></div>`;
  document.getElementById('abm').onclick = async e => { e.preventDefault(); await fetch('api/logout'); location.hash=''; location.reload(); };
  document.querySelectorAll('.schnell button').forEach(b => b.onclick = () => schnell(b.dataset.s, b));
  sucheBinden(); renderMenue(); schubladeBinden();
}
// Handy: Menü als Schublade von links (☰, Wischen vom Rand, Tippen daneben/Menüpunkt/Esc schließt)
function schubladeBinden(){
  const zu = () => document.body.classList.remove('nav-auf'), auf = () => document.body.classList.add('nav-auf');
  window.navZu = zu; window.navAuf = auf;
  document.getElementById('navSchleier').onclick = zu;
  document.querySelector('nav').addEventListener('click', e => { if (e.target.closest('a[href^="#/"]')) zu(); });
  window.addEventListener('hashchange', zu);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') zu(); });
  let x0 = null, y0 = 0, offen = false;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; offen = document.body.classList.contains('nav-auf');
    x0 = (offen || t.clientX < 24) && innerWidth <= 820 ? t.clientX : null; y0 = t.clientY; }, {passive:true});
  document.addEventListener('touchend', e => { if (x0 === null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
    if (dy < 60){ if (!offen && dx > 50) auf(); else if (offen && dx < -50) zu(); } x0 = null; }, {passive:true});
}
const favKey = () => 'erp-fav-' + ICH.login;
const favs = () => { try { return JSON.parse(localStorage.getItem(favKey()) || '[]'); } catch(e){ return []; } };
function renderMenue(){
  const fv = favs();
  let auf; try { auf = JSON.parse(localStorage.getItem('erp-ordner') || 'null'); } catch(e){}
  auf = auf || ['Verkauf','Einkauf','Finanzen','Projekte','Produktion','Lager','Stammdaten'];
  const m = document.getElementById('menu');
  m.innerHTML = `<div class="mm-titel">Mein Menü</div>` + (fv.length ? fv.map(f=>`<a href="${f.h}">${esc(f.t)}</a>`).join('') : '<div style="padding:2px 18px 6px;color:#8e98b0;font-size:12px">Mit ☆ oben rechts auf einer Seite hier ablegen</div>')
    + (NUR_FAV ? '' : MENUE.map(([g,l])=>`<div class="ordner ${auf.includes(g)?'auf':''}" data-g="${g}"><span class="pf">▶</span>${g}</div><div class="inhalt-o">${l.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')}</div>`).join(''));
  m.querySelectorAll('.ordner').forEach(o => o.onclick = () => { o.classList.toggle('auf');
    localStorage.setItem('erp-ordner', JSON.stringify([...m.querySelectorAll('.ordner.auf')].map(x=>x.dataset.g))); });
  markiereMenue(location.hash || '#/start');
}
function markiereMenue(h){
  document.querySelectorAll('nav a[href^="#/"]').forEach(a => { const x = a.getAttribute('href'); a.classList.toggle('on', h === x || (x.length > 3 && h.startsWith(x + '/'))); });
}
function schnell(was, btn){
  if (was === 'fav'){ NUR_FAV = !NUR_FAV; btn.classList.toggle('on', NUR_FAV); renderMenue(); }
  if (was === 'mail') toast('E-Mail-Anbindung (Outlook / Microsoft 365) folgt im nächsten Schritt.');
  if (was === 'termine') location.hash = '#/projekte';
  if (was === 'aufgaben') location.hash = '#/start';
  if (was === 'neu') dialog('Neu anlegen', '', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[['#/neu/AN','Angebot'],['#/neu/AB','Auftragsbestätigung'],['#/neu/RE','Rechnung'],['#/neu/BE','Bestellung'],['#/adressen/kunde/neu','Kunde'],['#/adressen/lieferant/neu','Lieferant'],['#/artikel/neu','Artikel'],['#/projekte?neu=1','Projekt']]
        .map(([h,t])=>`<button class="btn" onclick="document.getElementById('dlg').close();location.hash='${h}'">＋ ${t}</button>`).join('')}</div>`, [['Schließen','']]);
}
let bsT, bsErg = [];
function sucheBinden(){
  const i = document.getElementById('bs'), box = document.getElementById('bsErg');
  i.oninput = () => { clearTimeout(bsT); bsT = setTimeout(async () => { const q = i.value.trim(); if (q.length < 2){ box.classList.remove('auf'); return; }
    bsErg = await api('suche?q=' + encodeURIComponent(q)); let typ = '';
    box.innerHTML = bsErg.map(e => `${e.typ !== typ ? `<div class="typ">${typ = e.typ}</div>` : ''}<a href="${e.ziel}"><b>${esc(e.titel)}</b><div class="hinweis">${esc(e.info)}</div></a>`).join('') || '<div class="typ">Nichts gefunden</div>';
    box.classList.add('auf'); }, 200); };
  i.onkeydown = e => { if (e.key === 'Enter' && bsErg[0]){ location.hash = bsErg[0].ziel; box.classList.remove('auf'); i.value = ''; } if (e.key === 'Escape') box.classList.remove('auf'); };
  box.onclick = e => { if (e.target.closest('a')){ box.classList.remove('auf'); i.value = ''; } };
  document.addEventListener('click', e => { if (!e.target.closest('.bsuche')) box.classList.remove('auf'); });
}
// ---------- Reiter (jede Anwendung ein eigener Reiter) ----------
function reiterSchluessel(h){
  const [, t, a] = h.split('?')[0].split('/');
  if (t === 'beleg' || t === 'neu') return 'beleg';
  if (t === 'belege') return 'belege-' + (a || 'VK');
  if (t === 'adressen') return 'adr-' + (a || '');
  if (t === 'op') return 'op-' + (a || 'debitor');
  return t || 'start';
}
function neuerReiter(key){
  const el = document.createElement('section'); el.className = 'seite';
  el.innerHTML = `<div class="seitenkopf"><h2></h2><span class="badge-bs">${esc(E.betriebsstaette || '')}</span><div class="kopficons">
    <button data-k="fav" title="Mein Favorit">☆</button><button data-k="neu" title="Neu laden">⟳</button><button data-k="support" title="Supportanfrage stellen">✉</button><button data-k="hilfe" title="Hilfe & Tastenkürzel">?</button></div></div><div class="inhalt"></div>`;
  document.getElementById('seiten').appendChild(el);
  const t = { key, el, body: el.querySelector('.inhalt'), hash: null, titel: '' };
  el.querySelectorAll('.kopficons button').forEach(b => b.onclick = () => kopfIcon(b.dataset.k, t));
  TABS.push(t);
  if (TABS.length > 12){ const alt = TABS.find(x => x.key !== 'start' && x !== t); if (alt) schliesseReiter(TABS.indexOf(alt), true); }
  return t;
}
function zeigeReiter(t){
  AKT = t; TABS.forEach(x => x.el.classList.toggle('on', x === t));
  document.body.classList.toggle('kunde', t.key === 'projekt' && ANSICHT === 'kunde');
  t.el.querySelector('.badge-bs').textContent = E.betriebsstaette || '';
  const fv = favs().some(f => f.h === t.hash); const fb = t.el.querySelector('[data-k="fav"]'); fb.textContent = fv ? '★' : '☆'; fb.classList.toggle('fav', fv);
  renderReiter();
}
function renderReiter(){
  const box = document.getElementById('tabs');
  box.innerHTML = '<button class="burger" id="burger" title="Menü" aria-label="Menü öffnen">☰</button>' + TABS.map((t,i) => `<div class="rt ${t===AKT?'on':''}" data-i="${i}" title="${esc(t.titel)}"><span>${esc(t.titel || '…')}</span>${t.key === 'start' ? '' : `<i data-x="${i}" title="Schließen">✕</i>`}</div>`).join('');
  box.querySelector('#burger').onclick = () => window.navAuf && navAuf();
  box.querySelectorAll('.rt').forEach(r => r.onclick = e => { const i = +r.dataset.i;
    if (e.target.dataset.x !== undefined){ schliesseReiter(i); return; }
    const t = TABS[i]; if (location.hash === t.hash) zeigeReiter(t); else location.hash = t.hash; });
}
function schliesseReiter(i, still){
  const t = TABS[i]; if (!t || t.key === 'start') return;
  t.el.remove(); TABS.splice(i, 1);
  if (AKT === t && !still){ const n = TABS[Math.min(i, TABS.length) - 1] || TABS[0]; AKT = n; if (location.hash === n.hash) zeigeReiter(n); else location.hash = n.hash; }
  else renderReiter();
}
function setTitel(titel){ if (!AKT) return; AKT.titel = titel; AKT.el.querySelector('.seitenkopf h2').textContent = titel; document.title = titel + ' – V3D ERP'; renderReiter(); }
function kopfIcon(k, t){
  if (k === 'fav'){ let fv = favs(); const da = fv.some(f => f.h === t.hash);
    fv = da ? fv.filter(f => f.h !== t.hash) : fv.concat([{ h: t.hash, t: t.titel }]);
    localStorage.setItem(favKey(), JSON.stringify(fv)); renderMenue(); zeigeReiter(t); toast(da ? 'Aus „Mein Menü“ entfernt.' : 'In „Mein Menü“ abgelegt.'); }
  if (k === 'neu'){ t.hash = null; navigiere(); }
  if (k === 'support') location.href = `mailto:info@volme3dakademie.de?subject=${encodeURIComponent('Support V3D ERP – ' + t.titel)}`;
  if (k === 'hilfe') dialog('Hilfe & Tastenkürzel', '', `<div class="hilfe" style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px">
      <kbd>Alt+N</kbd><span>Neu</span><kbd>Alt+S</kbd><span>Speichern</span><kbd>Alt+T</kbd><span>Verarbeiten (Beleg)</span><kbd>Alt+W</kbd><span>Weiterverarbeiten</span>
      <kbd>Alt+U</kbd><span>Suchen</span><kbd>Alt+B</kbd><span>Beleg-Menü</span><kbd>Alt+P</kbd><span>Positionen-Menü</span><kbd>Alt+M</kbd><span>Memotext</span>
      <kbd>Alt+R</kbd><span>Drucken</span><kbd>Alt+A</kbd><span>Druckansicht</span><kbd>Alt+K</kbd><span>Kopieren</span><kbd>Alt+L</kbd><span>Löschen</span>
      <kbd>Alt+E</kbd><span>Erweiterte Suche</span><kbd>Alt+V</kbd><span>Volltextsuche</span><kbd>Alt+D / I / O</kbd><span>Menüs Daten / Info / Aktionen</span><kbd>Alt+C</kbd><span>Schließen</span></div>
      <p class="hinweis">Unterstrichene Buchstaben auf den Knöpfen zeigen das Kürzel. Die Business-Suche links oben findet Kunden, Artikel, Belege und Projekte.</p>`, [['Schließen','']]);
}
document.addEventListener('keydown', e => {
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  const k = (e.key || '').toLowerCase(); if (k.length !== 1) return;
  const dlg = document.getElementById('dlg'); const scope = dlg.open ? dlg : (AKT && AKT.el); if (!scope) return;
  const z = [...scope.querySelectorAll(`[data-ak="${k}"]`)].find(x => x.offsetParent && !x.disabled);
  if (z){ e.preventDefault(); if (z.tagName === 'INPUT') z.focus(); else z.click(); }
});
async function start(){
  try { ICH = await api('ich'); G = await api('grundlagen'); E = await api('einstellungen'); } catch(e){ return; }
  thema(E);
  if (ICH.rolle === 'werkstatt') return werkstattVollbild();
  rahmen(); navigiere();
}
window.addEventListener('hashchange', navigiere);
// Fachliche Fehler wurden schon als Meldung gezeigt – nicht zusätzlich als Skriptfehler werfen
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.gezeigt) e.preventDefault(); });
async function navigiere(){
  if (!ICH || ICH.rolle === 'werkstatt') return;
  const h = location.hash || '#/start';
  const [pfad, query] = h.split('?'); const Q = new URLSearchParams(query || '');
  const key = reiterSchluessel(h);

// ================================================================ Diagramme (SVG, ohne Bibliothek)
const VJ_FARBE = '#1baf7a';      // „Vorjahr“ – geprüft gegen GSB-Blau (CVD ΔE 31), Kontrast-Hinweis → Legende + Tabelle + Tooltip
const kurzZahl = v => Math.abs(v) >= 1000 ? (Math.round(v / 100) / 10).toLocaleString('de-DE') + ' T' : Math.round(v).toLocaleString('de-DE');
const MONAT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function tooltip(e, html){ let t = document.getElementById('vizTip'); if (!t){ t = document.createElement('div'); t.id = 'vizTip'; t.className = 'viz-tip'; document.body.appendChild(t); }
  if (!html){ t.style.display = 'none'; return; } t.innerHTML = html; t.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.max(8, e.clientY - t.offsetHeight - 10); t.style.left = x + 'px'; t.style.top = y + 'px'; }
function sauberMax(m){ if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= m) return f * p; return 10 * p; }
function vizKarte(titel, untertitel, legende, svg, tabelle){
  return `<div class="card viz"><div class="viz-kopf"><div><b>${titel}</b>${untertitel?`<div class="hinweis">${untertitel}</div>`:''}</div><span class="sp"></span>
    ${legende}<button class="btn posknopf viz-tab" title="Als Tabelle">▤</button></div><div class="viz-bild">${svg}</div><div class="viz-tabelle" hidden>${tabelle}</div></div>`;
}
const leg = l => `<span class="viz-leg">${l.map(([f,t]) => `<span><i style="background:${f}"></i>${t}</span>`).join('')}</span>`;
function saeulenUmsatz(monate){
  const W = 980, H = 260, L = 46, B = 26, T = 18, n = monate.length, slot = (W - L - 8) / n;
  const max = sauberMax(Math.max(...monate.flatMap(m => [m.netto, m.vorjahr]), 1));
  const y = v => H - B - (Math.max(0, v) / max) * (H - B - T);
  const bw = Math.min(14, (slot - 10) / 2);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" class="viz-grid"/><text x="${L-6}" y="${yy+4}" class="viz-achse" text-anchor="end">${kurzZahl(v)}</text>`; }
  const saeule = (x, v, f) => { if (v <= 0) return ''; const yy = y(v), h = H - B - yy, r = Math.min(4, h);
    return `<path d="M${x},${H-B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H-B} Z" fill="${f}"/>`; };
  monate.forEach((m, i) => { const x0 = L + i * slot + (slot - 2 * bw - 2) / 2; const [jj, mm] = m.monat.split('-');
    g += `<g class="viz-hit" data-t="${MONAT[+mm-1]} ${jj}: <b>${eur(m.netto)} €</b><br>Vorjahr: ${eur(m.vorjahr)} €"><rect x="${L + i*slot}" y="${T}" width="${slot}" height="${H-B-T}" fill="transparent"/>
      ${saeule(x0 + bw + 2, m.vorjahr, VJ_FARBE)}${saeule(x0, m.netto, 'var(--blue)')}
      <text x="${L + i*slot + slot/2}" y="${H-8}" class="viz-achse" text-anchor="middle">${MONAT[+mm-1]}</text></g>`; });
  const letzte = monate[n-1]; if (letzte.netto > 0) g += `<text x="${L + (n-1)*slot + slot/2}" y="${y(letzte.netto) - 6}" class="viz-wert" text-anchor="middle">${kurzZahl(letzte.netto)}</text>`;
  g += `<line x1="${L}" x2="${W-6}" y1="${H-B}" y2="${H-B}" class="viz-basis"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Umsatz der letzten 12 Monate gegen Vorjahr">${g}</svg>`;
}
function balkenListe(zeilen, farbe, ziel){
  if (!zeilen.length) return '<p class="hinweis">Noch keine Daten.</p>';
  const max = Math.max(...zeilen.map(z => z.wert), 1);
  return `<div class="viz-balken">${zeilen.map(z => `<div class="viz-zeile viz-hit ${ziel?'klick':''}" data-t="${esc(z.label)}: <b>${eur(z.wert)} €</b>" ${ziel?`data-ziel="${ziel(z)}"`:''}>
    <span class="viz-lbl" title="${esc(z.label)}">${esc(z.label)}</span><span class="viz-bahn"><span class="viz-bar" style="width:${Math.max(1, z.wert / max * 100)}%;background:${farbe}"></span></span><span class="viz-num">${kurzZahl(z.wert)}</span></div>`).join('')}</div>`;
}
function gruppenBalken(zeilen){
  if (!zeilen.length) return '<p class="hinweis">Noch keine Daten.</p>';
  const max = Math.max(...zeilen.flatMap(z => [z.jahr, z.vorjahr]), 1);

    <span class="viz-lbl" title="${esc(z.gruppe)}">${esc(z.gruppe)}</span><span class="viz-bahn doppelt"><span class="viz-bar" style="width:${Math.max(z.jahr>0?1:0, z.jahr / max * 100)}%;background:var(--blue)"></span><span class="viz-bar" style="width:${Math.max(z.vorjahr>0?1:0, z.vorjahr / max * 100)}%;background:${VJ_FARBE}"></span></span><span class="viz-num">${kurzZahl(z.jahr)}</span></div>`).join('')}</div>`;
}
function vizBinden(box){

// ================================================================ Liquiditätsplanung
function liqDiagramm(wochen){
  const W = 980, H = 240, L = 56, B = 26, T = 16, n = wochen.length, slot = (W - L - 8) / n;
  const werte = wochen.map(w => w.stand); const max = sauberMax(Math.max(...werte, 0, 1)), min = Math.min(...werte, 0) < 0 ? -sauberMax(-Math.min(...werte)) : 0;
  const y = v => T + (max - v) / (max - min) * (H - B - T); const bw = Math.min(30, slot - 8);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = min + (max - min) * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" class="viz-grid"/><text x="${L-6}" y="${yy+4}" class="viz-achse" text-anchor="end">${kurzZahl(v)}</text>`; }
  wochen.forEach((w, i) => { const x = L + i * slot + (slot - bw) / 2, y0 = y(0), yy = y(w.stand);
    g += `<g class="viz-hit" data-t="KW ${w.kw} (${fmt(w.von)} – ${fmt(w.bis)})<br>Eingänge ${eur(w.ein)} € · Ausgänge ${eur(w.aus)} €<br>Kontostand danach: <b>${eur(w.stand)} €</b>">
      <rect x="${L + i*slot}" y="${T}" width="${slot}" height="${H-B-T}" fill="transparent"/>
      <rect x="${x}" y="${Math.min(y0, yy)}" width="${bw}" height="${Math.max(1, Math.abs(yy - y0))}" rx="3" fill="${w.stand < 0 ? 'var(--red)' : 'var(--blue)'}"/>
      <text x="${L + i*slot + slot/2}" y="${H-8}" class="viz-achse" text-anchor="middle">KW ${w.kw}</text></g>`; });
  g += `<line x1="${L}" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" class="viz-basis"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Erwarteter Kontostand je Woche">${g}</svg>`;
}

  const nr = Object.fromEntries(artikel.map(a => [a.artikelnr, a]));
  const memo = a => { if (!a) return ''; const r = nr['R' + a.artikelnr]; return [a.memo, r && r.memo].filter(x => x && x.startsWith('myfactory-Bestand')).map(x => x.split(' Kundenmaterial')[0])[0] || ''; };
  M().innerHTML = `<div class="kopfzeile"><h1>Kundenmaterial erfassen</h1><span class="sp"></span><a class="btn" href="#/inventur">Inventur (eigenes Lager)</a></div>
    <div class="card"><div class="raster"><div class="feld"><label>Kunde</label><select id="kmK"><option value="">– Kunde wählen –</option>

      <div class="raster" style="margin-top:8px"><div class="feld"><label>Artikel (Bearbeitungsartikel)</label><input id="kmA" list="kmAL" placeholder="Artikelnummer oder Name"></div>
        <div class="feld"><label>Charge</label><input id="kmC" placeholder="${esc(d.charge_hinweis)}"></div>

      <div class="fussreihe"><button class="btn pri" id="kmNeu" data-ak="s">Erfassen</button></div></div>

      ${d.chargen.map(c => `<tr data-a="${c.artikel_id}" data-c="${esc(c.chargennr)}"><td>${esc(c.artikelnr||'')} <span class="hinweis">${esc(c.artikel_kurz||'')}</span></td><td>${esc(c.chargennr)}</td>
        <td>${esc(c.kunden_ls||'')}</td><td class="hinweis">${esc(c.herkunft_text)}</td><td class="r">${zahl(c.rest)}</td><td class="r"><input class="kmZ zahl" style="width:100px"></td></tr>`).join('')
        || '<tr><td colspan="6" class="hinweis">Für diesen Kunden ist kein Kundenmaterial erfasst.</td></tr>'}</tbody></table></div>

  $('#kmA').oninput = () => { const a = artikelZu(); const r = a && a.artikelnr.startsWith('R') && nr[a.artikelnr.slice(1)];
    $('#kmH').textContent = !a ? '' : [r ? `Rohstoff-Artikel – die Charge wird beim Bearbeitungsartikel ${r.artikelnr} geführt.` : '', memo(r || a)].filter(Boolean).join(' · '); };

async function seiteBelege(bereich, sel){
  const arten = G.belegarten.filter(x=>x.bereich===bereich);
  const filterArten = bereich === 'EK' ? [...arten, ...G.belegarten.filter(x => x.code === 'WK')] : arten.filter(x => x.code !== 'WK');
  M().innerHTML = `<div class="kopfzeile"><h1>${bereich==='VK'?'Verkaufsbelege':'Einkaufsbelege'}</h1><span class="sp"></span>
    ${bereich==='VK'?'<button class="btn" id="slNeu" title="Ein Lieferschein aus offenen Positionen mehrerer Aufträge eines Kunden">Lieferschein aus offenen Aufträgen</button><button class="btn" id="srNeu" title="Eine Rechnung über alle noch nicht berechneten Lieferscheine eines Kunden">Rechnung aus Lieferscheinen</button>':''}
    ${bereich==='EK'?'<button class="btn" id="erEin" title="XRechnung (XML) oder ZUGFeRD-PDF eines Lieferanten als Rechnungseingang übernehmen">E-Rechnung einlesen</button><input type="file" id="erDatei" accept=".xml,.pdf,application/xml,text/xml,application/pdf" hidden>':''}
    <div class="menue" id="neuM"><button class="btn pri">Neu ▾</button><div class="ddl">${arten.map(a=>`<button data-a="${a.code}">${esc(a.name)}</button>`).join('')}</div></div></div>
    <div class="card"><div class="filter"><input id="fs" placeholder="Suchen: Nummer, Name, Betreff, Projekt"><select id="fa"><option value="">Alle Belegarten</option>${filterArten.map(a=>`<option value="${a.code}">${esc(a.name)}</option>`).join('')}</select>
    <select id="fst"><option value="">Alle Status</option><option value="entwurf">Entwurf</option><option value="verarbeitet">Verarbeitet</option></select></div>
    <div class="liste"><table><thead><tr><th>Belegart</th><th>Nummer</th><th>Datum</th><th>${bereich==='VK'?'Kunde':'Lieferant'}</th><th>Betreff</th><th>Projekt</th><th class="r">Netto</th><th>Status</th></tr></thead><tbody id="bl"></tbody></table></div></div>`;
  menueAuf('#neuM', code => code === 'LS' ? sammelLieferschein() : code === 'RE' ? sammelRechnung() : location.hash = '#/neu/'+code);
  if ($('#slNeu')) $('#slNeu').onclick = sammelLieferschein;
  if ($('#srNeu')) $('#srNeu').onclick = sammelRechnung;
  if ($('#erEin')){ $('#erEin').onclick = () => $('#erDatei').click();
    $('#erDatei').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      if (f.size > 25e6) return toast('Datei zu groß (max. 25 MB).', true);
      const daten = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
      const erg = await api('erechnung/einlesen', {body:{name:f.name, daten}}).catch(()=>null); if (!erg) return;
      const nb = erg.beleg;
      dialog('E-Rechnung eingelesen', `${esc(erg.daten.syntax)} · Rechnung ${esc(erg.daten.nummer)} · ${eur(erg.daten.brutto)} €`,
        `<p>Als Rechnungseingang (Entwurf) für <b>${esc(nb.adresse_kurz||'')}</b> angelegt. Bitte prüfen und verarbeiten.</p>${erg.hinweise.length?`<ul>${erg.hinweise.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:''}`,
        [['Schließen',''], ['Beleg öffnen','pri', () => location.hash = '#/beleg/'+nb.id]]); };
  }
  const laden = async () => {
    const l = await api(`belege?bereich=${bereich}&suche=${encodeURIComponent($('#fs').value)}&belegart=${$('#fa').value}&status=${$('#fst').value}`);
    $('#bl').innerHTML = l.map(b=>`<tr class="klick" onclick="location.hash='#/beleg/${b.id}'"><td>${esc(ba(b.belegart).name)}</td><td>${esc(b.nummer||'(Entwurf)')}</td><td>${fmt(b.datum)}</td><td>${esc(b.adresse_kurz)}</td><td>${esc(b.betreff||'')}</td><td>${esc(b.projektnr||'')}</td><td class="r">${eur(b.netto)}</td><td><span class="pill st-${b.status}">${b.status}</span></td></tr>`).join('') || '<tr><td colspan="8" class="hinweis">Keine Belege.</td></tr>';
  };
  let t; $('#fs').oninput = () => { clearTimeout(t); t=setTimeout(laden, 250); }; $('#fa').onchange = laden; $('#fst').onchange = laden;
  await laden();
}
function menueAuf(sel, fn){
  const m = $(sel); m.querySelector('.btn').onclick = e => { e.stopPropagation(); m.classList.toggle('auf'); };
  m.querySelectorAll('.ddl button').forEach(b => b.onclick = () => { m.classList.remove('auf'); fn(b.dataset.a); });
  document.addEventListener('click', () => m.classList.remove('auf'), {once:true});
}

async function seiteBelegNeu(code, Q = new URLSearchParams()){
  const art = ba(code);
  const vk = art.bereich==='VK';
  const b = {id:null, belegart:code, belegart_name:art.name, bereich:art.bereich, status:'entwurf', datum:heute(), positionen:[], kette:[], folgearten:[],
             kopftext: vk?E.kopftext_vk:E.kopftext_ek, fusstext: vk?E.fusstext_vk:E.fusstext_ek, adresse_id: +Q.get('adr') || null};
  if (Q.get('kopie')){ const k = await api('belege/' + Q.get('kopie'));
    Object.assign(b, {adresse_id:k.adresse_id, projekt_id:k.projekt_id, betreff:k.betreff, ihre_referenz:k.ihre_referenz, zahlungsbed_id:k.zahlungsbed_id, kopftext:k.kopftext, fusstext:k.fusstext,
      positionen: k.positionen.map(p => ({artikel_id:p.artikel_id, text:p.text, menge:p.menge, me:p.me, einzelpreis:p.einzelpreis, rabatt_pct:p.rabatt_pct, steuer_pct:p.steuer_pct}))}); }
  if (Q.get('art')){ const a = await api('artikel/' + Q.get('art'));
    b.positionen = [{artikel_id:a.id, text:a.bezeichnung, me:a.me, menge:1, einzelpreis: vk ? a.vk_preis : a.ek_preis, steuer_pct:a.steuer_pct}]; }
  await belegMaske(b);
}
async function seiteBeleg(id){ await belegMaske(await api('belege/'+id)); }

async function belegMaske(b){
  const vk = b.bereich==='VK';
  const [adr, art, proj] = await Promise.all([api('adressen?rolle='+(vk?'kunde':'lieferant')), api('artikel'), api('projekte')]);
  const gesperrt = b.status!=='entwurf';
  const mitCharge = ['WK','LS','RE','GS'].includes(b.belegart), istWK = b.belegart === 'WK', istLS = b.belegart === 'LS';

// ================================================================ Stammdaten-Muster (wie myfactory: Liste oben, Knopfreihe, Reiter, Speichern/Schließen)
function blaetternBinden(cfg){
  // cfg: {tbody, anz, zur, vor, zeile(row) -> html, klick(row,tr)}
  let rows = [], seite = 0; const PRO = 50;
  const male = () => {
    const von = seite * PRO, teil = rows.slice(von, von + PRO);
    $(cfg.tbody).innerHTML = teil.map(cfg.zeile).join('') || `<tr><td colspan="9" class="hinweis">Keine Datensätze.</td></tr>`;
    $(cfg.anz).textContent = rows.length ? `Datensätze ${von + 1} – ${von + teil.length} von ${rows.length}` : 'Keine Datensätze';
    $(cfg.tbody).querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => { $(cfg.tbody).querySelectorAll('tr').forEach(x => x.classList.toggle('sel', x === tr)); cfg.klick(+tr.dataset.id); });
  };
  $(cfg.zur).onclick = () => { if (seite > 0){ seite--; male(); } };
  $(cfg.vor).onclick = () => { if ((seite + 1) * 50 < rows.length){ seite++; male(); } };
  return { setze(r){ rows = r; seite = 0; male(); }, get rows(){ return rows; } };
}

      <div class="reiter">${[['grundlagen','Grundlagen'],['ekvk','Einkauf/Verkauf'],['aplan','Arbeitsplan'],['kalk','Kalkulation'],['kpreise','Kundenpreise'],['kz','Kennzeichen'],['bestaende','Bestände']].map(([k,t])=>`<button data-r="${k}" class="${reiter===k?'on':''}">${t}</button>`).join('')}</div>
      <div id="rR"></div>
      <div class="fussreihe"><button class="btn pri" id="rSp" data-ak="s">${ak('Speichern','S')}</button><button class="btn" id="rSchl" data-ak="c">S<u>c</u>hließen</button></div></div>`;
    const R = $('#rR');
    if (reiter==='grundlagen') R.innerHTML = `<div class="raster">${f('artikelnr','Artikelnummer')}${f('kurz','Kurzbezeichnung')}${f('bezeichnung','Bezeichnung')}${f('gruppe','Artikelgruppe')}${f('me','Basismengeneinheit')}
      <div class="feld"><label>Lagerführung</label><select id="r_lagerfuehrung"><option value="1" ${a.lagerfuehrung?'selected':''}>ja</option><option value="0" ${!a.lagerfuehrung?'selected':''}>nein (Dienstleistung)</option></select></div>
      <div class="feld"><label>Status</label><select id="r_inaktiv"><option value="0" ${!a.inaktiv?'selected':''}>aktiv</option><option value="1" ${a.inaktiv?'selected':''}>inaktiv</option></select></div></div>
      <div class="feld" style="margin-top:10px;max-width:260px"><label>Gewicht je ${esc(a.me||'Stk')} in kg (für den Lieferschein)</label><input id="r_gewicht_kg" class="zahl" value="${a.gewicht_kg!=null?zahl(a.gewicht_kg):''}" placeholder="z. B. 0,02"></div>
      <p class="hinweis">Arbeitsgänge mit Toleranzen pflegst du im Reiter „Arbeitsplan“.</p>`;
    if (reiter==='aplan'){ a.arbeitsplan_liste = a.arbeitsplan_liste || [];
      const zeile = (x,i) => `<tr data-i="${i}"><td style="width:110px"><input class="apNr" value="${esc(x.nr||'')}" placeholder="AG000019"></td><td><input class="apT" value="${esc(x.text||'')}" placeholder="z. B. Nut fräsen"></td>
        <td><input class="apTol" value="${esc(x.toleranz||'')}" placeholder="z. B. 12 mm ±0,1"></td><td style="text-align:center"><input type="checkbox" class="apP" style="width:auto" ${x.pruef?'checked':''}></td>
        <td style="white-space:nowrap"><button class="btn apHoch" title="nach oben" ${i?'':'disabled'}>↑</button><button class="btn rot apX" title="entfernen">✕</button></td></tr>`;
      R.innerHTML = `<table><thead><tr><th>Nr.</th><th>Arbeitsgang</th><th>Maß / Toleranz / Hinweis</th><th>Prüfschritt</th><th></th></tr></thead><tbody id="apL">${a.arbeitsplan_liste.map(zeile).join('')}</tbody></table>
        <button class="btn" id="apNeu" style="margin-top:6px">+ Arbeitsgang</button>
        <p class="hinweis">Reihenfolge = Ablauf in der Werkstatt. Leer = allgemeine Liste aus den Einstellungen (${esc(E.arbeitsgaenge||'')}). Die Werkstatt sieht beim Starten nur diese Arbeitsgänge; der Fortschritt je Charge rechnet damit.
        Auf Auftragsbestätigung und Lieferschein erscheint der Arbeitsplan als Unterzeilen, wenn er im Formular-Baukasten eingeschaltet ist.</p>`;
      const nimm = () => { a.arbeitsplan_liste = [...$$('#apL tr')].map(tr => ({nr:tr.querySelector('.apNr').value.trim(), text:tr.querySelector('.apT').value.trim(), toleranz:tr.querySelector('.apTol').value.trim(), pruef:tr.querySelector('.apP').checked})); };
      $('#apNeu').onclick = () => { nimm(); a.arbeitsplan_liste.push({}); male(); setTimeout(() => { const l = $$('#apL .apT'); if (l.length) l[l.length-1].focus(); }); };
      $('#apL').onclick = e => { const tr = e.target.closest('tr'); if (!tr) return; const i = +tr.dataset.i;
        if (e.target.classList.contains('apX')){ nimm(); a.arbeitsplan_liste.splice(i,1); male(); }
        if (e.target.classList.contains('apHoch') && i){ nimm(); const l = a.arbeitsplan_liste; [l[i-1], l[i]] = [l[i], l[i-1]]; male(); } }; }
    if (reiter==='ekvk') R.innerHTML = `<div class="raster">${f('vk_preis','VK-Preis €','zahl')}${f('ek_preis','EK-Preis €','zahl')}${f('steuer_pct','MwSt. %','zahl')}
      <div class="feld"><label>Hauptlieferant</label><select id="r_hauptlieferant_id"><option value="">–</option>${lief.map(l=>`<option value="${l.id}" ${l.id===a.hauptlieferant_id?'selected':''}>${esc(l.lieferantennr)} · ${esc(l.kurz)}</option>`).join('')}</select></div></div>
      ${a.vk_preis?`<p class="hinweis">Rohertrag ${eur(a.vk_preis-a.ek_preis)} € (${Math.round((a.vk_preis-a.ek_preis)/a.vk_preis*100)} %)</p>`:''}`;
    if (reiter==='kalk'){ const k = a.kalk || {}; const kf = (n,l,ph) => `<div class="feld"><label>${l}</label><input class="kalk zahl" data-n="${n}" value="${k[n]!=null?zahl(k[n]):''}" placeholder="${ph||''}"></div>`;
      R.innerHTML = `<p class="hinweis" style="margin-top:0">Einfach gehalten: nur ausfüllen, was ihr braucht. Lohnbearbeitung: Material stellt meist der Kunde.</p>
        <div class="raster">${kf('ruestzeit_min','Rüstzeit je Los (min)')}${kf('losgroesse','Losgröße (Stk)','z. B. 500')}${kf('stueckzeit_min','Bearbeitungszeit je Stück (min)')}${kf('stundensatz','Maschinenstundensatz (€/h)','z. B. 65')}${kf('material','Material je Stück (€)','0 bei Kundenmaterial')}${kf('fremd','Fremdleistung je Stück (€)','z. B. Härten')}${kf('aufschlag_pct','Aufschlag (%)','z. B. 15')}</div>
        <div class="info" style="margin-top:12px" id="kErg"></div><button class="btn" id="kUeb" style="margin-top:8px">Als VK-Preis übernehmen</button>`;
      const rechneK = () => { const v = n => num($(`.kalk[data-n="${n}"]`).value); const los = v('losgroesse') || 1;
        const zeit = v('ruestzeit_min') / los + v('stueckzeit_min'); const fert = zeit / 60 * v('stundensatz');
        const selbst = fert + v('material') + v('fremd'); const vkp = selbst * (1 + v('aufschlag_pct') / 100);
        a._kalkVK = Math.round(vkp * 100) / 100;
        $('#kErg').innerHTML = `Zeit je Stück <b>${zahl(Math.round(zeit*100)/100)} min</b> · Fertigung ${eur(fert)} € · Selbstkosten <b>${eur(selbst)} €</b> · <b>Preisvorschlag ${eur(vkp)} € / Stk</b>${a.vk_preis?` <span class="hinweis">(aktuell ${eur(a.vk_preis)} €)</span>`:''}`; };
      R.querySelectorAll('.kalk').forEach(i => i.oninput = rechneK); rechneK();
      $('#kUeb').onclick = () => { merken(); a.vk_preis = a._kalkVK; toast(`VK-Preis ${eur(a.vk_preis)} € übernommen – bitte speichern.`); }; }
    if (reiter==='kpreise') { if (a.id) kundenpreiseZeichnen(R, {artikel_id: a.id}); else R.innerHTML = '<p class="hinweis">Bitte den Artikel zuerst speichern.</p>'; }
    if (reiter==='kz') { if (a.id) kennzeichenZeichnen(R, 'artikel', a.id); else R.innerHTML = '<p class="hinweis">Bitte den Artikel zuerst speichern.</p>'; }
    if (reiter==='bestaende') R.innerHTML = `<div class="raster">${f('meldebestand','Meldebestand','zahl')}</div>
      ${a.id&&a.lagerfuehrung?`<div class="info" style="margin-top:12px">Bestand <b>${zahl(a.bestand)} ${esc(a.me)}</b> · in Aufträgen ${zahl(a.reserviert)} · verfügbar <b>${zahl(a.verfuegbar)}</b></div>
      <table style="margin-top:8px"><thead><tr><th>Datum</th><th>Beleg</th><th>Text</th><th class="r">Menge</th></tr></thead><tbody>${(a.bewegungen||[]).map(b=>`<tr><td>${fmt(b.datum)}</td><td>${esc(b.nummer||'')}</td><td>${esc(b.text||'')}</td><td class="r" style="color:${b.menge<0?'var(--red)':'var(--green)'}">${b.menge>0?'+':''}${zahl(b.menge)}</td></tr>`).join('')}</tbody></table>`:'<p class="hinweis">Ohne Lagerführung bzw. noch nicht gespeichert.</p>'}`;
    $('#ard').querySelectorAll('.reiter button').forEach(b => b.onclick = () => { merken(); reiter = b.dataset.r; male(); });
    $('#rSp').onclick = async () => { merken(); const kz = reiter==='kz' && a.id ? kennzeichenWerte($('#rR')) : null; const d = {...a}; delete d.bewegungen;
      const n = await api('artikel',{body:d}); if (kz) await api(`kennzeichen/artikel/${n.id}`, {body:{werte:kz}}); toast('Gespeichert.'); Object.assign(a, n); gewaehlt(a); await neuLaden(); male(); };
    $('#rSchl').onclick = () => schliesseReiter(TABS.indexOf(AKT));
  };
  const merken = () => {
    ['artikelnr','kurz','bezeichnung','gruppe','me'].forEach(k => { const e = $('#r_'+k); if (e) a[k] = e.value || null; });
    if ($('#apL')){ a.arbeitsplan_liste = [...$$('#apL tr')].map(tr => ({nr:tr.querySelector('.apNr').value.trim(), text:tr.querySelector('.apT').value.trim(), toleranz:tr.querySelector('.apTol').value.trim(), pruef:tr.querySelector('.apP').checked})).filter(x => x.text);
      a.arbeitsplan = a.arbeitsplan_liste; }
    ['vk_preis','ek_preis','steuer_pct','meldebestand'].forEach(k => { const e = $('#r_'+k); if (e) a[k] = num(e.value); });
    if ($('#r_gewicht_kg')) a.gewicht_kg = $('#r_gewicht_kg').value.trim() ? num($('#r_gewicht_kg').value) : null;
    if ($('#r_lagerfuehrung')) a.lagerfuehrung = +$('#r_lagerfuehrung').value;
    if ($('#r_inaktiv')) a.inaktiv = +$('#r_inaktiv').value;
    if ($('#r_hauptlieferant_id')) a.hauptlieferant_id = +$('#r_hauptlieferant_id').value || null;
    if ($$('.kalk').length){ a.kalk = {}; $$('.kalk').forEach(i => { if (i.value.trim() !== '') a.kalk[i.dataset.n] = num(i.value); }); }
  };
  male();
}

  const adr = await api('adressen?rolle=kunde');
  M().innerHTML = `<div class="kopfzeile"><h1>Projekte</h1><span class="sp"></span><button class="btn pri" id="pNeu">Neues Projekt</button></div>

  const neuDlg = () => dialog('Neues Projekt', '', `<div class="zeile"><label>Titel</label><input id="np_t"></div>
    <div class="zeile"><label>Kunde</label><select id="np_k"><option value="">–</option>${adr.map(a=>`<option value="${a.id}">${esc(a.kundennr)} · ${esc(a.kurz)}</option>`).join('')}</select></div>

    <div class="zeile"><label>Vorlage</label><select id="np_v"><option value="">leer</option><option value="sonder">Sondermaschine (8 Schritte)</option><option value="serie">Serienteil (6 Schritte)</option></select></div>

      const H=new Date(); const d=n=>{const x=new Date(H);x.setDate(x.getDate()+n);return iso(x);};
      const V={sonder:[['Auftrag bestätigt',0,0,1,'AB','Büro'],['Konstruktion',1,14,0,null,'Konstruktion'],['Freigabe Zeichnung durch Kunde',15,20,1,null,'Kunde'],['Material bestellt',21,22,0,'BE','Einkauf'],['Material eingetroffen',22,35,0,'WE','Lager'],['Fertigung & Montage',36,55,0,null,'Werkstatt'],['Auslieferung',58,58,1,'LS','Versand'],['Abnahme beim Kunden',62,62,1,null,'Projektleitung']],
               serie:[['Auftrag bestätigt',0,0,1,'AB','Büro'],['Material bestellt',1,2,0,'BE','Einkauf'],['Material eingetroffen',2,10,0,'WE','Lager'],['Fertigung',11,20,0,null,'Werkstatt'],['Prüfung',21,22,0,null,'QS'],['Lieferung',24,24,1,'LS','Versand']]}[$('#np_v').value]||[];
      const p = await api('projekte',{body:{titel:t,kunde_id:+$('#np_k').value||null,ansprechpartner:$('#np_a').value,meilensteine:V.map(([ti,s,e,ms,au,w])=>({titel:ti,plan_start:d(s),plan_ende:d(e),ist_meilenstein:ms,ausloeser:au,verantwortlich:w}))}});
      location.hash='#/projekt/'+p.id; }]]);
  $('#pNeu').onclick = neuDlg;

}

    <label><input type="checkbox" id="ms_m" style="width:auto"> Meilenstein (Zeitpunkt statt Zeitraum)</label>`,

  const oeffne = i => { if (ANSICHT==='kunde') return; schrittDialog(p, p.meilensteine[i], id); };
  M().querySelectorAll('tr.klick[data-i], .gl .r[data-i], .bar[data-i], .ms[data-i]').forEach(e => e.onclick = () => oeffne(+e.dataset.i));
}

function schrittDialog(p, m, pid){
  const body = `<div class="zeile"><label>Zugesagt</label><div>${fmt(m.zugesagt)}</div></div><div class="zeile"><label>Plan aktuell</label><div>${fmt(m.plan_start)} – <b>${fmt(m.plan_ende)}</b></div></div>
    <div class="zeile"><label>Erledigt</label><div>${fmt(m.ist_ende)}</div></div>

function zeichneGantt(ms){
  if (!ms.length){ $('#gl').innerHTML='<div class="h">Noch keine Schritte</div>'; return; }
  const alle = ms.flatMap(s=>[s.plan_start,s.plan_ende,s.zugesagt,s.ist_ende].filter(Boolean)).concat([heute()]);
  const min = alle.reduce((a,b)=>a<b?a:b), max = alle.reduce((a,b)=>a>b?a:b);
  const von = dt(min); von.setDate(von.getDate()-((von.getDay()+6)%7)-7);
  const bis = dt(max); bis.setDate(bis.getDate()+10);
  const n = Math.round((bis-von)/86400000);
  const W = Math.max(8, Math.min(28, Math.floor(($('#gr').clientWidth||900)/n)));
  const x = s => Math.round((dt(s)-von)/86400000)*W;
  const kw = t => { const u=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())); const d=u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-d); const y=new Date(Date.UTC(u.getUTCFullYear(),0,1)); return Math.ceil(((u-y)/86400000+1)/7); };
  let kopf='', gitter='', lm=-1;
  for (let i=0;i<n;i++){ const t=new Date(von); t.setDate(t.getDate()+i);
    if (t.getDay()===1){ if (W*7>=34) kopf+=`<div class="wk" style="left:${i*W}px">KW ${kw(t)}</div>`; gitter+=`<div class="grid" style="left:${i*W}px"></div>`; }
    if (t.getMonth()!==lm){ lm=t.getMonth(); kopf+=`<div class="mo" style="left:${i*W}px">${t.toLocaleDateString('de-DE',{month:'short',year:'2-digit'})}</div>`; } }
  const hx = x(heute());
  $('#gi').style.width = n*W+'px';
  $('#gi').innerHTML = `<div class="h">${kopf}</div>` + ms.map((s,i)=>{ let el='';
    const ende = s.ist_ende || s.plan_ende;
    if (tage(s.zugesagt, ende) > 0) el += `<div class="shift" style="left:${x(s.zugesagt)+W}px;width:${x(ende)-x(s.zugesagt)}px"></div>`;
    el += `<div class="base" style="left:${x(s.zugesagt)+W-1}px" title="Zugesagt ${fmt(s.zugesagt)}"></div>`;
    el += s.ist_meilenstein ? `<div class="ms s-${s.status}" data-i="${i}" style="left:${x(s.plan_ende)+W/2}px" title="${esc(s.titel)}"></div>`
                            : `<div class="bar s-${s.status}" data-i="${i}" style="left:${x(s.plan_start)}px;width:${Math.max(W,x(s.plan_ende)-x(s.plan_start)+W)}px" title="${esc(s.titel)}: ${fmt(s.plan_start)} – ${fmt(s.plan_ende)}"></div>`;
    if (s.ist_ende) el += `<div class="ist ${s.status==='ok'?'':'late'}" style="left:${x(s.ist_ende)+W/2}px" title="Erledigt ${fmt(s.ist_ende)}">✓</div>`;
    return `<div class="r">${gitter}${el}</div>`; }).join('') + `<div class="heute" style="left:${hx+W/2}px"><span>Heute</span></div>`;
  $('#gl').innerHTML = `<div class="h">Schritt</div>` + ms.map((s,i)=>`<div class="r" data-i="${i}"><span class="hinweis" style="width:16px;text-align:right">${s.pos}</span><span class="pill s-${s.status}" style="width:10px;height:10px;padding:0"></span><span class="x">${esc(s.titel)}</span></div>`).join('');
  const gr=$('#gr'); gr.scrollLeft = Math.max(0, hx - gr.clientWidth*0.5);
}

// ================================================================ Dokumente
function dokumenteDialog(objekt, id, liste, neuLaden, hinweis){
  const zeile = d => `<tr><td><a href="api/dokumente/${d.id}" target="_blank">📄 ${esc(d.name)}</a></td><td class="hinweis">${esc(d.herkunft || '')}</td><td class="hinweis">${fmt(d.hochgeladen)} ${esc(d.von||'')}</td><td class="r hinweis">${Math.max(1, Math.round((d.groesse||0)/1024))} KB</td></tr>`;
  dialog('Dokumente', hinweis || '', `<table><tbody>${liste.map(zeile).join('') || '<tr><td class="hinweis">Noch keine Dokumente.</td></tr>'}</tbody></table>
    ${id ? `<label class="btn pri" style="justify-self:start">＋ Datei hochladen<input type="file" id="dokF" multiple style="display:none"></label>` : '<p class="hinweis">Bitte den Beleg zuerst speichern.</p>'}
    <p class="hinweis">Dokumente am Wareneingang oder an der Charge erscheinen automatisch auch bei Lieferschein und Rechnung dieser Charge.</p>`, [['Schließen','']]);
  const f = document.getElementById('dokF'); if (!f) return;
  f.onchange = async () => {
    for (const datei of f.files){
      if (datei.size > 25e6){ toast(`${datei.name}: größer als 25 MB`, true); continue; }
      const daten = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(datei); });
      await api('dokumente', {body:{objekt, objekt_id:id, name:datei.name, mime:datei.type, daten}});
    }
    toast('Hochgeladen.'); document.getElementById('dlg').close(); neuLaden();
  };
}

    const L = $('#foL'), q = s => L.querySelectorAll(s);

    q('.foU').forEach(x => x.onclick = () => tausch(+x.dataset.i, +x.dataset.i - 1));
    q('.foD').forEach(x => x.onclick = () => tausch(+x.dataset.i, +x.dataset.i + 1));
    L.querySelector('#foPr').onchange = e => { fo.preise = e.target.checked; zeichne(); vorschau(); };
    q('.foB').forEach(x => x.onchange = () => { fo.bloecke[x.dataset.k] = x.checked; vorschau(); });
    L.querySelector('#foTi').oninput = e => { fo.titel = e.target.value; vorschau(); };
    L.querySelector('#foZt').oninput = e => { fo.zusatztext = e.target.value; vorschau(); };

    L.querySelector('#foKo').onchange = e => { fo.kopf = e.target.value; vorschau(); };
    L.querySelector('#foUs').oninput = e => { fo.unterschriften = e.target.value; vorschau(); };

      const img = await new Promise((ok, nein) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nein; i.src = URL.createObjectURL(f); });
      const cv = document.createElement('canvas'); cv.width = 1240; cv.height = 1754;               // A4 mit 150 dpi reicht für den Druck
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      E = await api('einstellungen', {body:{briefpapier_bild: cv.toDataURL('image/jpeg', 0.82)}}); toast('Briefpapier-Bild gespeichert.'); zeichne(); vorschau(); };

    L.querySelector('#foRu').oninput = e => { fo.rand_unten = num(e.target.value); vorschau(); };
  };
  zeichne(); vorschau();
  const alle = () => { try { return JSON.parse(E.formular || '{}'); } catch(_){ return {}; } };
  $('#foArt').onchange = e => location.hash = '#/formulare/' + e.target.value;
  $('#foSp').onclick = async () => { const a = alle(); const {charge, verpackung, ...rest} = fo; a[art] = rest;

    E = await api('einstellungen', {body:{formular: JSON.stringify(a)}}); toast('Auf Standard zurückgesetzt.'); seiteFormulare(art); };
}

async function sammelPositionen(aid, kunde){
  const l = await api('offene_positionen?adresse=' + aid);

      <td><input class="slM zahl" data-i="${i}" value="${p.vorschlag > 0 ? zahl(p.vorschlag) : ''}" style="width:90px" ${fehlt ? 'disabled' : ''}></td></tr>`; }).join('');

     <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="slAlle">Alle</button><button class="btn" id="slKeine">Keine</button><span class="sp"></span><span class="hinweis" id="slInfo"></span></div>`,
    [['‹ Anderer Kunde','', () => { setTimeout(sammelLieferschein); return false; }], ['Abbrechen',''],
     ['Lieferschein erstellen','pri', async () => {
       const auswahl = [...document.querySelectorAll('.slH:checked')].map(c => ({pos_id: l[+c.dataset.i].pos_id, menge: num(document.querySelector(`.slM[data-i="${c.dataset.i}"]`).value)}));
       if (!auswahl.length){ toast('Bitte Positionen anhaken.', true); return false; }
       const ls = await api('lieferschein/sammel', {body:{adresse_id: aid, auswahl}});
       toast(`Lieferschein-Entwurf mit ${auswahl.length} Position${auswahl.length==1?'':'en'} angelegt.`); location.hash = '#/beleg/' + ls.id; }]]);
  document.getElementById('dlg').style.width = 'min(1100px, 96vw)';
  const info = () => { document.getElementById('slInfo').textContent = `${document.querySelectorAll('.slH:checked').length} ausgewählt`; };
  document.querySelectorAll('.slH').forEach(c => c.onchange = info);
  document.querySelectorAll('.slM').forEach(m => m.oninput = () => { const c = document.querySelector(`.slH[data-i="${m.dataset.i}"]`); if (m.value.trim()) c.checked = true; info(); });
  document.getElementById('slAlle').onclick = () => { document.querySelectorAll('.slH:not(:disabled)').forEach(c => c.checked = true); info(); };
  document.getElementById('slKeine').onclick = () => { document.querySelectorAll('.slH').forEach(c => c.checked = false); info(); };
  info();
}

const AUSSCHUSS_GRUENDE = ['Bohrer gebrochen', 'Gewinde ausgerissen', 'Maß außer Toleranz', 'Rohteil fehlerhaft', 'Einrichtteile'];
const dauer = min => { min = Math.max(0, Math.round(min)); return `${Math.floor(min/60)}:${String(min%60).padStart(2,'0')} h`; };
const pal = f => f.palette ? `Palette ${esc(f.palette)}` : 'ohne Palette';
let pdTimer = null;
async function produktionZeichnen(box){
  const d = await api('produktion');
  const geladen = Date.now();
  const karte = f => `<div class="pd-karte ${f.status}" data-id="${f.id}">

  box.innerHTML = `<div class="pd-kopf"><button class="btn pri pd-start" id="pdNeu">▶ Palette / Charge starten</button><span class="sp"></span><button class="btn" id="pdAkt">⟳ Aktualisieren</button></div>

    ${d.erledigt.length ? `<h3 style="margin:22px 0 8px;color:var(--mute)">Heute / gestern fertig gemeldet</h3>
    <div class="card"><table><thead><tr><th>Ende</th><th>Charge</th><th>Palette</th><th>Arbeitsgang</th><th>Wer</th><th class="r">Gut</th><th class="r">Ausschuss</th><th class="r">Dauer</th><th>Versand</th><th></th></tr></thead><tbody>
    ${d.erledigt.map(f=>`<tr data-id="${f.id}"><td>${fmt(f.ende)} ${new Date(f.ende).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${esc(f.chargennr)}</b> <span class="hinweis">${esc(f.kunde_kurz)}</span></td><td>${esc(f.palette||'')}</td><td>${esc(f.arbeitsgang)}${f.maschine?` <span class="hinweis">${esc(f.maschine)}</span>`:''}</td><td>${esc(f.mitarbeiter||'')}</td><td class="r">${zahl(f.menge_gut)}</td><td class="r" style="color:${f.menge_ausschuss?'var(--red)':''}">${f.menge_ausschuss?zahl(f.menge_ausschuss):''}</td><td class="r">${dauer(f.minuten)}</td><td>${f.freigabe ? '<span class="pill st-verarbeitet">📦 frei</span>' : '<button class="btn pd-frei-btn" title="Gutmenge für den Lieferschein freigeben">📦 freigeben</button>'}</td><td><button class="btn pd-zur" title="Fertigmeldung zurücknehmen">↶</button></td></tr>`).join('')}</tbody></table></div>` : ''}`;
  const neu = () => produktionZeichnen(box);

  box.querySelectorAll('.pd-weiter').forEach(b => b.onclick = async () => { await api(`fertigung/${finde(b).id}/weiter`, {body:{}}); neu(); });
  box.querySelectorAll('.pd-ende').forEach(b => b.onclick = () => produktionEnde(finde(b), neu));

  clearInterval(pdTimer);

    box.querySelectorAll('.pd-zeit').forEach(z => { if (!z.dataset.pause) z.textContent = dauer(+z.dataset.min + (Date.now() - geladen) / 60000); }); }, 20000);
