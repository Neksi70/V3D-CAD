;; ---------------------------------------------------------------
;; V3D Anrufannahme — Anmeldung als IP-Telefon an der Fritzbox
;; Wird von install.sh nach /etc/asterisk/pjsip.d/ gelegt.
;; Platzhalter @@REGISTRAR@@ / @@USER@@ / @@PASS@@ setzt install.sh
;; aus ~/v3dcall/config.json ein.
;; ---------------------------------------------------------------

[transport-udp]
type            = transport
protocol        = udp
bind            = 0.0.0.0:5060

;; --- Zugangsdaten ---------------------------------------------
[fritzbox_auth]
type            = auth
auth_type       = userpass
username        = @@USER@@
password        = @@PASS@@

;; --- Anmeldung (Registration) ---------------------------------
[fritzbox_reg]
type            = registration
transport       = transport-udp
outbound_auth   = fritzbox_auth
server_uri      = sip:@@REGISTRAR@@
client_uri      = @@CLIENTURI@@
contact_user    = @@USER@@
retry_interval  = 60
forbidden_retry_interval = 600
expiration      = 600
line            = yes
endpoint        = fritzbox

;; --- Gegenstelle ----------------------------------------------
[fritzbox]
type            = aor
contact         = sip:@@REGISTRAR@@:5060
qualify_frequency = 60

[fritzbox]
type            = endpoint
transport       = transport-udp
context         = v3dcall
aors            = fritzbox
outbound_auth   = fritzbox_auth
from_user       = @@USER@@
from_domain     = @@REGISTRAR@@
disallow        = all
allow           = alaw
allow           = ulaw
direct_media    = no
force_rport     = yes
rewrite_contact = yes
rtp_symmetric   = yes
dtmf_mode       = rfc4733
language        = de

[fritzbox]
type            = identify
endpoint        = fritzbox
match           = @@REGISTRAR@@
