<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3D ERP</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e2e6ed;--nav:#1d2433;--blue:#2f6fde;--green:#1f9d55;--orange:#e08a00;--red:#d64545;--yellow:#e6b800;--row:42px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:#cfd6e6;padding:12px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{color:#fff;font-weight:700;font-size:17px;padding:4px 18px 14px}
nav .logo small{display:block;font-weight:400;font-size:11px;color:#8e98b0}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7d879f;padding:14px 18px 4px}
nav a{display:block;color:#cfd6e6;padding:7px 18px;border-left:3px solid transparent}
nav a:hover{background:#262f42;color:#fff}
nav a.on{background:#2b3550;color:#fff;border-left-color:var(--blue)}
nav .unten{padding:16px 18px;font-size:12px;color:#7d879f}nav .unten a{display:inline;padding:0;border:0;color:#9fb4e8}
main{padding:16px 20px;min-width:0}
.kopfzeile{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kopfzeile h1{font-size:21px;margin:0;font-weight:600}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.rot{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f6f7fa;color:#4b5366}
input.zahl{text-align:right}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fafbfd;position:sticky;top:0}
td.r,th.r{text-align:right}
tr.klick{cursor:pointer} tr.klick:hover{background:#f2f6fd} tr.sel{background:#e7effc!important}
.liste{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.filter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter input{max-width:280px}.filter select{max-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .z{font-size:22px;font-weight:700}.kpi .t{color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;color:#fff;white-space:nowrap}
.st-entwurf{background:#8d96aa}.st-verarbeitet{background:var(--green)}.st-storniert{background:var(--red)}
.s-ok{background:var(--green)}.s-late{background:var(--orange)}.s-risk{background:var(--yellow);color:#4a3b00}.s-over{background:var(--red)}.s-open{background:var(--blue)}.s-fut{background:#b8c6e6;color:#1d2433}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.feld label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.hinweis{font-size:12px;color:var(--mute)}
.kette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kette a{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink);background:#fafbfd}
.kette a.akt{border-color:var(--blue);background:#e7effc}
.kette .pfeil{color:var(--mute)}
.reiter{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.reiter button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.reiter button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.pos td{padding:4px}.pos input{padding:4px 6px}
.summe{display:grid;grid-template-columns:auto 130px;gap:2px 16px;justify-content:end;margin-top:10px}
.summe .r{text-align:right}.summe b{font-size:16px}
.info{background:#f6f9ff;border:1px solid #dbe6fb;border-radius:8px;padding:8px 12px;font-size:13px}
.menue{position:relative;display:inline-block}
.menue .ddl{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;min-width:220px}
.menue.auf .ddl{display:block}
.ddl button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.ddl button:hover{background:#f2f6fd}
/* Zeitstrahl */
.gantt{display:grid;grid-template-columns:250px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gl{background:#fafbfd;border-right:1px solid var(--line)}
.gl .h,.gr .h{height:46px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.gl .h{display:flex;align-items:end;padding:0 10px 6px}
.gl .r{height:var(--row);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden}
.gl .r .x{overflow:hidden;text-overflow:ellipsis}
.gl .r:hover{background:#eef3fc}
.gr{overflow-x:auto;position:relative}
.gr .inner{position:relative}
.gr .h{position:relative}
.wk{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:11px;padding:3px 0 0 4px;color:var(--mute)}
.mo{position:absolute;top:22px;font-size:11px;font-weight:600;color:var(--ink);padding-left:4px;white-space:nowrap}
.gr .r{height:var(--row);border-bottom:1px solid var(--line);position:relative}
.grid{position:absolute;top:0;bottom:0;border-left:1px dashed #edf0f5}
.heute{position:absolute;top:0;bottom:0;border-left:2px solid var(--blue);z-index:3}
.heute span{position:absolute;top:2px;left:3px;font-size:10px;color:var(--blue);font-weight:700;background:#fff;padding:0 2px}
.bar{position:absolute;top:12px;height:18px;border-radius:4px;z-index:2;cursor:pointer;min-width:6px}
.ms{position:absolute;top:12px;width:17px;height:17px;transform:rotate(45deg);margin-left:-8px;border-radius:3px;z-index:2;cursor:pointer}
.base{position:absolute;top:7px;height:28px;width:0;border-left:3px solid #8d96aa;z-index:1}
.shift{position:absolute;top:20px;height:0;border-top:2px dashed var(--red);z-index:1}
.ist{position:absolute;top:10px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:2px solid var(--green);z-index:4;font-size:13px;line-height:18px;text-align:center;color:var(--green);font-weight:700}
.ist.late{border-color:var(--orange);color:var(--orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grund{font-size:12px;color:#8a4b00}
body.kunde .intern{display:none!important}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,26,40,.45)}
.dk{padding:14px 18px;border-bottom:1px solid var(--line)}.dk h3{margin:0;font-size:17px}
.db{padding:14px 18px;display:grid;gap:10px}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.zeile{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.zeile label{color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.fehler{background:var(--red)}
.login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:10px}
.druck{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;padding:6px}nav .grp,nav .unten{display:none}nav .logo{padding:6px 10px}nav a{padding:6px 10px;border-left:0}.gantt{grid-template-columns:140px 1fr}}
@media print{
  nav,.noprint,.kopfzeile .btn,.df{display:none!important}
  .app{display:block} main{padding:0} body{background:#fff}
  .card{border:0;padding:4px 0}
  .intern{display:none!important}
  body.belegdruck main>*{display:none!important}
  body.belegdruck .druck{display:block!important}
  @page{size:A4;margin:15mm}
  body.querformat{}
}
/* Briefansicht Belegerfassung */
.tisch{background:#dfe3ea;border-radius:10px;padding:22px 12px;overflow-x:auto}
.blatt{background:#fff;max-width:900px;min-width:720px;margin:0 auto;padding:34px 44px 30px;box-shadow:0 4px 18px rgba(0,0,0,.14);border-radius:2px}
.blatt input,.blatt select,.blatt textarea{border:1px solid transparent;background:#f5f7fb;border-radius:3px}
.blatt input:focus,.blatt select:focus,.blatt textarea:focus{border-color:var(--blue);background:#fff;outline:0}
.blatt.gesperrt input,.blatt.gesperrt select,.blatt.gesperrt textarea{background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.blatt.gesperrt select{appearance:none}.bk-wert{display:block;padding:2px 5px;white-space:normal;line-height:1.35}.blatt.gesperrt textarea{resize:none}.blatt.gesperrt textarea:placeholder-shown{display:none}
.bk-firma{text-align:right;font-weight:700;font-size:18px;letter-spacing:.02em}.bk-firma small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.bk-oben{display:flex;justify-content:space-between;gap:24px;margin:26px 0 18px}
.bk-links{width:46%}.bk-abs{font-size:9.5px;border-bottom:1px solid #444;padding-bottom:1px;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.bk-anschrift{min-height:96px;line-height:1.5}
.bk-kasten{width:330px;border:1px solid #444;padding:0 0 4px}
.bk-titel{background:#e9ecf1;border-bottom:1px solid #444;text-align:center;font-weight:700;font-size:17px;padding:4px}
.bk-z{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;padding:2px 8px;font-size:13px}
.bk-z>span:first-child{color:#444}
.bk-z input,.bk-z select{padding:2px 5px}
.bk-such{display:flex;gap:3px}.bk-such .btn{padding:0 7px}
.bk-zb{grid-template-columns:150px 260px;justify-content:end;padding:6px 0}
.bk-text{display:block;margin:8px 0;resize:vertical;font:inherit}
.bk-pos th{background:#e9ecf1;color:#333;border-bottom:1px solid #444;position:static}
.bk-pos td{border-bottom:1px solid #eceff4}
.statusleiste{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;flex-wrap:wrap}
@media (max-width:820px){.blatt{padding:18px;min-width:680px}}
.bk-logo{max-height:64px;max-width:260px;display:block;margin-left:auto}
.bk-fuss{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid #888;margin-top:22px;padding-top:6px;font-size:9.5px;color:#555;line-height:1.35}
.nurdruck{display:none}
@media print{.nurdruck{display:block;margin-bottom:8px}}
.druck .brief{font-size:12.5px}
.druck .absz{font-size:9px;border-bottom:1px solid #000;display:inline-block;margin-bottom:4px}
.druck .bk{border:1px solid #000;padding:6px 10px;width:250px;float:right}
.druck table th{background:none;border-bottom:1px solid #000;color:#000}
.druck table td{border-bottom:1px solid #ddd}
/* ===== myfactory-Look: Rahmen, Reiter, Seitenkopf (Farben über Thema) ===== */
:root{--akzent:#f39200}
nav{background:color-mix(in srgb,var(--blue) 22%,#0e1320)}
nav a:hover{background:color-mix(in srgb,var(--blue) 32%,#0e1320)}
nav a.on{background:color-mix(in srgb,var(--blue) 48%,#0e1320);border-left-color:var(--akzent)}
.bsuche{position:relative;margin:0 12px 8px}
.bsuche input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:18px;padding:7px 12px}
.bsuche input::placeholder{color:#aeb7cc}
.bs-erg{display:none;position:absolute;left:0;top:100%;margin-top:4px;width:440px;max-height:70vh;overflow:auto;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60}
.bs-erg.auf{display:block}
.bs-erg a{display:block;padding:6px 12px;color:var(--ink);border-left:0}
.bs-erg a:hover{background:#eef3fc;color:var(--ink)}
.bs-erg .typ{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 2px}
.schnell{display:flex;gap:6px;padding:2px 12px 8px}
.schnell button{flex:1;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:6px;padding:7px 0;cursor:pointer;font-size:15px}
.schnell button:hover,.schnell button.on{background:var(--blue)}
.mm-titel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9aa4bb;padding:10px 18px 4px}
.ordner{display:flex;align-items:center;gap:7px;cursor:pointer;color:#e6eaf3;font-weight:600;padding:7px 18px;user-select:none}
.ordner:hover{background:rgba(255,255,255,.06)}
.ordner .pf{display:inline-block;transition:transform .15s;font-size:9px;width:10px;opacity:.8}
.ordner.auf .pf{transform:rotate(90deg)}
.ordner+.inhalt-o{display:none}.ordner.auf+.inhalt-o{display:block}
.inhalt-o a{padding-left:36px}
main{padding:0!important;min-width:0;display:flex;flex-direction:column}
.reiterleiste{display:flex;gap:3px;background:color-mix(in srgb,var(--blue) 22%,#0e1320);padding:7px 10px 0;overflow-x:auto;position:sticky;top:0;z-index:30;min-height:41px}
.reiterleiste .rt{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);color:#dfe5f1;border-radius:7px 7px 0 0;padding:7px 9px 7px 13px;cursor:pointer;white-space:nowrap;font-size:13px;max-width:250px}
.reiterleiste .rt span{overflow:hidden;text-overflow:ellipsis}
.reiterleiste .rt:hover{background:rgba(255,255,255,.22)}
.reiterleiste .rt.on{background:var(--bg);color:var(--ink);font-weight:600}
.reiterleiste .rt i{font-style:normal;opacity:.55;padding:0 3px;border-radius:3px;font-size:12px}.reiterleiste .rt i:hover{opacity:1;background:rgba(0,0,0,.12)}
.seite{display:none;padding:12px 20px 24px}.seite.on{display:block}
.seitenkopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px}
.seitenkopf h2{margin:0;font-size:25px;font-weight:500;color:#39415a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-bs{border:2px solid var(--akzent);color:var(--akzent);border-radius:10px;padding:3px 16px;font-weight:600;font-size:13px;background:#fff;white-space:nowrap}
.kopficons{justify-self:end;display:flex;gap:2px}
.kopficons button{border:0;background:none;font-size:17px;cursor:pointer;color:#39415a;padding:4px 7px;border-radius:6px;line-height:1}
.kopficons button:hover{background:#e3e8f0}.kopficons button.fav{color:var(--akzent)}
.inhalt>.kopfzeile h1{display:none}
.inhalt>.kopfzeile:empty{display:none}
.werkz{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.werkz input.fi{max-width:230px}
.blaettern{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);padding:7px 4px 0;font-style:italic}
.blaettern button{border:0;background:none;cursor:pointer;font-size:15px;color:var(--mute);font-style:normal}
.knopfreihe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.fussreihe{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn u{text-underline-offset:2px}
.posknopf{padding:1px 6px!important;font-size:12px}
.artzelle{display:flex;gap:3px}
.hilfe kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;background:#fafbfd}
@media (max-width:820px){.seitenkopf{grid-template-columns:1fr auto}.badge-bs{display:none}.seite{padding:10px}}
.ws-kopf{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--blue) 22%,#0e1320);color:#fff;padding:10px 18px}
.ws-kopf img{height:40px;border-radius:3px}.ws-titel{font-size:22px;font-weight:600}
.ws-seite{padding:16px 18px}
.ws-bereiche{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.ws-bereiche .btn{font-size:16px;padding:10px 16px}
.ws-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.ws-karte{background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.ws-karte.fertig{opacity:.6;border-left-color:var(--green)}
.ws-proj{font-size:13px;color:var(--mute)}.ws-schritt{font-size:21px;font-weight:600;line-height:1.25}.ws-info{font-size:14px}
.ws-knoepfe{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.ws-knoepfe .btn{font-size:18px;padding:12px 18px;border-radius:8px}
.ws-ok{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;flex:1}
.ws-problem{color:#8a4b00}
.ws-gruende{display:flex;flex-wrap:wrap;gap:6px}.ws-gruende .btn{font-size:15px;padding:8px 12px}
.charge-alle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff8e6;border:1px solid #f3d38a;border-radius:6px;padding:8px 10px;margin:6px 0 10px}
.charge-alle input{max-width:220px}
.start-raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px;margin-top:14px}
.start-raster>.breit{grid-column:1/-1}.start-raster .card{margin:0}
.viz-kopf{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.viz-leg{display:flex;gap:12px;font-size:12px;color:var(--mute);align-items:center;flex-wrap:wrap;justify-content:flex-end}.viz-leg span{white-space:nowrap}.viz-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.viz-svg{width:100%;height:auto;display:block}
.viz-grid{stroke:#e9ecf1;stroke-width:1}.viz-basis{stroke:#c9cfda;stroke-width:1}
.viz-achse{font-size:11px;fill:var(--mute)}.viz-wert{font-size:11px;font-weight:600;fill:var(--ink)}
.viz-balken{display:grid;gap:6px}
.viz-zeile{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:2px 0;border-radius:4px}
.viz-zeile.klick{cursor:pointer}.viz-zeile:hover{background:#f3f6fb}
.viz-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viz-bahn{display:block;height:12px}.viz-bahn.doppelt{height:20px;display:grid;gap:2px}
.viz-bar{display:block;height:100%;border-radius:0 4px 4px 0;min-height:8px}
.viz-num{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.viz-tip{position:fixed;z-index:200;background:#1d2433;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}
.kpi.klick{cursor:pointer}.kpi.klick:hover{border-color:var(--blue)}
</style>
</head>
<body>
<div id="root"></div>
<div class="druck" id="druck"></div>
<dialog id="dlg"><div class="dk"><h3 id="dTitel"></h3><div class="hinweis" id="dSub"></div></div><div class="db" id="dBody"></div><div class="df" id="dFuss"></div></dialog>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ================================================================ Grundgerüst
let AKT = null; const TABS = [];
const $ = s => (AKT && AKT.el.querySelector(s)) || document.querySelector(s);   // zuerst im aktiven Reiter suchen
const $$ = s => (AKT ? AKT.el : document).querySelectorAll(s);

async function api(pfad, opt={}){
  const r = await fetch('api/'+pfad, {method: opt.method || (opt.body ? 'POST':'GET'), headers:{'Content-Type':'application/json','X-ERP':'1'},
                                     body: opt.body ? JSON.stringify(opt.body) : undefined, credentials:'same-origin'});
  const d = await r.json().catch(()=>({fehler:'Ungültige Antwort'}));
  if (r.status === 401){ zeigeLogin(); const f = new Error('login'); f.gezeigt = true; throw f; }
  if (!r.ok){ toast(d.fehler || 'Fehler', true); const f = new Error(d.fehler); f.gezeigt = true; throw f; }
  return d;
}
async function herunterladen(pfad, was){
  const r = await fetch('api/'+pfad, {credentials:'same-origin'});
  if (r.status === 401) return zeigeLogin();
  if (!r.ok){ const d = await r.json().catch(()=>({})); const t = d.fehler || 'Fehler';
    if (t.startsWith('Für die E-Rechnung fehlt noch:'))
      return dialog(was + ' nicht möglich', 'Pflichtangaben fehlen', `<p>${esc(t)}</p><p class="hinweis">Firmendaten unter Einstellungen → Firma, Kundendaten in der Adresse ergänzen.</p>`, [['Schließen','']]);
    return toast(t, true); }
  const name = decodeURIComponent((r.headers.get('Content-Disposition')||'').split("''")[1] || 'datei');
  const url = URL.createObjectURL(await r.blob()); const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast(was + ' erstellt: ' + name);
}

function schliesseReiter(i, still){

  else renderReiter();

async function navigiere(){
  if (!ICH || ICH.rolle === 'werkstatt') return;
  const h = location.hash || '#/start';
  const [pfad, query] = h.split('?'); const Q = new URLSearchParams(query || '');
  const key = reiterSchluessel(h);
  let t = TABS.find(x => x.key === key); const neu = !t;
  if (!t) t = neuerReiter(key);
  zeigeReiter(t); markiereMenue(h);
  if (!neu && t.hash === h) return;           // nur umschalten, Inhalt bleibt erhalten
  t.hash = h;
  document.body.classList.remove('kunde');
  const [, teil, a, b] = pfad.split('/');
  try{
    if (['beleg','neu','projekt','start','einstellungen'].includes(teil) || neu){ E = await api('einstellungen'); thema(E); }   // Firmendaten immer aktuell
    const nl = document.getElementById('navLogo'); if (nl) nl.innerHTML = E.logo ? `<img src="${E.logo}" alt="${esc(E.firma_name)}" style="display:block;max-width:150px;max-height:60px;margin:2px 18px 10px;border-radius:3px">` : '';
    if (teil==='start') await seiteStart();
    else if (teil==='belege') await seiteBelege(a||'VK', b ? +b : null);
    else if (teil==='beleg') await seiteBeleg(+a);
    else if (teil==='neu') await seiteBelegNeu(a, Q);
    else if (teil==='op') await seiteOP(a||'debitor');
    else if (teil==='projekte') await seiteProjekte(Q);
    else if (teil==='projekt') await seiteProjekt(+a);
    else if (teil==='adressen') await seiteAdressen(a||'', b==='neu' ? 'neu' : (b ? +b : null));
    else if (teil==='artikel') await seiteArtikel(a==='neu' ? 'neu' : (a ? +a : null));
    else if (teil==='einstellungen') await seiteEinstellungen();
    else if (teil==='chargen') await seiteChargen(a ? +a : null);
    else if (teil==='mahnwesen') await seiteMahnwesen();
    else if (teil==='bank') await seiteBank();
    else if (teil==='kennzeichen') await seiteKennzeichen();
    else if (teil==='werkstatt'){ M().innerHTML = '<div class="kopfzeile"><h1>Werkstatt-Ansicht</h1></div><div id="wsBox"></div>'; await werkstattZeichnen($('#wsBox')); }
    else { location.hash = '#/start'; return; }
    const h1 = t.body.querySelector('.kopfzeile h1');
    if (h1 && t.key !== 'beleg') setTitel(h1.textContent.trim());
    zeigeReiter(t);
  }catch(e){ if (e.message!=='login') console.error(e); }
}

const VJ_FARBE = '#1baf7a';      // „Vorjahr“ – geprüft gegen GSB-Blau (CVD ΔE 31), Kontrast-Hinweis → Legende + Tabelle + Tooltip
const kurzZahl = v => Math.abs(v) >= 1000 ? (Math.round(v / 100) / 10).toLocaleString('de-DE') + ' T' : Math.round(v).toLocaleString('de-DE');
const MONAT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function tooltip(e, html){ let t = document.getElementById('vizTip'); if (!t){ t = document.createElement('div'); t.id = 'vizTip'; t.className = 'viz-tip'; document.body.appendChild(t); }
  if (!html){ t.style.display = 'none'; return; } t.innerHTML = html; t.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.max(8, e.clientY - t.offsetHeight - 10); t.style.left = x + 'px'; t.style.top = y + 'px'; }
function sauberMax(m){ if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= m) return f * p; return 10 * p; }
function vizKarte(titel, untertitel, legende, svg, tabelle){
  return `<div class="card viz"><div class="viz-kopf"><div><b>${titel}</b>${untertitel?`<div class="hinweis">${untertitel}</div>`:''}</div><span class="sp"></span>
    ${legende}<button class="btn posknopf viz-tab" title="Als Tabelle">▤</button></div><div class="viz-bild">${svg}</div><div class="viz-tabelle" hidden>${tabelle}</div></div>`;
}
const leg = l => `<span class="viz-leg">${l.map(([f,t]) => `<span><i style="background:${f}"></i>${t}</span>`).join('')}</span>`;
function saeulenUmsatz(monate){
  const W = 980, H = 260, L = 46, B = 26, T = 18, n = monate.length, slot = (W - L - 8) / n;
  const max = sauberMax(Math.max(...monate.flatMap(m => [m.netto, m.vorjahr]), 1));
  const y = v => H - B - (Math.max(0, v) / max) * (H - B - T);
  const bw = Math.min(14, (slot - 10) / 2);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" class="viz-grid"/><text x="${L-6}" y="${yy+4}" class="viz-achse" text-anchor="end">${kurzZahl(v)}</text>`; }
  const saeule = (x, v, f) => { if (v <= 0) return ''; const yy = y(v), h = H - B - yy, r = Math.min(4, h);
    return `<path d="M${x},${H-B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H-B} Z" fill="${f}"/>`; };
  monate.forEach((m, i) => { const x0 = L + i * slot + (slot - 2 * bw - 2) / 2; const [jj, mm] = m.monat.split('-');
    g += `<g class="viz-hit" data-t="${MONAT[+mm-1]} ${jj}: <b>${eur(m.netto)} €</b><br>Vorjahr: ${eur(m.vorjahr)} €"><rect x="${L + i*slot}" y="${T}" width="${slot}" height="${H-B-T}" fill="transparent"/>
      ${saeule(x0 + bw + 2, m.vorjahr, VJ_FARBE)}${saeule(x0, m.netto, 'var(--blue)')}
      <text x="${L + i*slot + slot/2}" y="${H-8}" class="viz-achse" text-anchor="middle">${MONAT[+mm-1]}</text></g>`; });
  const letzte = monate[n-1]; if (letzte.netto > 0) g += `<text x="${L + (n-1)*slot + slot/2}" y="${y(letzte.netto) - 6}" class="viz-wert" text-anchor="middle">${kurzZahl(letzte.netto)}</text>`;
  g += `<line x1="${L}" x2="${W-6}" y1="${H-B}" y2="${H-B}" class="viz-basis"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Umsatz der letzten 12 Monate gegen Vorjahr">${g}</svg>`;
}
function balkenListe(zeilen, farbe, ziel){
  if (!zeilen.length) return '<p class="hinweis">Noch keine Daten.</p>';
  const max = Math.max(...zeilen.map(z => z.wert), 1);
  return `<div class="viz-balken">${zeilen.map(z => `<div class="viz-zeile viz-hit ${ziel?'klick':''}" data-t="${esc(z.label)}: <b>${eur(z.wert)} €</b>" ${ziel?`data-ziel="${ziel(z)}"`:''}>
    <span class="viz-lbl" title="${esc(z.label)}">${esc(z.label)}</span><span class="viz-bahn"><span class="viz-bar" style="width:${Math.max(1, z.wert / max * 100)}%;background:${farbe}"></span></span><span class="viz-num">${kurzZahl(z.wert)}</span></div>`).join('')}</div>`;
}
function gruppenBalken(zeilen){
  if (!zeilen.length) return '<p class="hinweis">Noch keine Daten.</p>';
  const max = Math.max(...zeilen.flatMap(z => [z.jahr, z.vorjahr]), 1);
  return `<div class="viz-balken">${zeilen.map(z => `<div class="viz-zeile viz-hit" data-t="${esc(z.gruppe)}<br>dieses Jahr: <b>${eur(z.jahr)} €</b><br>Vorjahr: ${eur(z.vorjahr)} €">
    <span class="viz-lbl" title="${esc(z.gruppe)}">${esc(z.gruppe)}</span><span class="viz-bahn doppelt"><span class="viz-bar" style="width:${Math.max(z.jahr>0?1:0, z.jahr / max * 100)}%;background:var(--blue)"></span><span class="viz-bar" style="width:${Math.max(z.vorjahr>0?1:0, z.vorjahr / max * 100)}%;background:${VJ_FARBE}"></span></span><span class="viz-num">${kurzZahl(z.jahr)}</span></div>`).join('')}</div>`;
}
function vizBinden(box){
  box.querySelectorAll('.viz-hit').forEach(h => { h.onmousemove = e => tooltip(e, h.dataset.t); h.onmouseleave = () => tooltip(null, null);
    if (h.dataset.ziel) h.onclick = () => { tooltip(null, null); location.hash = h.dataset.ziel; }; });
  box.querySelectorAll('.viz-tab').forEach(b => b.onclick = () => { const k = b.closest('.viz'); const t = k.querySelector('.viz-tabelle'), bild = k.querySelector('.viz-bild');
    t.hidden = !t.hidden; bild.hidden = !t.hidden; b.classList.toggle('pri', !t.hidden); });
}
const tab = (kopf, zeilen) => `<table><thead><tr>${kopf.map((k,i)=>`<th class="${i?'r':''}">${k}</th>`).join('')}</tr></thead><tbody>${zeilen.map(z=>`<tr>${z.map((c,i)=>`<td class="${i?'r':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

    <div class="card"><div class="filter"><input id="fs" placeholder="Suchen: Nummer, Name, Betreff, Projekt"><select id="fa"><option value="">Alle Belegarten</option>${arten.map(a=>`<option value="${a.code}">${esc(a.name)}</option>`).join('')}</select>
    <select id="fst"><option value="">Alle Status</option><option value="entwurf">Entwurf</option><option value="verarbeitet">Verarbeitet</option></select></div>
    <div class="liste"><table><thead><tr><th>Belegart</th><th>Nummer</th><th>Datum</th><th>${bereich==='VK'?'Kunde':'Lieferant'}</th><th>Betreff</th><th>Projekt</th><th class="r">Netto</th><th>Status</th></tr></thead><tbody id="bl"></tbody></table></div></div>`;
  menueAuf('#neuM', code => location.hash = '#/neu/'+code);
  if ($('#erEin')){ $('#erEin').onclick = () => $('#erDatei').click();
    $('#erDatei').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      if (f.size > 25e6) return toast('Datei zu groß (max. 25 MB).', true);
      const daten = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
      const erg = await api('erechnung/einlesen', {body:{name:f.name, daten}}).catch(()=>null); if (!erg) return;
      const nb = erg.beleg;
      dialog('E-Rechnung eingelesen', `${esc(erg.daten.syntax)} · Rechnung ${esc(erg.daten.nummer)} · ${eur(erg.daten.brutto)} €`,
        `<p>Als Rechnungseingang (Entwurf) für <b>${esc(nb.adresse_kurz||'')}</b> angelegt. Bitte prüfen und verarbeiten.</p>${erg.hinweise.length?`<ul>${erg.hinweise.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:''}`,
        [['Schließen',''], ['Beleg öffnen','pri', () => location.hash = '#/beleg/'+nb.id]]); };
  }
  const laden = async () => {
    const l = await api(`belege?bereich=${bereich}&suche=${encodeURIComponent($('#fs').value)}&belegart=${$('#fa').value}&status=${$('#fst').value}`);
    $('#bl').innerHTML = l.map(b=>`<tr class="klick" onclick="location.hash='#/beleg/${b.id}'"><td>${esc(ba(b.belegart).name)}</td><td>${esc(b.nummer||'(Entwurf)')}</td><td>${fmt(b.datum)}</td><td>${esc(b.adresse_kurz)}</td><td>${esc(b.betreff||'')}</td><td>${esc(b.projektnr||'')}</td><td class="r">${eur(b.netto)}</td><td><span class="pill st-${b.status}">${b.status}</span></td></tr>`).join('') || '<tr><td colspan="8" class="hinweis">Keine Belege.</td></tr>';
  };
  let t; $('#fs').oninput = () => { clearTimeout(t); t=setTimeout(laden, 250); }; $('#fa').onchange = laden; $('#fst').onchange = laden;
  await laden();
}
function menueAuf(sel, fn){
  const m = $(sel); m.querySelector('.btn').onclick = e => { e.stopPropagation(); m.classList.toggle('auf'); };
  m.querySelectorAll('.ddl button').forEach(b => b.onclick = () => { m.classList.remove('auf'); fn(b.dataset.a); });
  document.addEventListener('click', () => m.classList.remove('auf'), {once:true});
}

// ================================================================ Stammdaten-Muster (wie myfactory: Liste oben, Knopfreihe, Reiter, Speichern/Schließen)
function blaetternBinden(cfg){
  // cfg: {tbody, anz, zur, vor, zeile(row) -> html, klick(row,tr)}
  let rows = [], seite = 0; const PRO = 50;
  const male = () => {
    const von = seite * PRO, teil = rows.slice(von, von + PRO);
    $(cfg.tbody).innerHTML = teil.map(cfg.zeile).join('') || `<tr><td colspan="9" class="hinweis">Keine Datensätze.</td></tr>`;
    $(cfg.anz).textContent = rows.length ? `Datensätze ${von + 1} – ${von + teil.length} von ${rows.length}` : 'Keine Datensätze';
    $(cfg.tbody).querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => { $(cfg.tbody).querySelectorAll('tr').forEach(x => x.classList.toggle('sel', x === tr)); cfg.klick(+tr.dataset.id); });
  };
  $(cfg.zur).onclick = () => { if (seite > 0){ seite--; male(); } };
  $(cfg.vor).onclick = () => { if ((seite + 1) * 50 < rows.length){ seite++; male(); } };
  return { setze(r){ rows = r; seite = 0; male(); }, get rows(){ return rows; } };
}

// ================================================================ Adressen
async function seiteAdressen(rolle, sel){
  const titel = rolle==='kunde' ? 'Kunden' : rolle==='lieferant' ? 'Lieferanten' : 'Adressen';
  const nrTitel = rolle==='lieferant' ? 'Lieferantennummer' : rolle==='kunde' ? 'Kundennummer' : 'Adressnummer';
  let akt = null;   // gewählte Adresse (für Kopieren, Löschen, Memotext, Menüs)
  M().innerHTML = `<div class="kopfzeile"><h1>${titel}</h1></div>
  <div class="card">${stammWerkzeug('a', [['nr', nrTitel], ['kurz','Kurzbezeichnung'], ['ort','PLZ / Ort']])}
    <div class="werkz" id="aErwB" hidden><input class="fi" id="fPlz" placeholder="PLZ beginnt mit"><input class="fi" id="fOrt" placeholder="Ort enthält"><input class="fi" id="fMail" placeholder="E-Mail enthält"></div>
    <div class="liste"><table><thead><tr><th>${nrTitel}</th><th>Kurzbezeichnung</th><th>Name</th><th>PLZ</th><th>Ort</th><th>Telefon</th><th>E-Mail</th></tr></thead><tbody id="al"></tbody></table></div>
    <div class="blaettern"><span id="aAnz"></span><span class="sp"></span><button id="aZur" title="zurück">‹</button><button id="aVor" title="weiter">›</button></div></div>
  ${knopfReihe('a', [['Dat','Daten','d',[['belege','Belege'],['op','Offene Posten'],['projekte','Projekte']]], ['Inf','Info','i',[['umsatz','Umsatz & offene Posten'],['anlage','Nummern & Anlage']]],
     ['Akt','Aktionen','o', (rolle!=='lieferant' ? [['AN','Neues Angebot'],['AB','Neue Auftragsbestätigung'],['RE','Neue Rechnung'],['projekt','Neues Projekt']] : []).concat(rolle!=='kunde' ? [['PA','Neue Preisanfrage'],['BE','Neue Bestellung']] : [])]])}
  <div id="ad"></div>`;
  const nrVon = a => rolle==='lieferant' ? a.lieferantennr : rolle==='kunde' ? a.kundennr : a.adressnr;
  const liste = blaetternBinden({ tbody:'#al', anz:'#aAnz', zur:'#aZur', vor:'#aVor',
    zeile: a => `<tr class="klick ${a.id===sel?'sel':''}" data-id="${a.id}"><td>${esc(nrVon(a)||'')}</td><td>${esc(a.kurz)}</td><td>${esc(a.name1)}</td><td>${esc(a.plz||'')}</td><td>${esc(a.ort||'')}</td><td>${esc(a.telefon||'')}</td><td>${esc(a.email||'')}</td></tr>`,
    klick: id => { sel = id; oeffne(id); } });
  const laden = async () => {
    let l = await api(`adressen?rolle=${rolle}&suche=${encodeURIComponent($('#aS').value)}`);
    const plz = $('#fPlz').value.trim(), ort = $('#fOrt').value.trim().toLowerCase(), mail = $('#fMail').value.trim().toLowerCase();
    if (kzFilter) l = l.filter(a => kzFilter.ids.includes(a.id));
    if (plz) l = l.filter(a => (a.plz||'').startsWith(plz)); if (ort) l = l.filter(a => (a.ort||'').toLowerCase().includes(ort)); if (mail) l = l.filter(a => (a.email||'').toLowerCase().includes(mail));
    const ans = $('#aAns').value, cmp = (x,y) => String(x||'').localeCompare(String(y||''), 'de', {numeric:true});
    l.sort((x,y) => ans==='kurz' ? cmp(x.kurz,y.kurz) : ans==='ort' ? cmp(x.plz,y.plz) : cmp(nrVon(x),nrVon(y)));
    liste.setze(l);
  };
  const oeffne = (id, opt) => adresseDetail(id, rolle, laden, a => { akt = a; }, opt);

function zeichneGantt(ms){
  if (!ms.length){ $('#gl').innerHTML='<div class="h">Noch keine Schritte</div>'; return; }
  const alle = ms.flatMap(s=>[s.plan_start,s.plan_ende,s.zugesagt,s.ist_ende].filter(Boolean)).concat([heute()]);
  const min = alle.reduce((a,b)=>a<b?a:b), max = alle.reduce((a,b)=>a>b?a:b);
  const von = dt(min); von.setDate(von.getDate()-((von.getDay()+6)%7)-7);
  const bis = dt(max); bis.setDate(bis.getDate()+10);
  const n = Math.round((bis-von)/86400000);
  const W = Math.max(8, Math.min(28, Math.floor(($('#gr').clientWidth||900)/n)));
  const x = s => Math.round((dt(s)-von)/86400000)*W;
  const kw = t => { const u=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())); const d=u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-d); const y=new Date(Date.UTC(u.getUTCFullYear(),0,1)); return Math.ceil(((u-y)/86400000+1)/7); };
  let kopf='', gitter='', lm=-1;
  for (let i=0;i<n;i++){ const t=new Date(von); t.setDate(t.getDate()+i);
    if (t.getDay()===1){ if (W*7>=34) kopf+=`<div class="wk" style="left:${i*W}px">KW ${kw(t)}</div>`; gitter+=`<div class="grid" style="left:${i*W}px"></div>`; }
    if (t.getMonth()!==lm){ lm=t.getMonth(); kopf+=`<div class="mo" style="left:${i*W}px">${t.toLocaleDateString('de-DE',{month:'short',year:'2-digit'})}</div>`; } }
  const hx = x(heute());
  $('#gi').style.width = n*W+'px';
  $('#gi').innerHTML = `<div class="h">${kopf}</div>` + ms.map((s,i)=>{ let el='';
    const ende = s.ist_ende || s.plan_ende;
    if (tage(s.zugesagt, ende) > 0) el += `<div class="shift" style="left:${x(s.zugesagt)+W}px;width:${x(ende)-x(s.zugesagt)}px"></div>`;
    el += `<div class="base" style="left:${x(s.zugesagt)+W-1}px" title="Zugesagt ${fmt(s.zugesagt)}"></div>`;
    el += s.ist_meilenstein ? `<div class="ms s-${s.status}" data-i="${i}" style="left:${x(s.plan_ende)+W/2}px" title="${esc(s.titel)}"></div>`
                            : `<div class="bar s-${s.status}" data-i="${i}" style="left:${x(s.plan_start)}px;width:${Math.max(W,x(s.plan_ende)-x(s.plan_start)+W)}px" title="${esc(s.titel)}: ${fmt(s.plan_start)} – ${fmt(s.plan_ende)}"></div>`;
    if (s.ist_ende) el += `<div class="ist ${s.status==='ok'?'':'late'}" style="left:${x(s.ist_ende)+W/2}px" title="Erledigt ${fmt(s.ist_ende)}">✓</div>`;
    return `<div class="r">${gitter}${el}</div>`; }).join('') + `<div class="heute" style="left:${hx+W/2}px"><span>Heute</span></div>`;
  $('#gl').innerHTML = `<div class="h">Schritt</div>` + ms.map((s,i)=>`<div class="r" data-i="${i}"><span class="hinweis" style="width:16px;text-align:right">${s.pos}</span><span class="pill s-${s.status}" style="width:10px;height:10px;padding:0"></span><span class="x">${esc(s.titel)}</span></div>`).join('');
  const gr=$('#gr'); gr.scrollLeft = Math.max(0, hx - gr.clientWidth*0.5);
}

async function kennzeichenZeichnen(box, objekt, id, speicherbar = true){
  const felder = await api(`kennzeichen/${objekt}/${id}`);
  if (!felder.length){ box.innerHTML = `<p class="hinweis">Noch keine Kennzeichen eingerichtet – unter <a href="#/kennzeichen">System → Kennzeichen</a> anlegen (z. B. „IATF-zertifiziert“, „Branche“, „Erstkontakt“).</p>`; return; }
  const feld = f => { const w = f.wert ?? '';
    if (f.typ === 'janein') return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-kz="${f.id}" style="width:auto" ${w==='1'?'checked':''}> ${esc(f.name)}</label>`;
    let inp = `<input data-kz="${f.id}" value="${esc(w)}" ${f.typ==='zahl'?'class="zahl"':''}>`;
    if (f.typ === 'datum') inp = `<input type="date" data-kz="${f.id}" value="${esc(w)}">`;
    if (f.typ === 'auswahl') inp = `<select data-kz="${f.id}"><option value="">–</option>${(f.optionen||'').split(';').map(o => o.trim()).map(o => `<option ${o===w?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    return `<div class="feld"><label>${esc(f.name)}</label>${inp}</div>`; };
  box.innerHTML = `<div class="raster">${felder.map(feld).join('')}</div>${speicherbar?'<p class="hinweis">Wird mit „Speichern“ übernommen.</p>':''}`;
}

function dokumenteDialog(objekt, id, liste, neuLaden, hinweis){
  const zeile = d => `<tr><td><a href="api/dokumente/${d.id}" target="_blank">📄 ${esc(d.name)}</a></td><td class="hinweis">${esc(d.herkunft || '')}</td><td class="hinweis">${fmt(d.hochgeladen)} ${esc(d.von||'')}</td><td class="r hinweis">${Math.max(1, Math.round((d.groesse||0)/1024))} KB</td></tr>`;
  dialog('Dokumente', hinweis || '', `<table><tbody>${liste.map(zeile).join('') || '<tr><td class="hinweis">Noch keine Dokumente.</td></tr>'}</tbody></table>
    ${id ? `<label class="btn pri" style="justify-self:start">＋ Datei hochladen<input type="file" id="dokF" multiple style="display:none"></label>` : '<p class="hinweis">Bitte den Beleg zuerst speichern.</p>'}
    <p class="hinweis">Dokumente am Wareneingang oder an der Charge erscheinen automatisch auch bei Lieferschein und Rechnung dieser Charge.</p>`, [['Schließen','']]);
  const f = document.getElementById('dokF'); if (!f) return;
  f.onchange = async () => {
    for (const datei of f.files){
      if (datei.size > 25e6){ toast(`${datei.name}: größer als 25 MB`, true); continue; }
      const daten = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(datei); });
      await api('dokumente', {body:{objekt, objekt_id:id, name:datei.name, mime:datei.type, daten}});
    }
    toast('Hochgeladen.'); document.getElementById('dlg').close(); neuLaden();
  };
}

      <span class="sp"></span><button class="btn" id="wsNeu">⟳ Aktualisieren</button></div>
    <div class="ws-raster">${offen.map(karte).join('') || '<p class="hinweis" style="font-size:16px">Keine offenen Schritte. 👍</p>'}</div>
    ${fertig.length ? `<h3 style="margin:22px 0 8px;color:var(--mute)">Heute / gestern erledigt</h3><div class="ws-raster">${fertig.map(karte).join('')}</div>` : ''}`;
  box.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { localStorage.setItem('erp-ws-bereich', b.dataset.b); werkstattZeichnen(box); });
  box.querySelector('#wsNeu').onclick = () => werkstattZeichnen(box);
  const finde = el => d.schritte.find(m => m.id === +el.closest('.ws-karte').dataset.id);
  box.querySelectorAll('.ws-ok').forEach(b => b.onclick = () => { const m = finde(b);
    dialog('Als erledigt melden?', esc(m.projektnr), `<div style="font-size:20px;font-weight:600">${esc(m.titel)}</div>`,
      [['Abbrechen',''], ['✓ Ja, erledigt','ok', async () => { await api(`meilensteine/${m.id}/erledigt`, {body:{}}); toast(`„${m.titel}“ erledigt gemeldet.`); werkstattZeichnen(box); }]]); });
  box.querySelectorAll('.ws-zurueck').forEach(b => b.onclick = async () => { const m = finde(b);
    await api(`meilensteine/${m.id}/erledigt`, {body:{zuruecknehmen:true}}); toast('Zurückgenommen.'); werkstattZeichnen(box); });
  box.querySelectorAll('.ws-problem').forEach(b => b.onclick = () => { const m = finde(b);
    dialog('Problem melden', esc(m.projektnr + ' · ' + m.titel), `<div class="ws-gruende">${PROBLEME.map(g => `<button class="btn" data-g="${g}">${g}</button>`).join('')}</div>
      <textarea id="wsText" rows="3" placeholder="Was ist los? (geht an das Büro)"></textarea>`,
      [['Abbrechen',''], ['Melden','pri', async () => { await api(`meilensteine/${m.id}/hinweis`, {body:{text: document.getElementById('wsText').value}}); toast('Meldung an das Büro geschickt.'); }]]);
    document.querySelectorAll('.ws-gruende button').forEach(g => g.onclick = () => { const t = document.getElementById('wsText'); t.value = (t.value ? t.value + ' – ' : '') + g.dataset.g; t.focus(); }); });
}

// ================================================================ Dialog
function dialog(titel, sub, body, knoepfe){
  document.getElementById('dlg').style.width = '';
  $('#dTitel').textContent = titel; $('#dSub').innerHTML = sub; $('#dBody').innerHTML = body; fuss(knoepfe); $('#dlg').showModal();
}
function fuss(knoepfe){
  const f=$('#dFuss'); f.innerHTML='';
  knoepfe.forEach(([t,cls,fn]) => { const b=document.createElement('button'); b.className='btn '+cls; b.textContent=t;
    b.onclick = async () => { if (!fn){ $('#dlg').close(); return; } try{ const r = await fn(); if (r!==false) $('#dlg').close(); }catch(e){} }; f.appendChild(b); });
}

start();
</script>
</body>
