;; ---------------------------------------------------------------
;; V3D Anrufannahme — Anmeldung als IP-Telefon an der Fritzbox
;; Wird von install.sh nach /etc/asterisk/pjsip.d/ gelegt.
;; Platzhalter @@REGISTRAR@@ / @@USER@@ / @@PASS@@ setzt install.sh
;; aus ~/v3dcall/config.json ein.
;; ---------------------------------------------------------------

[transport-udp]
type            = transport
protocol        = udp
bind            = 0.0.0.0:5060
;; Der Server steht hinter dem UniFi. Ohne die naechsten drei Zeilen traegt
;; Asterisk seine eigene Adresse 192.168.178.254 in Contact/Via/SDP ein —
;; die kann die Fritzbox nicht erreichen, eingehende Anrufe verpuffen.
;; Hier steht die Adresse, unter der uns die Fritzbox sieht.
external_media_address     = @@EXTERN@@
external_signaling_address = @@EXTERN@@
local_net                  = @@LOCALNET@@

;; Rueckfall bei doppeltem NAT: Der Server steht hier hinter dem
;; UniFi-Gateway (192.168.178.x), die Fritzbox eine Etage hoeher
;; (192.168.2.1). UDP-Bindings koennen dabei wegbrechen — dann in
;; config.json asterisk.transport auf "tcp" setzen und install.sh
;; erneut laufen lassen. TCP haelt durch NAT wesentlich besser.
[transport-tcp]
type            = transport
protocol        = tcp
bind            = 0.0.0.0:5060
external_media_address     = @@EXTERN@@
external_signaling_address = @@EXTERN@@
local_net                  = @@LOCALNET@@

;; --- Zugangsdaten ---------------------------------------------
[fritzbox_auth]
type            = auth
auth_type       = userpass
username        = @@USER@@
password        = @@PASS@@

;; --- Anmeldung (Registration) ---------------------------------
[fritzbox_reg]
type            = registration
transport       = transport-@@TRANSPORT@@
outbound_auth   = fritzbox_auth
server_uri      = sip:@@REGISTRAR@@
client_uri      = @@CLIENTURI@@
contact_user    = @@USER@@
retry_interval  = 60
forbidden_retry_interval = 600
expiration      = @@EXPIRE@@
line            = yes
endpoint        = fritzbox

;; --- Gegenstelle ----------------------------------------------
[fritzbox]
type            = aor
contact         = sip:@@REGISTRAR@@:5060
qualify_frequency = 60

[fritzbox]
type            = endpoint
transport       = transport-@@TRANSPORT@@
context         = v3dcall
aors            = fritzbox
outbound_auth   = fritzbox_auth
from_user       = @@USER@@
from_domain     = @@REGISTRAR@@
disallow        = all
allow           = alaw
allow           = ulaw
direct_media    = no
force_rport     = yes
rewrite_contact = yes
rtp_symmetric   = yes
dtmf_mode       = rfc4733
language        = de

[fritzbox]
type            = identify
endpoint        = fritzbox
match           = @@REGISTRAR@@
