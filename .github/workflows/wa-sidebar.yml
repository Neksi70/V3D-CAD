# Baut die WA Seitenleiste (tools/wa-sidebar) unter Windows und stellt die .exe
# als GitHub-Release zum Herunterladen bereit.
name: WA Seitenleiste bauen

on:
  push:
    paths:
      - 'tools/wa-sidebar/**'
      - '.github/workflows/wa-sidebar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Bauen
        working-directory: tools/wa-sidebar
        run: dotnet publish -c Release -o out
      - name: Als Release bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=wa-sidebar-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" tools/wa-sidebar/out/WaSidebar.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "WA Seitenleiste (aktueller Stand)" \
            --notes "WaSidebar.exe herunterladen, in einen festen Ordner legen (z. B. C:\\Tools\\WaSidebar) und starten. Anleitung: tools/wa-sidebar/LIESMICH.md"
