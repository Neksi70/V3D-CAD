function produktionStart(d, fertig){
  let wahl = { charge: null, arbeitsgang: '', maschine: '' };
  const zeigeSuche = () => {
    dialog('Palette / Charge starten', 'Schritt 1: Charge wählen – Nummer eintippen oder scannen',
      `<input id="pdS" class="pd-gross" placeholder="Chargennummer" autocomplete="off"><div class="pd-liste" id="pdL" style="margin-top:10px"></div>`, [['Abbrechen','']]);
    const s = document.getElementById('pdS'); let t, treffer = [];
    const laden = async () => { treffer = await api('produktion/chargen?suche=' + encodeURIComponent(s.value));
      document.getElementById('pdL').innerHTML = treffer.map((c,i) => `<button class="btn" data-i="${i}"><b>${esc(c.chargennr)}</b> · ${esc(c.kunde_kurz)} · ${esc(c.artikelnr||'')} ${esc(c.artikel_kurz||'')} <span class="hinweis">· ${zahl(c.rest)} im Haus</span></button>`).join('')
        || '<p class="hinweis">Keine offene Charge gefunden. Kundenmaterial wird über „Wareneingang Kundenmaterial“ erfasst.</p>';
      document.querySelectorAll('#pdL [data-i]').forEach(b => b.onclick = () => { wahl.charge = treffer[+b.dataset.i]; zeigeDetails(); }); };
    s.oninput = () => { clearTimeout(t); t = setTimeout(laden, 200); };
    s.onkeydown = e => { if (e.key === 'Enter' && treffer.length && treffer[0].chargennr.toLowerCase() === s.value.trim().toLowerCase()){ wahl.charge = treffer[0]; zeigeDetails(); } };
    laden(); setTimeout(() => s.focus(), 50);
  };
  const zeigeDetails = () => {
    const c = wahl.charge; if (c.arbeitsgaenge.length === 1) wahl.arbeitsgang = c.arbeitsgaenge[0];
    const knoepfe = (liste, feld) => liste.map(x => `<button class="btn ${wahl[feld]===x?'an':''}" data-f="${feld}" data-v="${esc(x)}">${esc(x)}</button>`).join('');
    dialog('Palette / Charge starten', esc(`Charge ${c.chargennr} · ${c.kunde_kurz} · ${zahl(c.rest)} im Haus`),
      `<b>Arbeitsgang</b><div class="pd-wahl">${knoepfe(c.arbeitsgaenge, 'arbeitsgang')}</div>
       ${d.maschinen.length?`<b>Maschine</b><div class="pd-wahl">${knoepfe(d.maschinen, 'maschine')}</div>`:''}
       <div class="raster2"><div class="zeile"><label>Palette Nr.</label><input id="pdP" class="pd-gross" inputmode="numeric" placeholder="z. B. 1"></div>
       <div class="zeile"><label>Menge auf der Palette</label><input id="pdM" class="pd-gross" inputmode="decimal" placeholder="optional"></div></div>
       <div class="zeile"><label>Wer?</label><input id="pdW" class="pd-gross" value="${esc(localStorage.getItem('erp-pd-wer')||'')}" placeholder="Name"></div>`,
      [['‹ Andere Charge','', () => { setTimeout(zeigeSuche); return false; }], ['Abbrechen',''],
       ['▶ Starten','ok', async () => {
         if (!wahl.arbeitsgang){ toast('Bitte den Arbeitsgang antippen.', true); return false; }
         const wer = document.getElementById('pdW').value.trim(); localStorage.setItem('erp-pd-wer', wer);
         const f = await api('produktion/start', {body:{charge_id:c.id, arbeitsgang:wahl.arbeitsgang, maschine:wahl.maschine, palette:document.getElementById('pdP').value,
           menge_plan: document.getElementById('pdM').value ? num(document.getElementById('pdM').value) : null, mitarbeiter: wer}});
         toast(`Gestartet: ${f.arbeitsgang} · Charge ${f.chargennr}`); fertig(); }]]);
    document.querySelectorAll('#dBody [data-f]').forEach(b => b.onclick = () => { const f = b.dataset.f;
      wahl[f] = wahl[f] === b.dataset.v && f === 'maschine' ? '' : b.dataset.v;
      document.querySelectorAll(`#dBody [data-f="${f}"]`).forEach(x => x.classList.toggle('an', x.dataset.v === wahl[f])); });
    setTimeout(() => document.getElementById('pdP').focus(), 50);
  };
  zeigeSuche();
}
function produktionEnde(f, fertig){
  dialog('Fertig melden', esc(`Charge ${f.chargennr} · ${f.palette ? 'Palette ' + f.palette + ' · ' : ''}${f.arbeitsgang}`),
    `<div class="raster2"><div class="zeile"><label>Gut (${esc(f.me||'Stk')})</label><input id="peG" class="pd-gross" inputmode="decimal" value="${f.menge_plan ? String(f.menge_plan).replace('.',',') : ''}"></div>
     <div class="zeile"><label>Ausschuss</label><input id="peA" class="pd-gross" inputmode="decimal" placeholder="0"></div></div>
     <div class="zeile"><label>Grund (bei Ausschuss)</label><input id="peR"></div><div class="ws-gruende">${AUSSCHUSS_GRUENDE.map(g => `<button class="btn" data-g="${g}">${g}</button>`).join('')}</div>
     <div class="zeile" style="margin-top:8px"><label>Bemerkung</label><input id="peB" placeholder="optional"></div>
     <label class="pd-frei"><input type="checkbox" id="peF" ${f.letzter_gang ? 'checked' : ''}> 📦 <b>Für den Versand freigeben</b> – die Gutmenge darf auf den Lieferschein
       <span class="hinweis">${f.letzter_gang ? '(letzter Arbeitsgang)' : '(nur wenn danach kein weiterer Arbeitsgang mehr kommt)'}</span></label>`,
    [['Abbrechen',''], ['■ Fertig melden','ok', async () => {
      const aus = num(document.getElementById('peA').value), frei = document.getElementById('peF').checked;
      const r = await api(`fertigung/${f.id}/beenden`, {body:{menge_gut:num(document.getElementById('peG').value), menge_ausschuss:aus, grund:document.getElementById('peR').value, bemerkung:document.getElementById('peB').value, freigabe:frei}});
      toast(`Fertig: ${r.arbeitsgang} · Charge ${r.chargennr} · ${zahl(r.menge_gut)} gut${aus?`, ${zahl(aus)} Ausschuss gebucht`:''}${frei?' · für Versand freigegeben':''}`); fertig(); }]]);
  document.querySelectorAll('#dBody [data-g]').forEach(g => g.onclick = () => { document.getElementById('peR').value = g.dataset.g; });
  setTimeout(() => document.getElementById('peG').select(), 50);
}
function fortschrittBalken(c){
  return `<div class="pd-balken">${c.schritte.map(x => `<div class="${x.laufend?'laeuft':''}" title="${esc(x.arbeitsgang)}: ${zahl(x.gut)} gut${x.ausschuss?`, ${zahl(x.ausschuss)} Ausschuss`:''} von ${zahl(x.soll)}${x.laufend?' · läuft':''}"><i style="width:${x.pct}%"></i><span>${esc(x.arbeitsgang)} ${x.pct}%</span></div>`).join('')}</div>`;
}
async function seiteProduktion(){
  M().innerHTML = `<div class="kopfzeile"><h1>Produktion</h1><span class="sp"></span><span class="hinweis">Die Werkstatt meldet am Tablet (Login „werkstatt“) – hier siehst du dasselbe live.</span></div>
    <div id="pdBox"></div>
    <div class="card" style="margin-top:16px"><div class="kopfzeile" style="margin-bottom:6px"><b style="font-size:16px">Fortschritt je Charge</b><span class="sp"></span><label class="hinweis"><input type="checkbox" id="pdAlle" style="width:auto"> auch erledigte</label></div>
    <div class="liste"><table><thead><tr><th>Charge</th><th>Kunde</th><th>Artikel</th><th class="r">Eingang</th><th>Arbeitsgänge</th><th class="r">Ausschuss</th><th class="r">Freigegeben</th><th class="r">Geliefert</th><th>Status</th></tr></thead><tbody id="pdF"></tbody></table></div></div>`;
  await produktionZeichnen($('#pdBox'));
  const laden = async () => { let l = await api('produktion/fortschritt'); if (!$('#pdAlle').checked) l = l.filter(c => !['fertig','freigegeben'].includes(c.status) || c.rest > 0);
    $('#pdF').innerHTML = l.map(c => `<tr class="klick" onclick="location.hash='#/chargen/${c.charge_id}'"><td><b>${esc(c.chargennr)}</b></td><td>${esc(c.kunde_kurz)}</td><td>${esc(c.artikelnr||'')} ${esc(c.artikel_kurz||'')}</td><td class="r">${zahl(c.eingang)}</td><td>${fortschrittBalken(c)}</td><td class="r">${c.ausschuss?zahl(c.ausschuss):''}</td><td class="r">${c.freigegeben?zahl(c.freigegeben):''}</td><td class="r">${zahl(c.geliefert)}</td><td><span class="pill ${c.status==='freigegeben'||c.status==='fertig'?'st-verarbeitet':c.status==='wartet'?'st-entwurf':'s-open'}">${c.status}</span><div class="hinweis" style="font-size:11.5px;margin-top:2px">${esc(c.status_text||'')}</div></td></tr>`).join('')
      || '<tr><td colspan="9" class="hinweis">Keine Chargen im Haus.</td></tr>'; };
  $('#pdAlle').onchange = laden; await laden();
}

// ================================================================ Dialog
function dialog(titel, sub, body, knoepfe){
  document.getElementById('dlg').style.width = '';
  $('#dTitel').textContent = titel; $('#dSub').innerHTML = sub; $('#dBody').innerHTML = body; fuss(knoepfe); $('#dlg').showModal();
}
function fuss(knoepfe){
  const f=$('#dFuss'); f.innerHTML='';
  knoepfe.forEach(([t,cls,fn]) => { const b=document.createElement('button'); b.className='btn '+cls; b.textContent=t;
    b.onclick = async () => { if (!fn){ $('#dlg').close(); return; } try{ const r = await fn(); if (r!==false) $('#dlg').close(); }catch(e){} }; f.appendChild(b); });
}

start();
</script>
</body>
</html>
