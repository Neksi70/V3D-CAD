<script>
'use strict';
// ============ Fass-Alarm — Retro-Plattformer im Stil des Arcade-Klassikers ============
// Eigene Grafiken/Namen (Nintendo-Marken sind geschuetzt). Feste 60-Hz-Steps,
// dadurch deterministisch genug fuer Headless-Tests via window._faDbg.

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=448,H=512, GRAV=0.28, JUMP=-5.0, SPEED=1.5, CLIMB=1.1;

// ---- Zehn Level. Jeder Traeger-Index behaelt in allen Leveln seine Rolle:
// 0 Boden rechts, 1-4 Mittelebenen, 5 Affen-Plattform (immer flach, sonst
// rollt das frisch geworfene Fass rueckwaerts), 6 oberer Traeger, 7 Ziel,
// 8 Boden links (Oelfass + Start). Die Neigungsvorzeichen liegen fest, sonst
// laufen die Faesser nicht im Zickzack nach unten: 6/1/3 fallen nach rechts,
// 2/4 nach links. Variiert werden Neigung, Spannweite, Leitern und Haemmer.
const ROWY=[430,370,310,250];   // Hoehen der Mittelebenen 1..4
// t = [t0,t1,t2,t3,t4,t6] Neigung in px    sp = Spannweiten von 1,2,3,4,6
// top = [ziel_x1, ziel_x2, Ende der Affen-Plattform]
// lad = [x, oben, unten, kaputt?]          ham = [x, traeger]
const LEVELS=[
 { t:[-16,12,-12,12,-12,9], sp:[[0,428],[20,448],[0,428],[20,448],[190,428]], top:[176,272,190],
   lad:[[192,7,6],[256,7,6],[72,5,4],[352,6,4],[232,6,4,1],[112,4,3],[408,4,3],[280,4,3,1],
        [48,3,2],[304,3,2],[180,3,2,1],[144,2,1],[384,2,1],[64,2,1,1],[96,1,8],[336,1,0],[200,1,8,1]],
   ham:[[200,2],[64,4]] },
 { t:[-16,14,-14,14,-14,11], sp:[[0,436],[12,448],[0,436],[12,448],[190,436]], top:[176,272,190],
   lad:[[206,7,6],[262,7,6],[148,5,4],[300,6,4],[392,6,4,1],[64,4,3],[352,4,3],[216,4,3,1],
        [120,3,2],[400,3,2],[248,3,2,1],[72,2,1],[328,2,1],[192,2,1,1],[152,1,8],[392,1,0],[264,1,0,1]],
   ham:[[112,3],[344,1]] },
 { t:[-18,16,-16,16,-16,12], sp:[[0,420],[28,448],[0,420],[28,448],[196,420]], top:[168,264,196],
   lad:[[200,7,6],[248,7,6],[96,5,4],[268,6,4],[368,6,4,1],[152,4,3],[392,4,3],[56,4,3,1],
        [88,3,2],[344,3,2],[224,3,2,1],[168,2,1],[408,2,1],[112,2,1,1],[64,1,8],[368,1,0],[232,1,8,1]],
   ham:[[280,3],[128,1]] },
 { t:[-16,18,-18,18,-18,10], sp:[[0,444],[8,448],[0,444],[8,448],[186,444]], top:[184,280,186],
   lad:[[198,7,6],[268,7,6],[40,5,4],[320,6,4],[240,6,4,1],[76,4,3],[424,4,3],[196,4,3,1],
        [128,3,2],[368,3,2],[264,3,2,1],[40,2,1],[296,2,1],[168,2,1,1],[112,1,8],[416,1,0],[224,1,8,1]],
   ham:[[344,2],[80,4]] },
 { t:[-14,15,-15,15,-15,13], sp:[[0,392],[56,448],[0,392],[56,448],[190,392]], top:[172,268,190],
   lad:[[188,7,6],[254,7,6],[120,5,4],[288,6,4],[352,6,4,1],[96,4,3],[368,4,3],[248,4,3,1],
        [152,3,2],[320,3,2],[72,3,2,1],[104,2,1],[352,2,1],[232,2,1,1],[80,1,8],[352,1,0],[184,1,8,1]],
   ham:[[176,3],[312,1]] },
 { t:[-18,20,-20,20,-20,14], sp:[[0,432],[16,448],[0,432],[16,448],[192,432]], top:[164,260,192],
   lad:[[202,7,6],[244,7,6],[56,5,4],[344,6,4],[264,6,4,1],[136,4,3],[400,4,3],[224,4,3,1],
        [64,3,2],[288,3,2],[176,3,2,1],[128,2,1],[368,2,1],[248,2,1,1],[136,1,8],[400,1,0],[288,1,0,1]],
   ham:[[224,4],[96,2]] },
 { t:[-16,17,-17,17,-17,12], sp:[[0,412],[36,448],[0,412],[36,448],[188,412]], top:[180,276,188],
   lad:[[196,7,6],[266,7,6],[168,5,4],[256,6,4],[380,6,4,1],[48,4,3],[404,4,3],[232,4,3,1],
        [176,3,2],[392,3,2],[96,3,2,1],[56,2,1],[312,2,1],[200,2,1,1],[104,1,8],[344,1,0],[216,1,8,1]],
   ham:[[288,2],[144,4]] },
 { t:[-20,22,-22,22,-22,15], sp:[[0,440],[8,448],[0,440],[8,448],[194,440]], top:[168,264,194],
   lad:[[204,7,6],[250,7,6],[88,5,4],[312,6,4],[400,6,4,1],[120,4,3],[376,4,3],[264,4,3,1],
        [40,3,2],[328,3,2],[208,3,2,1],[152,2,1],[416,2,1],[280,2,1,1],[72,1,8],[384,1,0],[240,1,8,1]],
   ham:[[336,3]] },
 { t:[-18,19,-19,19,-19,13], sp:[[0,404],[44,448],[0,404],[44,448],[190,404]], top:[176,272,190],
   lad:[[192,7,6],[260,7,6],[136,5,4],[276,6,4],[364,6,4,1],[64,4,3],[388,4,3],[216,4,3,1],
        [112,3,2],[356,3,2],[240,3,2,1],[88,2,1],[336,2,1],[192,2,1,1],[160,1,8],[392,1,0],[272,1,0,1]],
   ham:[[248,1]] },
 { t:[-20,24,-24,24,-24,16], sp:[[0,448],[0,448],[0,448],[0,448],[190,448]], top:[172,268,190],
   lad:[[196,7,6],[252,7,6],[32,5,4],[336,6,4],[248,6,4,1],[144,4,3],[420,4,3],[280,4,3,1],
        [32,3,2],[300,3,2],[168,3,2,1],[176,2,1],[424,2,1],[96,2,1,1],[48,1,8],[424,1,0],[208,1,8,1]],
   ham:[[368,4]] },
];
const MAXLEVEL=LEVELS.length;
// x1/y1 = linkes Ende (Oberkante), x2/y2 = rechtes Ende.
// Faesser rollen bergab (Richtung des groesseren y) und fallen am offenen Ende.
let GIRDERS=[], LADDERS=[], HAMDEF=[];
function buildLevel(n){
  const L=LEVELS[Math.min(n,MAXLEVEL)-1];
  const [t0,t1,t2,t3,t4,t6]=L.t, sp=L.sp, [gx1,gx2,apeEnd]=L.top;
  const mid=(i,t)=>({x1:sp[i][0], y1:ROWY[i]-t/2, x2:sp[i][1], y2:ROWY[i]+t/2});
  GIRDERS=[
    {x1:256,y1:492,x2:448,y2:492+t0},
    mid(0,t1), mid(1,t2), mid(2,t3), mid(3,t4),
    {x1:0,y1:170,x2:apeEnd,y2:170},
    {x1:apeEnd,y1:170,x2:sp[4][1],y2:170+t6},
    {x1:gx1,y1:106,x2:gx2,y2:106,goal:true},
    {x1:0,y1:492,x2:256,y2:492},
  ];
  LADDERS=L.lad.map(([x,up,dn,br])=>({x,up,dn,broken:!!br,
    yTop:gY(GIRDERS[up],x), yBot:gY(GIRDERS[dn],x)}));
  HAMDEF=L.ham;
}
function gY(g,x){
  const raw = g.x2===g.x1 ? g.y1 : g.y1+(g.y2-g.y1)*((x-g.x1)/(g.x2-g.x1));
  const b = g.bend===undefined ? 1 : g.bend; // Intro: 0 = noch gerade, 1 = krumm
  if(b>=1) return raw;
  const flat=Math.min(g.y1,g.y2);
  return flat+(raw-flat)*b;
}
function downhill(g){ return g.y2>g.y1 ? 1 : (g.y2<g.y1 ? -1 : 0); }

// Kaputte Leitern nutzt nur das Fass (rollt runter), der Spieler nicht.
// Haemmer haengen in Sprunghoehe ueber ihrem Traeger.
buildLevel(1);

// ---- Zustand
let state='title', frame=0, stateT=0;
let score=0, high=+(localStorage.getItem('fassalarm_high')||0);
let level=1, lives=3, bonus=5000, extraGiven=false;
let player, barrels=[], hammers=[], popups=[], apeT=0, apeAnim=0, muted=false, paused=false;
let flameT=0; // Stichflamme am Oelfass, wenn ein Fass hineinrollt
let helpT=0;  // laeuft, waehrend die Prinzessin "HILFE!" ruft (Bild + Ton synchron)
let princessPlaced=true; // false nur waehrend des Intros, bis Kong sie oben absetzt
let fires=[], barrelCount=0; // Feuerbaelle aus dem Oelfass, Fass-Zaehler (1. Fass = blau)

const keys={l:0,r:0,u:0,d:0,j:0};
let jumpLatch=false; // Leertaste muss losgelassen werden

function resetRound(){
  buildLevel(level);  // jedes Level hat eigene Traeger, Leitern und Haemmer
  player={x:90, y:gY(GIRDERS[8],90), vx:0, vy:0, dir:1, mode:'ground', g:8,
          ladder:null, anim:0, hammerT:0, airFrom:0};
  barrels=[]; popups=[]; fires=[]; barrelCount=0;
  hammers=HAMDEF.map(([x,g])=>({x, y:gY(GIRDERS[g],x)-36, taken:false}));
  apeT=90; apeAnim=0; bonus=5000+Math.min(4,level-1)*500; helpT=0;
  princessPlaced=true; flee=null;
}
function startGame(){
  score=0; level=1; lives=3; extraGiven=false; resetRound();
  // Intro wie im Original: Kong traegt die Prinzessin die Leiter hoch,
  // setzt sie oben ab und stampft die (noch geraden) Traeger krumm
  for(const i of [0,1,2,3,4,6]) GIRDERS[i].bend=0;
  princessPlaced=false;
  intro={t:0, fr:0, phase:'wait', x:210, y:492, px:176, py:470, stomp:0};
  state='intro'; stateT=0; sfx.intro();
}
function finishIntro(){ for(const g of GIRDERS) if(g.bend!==undefined) g.bend=1;
  princessPlaced=true; state='play'; stateT=0; }
let intro=null, flee=null;

// ---- Levelwechsel: Kong laesst sich das nicht bieten, schnappt sich die
// Prinzessin vom Podest und klettert mit ihr ins naechste Stockwerk.
function startFlee(){
  const g=GIRDERS[7], cx=(g.x1+g.x2)/2;
  flee={phase:'come', fr:0, x:96, y:170, px:cx, py:g.y1, gx:cx-24, gy:g.y1};
  state='flee'; stateT=0; sfx.heave();
}
function stepFlee(){
  const f=flee; f.fr++;
  switch(f.phase){
    case 'come': { // vom eigenen Podest hinueber zur Prinzessin
      const k=Math.min(1,f.fr/55);
      f.x=96+(f.gx-96)*k;
      f.y=170+(f.gy-170)*k-Math.sin(Math.PI*k)*30;
      if(k>=1){ f.y=f.gy; f.phase='grab'; f.fr=0; sfx.roar(); }
      break; }
    case 'grab': { // Prinzessin unter den Arm klemmen
      princessPlaced=false;
      const k=Math.min(1,f.fr/28), cx=f.gx+24;
      f.px=cx+(f.x-34-cx)*k; f.py=f.gy+((f.y-22)-f.gy)*k;
      if(k>=1){ f.phase='up'; f.fr=0; sfx.help(); }
      break; }
    case 'up': // die Leiter hoch und oben aus dem Bild
      f.y-=2.6; f.px=f.x-34; f.py=f.y-22;
      if(f.fr%16===0) sfx.thud();
      if(f.y<-110) nextLevel();
      break;
  }
}
function nextLevel(){ level++; resetRound(); state='play'; stateT=0; }

// Reihenfolge, in der die Traeger beim Stampfen krumm werden (oben -> unten)
const STOMP_ORDER=[6,4,3,2,1];
function stepIntro(){
  const it=intro; it.t++; it.fr++;
  switch(it.phase){
    case 'wait': if(it.fr>40){ it.phase='climb'; it.fr=0; } break;
    case 'climb': // mit der Prinzessin unterm Arm die lange Leiter hoch
      it.y=Math.max(170, 492-it.fr*2);
      it.px=it.x-34; it.py=it.y-22;
      if(it.y<=170){ it.phase='place'; it.fr=0; }
      break;
    case 'place': { // Prinzessin hinauf aufs Podest setzen
      const k=Math.min(1,it.fr/50);
      it.px=210+(224-210)*k;
      it.py=(it.y-84)+(106-(it.y-84))*k - Math.sin(Math.PI*k)*26;
      if(k>=1){ princessPlaced=true; it.phase='walk'; it.fr=0; }
      break; }
    case 'walk': // zu seinem Platz stapfen
      it.x=Math.max(96, 210-it.fr*2.2);
      if(it.x<=96){ it.phase='hopup'; it.fr=0; }
      break;
    case 'hopup': { // Stampf-Sprung auf der Stelle
      const T=22, k=Math.min(1,it.fr/T);
      it.y=170-Math.sin(Math.PI*k)*46;
      if(it.fr>=T){ it.y=170; sfx.thud(); it.phase='bend'; it.fr=0; }
      break; }
    case 'bend': { // ein Traeger nach dem anderen biegt sich durch
      const gi=STOMP_ORDER[it.stomp], g=GIRDERS[gi];
      g.bend=Math.min(1,g.bend+1/22);
      if(gi===1) GIRDERS[0].bend=g.bend; // Boden-Rampe kippt mit dem letzten
      if(g.bend>=1){
        it.stomp++; it.fr=0;
        if(it.stomp>=STOMP_ORDER.length){ it.phase='roar'; sfx.roar(); }
        else it.phase='hopup';
      }
      break; }
    case 'roar': if(it.fr>=60) finishIntro(); break;
  }
}

// ---- Sound (WebAudio, winzige Synth-Bleeps)
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol,when){ if(muted) return;
  try{ const a=ac(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime+(when||0);
    o.type=type; o.frequency.setValueAtTime(f0,t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){} }
let walkAlt=false;
function crash(dur,vol,when){ // Rausch-Krachen fuer Aufprall
  if(muted) return;
  try{
    const a=ac(), len=(a.sampleRate*dur)|0,
          buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime+(when||0));
    s.connect(g); g.connect(a.destination); s.start(a.currentTime+(when||0));
  }catch(e){}
}
// Stimm-artiger Ton: Saegezahn durch ein Bandpass-Filter = grobe Vokalfarbe.
// formant tief (~900) klingt nach "e/a", hoch (~1800) nach "i". vib = Vibrato-Tiefe.
function voice(f0,f1,dur,formant,vol,when,vib){ if(muted) return;
  try{
    const a=ac(), t=a.currentTime+(when||0);
    const o=a.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    const bp=a.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.setValueAtTime(formant,t); bp.Q.setValueAtTime(7,t);
    const g=a.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.04);
    g.gain.setValueAtTime(vol,t+dur*.6);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    if(vib){ // Vibrato, sonst klingt der Ruf nach Roboter statt nach Mensch
      const lfo=a.createOscillator(), lg=a.createGain();
      lfo.frequency.setValueAtTime(6.5,t); lg.gain.setValueAtTime(vib,t);
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+dur+.05); }
    o.connect(bp); bp.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+.05);
  }catch(e){} }
const sfx={
  // Warbelnder Laufton wie im Original: pro Schritt ein schnell absackender
  // Blip, mit alternierender Tonhoehe wirkt es wie "wa-wa-wa"
  walk(){ walkAlt=!walkAlt; tone(walkAlt?310:250, 85, .09, 'square', .05); },
  jump(){ tone(280,560,.14,'square',.05); },
  point(){ tone(900,1500,.09,'square',.05); },
  smash(){ tone(220,50,.22,'sawtooth',.08); },
  grab(){ tone(500,900,.12,'square',.06); },
  // Kong greift in den Fass-Stapel: hohler Holz-Klonk
  stack(){ tone(210,120,.09,'triangle',.09); crash(.05,.07); },
  // ... wuchtet das Fass ueber den Kopf: ansteigender Grunzer
  heave(){ tone(85,155,.30,'sawtooth',.10); },
  // ... und schleudert es los: Grunzer, Rums beim Loslassen,
  // dann poltert das Fass auf den Traeger und rollt an
  throw(){
    tone(155,55,.24,'sawtooth',.17);
    tone(300,110,.10,'square',.08,.02);
    crash(.09,.18,.02);
    tone(180,90,.26,'triangle',.14,.10);
    crash(.15,.11,.12);
  },
  // Hilferuf der Prinzessin: "HIL-FE!" in zwei Silben
  help(){
    crash(.05,.05);                    // Hauch fuer das "H"
    voice(660,700,.20,1800,.10,.02,8); // "HIL" — hell
    voice(720,540,.34,900,.11,.26,14); // "FE!" — dunkler, faellt ab
  },
  beat(){ tone(72,55,.09,'triangle',.045); },
  death(){ [520,415,350,262,208,175].forEach((f,i)=>tone(f,f,.13,'square',.06,i*.12)); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,f,.12,'square',.06,i*.1)); },
  life(){ [784,988,1175].forEach((f,i)=>tone(f,f,.1,'square',.06,i*.08)); },
  // Bedrohliche chromatische Reihe (eigene Komposition, kein Nintendo-Original)
  intro(){ [98,104,110,117,123,131,139,147].forEach((f,i)=>tone(f,f,.15,'square',.07,i*.17));
    tone(156,156,.45,'square',.08,1.36); },
  thud(){ // LAUTER Wumms, wenn ein Traeger krummgetreten wird
    tone(95,32,.4,'triangle',.4);
    tone(55,28,.5,'sine',.45,.01);
    tone(240,45,.12,'sawtooth',.2);
    crash(.18,.35);
  },
  roar(){ tone(90,55,.6,'sawtooth',.09); tone(70,45,.6,'sawtooth',.09,.05); },
};

// ---- Hintergrundmusik (eigene Komposition, kein Nintendo-Original)
// Treibender 16tel-Groove in a-moll, 4 Takte im Kreis. Die Noten werden mit
// echten Audio-Zeitstempeln ~0,25 s vorausgeplant, damit die Musik nicht am
// Frame-Jitter haengt; beim Pausieren verstummt sie darum erst nach <0,25 s.
const NOTE={E2:82.41,F2:87.31,G2:98,A2:110,C3:130.81,D3:146.83,E3:164.81,G3:196,
            E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
            C5:523.25,D5:587.33,E5:659.26,F5:698.46,G5:783.99};
function seq(s){ return s.trim().split(/\s+/).map(n=>n==='-'?0:NOTE[n]); }
const SONG={
  lead:[].concat(
    seq('A4 -  C5 -  E5 -  D5 C5 -  B4 -  -  -  A4 -  -'),
    seq('F4 -  A4 -  C5 -  -  A4 -  G4 -  -  F4 -  -  -'),
    seq('G4 -  C5 -  E5 -  G5 -  F5 -  E5 -  D5 -  -  -'),
    seq('E5 -  D5 -  C5 -  B4 -  A4 -  -  -  E4 -  -  -')),
  bass:[].concat(

    seq('C3 -  C3 -  C3 -  G3 -  G2 -  G2 -  G2 -  D3 -'),
    seq('A2 -  A2 -  A2 -  E3 -  E2 -  E2 -  E3 -  E3 -')),
};
const MUS={
  i:0, t:0,
  stepDur(){ return Math.max(.10, .133-(level-1)*.006); }, // je Level etwas hektischer
  stop(){ this.i=0; this.t=0; },  // t=0 => beim naechsten tick() neu einklinken
  tick(){
    if(muted) return;
    let a; try{ a=ac(); }catch(e){ return; }
    if(this.t<a.currentTime+.05) this.t=a.currentTime+.05; // nach Pause/Mute/Tab-Wechsel
    const d=this.stepDur();
    while(this.t<a.currentTime+.25){
      const w=this.t-a.currentTime, k=this.i%SONG.lead.length;
      const L=SONG.lead[k], B=SONG.bass[k];
      if(L) tone(L,L,.11,'square',.035,w);
      if(B) tone(B,B,.16,'triangle',.075,w);
      if(this.i%2) crash(.02,.05,w); // Hi-Hat auf den Zwischenschlaegen
      this.i++; this.t+=d;
    }
  },
};

function addScore(n,x,y){
  score+=n; if(x!==undefined) popups.push({x,y,txt:''+n,t:0});
  if(!extraGiven && score>=7500){ extraGiven=true; lives++; sfx.life(); }
}

// ---- Geometrie-Helfer
function girderUnder(x,footY,tol){ // Traeger, auf dem der Fuss (x,footY) steht
  let best=-1, bY=1e9;
  for(let i=0;i<GIRDERS.length;i++){ const g=GIRDERS[i];
    if(x<g.x1-2||x>g.x2+2) continue;
    const s=gY(g,x);
    if(Math.abs(s-footY)<=tol && s<bY){ best=i; bY=s; } }
  return best;
}
function crossLanding(x,y0,y1,minSurf,noGoal){ // erster Traeger, dessen Oberkante zwischen y0..y1 liegt
  let best=-1, bY=1e9;
  for(let i=0;i<GIRDERS.length;i++){ const g=GIRDERS[i];
    if(noGoal&&g.goal) continue;
    if(x<g.x1-2||x>g.x2+2) continue;
    const s=gY(g,x);
    if(s>=y0-0.01 && s<=y1+0.01 && s>=minSurf && s<bY){ best=i; bY=s; } }
  return best;
}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

// ---- Faesser
function spawnBarrel(){
  // Wie im Original: das erste Fass jeder Runde ist blau und nimmt die Leitern
  const blue = barrelCount===0 || barrelCount%8===7;
  barrelCount++;
  barrels.push({x:150, y:170, dir:1, mode:'roll', g:5, vx:0, vy:0, anim:0,
                scored:false, ladder:null, blue});
  sfx.throw();
}
function barrelSpeed(){ return Math.min(2.9, 1.7+0.2*(level-1)); }
function ladderChance(){ return Math.min(0.6, 0.2+0.06*(level-1)); }

function stepBarrel(b){
  b.anim++;
  if(b.mode==='roll'){
    const g=GIRDERS[b.g];
    const oldX=b.x;
    b.x+=b.dir*barrelSpeed();
    // Leiter-Abstieg? (Fass rollt ueber Leiterkopf)
    for(const l of LADDERS){
      if(l.up!==b.g) continue;
      if((oldX-l.x)*(b.x-l.x)<=0 && rng()<(b.blue?0.85:ladderChance())){
        b.mode='ladder'; b.x=l.x; b.ladder=l; return; }
    }
    if(b.x<g.x1||b.x>g.x2){
      // Anschluss-Traeger auf gleicher Hoehe? (z.B. flacher -> schraeger Top-Traeger)
      const n=girderUnder(b.x,b.y,4);
      if(n>=0 && n!==b.g){ b.g=n; b.y=gY(GIRDERS[n],b.x); return; }
      b.mode='fall'; b.vx=b.dir*0.5; b.vy=0; return;
    }
    b.y=gY(g,b.x);
  } else if(b.mode==='ladder'){
    b.y+=1.6;
    if(b.y>=b.ladder.yBot){
      b.g=b.ladder.dn; b.y=b.ladder.yBot; b.mode='roll';
      const d=downhill(GIRDERS[b.g]); if(d) b.dir=d;
      b.ladder=null;
    }
  } else { // fall
    b.vy+=GRAV*0.75;
    const y0=b.y; b.x+=b.vx; b.y+=b.vy;
    if(b.x<-24||b.x>W+24){ b.dead=true; return; }
    if(b.vy>0){
      const n=crossLanding(b.x,y0,b.y,-1e9,true);
      if(n>=0){ b.g=n; b.y=gY(GIRDERS[n],b.x); b.mode='roll';
        const d=downhill(GIRDERS[n]); if(d) b.dir=d; }
    }
  }
  if(b.g===8 && b.x<38 && b.mode==='roll'){ // landet im Oelfass
    b.dead=true; flameT=26;
    if(fires.length < Math.min(4,1+Math.floor(level/3))) // Feuerbaelle wie im Original
      fires.push({x:30, y:gY(GIRDERS[8],30), g:8, dir:1, mode:'walk', tgt:0, tg:0, anim:0});
  }
}

// ---- Feuerbaelle: wandern zufaellig, klettern auch Leitern
function stepFire(f){
  f.anim++;
  if(f.mode==='walk'){
    const g=GIRDERS[f.g], oldX=f.x;
    f.x+=f.dir*0.7;
    if(f.x<g.x1+4||f.x>g.x2-4){
      const n=girderUnder(f.x,f.y,5); // Anschluss-Traeger (flacher Boden <-> Rampe)?
      if(n>=0&&n!==f.g&&!GIRDERS[n].goal) f.g=n;
      else { f.dir*=-1; f.x=Math.max(g.x1+4,Math.min(g.x2-4,f.x)); }
    }
    f.y=gY(GIRDERS[f.g],f.x);
    if(rng()<0.005) f.dir*=-1;
    for(const l of LADDERS){
      if((oldX-l.x)*(f.x-l.x)<=0){
        if(l.dn===f.g && rng()<0.35){ f.mode='climb'; f.x=l.x; f.tgt=l.yTop; f.tg=l.up; break; }
        if(l.up===f.g && rng()<0.2){ f.mode='climb'; f.x=l.x; f.tgt=l.yBot; f.tg=l.dn; break; }
      }
    }
  } else {
    f.y += (f.tgt>f.y?0.8:-0.8);
    if(Math.abs(f.y-f.tgt)<1){ f.y=f.tgt; f.g=f.tg; f.mode='walk'; }
  }
}

// Zufall austauschbar (Headless-Tests koennen deterministisch seeden)
let rng=Math.random;

// ---- Spieler
function killPlayer(){ if(DBG.god) return; state='dying'; stateT=0; sfx.death(); }
// Ziel erreicht: in Level 1-9 schnappt Kong sich die Prinzessin und flieht
// ein Stockwerk hoeher, im letzten Level ist sie endgueltig gerettet.
function reachGoal(){ state='win'; stateT=0; addScore(bonus); sfx.win();
  if(level>=MAXLEVEL){ addScore(10000,224,90); state='rescue'; } }

function stepPlayer(){
  const p=player;
  if(p.hammerT>0){ p.hammerT--; }
  const canClimb=p.hammerT<=0;

  if(p.mode==='ground'){
    const g=GIRDERS[p.g];
    let moved=false;
    if(keys.l){ p.dir=-1; p.x-=SPEED; moved=true; }
    if(keys.r){ p.dir=1;  p.x+=SPEED; moved=true; }
    p.x=Math.max(8,Math.min(W-8,p.x));
    // Affen-Plattform: unsichtbare Wand vor dem Affen
    if(p.g===5 && p.x<156) p.x=156;
    if(moved){ p.anim++; if(p.anim%8===0) sfx.walk(); } // Warbel-Ton beim Laufen
    const gi=girderUnder(p.x,p.y,8);
    if(gi>=0){ p.g=gi; p.y=gY(GIRDERS[gi],p.x);
      if(GIRDERS[gi].goal) { reachGoal(); return; } }
    else { p.mode='air'; p.vx=p.dir*0.6; p.vy=0; p.airFrom=p.y; return; }
    // Leiter rauf/runter
    if(canClimb && (keys.u||keys.d)){
      for(const l of LADDERS){
        if(l.broken || Math.abs(p.x-l.x)>=10) continue;
        if(keys.u && l.dn===p.g && Math.abs(p.y-l.yBot)<6){
          p.mode='climb'; p.ladder=l; p.x=l.x; return; }
        if(keys.d && l.up===p.g && Math.abs(p.y-l.yTop)<6){
          p.mode='climb'; p.ladder=l; p.x=l.x; p.y+=2; return; }
      }
    }
    // Sprung
    if(keys.j && !jumpLatch && p.hammerT<=0){
      jumpLatch=true; p.mode='air'; p.vy=JUMP; p.vx=(keys.l?-1:keys.r?1:0)*1.3;
      p.airFrom=p.y; sfx.jump();
    }
  }
  else if(p.mode==='air'){
    p.vy+=GRAV;
    const y0=p.y;
    p.x=Math.max(8,Math.min(W-8,p.x+p.vx));
    p.y+=p.vy;
    if(p.vy>0){
      const gi=crossLanding(p.x,y0,p.y,p.airFrom-10,false);
      if(gi>=0){
        if(p.y-p.airFrom>100){ p.g=gi; p.y=gY(GIRDERS[gi],p.x); killPlayer(); return; }
        p.g=gi; p.y=gY(GIRDERS[gi],p.x); p.mode='ground'; p.vx=0; p.vy=0;
        if(GIRDERS[gi].goal){ reachGoal(); return; }
      }
    }
    if(p.y>H+40){ killPlayer(); return; }
  }
  else if(p.mode==='climb'){
    const l=p.ladder;
    if(keys.u) { p.y-=CLIMB; p.anim++; }
    if(keys.d) { p.y+=CLIMB; p.anim++; }
    if(p.y<=l.yTop){ p.y=l.yTop; p.g=l.up; p.mode='ground'; p.ladder=null;
      if(GIRDERS[l.up].goal){ reachGoal(); return; } }
    else if(p.y>=l.yBot){ p.y=l.yBot; p.g=l.dn; p.mode='ground'; p.ladder=null; }
  }
  if(!keys.j) jumpLatch=false;

  // Hammer greifen (nicht beim Klettern)
  if(p.mode!=='climb' && p.hammerT<=0){
    for(const hm of hammers){
      if(hm.taken) continue;
      if(overlap(p.x-7,p.y-22,14,22, hm.x-9,hm.y-8,18,16)){
        hm.taken=true; p.hammerT=380; sfx.grab(); }
    }
  }
}

function hammerRect(){
  const p=player;
  if(p.hammerT<=0) return null;
  const up=(Math.floor(p.hammerT/8)%2)===0;
  return up ? {x:p.x-9, y:p.y-58, w:18, h:18}
            : (p.dir>0 ? {x:p.x+5, y:p.y-24, w:26, h:18}
                       : {x:p.x-31, y:p.y-24, w:26, h:18});
}

// ---- Haupt-Step (fester 60-Hz-Takt)
function step(){
  frame++;
  if(state==='title'||state==='over'){ stateT++; MUS.stop(); return; }
  if(paused){ MUS.stop(); return; }
  if(state==='intro'){ MUS.stop(); stepIntro(); return; }

  if(state==='dying'){
    stateT++; MUS.stop(); // Musik weg, damit die Sterbe-Melodie freisteht
    if(stateT>=140){
      lives--;
      if(lives<0){ state='over'; stateT=0;
        if(score>high){ high=score; localStorage.setItem('fassalarm_high',high); } }
      else { resetRound(); state='play'; }
    }
    return;
  }
  if(state==='win'){ // kurzer Jubel, dann holt Kong sie sich zurueck
    stateT++; MUS.stop();
    if(stateT>=110) startFlee();
    return;
  }
  if(state==='flee'){ stateT++; MUS.stop(); stepFlee(); return; }
  if(state==='rescue'){ // letztes Level geschafft -- Abspann
    stateT++; MUS.stop();
    if(stateT>=360){ state='over'; stateT=0;
      if(score>high){ high=score; localStorage.setItem('fassalarm_high',high); } }
    return;
  }
  // ---- state === 'play'
  stateT++;
  MUS.tick(); // Hintergrundmusik loest den frueheren nackten Herzschlag ab
  if(stateT%120===0 && bonus>0) bonus=Math.max(0,bonus-100);
  if(flameT>0) flameT--;

  // Prinzessin ruft regelmaessig um Hilfe
  if(helpT>0) helpT--;
  if(stateT%280===90){ sfx.help(); helpT=110; }

  // Affe wirft Faesser
  apeT--; apeAnim++;
  if(apeT===63) sfx.stack(); // Pranke wuehlt im Fass-Stapel
  if(apeT===35) sfx.heave(); // Fass wandert ueber den Kopf
  if(apeT===18) spawnBarrel();
  if(apeT<=0) apeT=Math.max(70, 170-20*(level-1));

  stepPlayer();
  if(state!=='play') return;

  for(const b of barrels) stepBarrel(b);
  barrels=barrels.filter(b=>!b.dead);
  if(barrels.length>14) barrels.shift();
  for(const f of fires) stepFire(f);

  // Kollisionen
  const hr=hammerRect(), p=player;
  for(const b of barrels){
    if(b.dead) continue;
    if(hr && overlap(hr.x,hr.y,hr.w,hr.h, b.x-8,b.y-12,16,12)){
      b.dead=true; addScore(500,b.x,b.y-16); sfx.smash(); continue; }
    if(overlap(p.x-6,p.y-20,12,20, b.x-7,b.y-11,14,10)){ killPlayer(); return; }
    // Punkte fuers Drueberspringen
    if(!b.scored && p.mode==='air' && Math.abs(b.x-p.x)<10 && b.y>p.y && b.y-p.y<80){
      b.scored=true; addScore(100,p.x,p.y-30); sfx.point(); }
  }
  for(const f of fires){
    if(hr && overlap(hr.x,hr.y,hr.w,hr.h, f.x-7,f.y-14,14,14)){
      f.dead=true; addScore(300,f.x,f.y-18); sfx.smash(); continue; }
    if(overlap(p.x-6,p.y-20,12,20, f.x-6,f.y-13,12,13)){ killPlayer(); return; }
  }
  fires=fires.filter(f=>!f.dead);
  for(const pp of popups) pp.t++;
  popups=popups.filter(pp=>pp.t<50);
}

  b:'#a8703c',e:'#3a2410'};  // Fell-Lichtkante / dunkelste Fell-Kontur
function mkspr(rows,sc){
  const w=Math.max(...rows.map(r=>r.length)), h=rows.length,
        c=document.createElement('canvas');
  c.width=w*sc; c.height=h*sc;
  const x=c.getContext('2d');
  for(let j=0;j<h;j++) for(let i=0;i<rows[j].length;i++){
    const ch=rows[j][i];
    if(ch!=='.'){ x.fillStyle=PAL[ch]||'#f0f'; x.fillRect(i*sc,j*sc,sc,sc); } }
  return c;
}
function blit(spr,cx,by,flip){ // cx = Fuss-Mitte, by = Unterkante
  ctx.save(); ctx.translate(cx,by); if(flip) ctx.scale(-1,1);
  ctx.drawImage(spr,-spr.width>>1,-spr.height); ctx.restore();
}

function drawGirder(g){
  // Wie im Arcade-Original: schraege Traeger bestehen aus horizontalen
  // Stuecken, die stufig versetzt sind (keine durchgehende Schraege!)
  const step=28;
  for(let x=g.x1; x<g.x2; x+=step){
    const xe=Math.min(x+step,g.x2), w=xe-x;
    const y=Math.round(gY(g,(x+xe)/2));
    ctx.fillStyle=PAL.q; // X-Verstrebungen
    for(let k=x; k<xe-10; k+=14){
      ctx.beginPath();
      ctx.moveTo(k,y+8); ctx.lineTo(k+10,y+3); ctx.lineTo(k+13,y+3); ctx.lineTo(k+3,y+8);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(k,y+3); ctx.lineTo(k+10,y+8); ctx.lineTo(k+13,y+8); ctx.lineTo(k+3,y+3);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle=PAL.p;
    ctx.fillRect(x,y,w,3); ctx.fillRect(x,y+8,w,3);
  }
}
function drawLadder(l){
  // Hoehen live berechnen, damit die Leitern im Intro mit den Traegern wandern
  const yT=gY(GIRDERS[l.up],l.x), yB=gY(GIRDERS[l.dn],l.x);
  ctx.fillStyle='#3ed6ff';
  const seg=(a,c)=>{ ctx.fillRect(l.x-8,a,2,c-a); ctx.fillRect(l.x+6,a,2,c-a);
    for(let y=a+3;y<c-2;y+=7) ctx.fillRect(l.x-8,y,16,2); };
  if(l.broken){ seg(yT+2,yT+16); seg(yB-14,yB); }
  else seg(yT+2,yB);
}
function drawBarrel(b){
  const x=b.x,y=b.y; // y = Unterkante
  // Blaues Fass = nimmt die Leitern (wie im Original)
  const body=b.blue?'#4890f0':PAL.T, dark=b.blue?'#1c4ea0':PAL.N,
        lite=b.blue?'#90c4ff':PAL.t;
  if(b.mode==='ladder'){ // Frontansicht beim Leiter-Abstieg
    ctx.fillStyle=dark; ctx.fillRect(x-7,y-13,14,13);
    ctx.fillStyle=body; ctx.fillRect(x-5,y-11,10,9);
    ctx.fillStyle=lite; ctx.fillRect(x-3,y-9,6,5);
    ctx.fillStyle=dark; ctx.fillRect(x-1,y-8,2,3);
    return;
  }
  ctx.fillStyle=body; ctx.fillRect(x-8,y-12,16,12);
  ctx.fillStyle=dark;
  ctx.fillRect(x-8,y-12,16,2); ctx.fillRect(x-8,y-2,16,2);   // Boeden
  ctx.fillRect(x-6,y-12,2,12); ctx.fillRect(x+4,y-12,2,12);  // Reifen
  ctx.fillStyle=lite;
  const ph=(b.anim>>2)%3; // "Rotation": wandernde helle Daube
  ctx.fillRect(x-3+ph*2,y-10,2,8);
}

function drawPlayer(){
  const p=player, x=p.x, y=p.y, d=p.dir, flip=d<0;
  if(state==='dying'){
    if(stateT<80){ // Sterbe-Drehung ...
      ctx.save();
      ctx.translate(x,y-14); ctx.rotate(stateT*0.2); ctx.translate(-x,-(y-14));
      blit(SPR.jump,x,y,false);
      ctx.restore();
    } else { // ... dann flach liegen mit Heiligenschein (wie im Original)
      ctx.save(); ctx.translate(x,y-10); ctx.rotate(Math.PI/2);
      ctx.drawImage(SPR.stand,-(SPR.stand.width>>1),-(SPR.stand.height>>1));
      ctx.restore();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y-32,7,0,7); ctx.stroke();
    }
    return;
  }
  ctx.save();
  if(p.mode==='climb'){
    blit(SPR.climb,x,y,(p.anim>>3)%2===1); // Frames = gespiegelt
  } else {
    const running=(keys.l||keys.r)&&p.mode==='ground';
    const spr = p.mode==='air' ? SPR.jump
              : (running&&(p.anim>>3)%2 ? SPR.walk : SPR.stand);
    blit(spr,x,y,flip);
    if(p.hammerT>0){
      const up=(Math.floor(p.hammerT/8)%2)===0;
      ctx.fillStyle=PAL.N;
      if(up){ ctx.fillRect(x-2,y-54,4,28);
        ctx.fillStyle=PAL.Y; ctx.fillRect(x-12,y-62,24,12);
        ctx.fillStyle=PAL.O; ctx.fillRect(x-12,y-62,24,3); }
      else { ctx.fillRect(x+(d>0?4:-24),y-20,20,4);
        ctx.fillStyle=PAL.Y; ctx.fillRect(x+(d>0?18:-34),y-28,16,18);
        ctx.fillStyle=PAL.O; ctx.fillRect(x+(d>0?18:-34),y-28,4,18); }
    }
  }
  ctx.restore();
}

function drawLevel(){
  for(const g of GIRDERS) drawGirder(g);
  for(const l of LADDERS) drawLadder(l);
  drawOil(); drawStack();
  for(const hm of hammers) if(!hm.taken) drawHammerPickup(hm);
  drawGoal();
  if(state==='intro'){ // Kong traegt die Prinzessin hoch und stampft alles krumm
    drawIntroLadder();
    const roar = intro.phase==='roar'||intro.phase==='place';
    blit(roar?SPR.kongThrow:SPR.kong, intro.x, Math.round(intro.y),
         intro.phase==='climb' && (intro.fr>>3)%2===1);
    if(!princessPlaced) // Prinzessin unterm Arm bzw. beim Hochsetzen
      blit(SPR.princess, intro.px, Math.round(intro.py), false);
  } else if(state==='flee'){ // Kong schnappt sie sich und flieht eine Ebene hoeher
    if(flee.phase==='up') drawFleeLadder();
    drawPlayer();
    blit(flee.phase==='come'?SPR.kong:SPR.kongThrow, Math.round(flee.x),
         Math.round(flee.y), flee.phase==='up' && (flee.fr>>3)%2===1);
    if(!princessPlaced) blit(SPR.princess, Math.round(flee.px), Math.round(flee.py), false);
  } else {
    if(state!=='rescue') drawApe(); // im Finale ist Kong ueber alle Berge
    for(const b of barrels) drawBarrel(b);
    for(const f of fires) drawFire(f);
    drawPlayer();
  }
  ctx.font='bold 12px monospace'; ctx.textAlign='center';
  for(const pp of popups){ ctx.fillStyle='#fff';
    ctx.fillText(pp.txt,pp.x,pp.y-pp.t*0.6); }
  drawHud();
}

function render(){

  else if(state==='over') drawOver();

  else if(state==='rescue') drawRescue();
  else{
    // Bildschirm wackelt kurz, wenn ein Traeger krummgetreten wird
    const shake = state==='intro' && intro && intro.phase==='bend' && intro.fr<12;
    if(shake){ ctx.save(); ctx.translate((frame>>1)%2?2:-2,(frame>>2)%2?1:-1); }
    drawLevel();
    if(shake) ctx.restore();
  }
}

// ---- Loop mit festem Zeittakt
let acc=0, last=performance.now();
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ step(); acc-=1000/60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- Eingabe
function anyStart(){
  if(state==='title'||state==='over'){ startGame(); return true; }
  if(state==='intro'){ finishIntro(); return true; } // Intro ueberspringbar
  return false;
}
addEventListener('keydown',e=>{
  if(e.repeat) return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') keys.l=1;
  if(k==='ArrowRight'||k==='d') keys.r=1;
  if(k==='ArrowUp'||k==='w') keys.u=1;
  if(k==='ArrowDown'||k==='s') keys.d=1;
  if(k===' '){ keys.j=1; e.preventDefault(); }
  if(k==='Enter') anyStart();
  if(k==='m'||k==='M') muted=!muted;
  if(k==='p'||k==='P') paused=!paused;
  if(AC===null&&!muted) try{ac();}catch(err){}
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a') keys.l=0;
  if(k==='ArrowRight'||k==='d') keys.r=0;
  if(k==='ArrowUp'||k==='w') keys.u=0;
  if(k==='ArrowDown'||k==='s') keys.d=0;
  if(k===' ') keys.j=0;
});
// Touch
if('ontouchstart' in window) document.body.classList.add('touch');
cv.addEventListener('pointerdown',()=>{ anyStart(); if(AC===null&&!muted) try{ac();}catch(err){} });
function bindBtn(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[key]=1;
    if(anyStart()) keys[key]=0; if(AC===null&&!muted) try{ac();}catch(err){} });
  const off=e=>{ e.preventDefault(); keys[key]=0; };
  el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}
bindBtn('bL','l'); bindBtn('bR','r'); bindBtn('bU','u'); bindBtn('bD','d'); bindBtn('bJ','j');

document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') paused=true; });

  seed(fn){ rng=fn||Math.random; },
  // Ton-Checks von Hand: _faDbg.unmute(); _faDbg.sfx('help')
  sfx(n,...a){ if(sfx[n]) sfx[n](...a); },
  unmute(){ muted=false; try{ac();}catch(e){} },
  mus:MUS,
};
window._faDbg=DBG;
muted=navigator.webdriver||false; // Headless: kein Audio-Genöle
</script>
