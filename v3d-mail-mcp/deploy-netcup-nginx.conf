# /etc/nginx/sites-available/mcp  —  V3D Mail MCP-Connector für Claude
# Leitet NUR /mcp, die OAuth-Pfade und die Metadaten über Tailscale an V3DA
# (100.125.34.44:8446 = tailscale serve → 127.0.0.1:8802) weiter. Alles andere 404.
# TLS ergänzt: sudo certbot --nginx -d mcp.volme3dakademie.de
limit_req_zone $binary_remote_addr zone=mcp_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mcp_api:10m rate=10r/s;

upstream v3da_mcp {
    server 100.125.34.44:8446;
    keepalive 4;
}

server {
    server_name mcp.volme3dakademie.de;
    listen 80;
    listen [::]:80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;         # überschreiben; tailscale serve reicht ihn durch
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name v3da.tailf05fe9.ts.net;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;              # Let's-Encrypt-Kette, Standard 1 reicht nicht
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_read_timeout 180s;
    proxy_buffering off;
    client_max_body_size 30m;
    access_log /var/log/nginx/mcp.access.log;   # nur Pfad/Status, keine Tokens (Header)

    location = /mcp {
        limit_req zone=mcp_api burst=40 nodelay;
        proxy_pass https://v3da_mcp;
    }
    location ~ ^/(authorize|token|register|revoke|login)$ {
        limit_req zone=mcp_auth burst=10 nodelay;
        proxy_pass https://v3da_mcp;
    }
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource)(/mcp)?$ {
        limit_req zone=mcp_api burst=20 nodelay;
        proxy_pass https://v3da_mcp;
    }
    location / {
        return 404;
    }
}
