<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolmeSlice Pro — Orca im Browser</title>
<style>
  :root { --bg: #1a1a2e; --panel: #16213e; --accent: #4fc3f7; --text: #e0e0e0; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text);
         display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1/3; padding: .7rem 1.2rem; background: var(--panel);
           display: flex; align-items: center; gap: 1rem; }
  h1 { font-size: 1.15rem; color: var(--accent); margin: 0; white-space: nowrap; }
  #status { flex: 1; font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: #66bb6a; } .err { color: #ef5350; }
  aside { padding: 1rem; background: var(--panel); overflow-y: auto; display: flex; flex-direction: column; gap: .9rem; }
  aside label { display: block; font-size: .78rem; opacity: .75; margin-bottom: .2rem; }
  aside input, aside select, aside textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid #334;
    border-radius: 6px; padding: .45rem .6rem; font-size: .88rem; }
  aside textarea { font-family: monospace; font-size: .78rem; min-height: 4.5rem; }
  button { background: var(--accent); color: #000; border: 0; padding: .6rem 1rem;
           border-radius: 6px; font-size: .95rem; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  button.secondary { background: #334; color: var(--text); }
  #tabs { display: flex; gap: .3rem; }
  .tab { background: transparent; color: var(--text); font-weight: 400; padding: .4rem .9rem;
         border: 1px solid #334; border-radius: 6px; }
  .tab.active { background: var(--accent); color: #000; font-weight: 600; }
  #drop { border: 2px dashed #446; border-radius: 10px; padding: 1.2rem .8rem; text-align: center;
          font-size: .85rem; cursor: pointer; }
  #drop.armed { border-color: var(--accent); color: var(--accent); }
  main { position: relative; }
  #view { width: 100%; height: 100%; display: block; }
  #overlay[hidden], #legend[hidden] { display: none; }
  #overlay { position: absolute; left: 1rem; right: 1rem; bottom: 1rem; display: flex;
             align-items: center; gap: 1rem; background: rgba(22,33,62,.85); border-radius: 10px;
             padding: .6rem 1rem; }
  #layerSlider { flex: 1; }
  #legend { position: absolute; top: .8rem; left: 1rem; display: flex; flex-direction: column;
            gap: .25rem; font-size: .78rem; background: rgba(22,33,62,.7); padding: .5rem .7rem;
            border-radius: 8px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  #stats { font-size: .85rem; line-height: 1.5; background: var(--bg); border-radius: 8px; padding: .6rem .8rem; }
  .row2 { display: flex; gap: .5rem; } .row2 > * { flex: 1; }
  #settings details { background: var(--bg); border-radius: 8px; padding: .35rem .6rem; margin-bottom: .5rem; }
  #settings summary { cursor: pointer; font-size: .85rem; font-weight: 600; padding: .25rem 0; }
  #settings .field { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .35rem 0; }
  #settings .field label { flex: 1; margin: 0; font-size: .8rem; }
  #settings .field input, #settings .field select { width: 7.5rem; padding: .3rem .45rem; font-size: .85rem; }
  #settings .field.changed label { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🥨 VolmeSlice Pro</h1>
  <nav id="tabs">
    <button class="tab active" data-tab="prepare">Vorbereiten</button>
    <button class="tab" data-tab="preview">Vorschau</button>
  </nav>
  <div id="status">Lade Orca-Kern …</div>
</header>

<aside>
  <div id="drop">📂 Modell hierher ziehen<br><small>STL · STEP · SVG · OBJ · 3MF</small>
    <input type="file" id="file" accept=".stl,.step,.stp,.svg,.obj,.3mf" hidden>
  </div>

  <div>
    <label>Hersteller</label>
    <select id="vendor"></select>
  </div>
  <div>
    <label>Drucker</label>
    <input id="machine" list="machineList" placeholder="Drucker wählen …">
    <datalist id="machineList"></datalist>
  </div>
  <div>
    <label>Druckprofil</label>
    <input id="process" list="processList" placeholder="Profil wählen …">
    <datalist id="processList"></datalist>
  </div>
  <div>
    <label>Filament</label>
    <input id="filament" list="filamentList" placeholder="Filament wählen …">
    <datalist id="filamentList"></datalist>
  </div>

  <div class="row2">
    <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;opacity:1">
      <input type="checkbox" id="support" style="width:auto"> Stützen</label>
    <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;opacity:1">
      <input type="checkbox" id="brim" style="width:auto"> Brim</label>
  </div>

  <div id="settings"></div>

  <div id="objPanel" hidden style="background:var(--bg);border-radius:8px;padding:.6rem .8rem">
    <label style="opacity:1;font-size:.85rem">🧊 <b id="objName"></b> <small>(ziehen = verschieben)</small></label>
    <div class="row2" style="margin-top:.4rem">
      <div><label>X (mm)</label><input type="number" id="tDx" step="1" value="0"></div>
      <div><label>Y (mm)</label><input type="number" id="tDy" step="1" value="0"></div>
    </div>
    <div class="row2" style="margin-top:.4rem">
      <div><label>Drehung (°)</label><input type="number" id="tRz" step="15" value="0"></div>
      <div><label>Größe (%)</label><input type="number" id="tScale" step="10" value="100" min="1"></div>
    </div>
  </div>

  <div>
    <label>Erweiterte Overrides (key = value)</label>
    <textarea id="overrides" placeholder="z. B. sparse_infill_density = 20%"></textarea>
  </div>

  <button id="btnSlice" disabled>Slicen</button>
  <button id="btnDownload" class="secondary" disabled>G-Code herunterladen</button>
  <div id="stats"></div>
</aside>

<main>
  <canvas id="view"></canvas>
  <div id="legend" hidden></div>
  <div id="overlay" hidden>
    <input type="range" id="layerSlider" min="1" max="1" value="1">
    <span id="layerLabel"></span>
  </div>
</main>

<script src="./three.min.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const status = $('status');

if (!crossOriginIsolated) {
  status.innerHTML = '<span class="err">FEHLER: COOP/COEP-Header fehlen (kein SharedArrayBuffer)</span>';
  throw new Error('no COI');
}

// ---------- Profil-Datenbank ----------
const vendorCache = new Map();
async function vendorIndex(v) {
  if (!vendorCache.has(v)) vendorCache.set(v, await (await fetch(`/profiles/${v}.json`)).json());
  return vendorCache.get(v);
}
async function profileChain(vendor, listKey, presetName) {
  const idx = await vendorIndex(vendor);
  const byName = new Map(idx[listKey].map(e => [e.name, e.sub_path]));
  const chain = []; let name = presetName;
  while (name) {
    const sub = byName.get(name);
    if (!sub) throw new Error(`Preset nicht gefunden: ${name}`);
    const json = await (await fetch(`/profiles/${vendor}/${sub.split('/').map(encodeURIComponent).join('/')}`)).json();
    chain.unshift(json); name = json.inherits;
  }
  return chain.map(j => JSON.stringify(j));
}

// ---------- Settings-Panel: effektive Profilwerte, Abweichung = Override ----------
const SETTINGS = [
  { group: '🎚️ Qualität', key: 'layer_height', label: 'Schichthöhe (mm)', type: 'number', step: .04 },
  { group: '🎚️ Qualität', key: 'initial_layer_print_height', label: 'Erste Schicht (mm)', type: 'number', step: .04 },
  { group: '🧱 Wände & Schalen', key: 'wall_loops', label: 'Wandlinien', type: 'number', step: 1 },
  { group: '🧱 Wände & Schalen', key: 'top_shell_layers', label: 'Deckschichten', type: 'number', step: 1 },
  { group: '🧱 Wände & Schalen', key: 'bottom_shell_layers', label: 'Bodenschichten', type: 'number', step: 1 },
  { group: '🕸️ Infill', key: 'sparse_infill_density', label: 'Dichte (%)', type: 'percent', step: 5 },
  { group: '🕸️ Infill', key: 'sparse_infill_pattern', label: 'Muster', type: 'select',
    options: ['grid','gyroid','cubic','triangles','honeycomb','adaptivecubic','crosshatch','line','zig-zag'] },
  { group: '🌡️ Temperatur', key: 'nozzle_temperature', label: 'Düse (°C)', type: 'number', step: 5, vector: true },
  { group: '🌡️ Temperatur', key: 'nozzle_temperature_initial_layer', label: 'Düse 1. Schicht (°C)', type: 'number', step: 5, vector: true },
  { group: '🚀 Geschwindigkeit', key: 'outer_wall_speed', label: 'Außenwand (mm/s)', type: 'number', step: 10 },
  { group: '🚀 Geschwindigkeit', key: 'inner_wall_speed', label: 'Innenwand (mm/s)', type: 'number', step: 10 },
  { group: '🚀 Geschwindigkeit', key: 'sparse_infill_speed', label: 'Infill (mm/s)', type: 'number', step: 10 },
  { group: '🦺 Stützen', key: 'support_type', label: 'Typ', type: 'select',
    options: ['normal(auto)','tree(auto)','normal(manual)','tree(manual)'] },
  { group: '🦺 Stützen', key: 'support_threshold_angle', label: 'Schwellwinkel (°)', type: 'number', step: 5 },
];
let effectiveConfig = {};   // gemergte Profilkette (Basis → speziell)
let chainsCache = null;     // { machine, process, filament } als JSON-Strings

async function loadChains() {
  const v = $('vendor').value;
  chainsCache = {
    machine:  await profileChain(v, 'machine_list',  $('machine').value),
    process:  await profileChain(v, 'process_list',  $('process').value),
    filament: await profileChain(v, 'filament_list', $('filament').value),
  };
  return chainsCache;
}

async function refreshSettings() {
  try {
    const c = await loadChains();
    effectiveConfig = {};
    for (const s of [...c.machine, ...c.process, ...c.filament])
      Object.assign(effectiveConfig, JSON.parse(s));
  } catch { return; }   // unvollständige Auswahl → Panel unverändert
  const groups = new Map();
  for (const s of SETTINGS) {
    if (!groups.has(s.group)) groups.set(s.group, []);
    groups.get(s.group).push(s);
  }
  $('settings').innerHTML = [...groups].map(([name, items]) => `
    <details${name.includes('Qualität') || name.includes('Infill') ? ' open' : ''}>
      <summary>${name}</summary>
      ${items.map(s => {
        const raw = effectiveConfig[s.key];
        let val = Array.isArray(raw) ? raw[0] : raw;
        if (val === undefined) val = '';
        if (s.type === 'percent') val = String(val).replace('%', '');
        const input = s.type === 'select'
          ? `<select data-key="${s.key}">${[...new Set([String(val), ...s.options])].map(o =>
              `<option${o === String(val) ? ' selected' : ''}>${o}</option>`).join('')}</select>`
          : `<input type="number" data-key="${s.key}" value="${val}" step="${s.step}">`;
        return `<div class="field" data-key="${s.key}"><label>${s.label}</label>${input}</div>`;
      }).join('')}
    </details>`).join('');
  // Änderungs-Markierung
  $('settings').querySelectorAll('[data-key]').forEach(el => {
    if (el.tagName !== 'INPUT' && el.tagName !== 'SELECT') return;
    el.oninput = () => {
      const field = el.closest('.field');
      const changed = settingOverrides().some(([k]) => k === el.dataset.key);
      field.classList.toggle('changed', changed);
    };
  });
}

// Abweichungen vom Profil als [key, value]-Liste
function settingOverrides() {
  const out = [];
  for (const s of SETTINGS) {
    const el = $('settings').querySelector(`input[data-key="${s.key}"], select[data-key="${s.key}"]`);
    if (!el || el.value === '') continue;
    const raw = effectiveConfig[s.key];
    let profileVal = Array.isArray(raw) ? raw[0] : raw;
    if (profileVal === undefined) profileVal = '';
    let uiVal = el.value;
    if (s.type === 'percent') {
      profileVal = String(profileVal).replace('%', '');
      if (String(uiVal) !== String(profileVal)) out.push([s.key, uiVal + '%']);
      continue;
    }
    if (String(uiVal) !== String(profileVal))
      out.push([s.key, uiVal]);   // Vektor-Optionen (coInts) akzeptieren Einzelwert
  }
  return out;
}

async function fillVendor() {
  const vendors = await (await fetch('/profiles/index.json')).json();
  $('vendor').innerHTML = vendors.map(v => `<option${v === 'BBL' ? ' selected' : ''}>${v}</option>`).join('');
  await fillPresets();
}
async function fillPresets() {
  const idx = await vendorIndex($('vendor').value);
  const fill = (listId, entries) => $(listId).innerHTML =
    entries.map(e => `<option value="${e.name.replaceAll('"','&quot;')}">`).join('');
  fill('machineList', idx.machine_list);
  fill('processList', idx.process_list);
  fill('filamentList', idx.filament_list);
  if ($('vendor').value === 'BBL') {
    $('machine').value  = 'Bambu Lab X1 Carbon 0.4 nozzle';
    $('process').value  = '0.20mm Standard @BBL X1C';
    $('filament').value = 'Bambu PLA Basic @BBL X1C';
  } else {
    $('machine').value = $('process').value = $('filament').value = '';
  }
}
$('vendor').onchange = async () => { await fillPresets(); await applyMachineBed(); await refreshSettings(); };
$('process').onchange = $('filament').onchange = refreshSettings;

// Bettgröße aus der printable_area des gewählten Druckers (letzter Wert der Kette)
async function applyMachineBed() {
  try {
    const chain = await profileChain($('vendor').value, 'machine_list', $('machine').value);
    let area = null;
    for (const s of chain) {
      const j = JSON.parse(s);
      if (j.printable_area) area = j.printable_area;
    }
    if (area) {
      const pts = (Array.isArray(area) ? area : [area]).map(p => p.split('x').map(Number));
      const w = Math.max(...pts.map(p => p[0])), h = Math.max(...pts.map(p => p[1]));
      if (w > 0 && h > 0) setBed(w, h);
    }
  } catch { /* unbekannter Drucker → Bett unverändert */ }
  requestPreview();
}
$('machine').onchange = async () => { await applyMachineBed(); await refreshSettings(); };

// ---------- Datei-Handling ----------
let modelBytes = null, modelName = '';
function acceptFile(f) {
  const r = new FileReader();
  r.onload = () => {
    modelBytes = new Uint8Array(r.result);
    modelName = f.name;
    $('drop').innerHTML = `✅ <b>${f.name}</b><br><small>${(f.size/1024).toFixed(0)} KB — klicken zum Ändern</small>`;
    updateSliceable();
    requestPreview();
  };
  r.readAsArrayBuffer(f);
}

let workerReady = false;
function requestPreview() {
  if (!modelBytes || !workerReady) return;
  status.textContent = 'Lade Modell-Vorschau …';
  // Kopie schicken — modelBytes bleibt für den Slice erhalten
  worker.postMessage({ cmd: 'preview', bytes: modelBytes.slice(),
                       filename: modelName, bedCenter: [bedSize[0] / 2, bedSize[1] / 2] });
}
$('drop').onclick = () => $('file').click();
$('file').onchange = () => $('file').files[0] && acceptFile($('file').files[0]);
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('armed'); });
addEventListener('dragleave', () => $('drop').classList.remove('armed'));
addEventListener('drop', e => {
  e.preventDefault(); $('drop').classList.remove('armed');
  if (e.dataTransfer.files[0]) acceptFile(e.dataTransfer.files[0]);
});

// ---------- Three.js-Viewer (aus dem M3-Test) ----------
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 2000);
scene.up = camera.up = new THREE.Vector3(0, 0, 1);

// Licht für die schattierte Modell-Ansicht
scene.add(new THREE.HemisphereLight(0xa0b0ff, 0x303040, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(150, -200, 400);
scene.add(sun);

// Druckbett — Größe kommt aus dem gewählten Druckerprofil (printable_area)
let CENTER = new THREE.Vector3(128, 128, 10);
let bedGroup = new THREE.Group();
scene.add(bedGroup);
let bedSize = [256, 256];
function setBed(w, h) {
  bedSize = [w, h];
  bedGroup.clear();
  const grid = new THREE.GridHelper(Math.max(w, h), Math.round(Math.max(w, h) / 16), 0x334466, 0x223);
  grid.rotation.x = Math.PI / 2;
  grid.position.set(w / 2, h / 2, 0);
  bedGroup.add(grid);
  const outline = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, .05), new THREE.Vector3(w, 0, .05),
      new THREE.Vector3(w, h, .05), new THREE.Vector3(0, h, .05)]),
    new THREE.LineBasicMaterial({ color: 0x4fc3f7 }));
  bedGroup.add(outline);
  CENTER = new THREE.Vector3(w / 2, h / 2, 10);
  updateCam();
}
let camTheta = -Math.PI / 4, camPhi = 1.05, camDist = 260;
function updateCam() {
  camera.position.set(
    CENTER.x + camDist * Math.sin(camPhi) * Math.cos(camTheta),
    CENTER.y + camDist * Math.sin(camPhi) * Math.sin(camTheta),
    CENTER.z + camDist * Math.cos(camPhi));
  camera.lookAt(CENTER);
}
const raycaster = new THREE.Raycaster();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // Bettebene z=0
function pickObject(ev) {
  const r = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(modelGroup.children, true)[0];
  return hit ? { idx: hit.object.userData.objIndex, ray: raycaster } : null;
}
function planePoint(ev) {
  const r = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(dragPlane, p) ? p : null;
}
canvas.addEventListener('pointerdown', (e) => {
  // Im Vorbereiten-Tab: Klick auf Objekt = auswählen + ziehen; sonst Orbit
  const hit = modelGroup.visible ? pickObject(e) : null;
  if (hit && hit.idx !== undefined) {
    selectObject(hit.idx);
    const st = objectStates[hit.idx];
    const start = planePoint(e);
    const startDx = st.dx, startDy = st.dy;
    const move = ev => {
      const p = planePoint(ev);
      if (!p || !start) return;
      st.dx = startDx + (p.x - start.x);
      st.dy = startDy + (p.y - start.y);
      applyStateToGroup(st);
      $('tDx').value = Math.round(st.dx); $('tDy').value = Math.round(st.dy);
    };
    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
    return;
  }
  const move = ev => {
    camTheta -= ev.movementX * 0.008;
    camPhi = Math.min(Math.PI - .05, Math.max(.05, camPhi - ev.movementY * 0.008));
    updateCam();
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(900, Math.max(20, camDist * (e.deltaY > 0 ? 1.1 : .9)));
  updateCam();
}, { passive: false });
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
(function loop() { requestAnimationFrame(loop); resize(); renderer.render(scene, camera); })();
updateCam();

const FEATURE_COLORS = {
  'Outer wall': 0xff4d4d, 'Inner wall': 0xffc14d, 'Sparse infill': 0xb04dff,
  'Internal solid infill': 0xff984d, 'Top surface': 0x4dc3ff, 'Bottom surface': 0x4dff88,
  'Skirt': 0x9e9e9e, 'Brim': 0x9e9e9e, 'Support': 0x66bb6a, 'Support interface': 0x338855,
  'Bridge': 0x4dd0e1, 'Internal Bridge': 0x80deea, 'Gap infill': 0xff80ab,
};
const DEFAULT_COLOR = 0x8899aa;
const toolpathGroup = new THREE.Group();
scene.add(toolpathGroup);
const modelGroup = new THREE.Group();
scene.add(modelGroup);
let layerGroups = [];

// ---------- Tabs (Vorbereiten = Modell, Vorschau = Bahnen) ----------
function showTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  modelGroup.visible = name === 'prepare';
  toolpathGroup.visible = name === 'preview';
  $('overlay').hidden = name !== 'preview' || !layerGroups.length;
  $('legend').hidden = name !== 'preview' || !layerGroups.length;
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// Pro (Objekt,Instanz): Pivot-Gruppe (Drehpunkt = XY-Mitte auf z=0) + Zustand.
// Reihenfolge entspricht previewModel — der Slicer wendet dieselben
// Transformationen mit identischem Pivot an.
let objectStates = [];
function showModelMeshes(objects) {
  modelGroup.clear();
  objectStates = [];
  selectObject(-1);
  // flatShading: Normalen pro Fläche (im Shader) — Smooth Shading würde über
  // harte Kanten mitteln und CAD-Teile "geschmolzen" aussehen lassen
  let maxZ = 10;
  for (const o of objects) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(o.verts, 3));
    geo.setIndex(new THREE.BufferAttribute(o.tris, 1));
    geo.computeBoundingBox();
    maxZ = Math.max(maxZ, geo.boundingBox.max.z);
    const c = new THREE.Vector3();
    geo.boundingBox.getCenter(c);
    const pivot = new THREE.Vector3(c.x, c.y, 0);
    geo.translate(-pivot.x, -pivot.y, 0);   // Geometrie um Pivot zentrieren
    const mat = new THREE.MeshStandardMaterial({ color: 0x2ea2d8, metalness: .05, roughness: .65, flatShading: true });
    const mesh = new THREE.Mesh(geo, mat);
    const group = new THREE.Group();
    group.position.copy(pivot);
    group.add(mesh);
    mesh.userData.objIndex = objectStates.length;
    modelGroup.add(group);
    objectStates.push({ name: o.name, pivot, group, mesh, dx: 0, dy: 0, rz: 0, scale: 1 });
  }
  CENTER = new THREE.Vector3(bedSize[0] / 2, bedSize[1] / 2, maxZ / 2);
  updateCam();
  showTab('prepare');
}

// ---------- Objekt-Auswahl + Transformation ----------
let selectedIdx = -1;
function applyStateToGroup(st) {
  st.group.position.set(st.pivot.x + st.dx, st.pivot.y + st.dy, 0);
  st.group.rotation.z = st.rz * Math.PI / 180;
  st.group.scale.setScalar(st.scale);
}
function selectObject(i) {
  if (selectedIdx >= 0 && objectStates[selectedIdx])
    objectStates[selectedIdx].mesh.material.emissive?.setHex(0x000000);
  selectedIdx = i;
  const st = objectStates[i];
  $('objPanel').hidden = !st;
  if (!st) return;
  st.mesh.material.emissive?.setHex(0x14532d);
  $('objName').textContent = st.name;
  $('tDx').value = Math.round(st.dx);   $('tDy').value = Math.round(st.dy);
  $('tRz').value = Math.round(st.rz);   $('tScale').value = Math.round(st.scale * 100);
}
for (const [id, apply] of [
  ['tDx',    (st, v) => st.dx = v],
  ['tDy',    (st, v) => st.dy = v],
  ['tRz',    (st, v) => st.rz = v],
  ['tScale', (st, v) => st.scale = Math.max(0.01, v / 100)],
]) {
  $(id).oninput = () => {
    const st = objectStates[selectedIdx];
    if (!st) return;
    apply(st, +$(id).value || 0);
    applyStateToGroup(st);
  };
}
function currentTransforms() {
  return objectStates.map(st => ({ dx: st.dx, dy: st.dy, rz: st.rz, scale: st.scale }));
}
// Test-/Debug-Handle (Playwright & Konsole)
window._vs = {
  get states() { return objectStates; },
  selectObject, currentTransforms,
  pick(clientX, clientY) { return pickObject({ clientX, clientY }); },
  project(i) {  // Bildschirmkoordinaten des Objekt-Pivots
    const st = objectStates[i]; if (!st) return null;
    const v = st.group.position.clone().project(camera);
    const r = canvas.getBoundingClientRect();
    return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
  },
};

function parseGcode(gcode) {
  const layers = []; let cur = null;
  let x = 0, y = 0, z = 0, e = 0, feature = 'unbekannt', absE = true;
  for (const line of gcode.split('\n')) {
    if ((line.startsWith('; CHANGE_LAYER') || line.startsWith(';LAYER_CHANGE'))) { cur = { features: new Map() }; layers.push(cur); continue; }
    if (line.startsWith('; FEATURE: ')) { feature = line.slice(11).trim(); continue; }
    if (line.startsWith('M82')) { absE = true; continue; }
    if (line.startsWith('M83')) { absE = false; continue; }
    if (!/^G[0123] /.test(line)) continue;
    let nx = x, ny = y, nz = z, ne = absE ? e : 0;
    for (const tok of line.split(' ')) {
      const v = parseFloat(tok.slice(1));
      if (Number.isNaN(v)) continue;
      if (tok[0] === 'X') nx = v; else if (tok[0] === 'Y') ny = v;
      else if (tok[0] === 'Z') nz = v; else if (tok[0] === 'E') ne = v;
    }
    const de = absE ? ne - e : ne;
    if (cur && de > 0 && (nx !== x || ny !== y)) {
      if (!cur.features.has(feature)) cur.features.set(feature, []);
      cur.features.get(feature).push(x, y, z, nx, ny, nz);
    }
    x = nx; y = ny; z = nz; e = absE ? ne : e + Math.max(0, ne);
  }
  return layers.filter(l => l.features.size);
}

function showToolpaths(layers) {
  toolpathGroup.clear(); layerGroups = [];
  const seen = new Set();
  for (const layer of layers) {
    const g = new THREE.Group();
    for (const [feature, coords] of layer.features) {
      seen.add(feature);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(coords, 3));
      g.add(new THREE.LineSegments(geo,
        new THREE.LineBasicMaterial({ color: FEATURE_COLORS[feature] ?? DEFAULT_COLOR })));
    }
    toolpathGroup.add(g); layerGroups.push(g);
  }
  $('legend').innerHTML = [...seen].map(f =>
    `<span><span class="sw" style="background:#${(FEATURE_COLORS[f] ?? DEFAULT_COLOR).toString(16).padStart(6,'0')}"></span>${f}</span>`).join('');
  $('legend').hidden = false;
  const s = $('layerSlider');
  s.max = layers.length; s.value = layers.length;
  $('overlay').hidden = false;
  setVisibleLayers(layers.length);
}
function setVisibleLayers(n) {
  layerGroups.forEach((g, i) => g.visible = i < n);
  $('layerLabel').textContent = `${n}/${layerGroups.length}`;
}
$('layerSlider').oninput = () => setVisibleLayers(+$('layerSlider').value);

// ---------- Slicen (im Web-Worker — UI bleibt bedienbar) ----------
let worker = null;
let sliceStart = 0;
let lastGcode = '';
function updateSliceable() { $('btnSlice').disabled = !modelBytes; }

function crashRecovery(message) {
  // Nach einem WASM-Trap ist die Instanz tot → Worker neu starten,
  // und das Modell zur Fehleranalyse anbieten (bleibt im Tailnet)
  workerReady = false;
  try { worker.terminate(); } catch {}
  initWorker();
  status.innerHTML = `<span class="err">CRASH: ${message.slice(0, 160)}</span> — Kern neu gestartet. ` +
    `<button id="dbgUp" style="padding:.15rem .5rem;font-size:.8rem">Modell zur Fehleranalyse ablegen</button>`;
  $('dbgUp').onclick = async () => {
    await fetch(`/debug-upload?name=${encodeURIComponent(modelName)}`, { method: 'POST', body: modelBytes });
    status.innerHTML = '<span class="ok">Debug-Kopie gespeichert — danke!</span>';
  };
}

function handleMessage(e) {
  const msg = e.data;
  if (msg.type === 'ready') {
    status.innerHTML = `<span class="ok">Orca ${msg.version} bereit</span>`;
    workerReady = true;
    updateSliceable();
    requestPreview();
  } else if (msg.type === 'preview') {
    showModelMeshes(msg.objects);
    status.innerHTML = `<span class="ok">${msg.objects.length} Objekt(e) geladen — bereit zum Slicen</span>`;
  } else if (msg.type === 'progress') {
    if (msg.percent >= 0)
      status.innerHTML = `⚙️ <b>${msg.percent}%</b> — ${msg.text}`;
  } else if (msg.type === 'error') {
    if (/RuntimeError|out of bounds|unreachable|Aborted/.test(msg.message)) {
      crashRecovery(msg.message);
    } else {
      status.innerHTML = `<span class="err">FEHLER: ${msg.message.slice(0, 300)}</span>`;
    }
    updateSliceable();
  } else if (msg.type === 'done') {
    const dt = ((performance.now() - sliceStart) / 1000).toFixed(1);
    lastGcode = msg.gcode;
    window._lastGcode = lastGcode; // Debug-Zugriff (Konsole/Headless-Tests)
    const layers = parseGcode(lastGcode);
    showToolpaths(layers);
    $('btnDownload').disabled = false;
    const grab = re => (lastGcode.match(re) || [,''])[1];
    $('stats').innerHTML = [
      `<b>${layers.length}</b> Layer in <b>${dt}s</b>`,
      `Druckzeit: <b>${grab(/; total estimated time: (.*)/) || '–'}</b>`,
      `Filament: <b>${grab(/; filament used \[g\] = ([\d.]+)/) || grab(/; total filament used \[g\] = ([\d.]+)/) || '–'} g</b>`,
    ].join('<br>');
    status.innerHTML = `<span class="ok" id="done">Fertig: ${modelName} → ${layers.length} Layer in ${dt}s</span>`;
    showTab('preview');
    updateSliceable();
  }
}

function initWorker() {
  worker = new Worker('./slicer-worker.js', { type: 'module' });
  worker.onmessage = handleMessage;
  worker.onerror = (e) => { crashRecovery(e.message || 'Worker-Fehler'); };
}
initWorker();

await fillVendor();
setBed(256, 256);
await applyMachineBed();
await refreshSettings();

$('btnSlice').onclick = async () => {
  try {
    $('btnSlice').disabled = true;
    status.textContent = 'Lade Profile …';
    const c = chainsCache ?? await loadChains();
    const profiles = [...c.machine, ...c.process, ...c.filament];
    const overrides = [
      'enable_arc_fitting = 0',
      `enable_support = ${$('support').checked ? 1 : 0}`,
      `brim_type = ${$('brim').checked ? 'outer_only' : 'no_brim'}`,
      `printer_settings_id = ${$('machine').value}`,
      `print_settings_id = ${$('process').value}`,
      `filament_settings_id = "${$('filament').value}"`,
      // Settings-Panel: nur Abweichungen vom Profil
      ...settingOverrides().map(([k, v2]) => `${k} = ${v2}`),
      $('overrides').value,
    ].join('\n');
    status.textContent = 'Slice läuft …';
    sliceStart = performance.now();
    worker.postMessage({ bytes: modelBytes, filename: modelName, profiles, overrides,
                         transforms: currentTransforms() });
  } catch (e) {
    status.innerHTML = `<span class="err">FEHLER: ${e.message}</span>`;
    updateSliceable();
  }
};

$('btnDownload').onclick = () => {
  const blob = new Blob([lastGcode], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = modelName.replace(/\.[^.]+$/, '') + '.gcode';
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
