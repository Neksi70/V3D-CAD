;; ---------------------------------------------------------------
;; V3D Anrufannahme — Ablauf eines eingehenden Anrufs
;; Platzhalter setzt install.sh aus ~/v3dcall/config.json ein.
;; ---------------------------------------------------------------

[v3dcall]

;; Alles landet im selben Ablauf.
;;
;; Die Fritzbox waehlt als Ziel NICHT die Rufnummer, sondern den
;; Benutzernamen des IP-Telefons:
;;     INVITE sip:@@USER@@@192.168.2.3:5060
;; Darum steht der Benutzername hier ausdruecklich drin — das ist der
;; Normalfall und trifft immer. Die Muster darunter fangen alles Uebrige.
;;
;; Kein _. als Auffangmuster: Asterisk mahnt es ausdruecklich an, weil es
;; die Sonderziele verschlucken kann. Der Benutzername deckt den Normalfall
;; ab, _X. faengt gewaehlte Rufnummern.
exten => @@USER@@,1,Goto(s,1)
exten => _X.,1,Goto(s,1)

exten => s,1,NoOp(V3D Anrufannahme: ${CALLERID(num)} <${CALLERID(name)}>)
    same => n,Set(V3DID=${UNIQUEID})
    same => n,Set(V3DDATEI=/var/spool/v3dcall/${V3DID}.wav)
    same => n,Answer()
    same => n,Wait(1)

    ;; 1. Ansage (mit ElevenLabs erzeugt, liegt als 8-kHz-wav bereit).
    ;;    Voller Pfad, damit die Sprachauswahl von Asterisk nicht
    ;;    dazwischenfunkt.
    same => n,Playback(/var/lib/asterisk/sounds/v3d/ansage)

    ;; 2. Signalton, dann aufnehmen.
    ;;    k = Datei auch beim Auflegen behalten, q = kein Piepen von Asterisk
    same => n,Playback(/var/lib/asterisk/sounds/v3d/beep)
    same => n,Record(${V3DDATEI},@@SILENCE@@,@@MAXSEC@@,kq)

    ;; 3. Verabschiedung, falls der Anrufer noch dran ist
    same => n,Playback(/var/lib/asterisk/sounds/v3d/danke)
    same => n,Hangup()

;; Laeuft immer beim Auflegen — egal an welcher Stelle des Ablaufs.
exten => h,1,NoOp(V3D Anrufannahme beendet: ${V3DID})
    same => n,System(/usr/local/bin/v3dcall-notify "${V3DID}" "${CALLERID(num)}" "${CALLERID(name)}" "${V3DDATEI}")

exten => i,1,Hangup()
exten => t,1,Hangup()
