<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marchi Group – Zentraleinkauf</title>
<link rel="icon" href="logo-icon-blau.svg">
<style>
:root{--blau:#00a2ff;--blau-d:#0084d1;--text:#151515;--grau:#6b7280;--linie:#e3e6ea;--flaeche:#f5f7f9;--weiss:#fff;--rot:#d0342c;--gruen:#1e9e63}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--flaeche)}
header{background:#111;color:#fff;display:flex;align-items:center;gap:22px;padding:0 22px;height:64px;position:sticky;top:0;z-index:5}
header img{height:30px}
header .titel{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blau);border-left:1px solid #333;padding-left:18px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;color:#bbb;font:inherit;padding:8px 14px;border-radius:6px;cursor:pointer}
nav button:hover{color:#fff}
nav button.an{background:var(--blau);color:#fff}
main{max-width:1280px;margin:0 auto;padding:22px}
h2{margin:0 0 14px;font-size:22px}
.leiste{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.leiste .rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd4da;border-radius:6px;background:#fff;color:inherit;min-width:0}
textarea{min-height:64px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blau);border-color:transparent}
.btn{font:inherit;border:1px solid #cfd4da;background:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blau)}
.btn.p{background:var(--blau);border-color:var(--blau);color:#fff}
.btn.p:hover{background:var(--blau-d)}
.btn.rot{color:var(--rot)}
.btn.klein{padding:4px 9px;font-size:13px}
.karte{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linie);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--linie);vertical-align:top}
th{background:#fafbfc;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--grau);font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f0f8ff}
td.z,th.z{text-align:right;font-variant-numeric:tabular-nums}
.leer{padding:30px;text-align:center;color:var(--grau)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;background:#eef1f4;white-space:nowrap}
.punkt{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.st{font-weight:600}
.st-Bedarf{background:#fff4d6}.st-Angefragt{background:#e8f0ff}.st-Bestellt{background:#dff3ff;color:#005d94}
.st-Teilgeliefert{background:#efe6ff}.st-Geliefert{background:#dcf5e8;color:#11663f}.st-Storniert{background:#f3f3f3;color:#888;text-decoration:line-through}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kpi{font-size:28px;font-weight:700}
.kpi-l{color:var(--grau);font-size:13px}
.zweispaltig{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.baum{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:8px}
.baum .r{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer}
.baum .r:hover{background:#f0f8ff}
.baum .r.an{background:var(--blau);color:#fff}
.baum .r.u{padding-left:28px;font-size:14px}
.baum .r .n{margin-left:auto;font-size:12px;opacity:.65}
.balken{height:10px;border-radius:5px;background:var(--blau)}
dialog{border:0;border-radius:12px;padding:0;width:min(760px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.breit{width:min(1100px,97vw)}
dialog::backdrop{background:rgba(10,20,30,.45)}
.dkopf{padding:16px 20px;border-bottom:1px solid var(--linie);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.dkopf h3{margin:0;font-size:18px}
.dkopf .x{margin-left:auto}
.dinhalt{padding:18px 20px}
.dfuss{padding:14px 20px;border-top:1px solid var(--linie);display:flex;gap:8px;position:sticky;bottom:0;background:#fff}
.dfuss .rechts{margin-left:auto;display:flex;gap:8px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--grau)}
.form label.ganz{grid-column:1/-1}
.form input,.form select{color:var(--text)}
.pos td{padding:5px 6px;cursor:default}
.pos input,.pos select{width:100%;padding:6px 7px}
.pos tbody tr:hover{background:none}
.summe{font-size:18px;font-weight:700;text-align:right;margin-top:10px}
.hinweis{color:var(--grau);font-size:13px}
.ok{color:var(--gruen)}
#login{max-width:360px;margin:12vh auto;text-align:center}
#login img{height:44px;margin-bottom:22px}
#login input{width:100%;font-size:20px;text-align:center;letter-spacing:.3em;margin:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.an{opacity:1}
.mapping td{cursor:default}
.mapping select{width:100%}
#druck{display:none}
@media (max-width:820px){.zweispaltig{grid-template-columns:1fr}.form{grid-template-columns:1fr}header{height:auto;flex-wrap:wrap;padding:10px 16px}header .titel{display:none}main{padding:14px}table{font-size:14px}.ausbl{display:none}}
@media print{
  body{background:#fff}
  body>*:not(#druck){display:none!important}
  #druck{display:block;padding:0 6mm;font-size:12px}
  #druck table{border:0}#druck th,#druck td{padding:6px 4px}
  @page{size:A4;margin:16mm 14mm}
}
</style>
</head>
<body>
<div id="login" hidden>
  <img src="logo-dunkel.svg" alt="Marchi Group">
  <div class="karte">
    <b>Zentraleinkauf</b>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
    <button class="btn p" style="width:100%" onclick="anmelden()">Anmelden</button>
    <div id="loginFehler" class="hinweis" style="color:var(--rot);margin-top:8px"></div>
  </div>
</div>

<div id="app" hidden>
<header>
  <img src="logo-weiss.svg" alt="Marchi Group">
  <span class="titel">Zentraleinkauf</span>
  <nav id="nav">
    <button data-s="uebersicht">Übersicht</button>
    <button data-s="bestellungen">Bestellungen</button>
    <button data-s="rubriken">Rubriken &amp; Artikel</button>
    <button data-s="lieferanten">Lieferanten</button>
    <button data-s="kunden">Kunden</button>
  </nav>
</header>
<main id="inhalt"></main>
</div>

<dialog id="dlg"></dialog>
<div id="druck"></div>
<div class="toast" id="toast"></div>

<script>
let D = {rubriken:[],artikel:[],lieferanten:[],kunden:[],bestellungen:[],rubrik_summen:[],einheiten:[],status:[]};
let seite = 'uebersicht';
const F = {rubrik:null, bestSuche:'', bestStatus:'', bestRubrik:'', artSuche:'', liefSuche:'', kundSuche:''};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const zahlDe = n => (Number(n)||0).toLocaleString('de-DE',{maximumFractionDigits:3});
const datumDe = s => s ? s.slice(0,10).split('-').reverse().join('.') : '';
const byId = (liste, id) => D[liste].find(x => x.id == id);
const passt = (o, q, felder) => !q || felder.some(f => String(o[f]??'').toLowerCase().includes(q.toLowerCase()));

function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('an'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('an'),2200); }

async function api(pfad, opt={}){
  const o = {method: opt.method||'GET', headers:{}};
  if (opt.body !== undefined){
    if (opt.roh){ o.body = opt.body; } else { o.body = JSON.stringify(opt.body); o.headers['Content-Type']='application/json'; }
  }
  const r = await fetch('api/'+pfad, o);
  if (r.status === 401){ zeigeLogin(); throw new Error('Anmeldung nötig'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok){ toast(j.fehler || 'Fehler'); throw new Error(j.fehler||r.status); }
  return j;
}

function zeigeLogin(){ $('#app').hidden=true; $('#login').hidden=false; setTimeout(()=>$('#pin').focus(),50); }
async function anmelden(){
  const r = await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});
  if (!r.ok){ $('#loginFehler').textContent='PIN falsch'; return; }
  $('#login').hidden=true; start();
}
$('#pin').addEventListener('keydown', e => { if (e.key==='Enter') anmelden(); });

async function laden(){ D = await api('alles'); zeichnen(); }
async function start(){
  try { D = await api('alles'); } catch(e){ return; }
  $('#app').hidden=false;
  try { seite = localStorage.getItem('me_seite') || seite; } catch(e){}
  zeichnen();
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  seite = b.dataset.s; try{localStorage.setItem('me_seite',seite);}catch(e){}
  zeichnen();
});

function zeichnen(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('an', b.dataset.s===seite));
  ({uebersicht:sUebersicht, bestellungen:sBestellungen, rubriken:sRubriken, lieferanten:sLieferanten, kunden:sKunden})[seite]();
}

// ---------- Rubriken-Hilfen
const hauptRubriken = () => D.rubriken.filter(r => !r.parent_id);
const unterRubriken = id => D.rubriken.filter(r => r.parent_id == id);
function rubrikName(id){ const r = byId('rubriken', id); if (!r) return ''; const p = r.parent_id && byId('rubriken', r.parent_id); return p ? p.name+' › '+r.name : r.name; }
function rubrikChip(id){ const r = byId('rubriken', id); if (!r) return ''; return `<span class="chip"><span class="punkt" style="background:${esc(r.farbe)}"></span>${esc(rubrikName(id))}</span>`; }
function rubrikOptionen(sel, leer='— Rubrik —'){
  let h = `<option value="">${leer}</option>`;
  for (const r of hauptRubriken()){
    h += `<option value="${r.id}" ${r.id==sel?'selected':''}>${esc(r.name)}</option>`;
    for (const u of unterRubriken(r.id)) h += `<option value="${u.id}" ${u.id==sel?'selected':''}>&nbsp;&nbsp;› ${esc(u.name)}</option>`;
  }
  return h;
}
const rubrikUndUnter = id => [Number(id), ...unterRubriken(id).map(u=>u.id)];
const optionen = (liste, sel, leer, feld='name') => `<option value="">${leer}</option>` + D[liste].map(x => `<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x[feld])}${liste==='kunden'&&x.ort?' ('+esc(x.ort)+')':''}</option>`).join('');
const statusChip = s => `<span class="chip st st-${esc(s)}">${esc(s)}</span>`;

// ---------- Übersicht
function sUebersicht(){
  const offen = D.bestellungen.filter(b => !['Geliefert','Storniert'].includes(b.status));
  const jahr = new Date().getFullYear()+'';
  const imJahr = D.bestellungen.filter(b => (b.datum||'').startsWith(jahr) && b.status!=='Storniert');
  const heute = new Date().toISOString().slice(0,10);
  const ueberfaellig = offen.filter(b => b.liefertermin && b.liefertermin < heute && b.status!=='Bedarf');
  const summen = {}; D.rubrik_summen.forEach(s => summen[s.rubrik_id]=s.summe);
  const max = Math.max(1, ...Object.values(summen));
  $('#inhalt').innerHTML = `
  <h2>Übersicht</h2>
  <div class="raster" style="margin-bottom:18px">
    <div class="karte"><div class="kpi">${offen.length}</div><div class="kpi-l">offene Vorgänge</div></div>
    <div class="karte"><div class="kpi">${eur(imJahr.reduce((a,b)=>a+b.summe,0))}</div><div class="kpi-l">Einkaufsvolumen ${jahr}</div></div>
    <div class="karte"><div class="kpi" style="color:${ueberfaellig.length?'var(--rot)':'inherit'}">${ueberfaellig.length}</div><div class="kpi-l">Liefertermin überschritten</div></div>
    <div class="karte"><div class="kpi">${D.kunden.length}</div><div class="kpi-l">Kunden · ${D.lieferanten.length} Lieferanten · ${D.artikel.length} Artikel</div></div>
  </div>
  <div class="zweispaltig" style="grid-template-columns:1fr 1fr">
    <div class="karte"><b>Volumen ${jahr} nach Rubrik</b>
      <div style="margin-top:12px;display:grid;gap:9px">
      ${hauptRubriken().map(r => `<div style="display:grid;grid-template-columns:170px 1fr 90px;gap:10px;align-items:center;font-size:14px">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
        <div style="background:#eef1f4;border-radius:5px"><div class="balken" style="width:${(summen[r.id]||0)/max*100}%;background:${esc(r.farbe)}"></div></div>
        <span class="z" style="text-align:right">${eur(summen[r.id]||0)}</span></div>`).join('')}
      </div></div>
    <div class="karte"><b>Offene Vorgänge</b>
      ${offen.length ? `<table style="margin-top:10px;border:0"><tbody>${offen.slice(0,12).map(b => `<tr onclick="bestellungOeffnen(${b.id})">
        <td>${esc(b.nr)}</td><td>${statusChip(b.status)}</td><td>${esc(byId('lieferanten',b.lieferant_id)?.name||'—')}</td>
        <td class="z">${b.liefertermin?datumDe(b.liefertermin):''}</td></tr>`).join('')}</tbody></table>` : '<div class="leer">Alles erledigt.</div>'}
      <div style="margin-top:12px"><button class="btn p" onclick="bestellungOeffnen()">+ Neuer Vorgang</button></div>
    </div>
  </div>`;
}

// ---------- Bestellungen
function sBestellungen(){
  let liste = D.bestellungen.filter(b => {
    if (F.bestStatus && b.status!==F.bestStatus) return false;
    if (F.bestRubrik){ const ids = rubrikUndUnter(F.bestRubrik).map(String); if (!(b.rubrik_ids||'').split(',').some(x=>ids.includes(x))) return false; }
    const zus = {...b, l: byId('lieferanten',b.lieferant_id)?.name, k: byId('kunden',b.kunde_id)?.name};
    return passt(zus, F.bestSuche, ['nr','projekt','besteller','l','k','notiz']);
  });
  $('#inhalt').innerHTML = `
  <h2>Bestellungen &amp; Bedarfe</h2>
  <div class="leiste">
    <input placeholder="Suchen (Nr., Lieferant, Kunde, Projekt …)" value="${esc(F.bestSuche)}" oninput="F.bestSuche=this.value;sBestellungenTabelle()" style="flex:1;max-width:340px" id="bsuche">
    <select onchange="F.bestStatus=this.value;sBestellungen()"><option value="">Alle Status</option>${D.status.map(s=>`<option ${s===F.bestStatus?'selected':''}>${s}</option>`).join('')}</select>
    <select onchange="F.bestRubrik=this.value;sBestellungen()">${rubrikOptionen(F.bestRubrik,'Alle Rubriken').replace(/<option value="(\d+)"([^>]*)>&nbsp;.*?<\/option>/g,'')}</select>
    <div class="rechts"><a class="btn" href="api/export/bestellungen">CSV-Export</a><button class="btn p" onclick="bestellungOeffnen()">+ Neuer Vorgang</button></div>
  </div>
  <div id="btab"></div>`;
  sBestellungenTabelle(liste);
}
function sBestellungenTabelle(liste){
  if (!liste){ sBestellungen(); const e=$('#bsuche'); e.focus(); e.setSelectionRange(e.value.length,e.value.length); return; }
  $('#btab').innerHTML = liste.length ? `<table><thead><tr><th>Nr.</th><th>Datum</th><th>Status</th><th>Lieferant</th><th class="ausbl">Kunde / Projekt</th><th class="ausbl">Rubriken</th><th class="z">Summe</th></tr></thead><tbody>
    ${liste.map(b => `<tr onclick="bestellungOeffnen(${b.id})"><td><b>${esc(b.nr)}</b></td><td>${datumDe(b.datum)}</td><td>${statusChip(b.status)}</td>
      <td>${esc(byId('lieferanten',b.lieferant_id)?.name||'—')}</td>
      <td class="ausbl">${esc(byId('kunden',b.kunde_id)?.name||'')}${b.projekt?'<div class="hinweis">'+esc(b.projekt)+'</div>':''}</td>
      <td class="ausbl">${(b.rubrik_ids||'').split(',').filter(Boolean).map(rubrikChip).join(' ')}</td>
      <td class="z">${eur(b.summe)}</td></tr>`).join('')}</tbody></table>` : '<div class="karte leer">Keine Vorgänge gefunden.</div>';
}

let B = null;   // Bestellung im Editor
async function bestellungOeffnen(id){
  B = id ? await api('bestellungen/'+id) : {status:'Bedarf', datum:new Date().toISOString().slice(0,10), positionen:[], besteller:(()=>{try{return localStorage.getItem('me_besteller')||''}catch(e){return ''}})()};
  if (!B.positionen.length) B.positionen.push(leerePos());
  const dlg = $('#dlg'); dlg.className='breit';
  dlg.innerHTML = `
  <div class="dkopf"><h3>${id ? 'Vorgang '+esc(B.nr) : 'Neuer Vorgang'}</h3><button class="btn x" onclick="dlg.close()">✕</button></div>
  <div class="dinhalt">
    <div class="form" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      <label>Status<select id="b_status">${D.status.map(s=>`<option ${s===B.status?'selected':''}>${s}</option>`).join('')}</select></label>
      <label>Datum<input type="date" id="b_datum" value="${esc(B.datum)}"></label>
      <label>Liefertermin<input type="date" id="b_liefertermin" value="${esc(B.liefertermin||'')}"></label>
      <label>Besteller<input id="b_besteller" value="${esc(B.besteller||'')}"></label>
      <label style="grid-column:span 2">Lieferant<select id="b_lieferant_id">${optionen('lieferanten',B.lieferant_id,'— Lieferant wählen —')}</select></label>
      <label style="grid-column:span 2">Kunde (Kommission)<input id="b_kunde" list="kundenliste" placeholder="Name oder Kundennr. tippen …" value="${esc(kundeText(B.kunde_id))}"></label>
      <label style="grid-column:span 2">Projekt / Fahrzeug<input id="b_projekt" value="${esc(B.projekt||'')}"></label>
      <label style="grid-column:span 2">Lieferadresse (falls abweichend)<input id="b_lieferadresse" value="${esc(B.lieferadresse||'')}"></label>
    </div>
    <datalist id="kundenliste">${D.kunden.map(k=>`<option value="${esc(kundeText(k.id))}">`).join('')}</datalist>
    <datalist id="artikelliste">${D.artikel.filter(a=>a.aktiv).map(a=>`<option value="${esc(artikelText(a))}">`).join('')}</datalist>
    <h4 style="margin:18px 0 6px">Positionen</h4>
    <table class="pos"><thead><tr><th style="width:24%">Rubrik</th><th>Artikel / Bezeichnung</th><th style="width:90px" class="z">Menge</th><th style="width:90px">Einheit</th><th style="width:110px" class="z">Einzelpreis €</th><th style="width:100px" class="z">Summe</th><th style="width:36px"></th></tr></thead><tbody id="posBody"></tbody></table>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="B.positionen.push(leerePos());posZeichnen()">+ Position</button></div>
    <div class="summe" id="bSumme"></div>
    <label class="hinweis" style="display:block;margin-top:10px">Notiz<textarea id="b_notiz">${esc(B.notiz||'')}</textarea></label>
  </div>
  <div class="dfuss">
    ${id?`<button class="btn rot" onclick="bestellungLoeschen()">Löschen</button><button class="btn" onclick="bestellungDrucken()">🖨 Bestellschein</button>`:''}
    <div class="rechts"><button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn p" onclick="bestellungSpeichern()">Speichern</button></div>
  </div>`;
  posZeichnen();
  dlg.showModal();
}
const leerePos = () => ({rubrik_id:'', artikel_id:'', bezeichnung:'', menge:1, einheit:'Stk', preis:0});
const kundeText = id => { const k = byId('kunden', id); return k ? (k.kundennr ? k.kundennr+' · ' : '')+k.name+(k.ort?' ('+k.ort+')':'') : ''; };
const artikelText = a => (a.nr ? a.nr+' · ' : '') + a.name + (a.abmessung ? ' – '+a.abmessung : '');
function posZeichnen(){
  $('#posBody').innerHTML = B.positionen.map((p,i) => `<tr>
    <td><select onchange="posSetz(${i},'rubrik_id',this.value)">${rubrikOptionen(p.rubrik_id)}</select></td>
    <td><input list="artikelliste" value="${esc(p.bezeichnung)}" onchange="posArtikel(${i},this.value)" placeholder="Artikel wählen oder frei eintragen"></td>
    <td><input class="z" value="${zahlDe(p.menge)}" onchange="posSetz(${i},'menge',zahlLesen(this.value))" style="text-align:right"></td>
    <td><select onchange="posSetz(${i},'einheit',this.value)">${D.einheiten.map(e=>`<option ${e===p.einheit?'selected':''}>${e}</option>`).join('')}</select></td>
    <td><input value="${(Number(p.preis)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:4})}" onchange="posSetz(${i},'preis',zahlLesen(this.value))" style="text-align:right"></td>
    <td class="z" style="padding-top:12px">${eur(p.menge*p.preis)}</td>
    <td><button class="btn klein rot" title="Position entfernen" onclick="B.positionen.splice(${i},1);posZeichnen()">✕</button></td></tr>`).join('');
  $('#bSumme').textContent = 'Summe netto: ' + eur(B.positionen.reduce((a,p)=>a+p.menge*p.preis,0));
}
const zahlLesen = s => Number(String(s).replace(/\./g,'').replace(',','.')) || 0;
function posSetz(i,f,v){ B.positionen[i][f]=v; posZeichnen(); }
function posArtikel(i, text){
  const p = B.positionen[i];
  const a = D.artikel.find(a => artikelText(a) === text);
  p.bezeichnung = text;
  if (a){
    p.artikel_id = a.id; p.rubrik_id = a.rubrik_id || p.rubrik_id; p.einheit = a.einheit || p.einheit; p.preis = a.preis || p.preis;
    if (!$('#b_lieferant_id').value && a.lieferant_id) $('#b_lieferant_id').value = a.lieferant_id;
  } else p.artikel_id = '';
  posZeichnen();
}
function kundeAusText(t){ if (!t.trim()) return null; const k = D.kunden.find(k => kundeText(k.id) === t.trim()); return k ? k.id : undefined; }
async function bestellungSpeichern(){
  const kid = kundeAusText($('#b_kunde').value);
  if (kid === undefined){ toast('Kunde nicht gefunden – bitte aus der Liste wählen oder unter „Kunden" anlegen'); return; }
  const d = {positionen: B.positionen, kunde_id: kid};
  for (const f of ['status','datum','liefertermin','besteller','lieferant_id','projekt','lieferadresse','notiz']) d[f] = $('#b_'+f).value || (f==='lieferant_id'?null:'');
  try{localStorage.setItem('me_besteller', d.besteller);}catch(e){}
  const r = await api('bestellungen'+(B.id?'/'+B.id:''), {method:B.id?'PUT':'POST', body:d});
  $('#dlg').close(); await laden(); toast('Gespeichert');
  if (!B.id) B.id = r.id;
}
async function bestellungLoeschen(){ if (!confirm('Vorgang '+B.nr+' wirklich löschen?')) return; await api('bestellungen/'+B.id,{method:'DELETE'}); $('#dlg').close(); laden(); }

  ${k||$('#b_projekt').value?`<p>Kommission: ${esc(k?k.name:'')}${k&&$('#b_projekt').value?' – ':''}${esc($('#b_projekt').value)}</p>`:''}
  ${$('#b_lieferadresse').value?`<p>Lieferadresse: ${esc($('#b_lieferadresse').value)}</p>`:''}
  <table><thead><tr><th>Pos.</th><th>Bezeichnung</th><th class="z">Menge</th><th>Einheit</th><th class="z">Einzelpreis</th><th class="z">Gesamt</th></tr></thead><tbody>
  ${B.positionen.filter(p=>p.bezeichnung).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.bezeichnung)}<div style="font-size:10px;color:#777">${esc(rubrikName(p.rubrik_id))}</div></td><td class="z">${zahlDe(p.menge)}</td><td>${esc(p.einheit)}</td><td class="z">${eur(p.preis)}</td><td class="z">${eur(p.menge*p.preis)}</td></tr>`).join('')}
  </tbody></table>

  window.print();

// ---------- Rubriken & Artikel
function sRubriken(){
  const sel = F.rubrik;
  const ids = sel ? rubrikUndUnter(sel) : null;
  const artikel = D.artikel.filter(a => (!ids || ids.includes(a.rubrik_id)) && passt(a, F.artSuche, ['nr','name','werkstoff','abmessung','notiz']));
  const zaehl = id => D.artikel.filter(a => rubrikUndUnter(id).includes(a.rubrik_id)).length;
  $('#inhalt').innerHTML = `
  <h2>Rubriken &amp; Artikel</h2>
  <div class="zweispaltig">
    <div>
      <div class="baum">
        <div class="r ${!sel?'an':''}" onclick="F.rubrik=null;sRubriken()"><b>Alle Rubriken</b><span class="n">${D.artikel.length}</span></div>
        ${hauptRubriken().map(r => `<div class="r ${sel==r.id?'an':''}" onclick="F.rubrik=${r.id};sRubriken()" ondblclick="rubrikOeffnen(${r.id})"><span class="punkt" style="background:${esc(r.farbe)}"></span>${esc(r.name)}<span class="n">${zaehl(r.id)}</span></div>
          ${unterRubriken(r.id).map(u => `<div class="r u ${sel==u.id?'an':''}" onclick="F.rubrik=${u.id};sRubriken()" ondblclick="rubrikOeffnen(${u.id})">${esc(u.name)}<span class="n">${zaehl(u.id)}</span></div>`).join('')}`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn" onclick="rubrikOeffnen()">+ Rubrik</button>
        ${sel?`<button class="btn" onclick="rubrikOeffnen(${sel})">Rubrik bearbeiten</button>`:''}
      </div>
      <p class="hinweis">Doppelklick auf eine Rubrik zum Bearbeiten. Unterrubriken entstehen über „übergeordnete Rubrik".</p>
    </div>
    <div>
      <div class="leiste"><input placeholder="Artikel suchen …" value="${esc(F.artSuche)}" oninput="F.artSuche=this.value;sRubriken();const e=document.querySelector('#asuche');e.focus();e.setSelectionRange(e.value.length,e.value.length)" id="asuche" style="flex:1;max-width:340px">
        <div class="rechts"><button class="btn p" onclick="artikelOeffnen()">+ Artikel</button></div></div>
      ${artikel.length ? `<table><thead><tr><th>Nr.</th><th>Artikel</th><th class="ausbl">Rubrik</th><th class="ausbl">Werkstoff / Maße</th><th class="ausbl">Lieferant</th><th class="z">Preis</th></tr></thead><tbody>
      ${artikel.map(a => `<tr onclick="artikelOeffnen(${a.id})" style="${a.aktiv?'':'opacity:.5'}"><td>${esc(a.nr)}</td><td><b>${esc(a.name)}</b></td><td class="ausbl">${rubrikChip(a.rubrik_id)}</td>
        <td class="ausbl">${esc(a.werkstoff)}${a.werkstoff&&a.abmessung?' · ':''}${esc(a.abmessung)}</td><td class="ausbl">${esc(byId('lieferanten',a.lieferant_id)?.name||'')}</td>
        <td class="z">${eur(a.preis)} / ${esc(a.einheit)}</td></tr>`).join('')}</tbody></table>` : `<div class="karte leer">Noch keine Artikel${sel?' in dieser Rubrik':''}. <br><br><button class="btn p" onclick="artikelOeffnen()">+ Artikel anlegen</button></div>`}
    </div>
  </div>`;
}

// ---------- generischer Formular-Dialog
function formDialog({titel, tab, obj, felder, nachSpeichern}){
  const dlg = $('#dlg'); dlg.className='';
  dlg.innerHTML = `<div class="dkopf"><h3>${esc(titel)}</h3><button class="btn x" onclick="dlg.close()">✕</button></div>
  <div class="dinhalt"><div class="form">${felder.map(f => {
    const v = obj[f.k] ?? f.std ?? '';
    const kl = f.ganz ? 'ganz' : '';
    if (f.typ==='select') return `<label class="${kl}">${f.l}<select data-k="${f.k}">${f.opt(v)}</select></label>`;
    if (f.typ==='textarea') return `<label class="ganz">${f.l}<textarea data-k="${f.k}">${esc(v)}</textarea></label>`;
    if (f.typ==='check') return `<label class="${kl}" style="flex-direction:row;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" data-k="${f.k}" ${v?'checked':''}>${f.l}</label>`;
    return `<label class="${kl}">${f.l}<input data-k="${f.k}" type="${f.typ||'text'}" value="${esc(f.zahl?String(v).replace('.',','):v)}" ${f.zahl?'inputmode="decimal"':''}></label>`;
  }).join('')}</div></div>
  <div class="dfuss">${obj.id?`<button class="btn rot" id="fdLoeschen">Löschen</button>`:''}
    <div class="rechts"><button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn p" id="fdSpeichern">Speichern</button></div></div>`;
  $('#fdSpeichern').onclick = async () => {
    const d = {};
    dlg.querySelectorAll('[data-k]').forEach(e => {
      const f = felder.find(x=>x.k===e.dataset.k);
      d[e.dataset.k] = e.type==='checkbox' ? (e.checked?1:0) : f.zahl ? zahlLesen(e.value) : (f.typ==='select' && e.value==='' ? null : e.value);
    });
    if (!String(d.name||'').trim()){ toast('Bitte einen Namen eintragen'); return; }
    const r = await api(tab+(obj.id?'/'+obj.id:''), {method:obj.id?'PUT':'POST', body:d});
    dlg.close(); await laden(); toast('Gespeichert'); nachSpeichern && nachSpeichern(obj.id||r.id);
  };
  if (obj.id) $('#fdLoeschen').onclick = async () => {
    if (!confirm(`„${obj.name}" wirklich löschen?`)) return;
    await api(tab+'/'+obj.id,{method:'DELETE'}); dlg.close(); laden();
  };
  dlg.showModal();
  setTimeout(()=>dlg.querySelector('[data-k]')?.focus(),30);
}

function rubrikOeffnen(id){
  const r = id ? byId('rubriken',id) : {farbe:'#00a2ff', sort: D.rubriken.length};
  formDialog({titel: id?'Rubrik bearbeiten':'Neue Rubrik', tab:'rubriken', obj:r, felder:[
    {k:'name', l:'Name (z. B. Kupfer, Glas, Hydraulik)', ganz:true},
    {k:'parent_id', l:'Übergeordnete Rubrik (leer = Hauptrubrik)', typ:'select', opt:v => `<option value="">— Hauptrubrik —</option>`+hauptRubriken().filter(h=>h.id!=id).map(h=>`<option value="${h.id}" ${h.id==v?'selected':''}>${esc(h.name)}</option>`).join('')},
    {k:'farbe', l:'Farbe', typ:'color'},
    {k:'sort', l:'Reihenfolge', zahl:true},
    {k:'notiz', l:'Notiz (z. B. Rahmenvertrag, Normen)', typ:'textarea'},
  ], nachSpeichern: nid => { F.rubrik = nid; sRubriken(); }});
}

function artikelOeffnen(id){
  const a = id ? byId('artikel',id) : {rubrik_id: F.rubrik, einheit:'Stk', aktiv:1};
  formDialog({titel: id?'Artikel bearbeiten':'Neuer Artikel', tab:'artikel', obj:a, felder:[
    {k:'name', l:'Bezeichnung', ganz:true},
    {k:'nr', l:'Artikelnummer'},
    {k:'rubrik_id', l:'Rubrik', typ:'select', opt:v=>rubrikOptionen(v)},
    {k:'werkstoff', l:'Werkstoff / Güte (z. B. S235JR, AlMg3)'},
    {k:'abmessung', l:'Abmessung (z. B. 3000×1500×2 mm)'},
    {k:'einheit', l:'Einheit', typ:'select', opt:v=>D.einheiten.map(e=>`<option ${e===v?'selected':''}>${e}</option>`).join('')},
    {k:'preis', l:'Letzter Preis € (netto, je Einheit)', zahl:true},
    {k:'lieferant_id', l:'Standard-Lieferant', typ:'select', opt:v=>optionen('lieferanten',v,'— keiner —')},
    {k:'mindestmenge', l:'Mindestmenge / Mindestbestand', zahl:true},
    {k:'notiz', l:'Notiz', typ:'textarea'},
    {k:'aktiv', l:'aktiv (in Bestellungen auswählbar)', typ:'check'},
  ]});
}

// ---------- Lieferanten
function sLieferanten(){
  const liste = D.lieferanten.filter(l => passt(l, F.liefSuche, ['name','ansprechpartner','ort','email','notiz']));
  $('#inhalt').innerHTML = `<h2>Lieferanten</h2>
  <div class="leiste"><input id="lsuche" placeholder="Lieferant suchen …" value="${esc(F.liefSuche)}" oninput="F.liefSuche=this.value;sLieferanten();const e=document.querySelector('#lsuche');e.focus();e.setSelectionRange(e.value.length,e.value.length)" style="flex:1;max-width:340px">
    <div class="rechts"><button class="btn p" onclick="lieferantOeffnen()">+ Lieferant</button></div></div>
  ${liste.length ? `<table><thead><tr><th>Lieferant</th><th class="ausbl">Rubriken</th><th>Ansprechpartner</th><th class="ausbl">Kontakt</th><th class="ausbl">Ort</th></tr></thead><tbody>
  ${liste.map(l => `<tr onclick="lieferantOeffnen(${l.id})"><td><b>${esc(l.name)}</b></td><td class="ausbl">${(l.rubriken||'').split(',').filter(Boolean).map(rubrikChip).join(' ')}</td>
    <td>${esc(l.ansprechpartner)}</td><td class="ausbl">${esc(l.telefon)}${l.telefon&&l.email?'<br>':''}${l.email?`<a href="mailto:${esc(l.email)}" onclick="event.stopPropagation()">${esc(l.email)}</a>`:''}</td><td class="ausbl">${esc(l.ort)}</td></tr>`).join('')}</tbody></table>`
  : '<div class="karte leer">Noch keine Lieferanten angelegt.</div>'}`;
}
function lieferantOeffnen(id){
  const l = id ? byId('lieferanten',id) : {};
  formDialog({titel: id?'Lieferant bearbeiten':'Neuer Lieferant', tab:'lieferanten', obj:l, felder:[
    {k:'name', l:'Firma', ganz:true},
    {k:'ansprechpartner', l:'Ansprechpartner'}, {k:'telefon', l:'Telefon'},
    {k:'email', l:'E-Mail', typ:'email'}, {k:'kundennr_bei_uns', l:'Unsere Kundennr. beim Lieferanten'},
    {k:'strasse', l:'Straße'}, {k:'plz', l:'PLZ'}, {k:'ort', l:'Ort'},
    {k:'rubriken', l:'Liefert Rubriken', typ:'select', opt:()=>'', ganz:true},
    {k:'notiz', l:'Notiz (Konditionen, Zahlungsziel …)', typ:'textarea'},
  ]});
  // Rubriken als Mehrfachauswahl
  const sel = $('#dlg select[data-k="rubriken"]');
  const gew = (l.rubriken||'').split(',');
  sel.outerHTML = `<div data-k="rubriken" id="lrub" style="display:flex;flex-wrap:wrap;gap:6px">${hauptRubriken().map(r=>`<label style="flex-direction:row;align-items:center;gap:5px;color:var(--text)" class="chip"><input type="checkbox" value="${r.id}" ${gew.includes(String(r.id))?'checked':''}>${esc(r.name)}</label>`).join('')}</div>`;
  const div = $('#lrub');
  Object.defineProperty(div, 'value', {get:()=>[...div.querySelectorAll('input:checked')].map(i=>i.value).join(',')});
}

// ---------- Kunden
function sKunden(){
  const liste = D.kunden.filter(k => passt(k, F.kundSuche, ['kundennr','name','ansprechpartner','ort','plz','email','telefon']));
  $('#inhalt').innerHTML = `<h2>Kunden</h2>
  <div class="leiste"><input id="ksuche" placeholder="Kunde suchen (Name, Nr., Ort …)" value="${esc(F.kundSuche)}" oninput="F.kundSuche=this.value;sKunden();const e=document.querySelector('#ksuche');e.focus();e.setSelectionRange(e.value.length,e.value.length)" style="flex:1;max-width:340px">
    <span class="hinweis">${liste.length} von ${D.kunden.length}</span>
    <div class="rechts"><a class="btn" href="api/export/kunden">CSV-Export</a><button class="btn" onclick="importStarten()">⤓ Kundendatei einlesen</button><button class="btn p" onclick="kundeOeffnen()">+ Kunde</button></div></div>
  <input type="file" id="importDatei" accept=".csv,.txt,.xlsx" hidden onchange="importDatei(this.files[0])">
  ${liste.length ? `<table><thead><tr><th>Nr.</th><th>Kunde</th><th class="ausbl">Ansprechpartner</th><th>Ort</th><th class="ausbl">Kontakt</th><th class="z ausbl">Vorgänge</th></tr></thead><tbody>
  ${liste.slice(0,500).map(k => `<tr onclick="kundeOeffnen(${k.id})"><td>${esc(k.kundennr)}</td><td><b>${esc(k.name)}</b></td><td class="ausbl">${esc(k.ansprechpartner)}</td><td>${esc((k.plz||'')+' '+(k.ort||''))}</td>
    <td class="ausbl">${esc(k.telefon)}${k.telefon&&k.email?'<br>':''}${esc(k.email)}</td><td class="z ausbl">${D.bestellungen.filter(b=>b.kunde_id===k.id).length||''}</td></tr>`).join('')}</tbody></table>
    ${liste.length>500?'<p class="hinweis">Nur die ersten 500 angezeigt – bitte Suche verfeinern.</p>':''}`
  : `<div class="karte leer">Noch keine Kunden. Lies eure Kundendatenbank als CSV- oder Excel-Datei ein:<br><br><button class="btn p" onclick="importStarten()">⤓ Kundendatei einlesen</button></div>`}`;
}
function kundeOeffnen(id){
  const k = id ? byId('kunden',id) : {};

    {k:'name', l:'Firma / Name', ganz:true},
    {k:'kundennr', l:'Kundennummer'}, {k:'ansprechpartner', l:'Ansprechpartner'},
    {k:'strasse', l:'Straße'}, {k:'plz', l:'PLZ'}, {k:'ort', l:'Ort'}, {k:'land', l:'Land'},
    {k:'telefon', l:'Telefon'}, {k:'email', l:'E-Mail', typ:'email'}, {k:'ustid', l:'USt-ID'},

    const vg = D.bestellungen.filter(b=>b.kunde_id===id);

      ${vg.length?`<h4>Einkaufsvorgänge für diesen Kunden</h4>${vg.map(b=>`<div style="padding:4px 0">${esc(b.nr)} · ${statusChip(b.status)} · ${eur(b.summe)} ${esc(b.projekt||'')}</div>`).join('')}`:''}`);

// Kunden-Import: Datei → Vorschau mit erkannten Spalten → einlesen
let IMP = null;
function importStarten(){ $('#importDatei').value=''; $('#importDatei').click(); }
async function importDatei(datei){
  if (!datei) return;
  const r = await api('kunden/vorschau?datei='+encodeURIComponent(datei.name), {method:'POST', body:await datei.arrayBuffer(), roh:true});
  IMP = {...r, datei:datei.name};
  const feldNamen = {kundennr:'Kundennummer', name:'Firma / Name', ansprechpartner:'Ansprechpartner', strasse:'Straße', plz:'PLZ', ort:'Ort', land:'Land', telefon:'Telefon', email:'E-Mail', ustid:'USt-ID', notiz:'Notiz'};
  const dlg = $('#dlg'); dlg.className='breit';
  dlg.innerHTML = `<div class="dkopf"><h3>Kunden einlesen: ${esc(datei.name)}</h3><button class="btn x" onclick="dlg.close()">✕</button></div>
  <div class="dinhalt">
    <p><b>${r.zeilen.length}</b> Datensätze gefunden. Die Spalten wurden automatisch zugeordnet – bitte kurz prüfen.
    Bereits vorhandene Kunden (gleiche Kundennummer, sonst gleicher Name + PLZ) werden <b>aktualisiert</b>, neue <b>angelegt</b>.</p>
    <div style="overflow:auto"><table class="mapping"><thead><tr>${r.kopf.map((k,i)=>`<th style="min-width:140px">${esc(k)||'Spalte '+(i+1)}<br>
      <select data-i="${i}" style="margin-top:6px;text-transform:none;font-weight:400"><option value="">– ignorieren –</option>${r.felder.map(f=>`<option value="${f}" ${r.zuordnung[i]===f?'selected':''}>${feldNamen[f]}</option>`).join('')}</select></th>`).join('')}</tr></thead>
    <tbody>${r.zeilen.slice(0,8).map(z=>`<tr>${r.kopf.map((_,i)=>`<td>${esc(z[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    ${r.zeilen.length>8?`<p class="hinweis">… und ${r.zeilen.length-8} weitere Zeilen.</p>`:''}
  </div>
  <div class="dfuss"><div class="rechts"><button class="btn" onclick="dlg.close()">Abbrechen</button><button class="btn p" onclick="importAusfuehren()">${r.zeilen.length} Kunden einlesen</button></div></div>`;
  dlg.showModal();
}
async function importAusfuehren(){
  const zuordnung = {};
  $('#dlg').querySelectorAll('select[data-i]').forEach(s => { if (s.value) zuordnung[s.dataset.i] = s.value; });
  if (!Object.values(zuordnung).includes('name')){ toast('Bitte eine Spalte als „Firma / Name" zuordnen'); return; }
  const r = await api('kunden/import', {method:'POST', body:{zeilen:IMP.zeilen, zuordnung, quelle:'Import '+IMP.datei}});
  $('#dlg').innerHTML = `<div class="dkopf"><h3>Import abgeschlossen</h3></div><div class="dinhalt">
    <p class="ok" style="font-size:17px">✓ ${r.neu} Kunden neu angelegt, ${r.aktualisiert} aktualisiert${r.uebersprungen?`, ${r.uebersprungen} Zeilen ohne Namen übersprungen`:''}.</p></div>
    <div class="dfuss"><div class="rechts"><button class="btn p" onclick="dlg.close()">Fertig</button></div></div>`;
  await laden();
}

start();
