<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<title>V3D Beleg</title>
<link rel="icon" href="logo.svg">
<style>
:root{--acc:#F97316;--acc-d:#EA6000;--bg:#f4f5f9;--card:#fff;--text:#1c2030;--mid:#5b6172;--dim:#8a90a3;--line:#e3e6ef;--green:#16a34a;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--acc);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
header button{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
main{padding:16px;max-width:560px;margin:0 auto}
.gross{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:16px;padding:26px 16px;font:inherit;font-size:21px;font-weight:700;cursor:pointer;margin-bottom:12px}
.gross.p{background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.gross.s{background:#fff;color:var(--text);border:1px solid var(--line);font-size:17px;padding:18px}
.btn{border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:#fff}
.btn.s{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.g{background:var(--green)}
h2{font-size:15px;color:var(--mid);margin:22px 0 8px}
.feld{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin-bottom:10px;font:inherit;color:var(--text);cursor:pointer}
.feld small{display:block;color:var(--dim);font-weight:600;font-size:12.5px}
.feld b{font-size:18px;word-break:break-word}
.feld.ok{background:#f0fdf4;border-color:#86efac}
.feld .ico{font-size:24px}
.feld .edit{font-size:18px;padding:8px;margin:-8px;opacity:.55}
.leer{color:var(--dim);font-weight:400}
.eintrag{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.hinw{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.lade{text-align:center;padding:60px 10px;color:var(--mid)}
.lade .kreis{width:46px;height:46px;border:5px solid #fed7aa;border-top-color:var(--acc);border-radius:50%;animation:dreh 1s linear infinite;margin:0 auto 16px}
@keyframes dreh{to{transform:rotate(360deg)}}
input{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;z-index:9}
.leiste{display:flex;gap:10px;margin-top:6px}
.leiste .btn{flex:1}
.bankwahl{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.bankwahl small{color:var(--mid);font-size:13px;margin-right:2px}
.bankwahl button{flex:1;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.bankwahl button.an{background:var(--acc);border-color:var(--acc);color:#fff}
</style>
</head>
<body>
<header>🧾 V3D Beleg<button id="kopfZurueck" hidden onclick="start()">← Übersicht</button></header>
<main id="m"></main>
<div id="toast"></div>
<script>
'use strict';
// Schlanke Handy-Seite zu VolmeRechnung: Papierrechnung scannen -> Zahlungsdaten
// einzeln kopieren -> in der Banking-App (SumUp oder bunq) einfügen. Läuft im Browser
// und in der Android-Hülle „V3D Beleg" (AndroidBruecke: kopieren, appOeffnen, kamera).
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>(Number(v)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const dtDE=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE'):'';
const today=()=>new Date().toISOString().slice(0,10);
const ROOTP=location.pathname.startsWith('/rechnung')?'/rechnung':'';
const APP=window.AndroidBruecke||null;
// Banking-Apps zum Einfügen; die zuletzt gewählte merkt sich das Handy
const BANKEN={sumup:{name:'SumUp',pakete:['com.kaching.merchant','com.sumup.pay']},bunq:{name:'bunq',pakete:['com.bunq.android']}};
let BANK=BANKEN[localStorage.getItem('vrBank')]?localStorage.getItem('vrBank'):'sumup';
function bankWahl(b){BANK=b;localStorage.setItem('vrBank',b);zeige(AKTIV,null,true);}
function bankOeffnen(){
  const b=BANKEN[BANK];
  if(APP.appOeffnenListe)APP.appOeffnenListe(b.pakete.join(','),b.name);
  else APP.appOeffnen(b.pakete[0],b.pakete[1]||b.pakete[0]); // ältere App-Fassung
}
let KEY=(()=>{const u=new URL(location.href),k=u.searchParams.get('key');
  if(!k)return localStorage.getItem('vrKey')||'';
  localStorage.setItem('vrKey',k);u.searchParams.delete('key');history.replaceState(null,'',u);return k;})();

function toast(t,err){const e=$('#toast');e.textContent=t;e.style.background=err?'var(--red)':'var(--green)';e.style.opacity=1;clearTimeout(e._h);e._h=setTimeout(()=>e.style.opacity=0,2200);}
async function api(p,method='GET',body){
  const r=await fetch(ROOTP+'/api/'+p,{method,headers:{'X-Key':KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){login();throw new Error('Bitte anmelden');}
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Fehler '+r.status);return j;
}

function login(){
  $('#kopfZurueck').hidden=true;
  $('#m').innerHTML=`<h2>Anmelden</h2><p style="color:var(--mid);font-size:14px;margin-bottom:10px">Einmalig den Login-Schlüssel von VolmeRechnung eingeben — die App merkt ihn sich.</p>
    <input id="k" type="password" placeholder="Login-Schlüssel" autocomplete="off"><div style="height:10px"></div>
    <button class="btn" style="width:100%" onclick="KEY=$('#k').value.trim();localStorage.setItem('vrKey',KEY);start()">Weiter</button>`;
}

// ---------------------------------------------------------------- Übersicht
async function start(){
  $('#kopfZurueck').hidden=true;
  if(!KEY)return login();
  $('#m').innerHTML=`
    <button class="gross p" onclick="waehle(true)">📷 Rechnung scannen</button>
    <button class="gross s" onclick="waehle(false)">📄 PDF oder Bild wählen</button>
    <button class="gross s" onclick="mailListe()">📨 Aus V3D Mail</button>
    <button class="gross s" onclick="rechnungenSuchen()">🔎 Rechnungen suchen<br><small style="font-weight:400;font-size:13px;color:var(--dim)">in allen Postfächern</small></button>
    <p style="color:var(--dim);font-size:13px;text-align:center">Tipp: PDF aus Gmail/Dateien per „Teilen → V3D Beleg" schicken.</p>
    <div id="offen"></div>`;
  try{
    const alle=await api('expenses');
    const offen=alle.filter(a=>a.iban&&!a.bezahltAm).sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,15);
    const bezahlt=alle.filter(a=>a.bezahltAm).sort((a,b)=>(b.bezahltAm||'').localeCompare(a.bezahltAm||'')).slice(0,3);
    $('#offen').innerHTML=(offen.length?'<h2>Noch zu überweisen</h2>'+offen.map(eintrag).join(''):'')
      +(bezahlt.length?'<h2>Zuletzt bezahlt</h2>'+bezahlt.map(eintrag).join(''):'');
  }catch(e){if(KEY)toast(e.message,true);}
}
const eintrag=a=>`<div class="eintrag" onclick="zeige('${a.id}')"><span><b>${esc(a.lieferant||'?')}</b><br><small style="color:var(--dim)">${esc(a.nummer||'')} ${a.faellig&&!a.bezahltAm?'· fällig '+dtDE(a.faellig):''}${a.bezahltAm?'· ✓ bezahlt '+dtDE(a.bezahltAm)+(BANKEN[a.bezahltVia]?' via '+BANKEN[a.bezahltVia].name:''):''}</small></span><b>${eur(a.betrag)}</b></div>`;

// Kamera/Datei: im Browser über <input>, in der App übernimmt Android (onShowFileChooser)
function waehle(kamera){
  const i=document.createElement('input');i.type='file';
  i.accept=kamera?'image/*':'image/*,application/pdf';
  if(kamera)i.capture='environment';
  i.onchange=()=>i.files[0]&&hochladen(i.files[0]);
  i.click();
}
// Aufruf aus der Android-Hülle beim „Teilen → V3D Beleg"
window.belegVonApp=function(b64,typ){
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  hochladen(new Blob([u],{type:typ||'application/octet-stream'}));
};

// ---------------------------------------------------------------- Erfassen
async function hochladen(file){
  if(!KEY)return login();
  $('#kopfZurueck').hidden=true;
  $('#m').innerHTML='<div class="lade"><div class="kreis"></div><b>Rechnung wird gelesen …</b><br><small>ein paar Sekunden</small></div>';
  let body=file;
  if(file.type.startsWith('image/')){ // 12-MP-Foto -> max. 3000 px: schneller Upload
    try{const bm=await createImageBitmap(file,{imageOrientation:'from-image'});const f=Math.min(1,3000/Math.max(bm.width,bm.height));
      const c=document.createElement('canvas');c.width=Math.round(bm.width*f);c.height=Math.round(bm.height*f);
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);body=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));}catch(e){body=file;}
  }
  try{
    const r=await fetch(ROOTP+'/api/erfassen',{method:'POST',headers:{'X-Key':KEY},body});
    if(r.status===401){login();return;}
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Fehler');
    await speichern(j);
  }catch(e){toast(e.message,true);start();}
}
// Erkannte Felder sofort als Ausgabe speichern — taucht damit auch in VolmeRechnung auf.
// extra: Zusatzfelder (Mail-Herkunft), fallbackName: Lieferant, falls nichts erkannt
async function speichern(j,extra,fallbackName){
    const f=j.felder,L=f.lieferant||{};
    const st=f.steuern||[];
    const brutto=f.brutto!=null?f.brutto:(st.length?Math.round(st.reduce((x,s)=>x+(+s.netto||0)+(+s.ust||0),0)*100)/100:0);
    const a=await api('expenses','POST',{datum:f.datum||today(),lieferant:L.name||fallbackName||'',betrag:brutto,kategorie:'Material',beschreibung:'',
      nummer:f.nummer||'',kundennr:f.kundennr||'',verwendungszweck:f.verwendungszweck||[f.nummer,f.kundennr?'Kd-Nr. '+f.kundennr:''].filter(Boolean).join(' '),
      faellig:f.faellig||'',lieferdatum:f.lieferdatum||'',iban:f.iban||'',bic:f.bic||'',
      lieferantAdr:{strasse:L.strasse||'',plz:L.plz||'',ort:L.ort||'',ustId:L.ustId||'',steuernummer:L.steuernummer||''},
      steuern:st,positionen:f.positionen||[],belegId:j.belegId,quelle:'scan-app',...(extra||{})});
    await zeige(a.id,j.hinweise);
    if(j.quelle!=='zugferd')nachbessern(a.id,j);
}

// ---------------------------------------------------------------- Aus V3D Mail
// Posteingang: Mails mit Anhang -> Anhang wählen -> erfassen wie ein Scan
let MAILKONTO=localStorage.getItem('vrMailKonto')||'',MAILKONTEN=null;
async function mailListe(suche){
  MAILHER='liste';
  $('#kopfZurueck').hidden=false;
  $('#m').innerHTML='<div class="lade"><div class="kreis"></div><b>Posteingang wird geladen …</b></div>';
  try{
    if(!MAILKONTEN)MAILKONTEN=(await api('mail/konten')).konten;
    if(!MAILKONTEN.length)throw new Error('In V3D Mail ist kein Konto eingerichtet');
    if(!MAILKONTEN.some(k=>k.id===MAILKONTO))MAILKONTO=MAILKONTEN[0].id;
    const {liste}=await api('mail/liste?'+new URLSearchParams({acc:MAILKONTO,q:suche||''}));
    $('#m').innerHTML=`
      <select id="mk" onchange="MAILKONTO=this.value;localStorage.setItem('vrMailKonto',MAILKONTO);mailListe()" style="font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff">
        ${MAILKONTEN.map(k=>`<option value="${esc(k.id)}" ${k.id===MAILKONTO?'selected':''}>${esc(k.email)}</option>`).join('')}</select>
      <form onsubmit="event.preventDefault();mailListe($('#ms').value.trim())" style="display:flex;gap:8px;margin-bottom:6px">
        <input id="ms" placeholder="Suchen (Absender, Betreff …)" value="${esc(suche||'')}"><button class="btn s">🔍</button></form>
      <button class="btn s" style="width:100%;margin:4px 0 2px" onclick="rechnungenSuchen()">🔎 Rechnungen in allen Postfächern suchen</button>
      <h2>${suche?'Treffer mit Anhang':'Neueste Mails mit Anhang'}</h2>
      ${liste.length?liste.map(x=>`<div class="eintrag" onclick="${x.erfasst?`zeige('${x.erfasst}')`:`mailOeffnen(${x.uid},'${esc(MAILKONTO)}')`}">
        <span style="min-width:0"><b style="${x.gelesen?'font-weight:600':''}">${esc(x.von.name||x.von.email||'?')}</b><br>
        <small style="color:var(--dim)">${esc(x.betreff)}</small></span>
        <small style="color:${x.erfasst?'var(--green)':'var(--dim)'};white-space:nowrap;font-weight:700">${x.erfasst?'✓ erfasst':new Date(x.ts*1000).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</small></div>`).join('')
      :'<p style="color:var(--dim);text-align:center;padding:20px">Keine Mails mit Anhang gefunden.</p>'}`;
  }catch(e){toast(e.message,true);start();}
}
async function mailOeffnen(uid,acc){
  $('#m').innerHTML='<div class="lade"><div class="kreis"></div><b>Mail wird geöffnet …</b></div>';
  try{
    const r=await api('mail/anhaenge?'+new URLSearchParams({acc,uid}));
    window.MAILAKT={acc,uid,betreff:r.betreff,von:r.von};
    if(r.anhaenge.length===1)return mailErfassen(r.anhaenge[0].part); // der Normalfall: eine Rechnungs-PDF
    $('#m').innerHTML=`<h2>${esc(r.von.name||r.von.email||'')}</h2><p style="margin-bottom:12px">${esc(r.betreff)}</p>
      ${r.anhaenge.length?'<h2>Welcher Anhang ist die Rechnung?</h2>'+r.anhaenge.map(x=>`<div class="eintrag" onclick="mailErfassen('${esc(x.part)}')">
        <span>${x.typ==='application/pdf'?'📄':'🖼️'} <b>${esc(x.name)}</b></span><small style="color:var(--dim)">${Math.max(1,Math.round(x.groesse/1024))} KB</small></div>`).join('')
      :'<div class="hinw">In dieser Mail steckt keine PDF und kein Bild.</div>'}
      <button class="btn s" style="width:100%;margin-top:8px" onclick="mailZurueck()">← Zurück zur Liste</button>`;
  }catch(e){toast(e.message,true);mailZurueck();}
}
async function mailErfassen(part){
  const M=window.MAILAKT;
  $('#m').innerHTML='<div class="lade"><div class="kreis"></div><b>Rechnung wird gelesen …</b><br><small>ein paar Sekunden</small></div>';
  try{
    const j=await api('mail/erfassen','POST',{acc:M.acc,uid:M.uid,part,vonName:M.von.name||''});
    await speichern(j,{quelle:'mail',mail:{acc:M.acc,folder:'INBOX',uid:M.uid,part,betreff:M.betreff,von:M.von.email||''}},M.von.name||'');
  }catch(e){toast(e.message,true);mailZurueck();}
}
// Zurück dorthin, woher die Mail kam: Posteingang eines Kontos oder Suchergebnis
let MAILHER='liste';
const mailZurueck=()=>MAILHER==='suche'?rechnungenSuchen():mailListe();
async function rechnungenSuchen(){
  MAILHER='suche';
  $('#kopfZurueck').hidden=false;
  $('#m').innerHTML='<div class="lade"><div class="kreis"></div><b>Suche Rechnungen in allen Postfächern …</b><br><small>ein paar Sekunden</small></div>';
  try{
    const r=await api('mail/rechnungen');
    const offen=r.liste.filter(x=>!x.erfasst),erledigt=r.liste.filter(x=>x.erfasst);
    const zeile=x=>`<div class="eintrag" onclick="${x.erfasst?`zeige('${x.erfasst}')`:`mailOeffnen(${x.uid},'${esc(x.acc)}')`}">
        <span style="min-width:0"><b style="${x.gelesen?'font-weight:600':''}">${esc(x.von.name||x.von.email||'?')}</b><br>
        ${x.proforma?'<small style="background:#fef3c7;color:#92400e;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-right:4px">PROFORMA</small>':''}<small style="color:var(--dim)">${esc(x.betreff)}</small><br><small style="color:var(--acc-d);font-size:12px">📥 ${esc(x.konto)}</small></span>
        <small style="color:${x.erfasst?'var(--green)':'var(--dim)'};white-space:nowrap;font-weight:700;text-align:right">${new Date(x.ts*1000).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}${x.erfasst?'<br>'+(x.bezahlt?'✓ bezahlt':'✓ erfasst'):''}</small></div>`;
    $('#m').innerHTML=`
      <p style="color:var(--mid);font-size:14px;margin-bottom:8px">${r.konten} Postfächer durchsucht nach ${r.suchworte.map(w=>'„'+esc(w)+'“').join(', ')} — nur Mails mit Anhang.</p>
      ${r.fehler.length?`<div class="hinw">⚠️ Nicht erreichbar: ${r.fehler.map(esc).join('; ')}</div>`:''}
      <h2>Noch nicht erfasst (${offen.length})</h2>
      ${offen.length?offen.map(zeile).join(''):'<p style="color:var(--dim);text-align:center;padding:14px">Nichts Neues gefunden. 🎉</p>'}
      ${erledigt.length?`<h2>Schon erfasst (${erledigt.length})</h2>`+erledigt.map(zeile).join(''):''}`;
  }catch(e){toast(e.message,true);start();}
}
// KI im Hintergrund: Name/Beschreibung/Kategorie; Zahlungsfelder nur, wo noch leer
async function nachbessern(id,erf){
  try{
    const j=await api('erfassen/ki','POST',{zeilen:erf.zeilen,felder:erf.felder});
    const a=(await api('expenses')).find(x=>x.id===id);if(!a)return;
    const f=j.felder,L=f.lieferant||{},upd={};
    if(!a.lieferant&&L.name)upd.lieferant=L.name;
    if(L.name&&a.lieferant&&!BEARB.has('lieferant')&&!KOPIERT.has('lieferant')&&a.lieferant!==L.name&&a.lieferant.length<4)upd.lieferant=L.name;
    if(!a.iban&&f.iban)upd.iban=f.iban;
    if(!a.bic&&f.bic)upd.bic=f.bic;
    if(!a.nummer&&f.nummer)upd.nummer=f.nummer;
    if(!a.verwendungszweck&&(f.verwendungszweck||f.nummer))upd.verwendungszweck=f.verwendungszweck||f.nummer;
    if(!a.betrag&&f.brutto)upd.betrag=f.brutto;
    if(f.beschreibung)upd.beschreibung=f.beschreibung;
    if(f.kategorie)upd.kategorie=f.kategorie;
    if(!Object.keys(upd).length)return;
    await api('expenses/'+id,'PUT',upd);
    if(AKTIV===id)zeige(id,j.hinweise,true);
  }catch(e){/* KI ist Beiwerk — Felder aus Text/OCR bleiben */}
}

// ---------------------------------------------------------------- Kopieransicht
let AKTIV=null,KOPIERT=new Set(),BEARB=new Set();
const FELDER=[['lieferant','Empfänger'],['iban','IBAN'],['bic','BIC'],['betrag','Betrag'],['verwendungszweck','Verwendungszweck']];
function wert(a,k){
  if(k==='iban')return String(a.iban||'').replace(/\s/g,'');
  if(k==='betrag')return a.betrag?Number(a.betrag).toFixed(2).replace('.',','):'';
  return String(a[k]||'');
}
function anzeige(a,k){
  const w=wert(a,k);if(!w)return '<span class="leer">— nicht erkannt, ✏️ zum Eintragen —</span>';
  if(k==='iban')return `<span style="font-family:ui-monospace,monospace;font-size:16.5px">${esc(w.replace(/(.{4})/g,'$1 ').trim())}</span>`;
  if(k==='betrag')return esc(eur(a.betrag));
  return esc(w);
}
async function zeige(id,hinweise,still){
  const a=(await api('expenses')).find(x=>x.id===id);if(!a){start();return;}
  if(AKTIV!==id){KOPIERT=new Set();BEARB=new Set();}
  AKTIV=id;
  $('#kopfZurueck').hidden=false;
  const kq='?key='+encodeURIComponent(KEY);
  $('#m').innerHTML=`
    ${(hinweise||[]).filter(h=>!/Rechnungsdatum|Rechnungsnummer|USt-Zeile|USt \d/.test(h)).map(h=>`<div class="hinw">⚠️ ${esc(h)}</div>`).join('')}
    <p style="color:var(--mid);font-size:14px;margin-bottom:12px">Feld antippen = kopiert. Dann in ${BANKEN[BANK].name} einfügen und zurückkommen.${a.faellig&&!a.bezahltAm?` Fällig am <b>${dtDE(a.faellig)}</b>.`:''}${a.bezahltAm?' <b style="color:var(--green)">✓ bezahlt am '+dtDE(a.bezahltAm)+(BANKEN[a.bezahltVia]?' via '+BANKEN[a.bezahltVia].name:'')+'</b>':''}</p>
    <div class="bankwahl"><small>Bezahlen mit</small>${Object.entries(BANKEN).map(([k,b])=>`<button class="${k===BANK?'an':''}" onclick="bankWahl('${k}')">${b.name}</button>`).join('')}</div>
    ${FELDER.map(([k,l])=>`<div class="feld ${KOPIERT.has(k)?'ok':''}" id="f_${k}" onclick="kopiere('${k}')">
      <span style="flex:1;min-width:0"><small>${l}</small><b>${anzeige(a,k)}</b></span>
      <span class="edit" onclick="event.stopPropagation();bearbeite('${k}')">✏️</span>
      <span class="ico">${KOPIERT.has(k)?'✅':'📋'}</span></div>`).join('')}
    ${APP?`<button class="btn s" style="width:100%;margin:4px 0 10px" onclick="bankOeffnen()">↗️ ${BANKEN[BANK].name} öffnen</button>`:''}
    <div class="leiste">
      ${a.bezahltAm?`<button class="btn s" onclick="bezahlt(false)">Doch nicht bezahlt</button>`:`<button class="btn g" onclick="bezahlt(true)">✓ Überwiesen</button>`}
      <button class="btn s" style="flex:0 0 auto" onclick="verwerfen()">🗑 Verwerfen</button>
    </div>
    ${a.belegId?`<p style="text-align:center;margin-top:16px"><a href="${ROOTP}/api/belege/${a.belegId}${kq}" target="_blank" style="color:var(--acc-d)">🧾 Rechnung ansehen</a></p>`:''}`;
  window.AKT=a;
  if(!still)window.scrollTo(0,0);
}
function kopiere(k){
  const w=wert(window.AKT,k);if(!w){bearbeite(k);return;}
  const fertig=()=>{KOPIERT.add(k);const el=$('#f_'+k);el.classList.add('ok');el.querySelector('.ico').textContent='✅';toast('Kopiert: '+(w.length>34?w.slice(0,34)+'…':w));};
  if(APP&&APP.kopieren){APP.kopieren(w);fertig();return;}
  (navigator.clipboard?navigator.clipboard.writeText(w):Promise.reject()).then(fertig).catch(()=>{
    const t=document.createElement('textarea');t.value=w;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
    const ok=document.execCommand('copy');t.remove();ok?fertig():toast('Kopieren nicht möglich',true);});
}
async function bearbeite(k){
  const a=window.AKT,l=FELDER.find(f=>f[0]===k)[1];
  let v=prompt(l+':',k==='betrag'?wert(a,k):(a[k]||''));
  if(v===null)return;v=v.trim();
  const upd={};
  if(k==='betrag'){const n=parseFloat(v.replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));if(!Number.isFinite(n)){toast('Betrag nicht lesbar',true);return;}upd.betrag=Math.round(n*100)/100;}
  else if(k==='iban'||k==='bic')upd[k]=v.replace(/\s/g,'').toUpperCase();
  else upd[k]=v;
  BEARB.add(k);KOPIERT.delete(k);
  try{await api('expenses/'+a.id,'PUT',upd);zeige(a.id,null,true);}catch(e){toast(e.message,true);}
}
async function verwerfen(){
  if(!confirm('Diesen Beleg löschen? (z. B. Fehlschuss oder doppelt gescannt)'))return;
  try{await api('expenses/'+AKTIV,'DELETE');toast('Gelöscht');start();}catch(e){toast(e.message,true);}
}
async function bezahlt(ja){
  try{await api('expenses/'+AKTIV,'PUT',ja?{bezahltAm:today(),bezahltVia:BANK}:{bezahltAm:'',bezahltVia:''});toast(ja?'Als bezahlt markiert':'Wieder offen');start();}catch(e){toast(e.message,true);}
}
start();
</script>
</body>
</html>
